<!DOCTYPE html>
<!-- 个人全能工作台 · 单文件 HTML · 全部资源内联 · 离线可用 -->
<html lang="zh-CN" data-theme="forest" data-fs="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8C9A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>个人全能工作台</title>
<!-- PWA 真实 manifest 与图标（第二轮修复）
     原因：Chrome 不认 blob: URL 的 manifest，也不把 Canvas 动态生成的 data: URL
     图标视为有效 PWA 图标，结果只生成“普通书签”而不是原生 WebAPK，
     手机重启后系统可能清理该书签 → 桌面图标失效。
     改为引用同目录下的真实文件：manifest.webmanifest + icon-192.png / icon-512.png。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ============ 1. 主题变量 ============ */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sp:16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
  --tr: .2s cubic-bezier(.4,0,.2,1);
  /* 辅助色（标签胶囊 / 装饰）· 莫兰迪化：降饱和、加灰，避免糖果色抢主色 */
  --pink:#E7C9C9; --pink-soft:#F7EEEE; --pink-fg:#8C5757;
  --yellow:#E8DBB7; --yellow-soft:#F8F2E2; --yellow-fg:#7C6829;
  --purple:#CEC6DE; --purple-soft:#EEEAF4; --purple-fg:#5C5380;
  /* 卡片统一变量（一处定义，全局复用）· 模块六：圆角 12px / 阴影 0 2px 8px / 内边距 16px */
  --card-pd:16px; --card-radius:12px; --card-shadow:0 2px 8px rgba(0,0,0,.04);
  /* 兼容别名：历史代码里引用了 --surface / --surface-2 / --border，但三套主题从未定义过它们，
     导致成就徽章边框、Tab 栏底色等拿到无效值（等同 transparent）。
     这里统一映射到已有变量，不新增颜色结构，也不影响主题切换机制。 */
  --surface:var(--card); --surface-2:var(--card2); --border:var(--line);
}
/* 模块六 · 莫兰迪配色
   原则：低饱和 + 掺灰，主色走浅绿/雾蓝，背景暖白；深色主题仍保持深底。
   --primary 承担大量「白字底色」（主按钮 / 选中 Tab / 日期圆点），
   所以刻意压到 4.5:1 以上对比度——纯浅绿配白字只有 3:1 左右，在手机上会看不清。
   「浅绿」的观感由 --primary-soft / --accent-soft 这类浅色调和背景渐变承担。 */
html[data-theme="forest"]{
  --bg:linear-gradient(155deg,#F7F6F1 0%,#EDEBE3 100%); --bg2:#E7E4DA; --card:#FFFEFA; --card2:#F5F3EC;
  --text:#3A413A; --muted:#6F7570; --line:#E3E0D5;
  --primary:#5F7A5A; --primary2:#4C6349; --primary-soft:#E7EDE2; --on-primary:#FFFFFF;
  --accent:#8A6549; --accent-soft:#F2E9E0;
  --danger:#A85F52; --danger-soft:#F5E5E0;
  --warn:#9A7C2E; --success:#5F7A5A;
  --shadow:0 2px 8px rgba(0,0,0,.04); --shadow-lg:0 10px 30px rgba(70,80,60,.13);
  --card-shadow:0 2px 8px rgba(0,0,0,.04);   /* 模块六：卡片阴影按主题给，深底上 4% 黑等于没有 */
  --leaf-op:.05;
}
html[data-theme="light"]{
  --bg:linear-gradient(155deg,#F8F9F9 0%,#ECEFF1 100%); --bg2:#E4E8EA; --card:#FDFDFE; --card2:#F3F5F6;
  --text:#33393D; --muted:#6E757B; --line:#E1E5E8;
  --primary:#5F7885; --primary2:#4C626D; --primary-soft:#E8EDEF; --on-primary:#FFFFFF;
  --accent:#8E6B4E; --accent-soft:#F3EBE3;
  --danger:#A85F52; --danger-soft:#F6E5E1;
  --warn:#96762A; --success:#5F7E74;
  --shadow:0 2px 8px rgba(0,0,0,.04); --shadow-lg:0 10px 30px rgba(45,60,70,.13);
  --card-shadow:0 2px 8px rgba(0,0,0,.04);
  --leaf-op:.03;
}
html[data-theme="dark"]{
  --bg:linear-gradient(155deg,#1F231E 0%,#141614 100%); --bg2:#141614; --card:#242922; --card2:#2B312A;
  --text:#E6E9E1; --muted:#A2A89B; --line:#353B34;
  --primary:#9DB38C; --primary2:#B7C9A4; --primary-soft:#313A2D; --on-primary:#1B1F1A;
  --accent:#C9A484; --accent-soft:#3A332B;
  --danger:#DE8977; --danger-soft:#3E2A25;
  --warn:#D6B65C; --success:#9DB38C;
  --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 12px 34px rgba(0,0,0,.5);
  --card-shadow:0 2px 10px rgba(0,0,0,.30);
  --leaf-op:.05;
}
html[data-fs="xs"]{ font-size:13px }
html[data-fs="sm"]{ font-size:14px }
html[data-fs="md"]{ font-size:16px }
html[data-fs="lg"]{ font-size:18px }
html[data-fs="xl"]{ font-size:20px }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ margin:0; padding:0 }
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  line-height:1.6; min-height:100vh; overflow-x:hidden; letter-spacing:.3px;
  transition:background var(--tr), color var(--tr);
}
/* 植物叶子纹理点缀 */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:var(--leaf-op);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><g fill='none' stroke='%238C9A4D' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round' opacity='0.6'><circle cx='40' cy='40' r='3'/><circle cx='120' cy='30' r='2.5'/><circle cx='172' cy='80' r='3'/><circle cx='28' cy='120' r='2.5'/><circle cx='92' cy='150' r='3'/><circle cx='160' cy='172' r='2.5'/><circle cx='150' cy='110' r='2'/><circle cx='58' cy='182' r='2'/><path d='M58 66a10 10 0 0 1 10-10 12 12 0 0 1 22 4 9 9 0 0 1 6 16H64a9 9 0 0 1-6-10z'/><path d='M120 138a8 8 0 0 1 8-8 10 10 0 0 1 18 3 7 7 0 0 1 5 13h-25a7 7 0 0 1-6-8z'/></g></svg>");
  background-size:200px 200px;
}
#app{ position:relative; z-index:1 }

/* ============ 2. 布局 ============ */
.shell{ display:flex; min-height:100vh }

/* 浮动画侧边栏 —— 桌面端 */
.sidebar{
  position:sticky; top:0; height:100vh; align-self:flex-start;
  width:248px; flex:0 0 248px;
  margin:14px 0 14px 14px;
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  box-shadow:0 14px 40px -22px rgba(60,70,40,.30), 0 2px 10px -3px rgba(60,70,40,.08);
  padding:14px 12px calc(18px + env(safe-area-inset-bottom));
  overflow-y:auto; display:flex; flex-direction:column; gap:6px;
  transition:width .28s cubic-bezier(.5,.1,.2,1), margin .28s cubic-bezier(.5,.1,.2,1), box-shadow .2s;
}
.sidebar.collapsed{ width:78px; flex:0 0:78px }
.sidebar.collapsed .brand-txt,
.sidebar.collapsed .nav-item > span,
.sidebar.collapsed .nav-item .nv-badge,
.sidebar.collapsed .nav-grip,
.sidebar.collapsed .nav-pin,
.sidebar.collapsed .nav-section-title,
.sidebar.collapsed .sidebar-foot .nav-item > span{ display:none }
.sidebar.collapsed .nav-item{ justify-content:center; padding:11px }
.sidebar.collapsed .brand{ justify-content:center; padding:6px 0 6px; gap:0 }
.sidebar.collapsed .sb-handle{ transform:rotate(180deg) }
.sidebar.collapsed .add-module-text{ display:none }

/* 头部的小折叠按钮 */
.sb-head{ display:flex; align-items:center; justify-content:flex-end; padding:0 4px 6px }
.sb-handle{
  width:30px; height:30px; border-radius:10px; border:1px solid var(--line);
  display:grid; place-items:center; cursor:pointer; background:var(--card2); color:var(--muted);
  transition:transform .28s cubic-bezier(.5,.1,.2,1), background .2s, color .2s;
}
.sb-handle:hover{ background:var(--primary-soft); color:var(--primary2) }
.sb-handle svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }

/* 移动端浮动汉堡按钮 */
.sb-fab{ display:none }
.sb-mask{ display:none; position:fixed; inset:0; background:rgba(20,30,15,.42); z-index:69; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px) }
.sb-mask.on{ display:block; animation:fadeIn .22s ease }

.brand{ display:flex; align-items:center; gap:10px; padding:6px 6px 8px }
.brand-logo{
  width:38px; height:38px; border-radius:13px; flex:0 0 38px;
  background:linear-gradient(145deg,var(--primary),var(--primary2));
  display:grid; place-items:center; box-shadow:var(--shadow);
}
.brand-logo svg{ width:22px; height:22px; stroke:var(--on-primary) }
.brand-txt b{ display:block; font-size:.98rem; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.brand-txt span{ font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

.nav-section-title{ font-size:.66rem; color:var(--muted); padding:12px 12px 4px; letter-spacing:1.2px; text-transform:uppercase }
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--r-md);
  cursor:pointer; color:var(--text); font-size:.9rem; border:1px solid transparent;
  transition:background var(--tr), transform var(--tr); user-select:none; min-height:44px;
}
.nav-item:hover{ background:var(--card2) }
.nav-item.active{ background:var(--primary-soft); color:var(--primary2); font-weight:600; border-color:color-mix(in srgb,var(--primary) 25%,transparent) }
html[data-theme="dark"] .nav-item.active{ color:var(--primary) }
.nav-item svg{ width:22px; height:22px; flex:0 0 22px; stroke:currentColor; fill:rgba(140,154,77,.12); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; background:var(--primary-soft); border-radius:50%; padding:3px }
.nav-item .nv-badge{ margin-left:auto; background:var(--danger); color:#fff; font-size:.66rem; padding:1px 7px; border-radius:20px; font-weight:600 }
.nav-grip{ margin-right:2px; color:var(--muted); opacity:.45; cursor:grab; display:flex; align-items:center; flex:0 0 auto }
.nav-grip:active{ cursor:grabbing }
.nav-pin{ margin-left:6px; width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--muted); display:none; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; transition:all var(--tr) }
.nav-pin svg{ width:14px; height:14px }
.nav-item:hover .nav-pin{ display:inline-flex }
.nav-pin:hover{ color:var(--primary2); border-color:var(--primary); background:var(--primary-soft) }
.nav-item.dragging{ opacity:.4 }
.nav-item.drag-over{ box-shadow:inset 3px 0 0 var(--primary); background:var(--primary-soft) }
.sidebar-foot{ margin-top:auto; padding-top:10px; border-top:1px solid var(--line) }

.main{ flex:1; min-width:0; display:flex; flex-direction:column }
.topbar{
  display:none; align-items:center; gap:10px; padding:12px 14px;
  background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;
}
.topbar .tb-title{ font-weight:700; font-size:1.02rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.content{ padding:20px 20px 40px; max-width:1180px; width:100%; margin:0 auto; flex:1 }

/* ============ 全局搜索 ============ */
.sb-search{ display:flex; align-items:center; gap:8px; width:calc(100% - 12px); margin:0 6px 8px;
  padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card2);
  color:var(--muted); cursor:pointer; font-size:.86rem; font-family:var(--font); text-align:left;
  transition:background .18s,border-color .18s,color .18s }
.sb-search:hover{ background:var(--card); border-color:var(--primary); color:var(--text) }
.sb-search>svg{ width:16px; height:16px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round }
.sb-search>span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.sb-search>kbd{ font-size:.66rem; border:1px solid var(--line); border-radius:5px; padding:1px 5px;
  opacity:.7; flex:0 0 auto; font-family:var(--font) }
.sidebar.collapsed .sb-search{ justify-content:center; padding:9px 0 }
.sidebar.collapsed .sb-search>span,.sidebar.collapsed .sb-search>kbd{ display:none }

.gs-wrap{ position:fixed; inset:0; z-index:200; display:none }
.gs-wrap.on{ display:block }
.gs-bg{ position:absolute; inset:0; background:rgba(10,18,12,.5);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px) }
.gs-box{ position:absolute; left:50%; top:9vh; transform:translateX(-50%); width:min(720px,94vw);
  max-height:78vh; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line);
  border-radius:16px; box-shadow:0 24px 70px -20px rgba(10,20,12,.5); overflow:hidden }
.gs-head{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid var(--line); flex:0 0 auto }
.gs-head>svg{ width:18px; height:18px; flex:0 0 auto; stroke:var(--muted); fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round }
.gs-head input{ flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text);
  font-size:16px; font-family:var(--font); padding:6px 2px }
.gs-x{ flex:0 0 auto; width:32px; height:32px; border:0; background:transparent; color:var(--muted);
  cursor:pointer; border-radius:8px; display:none; align-items:center; justify-content:center }
.gs-x.on{ display:flex }
.gs-x svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round }
.gs-cancel{ flex:0 0 auto; border:0; background:transparent; color:var(--muted); font-size:.82rem;
  font-family:var(--font); cursor:pointer; padding:6px 4px; min-height:44px }
.gs-body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 10px 14px }
.gs-group{ margin:4px 0 12px }
.gs-gt{ display:block; font-size:.74rem; color:var(--muted); font-weight:600; padding:7px 6px 5px;
  border-top:1px solid var(--line) }
.gs-group:first-child .gs-gt{ border-top:0 }
.gs-item{ display:block; width:100%; text-align:left; padding:9px 10px; border:0; border-radius:10px;
  background:transparent; cursor:pointer; font-family:var(--font); color:var(--text); min-height:44px;
  transition:background .15s }
.gs-item:hover{ background:var(--card2) }
.gs-t{ font-size:.88rem; font-weight:600; line-height:1.45; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden }
.gs-c{ font-size:.78rem; color:var(--muted); line-height:1.55; margin-top:3px; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.gs-item mark{ background:rgba(255,208,96,.42); color:inherit; border-radius:3px; padding:0 1px }
.gs-empty{ text-align:center; color:var(--muted); font-size:.85rem; padding:30px 16px; line-height:1.9 }
.gs-empty b{ color:var(--text) }
.gs-tip{ font-size:.74rem; color:var(--muted); padding:8px 6px; line-height:1.8 }
@keyframes gsFlash{ 0%,100%{ background:transparent } 25%,60%{ background:rgba(255,208,96,.34) } }
.gs-focus{ animation:gsFlash 1.8s ease; border-radius:10px }

/* ============ 3. 通用组件 ============ */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--card-radius);
  padding:var(--card-pd); box-shadow:var(--card-shadow); margin-bottom:14px;
  transition:background var(--tr), border-color var(--tr);
  position:relative; overflow:hidden;
}
/* 简易波点装饰（森系呼吸感，不改动整体配色） */
.card::before{ content:''; position:absolute; right:-34px; top:-30px; width:132px; height:132px; border-radius:50%;
  background-image:radial-gradient(circle, color-mix(in srgb,var(--primary) 14%,transparent) 1.6px, transparent 2px);
  background-size:13px 13px; opacity:.5; pointer-events:none }
.card::after{ content:''; position:absolute; left:-24px; bottom:-24px; width:96px; height:96px; border-radius:50%;
  background-image:radial-gradient(circle, color-mix(in srgb,var(--accent) 12%,transparent) 1.4px, transparent 2px);
  background-size:11px 11px; opacity:.4; pointer-events:none }
.card-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; position:relative }
.card-head h2, .card-head h3{ margin:0; font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:9px }
.card-head .spacer{ flex:1 }
/* 卡片头部图标：浅色圆形背景 */
.card-head h3 svg, .card-head h2 svg{ background:var(--primary-soft); color:var(--primary2); border-radius:50%; padding:6px; width:30px; height:30px; flex:0 0 auto; fill:none }
.ic{ width:20px; height:20px; stroke:currentColor; fill:color-mix(in srgb,var(--primary) 12%,transparent); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto }
.ic-sm{ width:16px; height:16px }
.sec-title{ font-size:1.35rem; margin:0 0 10px; display:flex; align-items:center; gap:10px; color:var(--primary2); font-weight:800; letter-spacing:.4px; position:relative }
.sec-title::after{ content:''; position:absolute; left:0; bottom:-5px; width:44px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--primary),transparent) }
.sec-sub{ color:var(--muted); font-size:.875rem; margin:0 0 18px }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:44px; padding:10px 16px; border-radius:var(--r-md); border:1px solid var(--line);
  background:var(--card2); color:var(--text); font-size:.9rem; font-family:var(--font);
  cursor:pointer; transition:all var(--tr); font-weight:500;
}
.btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow) }
.btn:active{ transform:translateY(0) scale(.985) }
.btn-primary{ background:linear-gradient(145deg,var(--primary),var(--primary2)); color:var(--on-primary); border-color:transparent; box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 30%,transparent) }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 40%,transparent) }
.btn-accent{ background:var(--accent); color:var(--on-primary); border-color:transparent }
.btn-ghost{ background:transparent }
.btn-danger{ background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 30%,transparent) }
.btn-sm{ min-height:36px; padding:6px 12px; font-size:.82rem; border-radius:var(--r-sm) }
.btn-icon{ min-height:40px; width:40px; padding:0; border-radius:12px }
.btn-block{ width:100% }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none }

/* ── AI 助手（B1）─────────────────────────────────────────────
   样式原则：描边式，不抢主按钮视觉；loading 就地转圈，不弹窗不跳转 */
.btn-ai{
  color:var(--primary); background:color-mix(in srgb,var(--primary) 8%,transparent);
  border-color:color-mix(in srgb,var(--primary) 30%,transparent); white-space:nowrap;
}
.btn-ai:hover{ background:color-mix(in srgb,var(--primary) 15%,transparent); border-color:var(--primary) }
.btn-ai:disabled{ opacity:.62 }
.ai-spin{
  display:inline-block; width:13px; height:13px; margin-right:6px; vertical-align:-2px;
  border:2px solid currentColor; border-right-color:transparent; border-radius:50%;
  animation:aiSpin .7s linear infinite;
}
@keyframes aiSpin{ to{ transform:rotate(360deg) } }
/* weak 提示：小字，不遮挡、不阻塞 */
.ai-weak{ margin-top:6px; font-size:.74rem; line-height:1.5; color:var(--yellow-fg); word-break:break-word }
.ai-weak:empty{ display:none }
/* 计划拆解的内联结果卡：嵌在快速添加卡片内，不弹窗不跳转 */
.ai-steps{
  margin-top:10px; padding:10px 12px; background:var(--card2);
  border:1px dashed color-mix(in srgb,var(--primary) 40%,transparent); border-radius:var(--r-sm);
}
.ai-steps-hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--text-2); margin-bottom:4px }
.ai-steps-hd .spacer{ flex:1 }
.ai-step{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:.85rem; line-height:1.5 }
.ai-step:first-of-type{ border-top:0 }
.ai-step .ai-step-t{ flex:1; min-width:0; word-break:break-word }

/* ── 第三批 · 阶段2：D1 今日执行顺序建议结果 ────────────────────────── */
.d1-box{
  margin-top:12px; padding:11px 13px; background:var(--card2);
  border:1px dashed color-mix(in srgb,var(--primary) 40%,transparent); border-radius:var(--r-sm);
}
.d1-box.d1-err{ border-style:solid; border-color:color-mix(in srgb,var(--danger) 35%,transparent) }
.d1-hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.82rem; color:var(--text-2); margin-bottom:8px }
.d1-hd .spacer{ flex:1 }
.d1-it{ display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line); font-size:.88rem; line-height:1.5 }
.d1-it:first-of-type{ border-top:0 }
.d1-n{ flex:0 0 auto; font-weight:600; color:var(--primary2); min-width:20px }
.d1-t{ flex:1; min-width:0; word-break:break-word }
.d1-it .badge{ flex:0 0 auto }

/* ── N2 笔记费曼自测题（第三批 · 阶段3 · 批次一）────────────────────
   复用 d1-box 的虚线卡片观感，但内容是可勾选的题目列表。 */
.quiz-box{
  margin-top:12px; padding:11px 13px; background:var(--card2);
  border:1px dashed color-mix(in srgb,var(--primary) 40%,transparent); border-radius:var(--r-sm);
}
.quiz-box.quiz-err{ border-style:solid; border-color:color-mix(in srgb,var(--danger) 35%,transparent) }
.quiz-hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.82rem; color:var(--text-2); margin-bottom:8px }
.quiz-hd .spacer{ flex:1 }
.quiz-it{ display:flex; align-items:center; gap:9px; padding:7px 0; min-height:44px; cursor:pointer; border-top:1px solid var(--line); font-size:.88rem; line-height:1.5 }
.quiz-it:first-of-type{ border-top:0 }
.quiz-it:active{ background:var(--card) }
/* 复用的自绘方块，仅作视觉指示（点击区是整行，保证移动端 ≥44px 触摸区） */
.quiz-it .ck-box{ flex:0 0 auto; width:22px; height:22px; pointer-events:none }
.quiz-q{ flex:1; min-width:0; word-break:break-word }

/* ── AI 助手（B2）─────────────────────────────────────────────
   移动端顶栏右侧操作组：从「三个绝对定位、写死 right 值」改成正常流 flex。
   绝对定位写死 right:106/60/14，第四个按钮一加进来就会互相压住甚至溢出；
   改成 flex 后宽度由浏览器算，加几个都不挤，触摸区尺寸由下面那条统一保证。 */
.tb-acts{ display:flex; align-items:center; gap:2px; flex:0 0 auto; margin-left:auto }
.topbar .btn-icon{ min-height:44px; width:44px; padding:0 }
/* 侧边栏 AI 入口：与搜索入口同款（折叠态自动只留图标，无需额外适配） */
.sb-search.is-ai:hover{ border-color:var(--accent) }
/* 全局 AI 助手浮层：沿用搜索面板骨架，PC 居中弹层 / 移动端整屏 */
.ai-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:2px 6px 8px }
.ai-chip{ min-height:34px; padding:5px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--card2); color:var(--muted); font-size:.78rem; font-family:var(--font);
  cursor:pointer; transition:background .16s,border-color .16s,color .16s }
.ai-chip.on{ background:color-mix(in srgb,var(--primary) 14%,transparent);
  border-color:var(--primary); color:var(--primary2); font-weight:600 }
.ai-msg{ padding:8px 8px 2px }
.ai-load{ display:flex; align-items:center; gap:9px; color:var(--muted); font-size:.85rem }
.ai-load .ai-spin{ margin-right:0; width:15px; height:15px }
.ai-ans{ background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:12px 14px; font-size:.88rem; line-height:1.78; white-space:pre-wrap;
  word-break:break-word; color:var(--text) }
.ai-acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }
/* ── 批次二：AI 回顾 / 洞察 ─────────────────────────────────────────── */
.ai-out{ background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:12px 14px; font-size:.88rem; line-height:1.8;
  word-break:break-word; color:var(--text); max-height:26em; overflow:auto; -webkit-overflow-scrolling:touch }
/* 危机拦截：后端命中关键词时直接返回热线文案，没经过模型。
   ★ 视觉上必须和普通 AI 输出明显不同 —— 用警示色边框 + 淡红底，
     否则用户会以为是 AI 的"分析结论"。 */
.crisis-box{ background:var(--danger-soft); border:2px solid var(--danger); border-radius:var(--r-md);
  padding:14px 16px; font-size:.9rem; line-height:1.85;
  word-break:break-word; color:var(--text) }
.crisis-box::before{ content:'这不是 AI 生成的内容'; display:block; font-size:.72rem;
  font-weight:800; letter-spacing:.5px; color:var(--danger); margin-bottom:8px }
/* 已有脚本（只读）区块：灰色底、等宽、可滚动，和"可编辑输入框"视觉明显区分，
   避免用户以为这是能改的草稿、改了又没了（脚本由 AI 生成，重生成会覆盖）。 */
.ro-box{ background:var(--card2); border:1px dashed var(--line); border-radius:var(--r-sm);
  padding:10px 12px; font-size:.84rem; line-height:1.7; color:var(--muted);
  white-space:pre-wrap; word-break:break-word; max-height:14em; overflow:auto }
/* 结果正文里的日期：点开看那天记了什么。行内按钮，别抢正文的视觉重心。 */
.dt-chip{ display:inline; font:inherit; font-size:.8em; color:var(--primary2);
  background:var(--primary-soft); border:1px solid var(--line); border-radius:999px;
  padding:1px 8px; margin:0 2px; cursor:pointer; line-height:1.6 }
.dt-chip:hover{ background:var(--primary); color:var(--on-primary); border-color:var(--primary) }
/* 勾选行（如"与上周对比"）：整行按钮，触控目标 44px，一次点击 = 一次切换 */
.ck-line{ display:flex; align-items:center; gap:9px; min-height:44px; width:100%;
  cursor:pointer; font-size:.82rem; color:var(--text); text-align:left;
  background:none; border:none; padding:0 2px; font-family:inherit }
.ck-box{ flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
  background:var(--card2); display:flex; align-items:center; justify-content:center; color:transparent }
.ck-box.on{ background:var(--primary); border-color:var(--primary); color:var(--on-primary) }
.ai-quota{ font-size:.72rem; color:var(--muted); padding:10px 8px 0; line-height:1.75;
  border-top:1px solid var(--line); margin-top:10px }
.ai-quota b{ color:var(--text-2) }
.ai-bar{ height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px }
.ai-bar>i{ display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,var(--primary),var(--accent)) }
.ai-bar.over>i{ background:linear-gradient(90deg,var(--accent),var(--danger)) }
.ai-note{ font-size:.74rem; color:var(--muted); padding:6px 2px 0; line-height:1.7 }

input, select, textarea{
  width:100%; font-family:var(--font); font-size:16px; color:var(--text);
  background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md);
  padding:11px 13px; min-height:44px; transition:border-color var(--tr), box-shadow var(--tr);
}
textarea{ resize:vertical; min-height:88px; line-height:1.6 }
input:focus, select:focus, textarea:focus{
  outline:none; border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);
}
label.fl{ display:block; font-size:.8rem; color:var(--muted); margin:0 0 5px; font-weight:500 }
.field{ margin-bottom:12px }
/* 重复控制 */
.repeat-box{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px 12px; margin-bottom:12px }
.repeat-box .fl{ margin:0; align-self:center; white-space:nowrap }
.repeat-sel{ height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--text); padding:0 10px; font-size:.9rem }
.repeat-opts{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; flex:1; min-width:200px }
.repeat-opts > div{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center }
.repeat-opts input[type=number]{ width:62px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--text); padding:0 8px; font-size:.9rem }
.wk-pick{ display:inline-flex; align-items:center; gap:3px; padding:5px 10px; border-radius:20px; border:1px solid var(--line); background:var(--card2); font-size:.8rem; cursor:pointer; user-select:none; transition:all var(--tr) }
.wk-pick.on{ background:var(--primary-soft); border-color:color-mix(in srgb,var(--primary) 30%,transparent); color:var(--primary2); font-weight:600 }
.wk-pick input{ display:none }
.repeat-tip{ font-size:.75rem; color:var(--muted); width:100%; margin-top:2px }
.hint-sm{ font-size:.75rem; color:var(--muted) }
.kw-cloud{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-top:6px }
.kw{ color:var(--primary2); font-weight:700; background:var(--primary-soft); padding:2px 11px; border-radius:20px; line-height:1.7 }
/* 日期选择头 */
.day-head{ display:flex; align-items:center; gap:9px; flex-wrap:wrap }
.day-picker{ font-size:.95rem; font-weight:600; border:1px solid var(--line); background:var(--card2); color:var(--text); border-radius:10px; padding:5px 9px; min-height:36px }
.day-tag{ font-size:.72rem; color:var(--muted); background:var(--card2); padding:3px 9px; border-radius:20px; border:1px solid var(--line) }
.rep-badge{ color:var(--primary2); background:var(--primary-soft); padding:1px 7px; border-radius:20px; font-size:.7rem; font-weight:600; white-space:nowrap }

.row{ display:flex; gap:10px; flex-wrap:wrap }
.row > *{ flex:1; min-width:130px }
.grid{ display:grid; gap:14px }
.grid.g2{ grid-template-columns:1fr 1fr }
.grid.g4{ grid-template-columns:repeat(4,1fr) }
.stat-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); font-size:.86rem }
.stat-row:last-child{ border-bottom:none }
.stat-row span{ color:var(--muted) }
.stat-row b{ font-size:1.05rem }
.g2{ grid-template-columns:repeat(2,1fr) }
.g3{ grid-template-columns:repeat(3,1fr) }
.g4{ grid-template-columns:repeat(4,1fr) }
.gauto{ grid-template-columns:repeat(auto-fill,minmax(210px,1fr)) }

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:20px;
  font-size:.75rem; background:var(--card2); border:1px solid var(--line); color:var(--muted);
  cursor:pointer; transition:all var(--tr); min-height:30px;
}
.chip.on{ background:var(--primary-soft); color:var(--primary2); border-color:color-mix(in srgb,var(--primary) 32%,transparent); font-weight:600 }
html[data-theme="dark"] .chip.on{ color:var(--primary) }
.chips{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px }
.tag{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:.7rem; background:var(--accent-soft); color:var(--accent); font-weight:600; border:none; letter-spacing:.2px }
.tag.pink{ background:var(--pink-soft); color:var(--pink-fg) }
.tag.yellow{ background:var(--yellow-soft); color:var(--yellow-fg) }
.tag.purple{ background:var(--purple-soft); color:var(--purple-fg) }
.tag.green{ background:var(--primary-soft); color:var(--primary2) }
.badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:8px; font-size:.7rem; font-weight:700 }
.b-p0{ background:var(--danger-soft); color:var(--danger) }
.b-p1{ background:#F4EDD9; color:#7B6420 }
html[data-theme="dark"] .b-p1{ background:#3B3218; color:var(--warn) }
.b-p2{ background:var(--primary-soft); color:var(--primary2) }
html[data-theme="dark"] .b-p2{ background:var(--primary-soft); color:var(--primary) }
.b-over{ background:var(--danger); color:var(--on-primary) }

.list{ display:flex; flex-direction:column; gap:10px }
.item{
  position:relative;
  display:flex; align-items:flex-start; gap:11px; padding:14px 15px;
  background:var(--card2); border:1px solid var(--line); border-radius:12px;
  transition:all var(--tr);
}
.item:nth-child(even){ background:color-mix(in srgb,var(--card2) 78%, var(--primary-soft)) }
/* 优先级左侧色条（列表项带 p0/p1/p2 或 data-p 时生效） */
.item.p0, .item[data-p="0"]{ border-left:4px solid var(--danger) }
.item.p1, .item[data-p="1"]{ border-left:4px solid var(--warn) }
.item.p2, .item[data-p="2"]{ border-left:4px solid var(--primary) }
.over-corner{
  position:absolute; top:-9px; right:-7px; background:var(--danger); color:var(--on-primary);
  font-size:.66rem; font-weight:700; padding:2px 9px; border-radius:20px; box-shadow:0 2px 6px color-mix(in srgb,var(--danger) 40%,transparent); z-index:2;
}
.src-tag{
  border:1px dashed var(--primary2); color:var(--primary2); background:var(--primary-soft);
  font-size:.7rem; font-weight:600; padding:1px 8px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
.src-tag:hover{ background:var(--primary2); color:#fff }
.src-tag.manual{ border-style:solid; border-color:var(--warn); color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent) }
.pm-info{ background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; margin-bottom:12px }
.pm-t{ font-weight:600; font-size:.95rem; margin-bottom:4px; line-height:1.4 }
.pm-url{ font-size:.74rem; color:var(--muted); word-break:break-all; line-height:1.5 }
.once-badge{ color:var(--muted); background:var(--bg2); padding:1px 7px; border-radius:20px; font-size:.7rem; font-weight:600; white-space:nowrap }
.btn-warn{ background:var(--danger); color:var(--on-primary) }
.btn-warn:hover{ filter:brightness(.94) }
.item:hover{ border-color:color-mix(in srgb,var(--primary) 35%,transparent) }
.item.over{ border-left:4px solid var(--danger); background:var(--danger-soft) }
.item.done{ opacity:.58 }
.item.done .it-title{ text-decoration:line-through }
.it-body{ flex:1; min-width:0 }
.it-title{ font-weight:400; font-size:.9rem; word-break:break-word }
.it-meta{ font-size:.75rem; color:var(--muted); margin-top:4px; display:flex; gap:9px; flex-wrap:wrap; align-items:center }
.it-actions{ display:flex; gap:8px; flex-shrink:0 }
.cbx{
  width:24px; height:24px; min-width:24px; min-height:24px; border-radius:8px; flex:0 0 24px;
  border:2px solid var(--line); background:var(--card); cursor:pointer; display:grid; place-items:center;
  padding:0; transition:all var(--tr); margin-top:1px;
}
.cbx.on{ background:var(--primary); border-color:var(--primary) }
.cbx svg{ width:14px; height:14px; stroke:var(--on-primary); stroke-width:3; fill:none; opacity:0 }
.cbx.on svg{ opacity:1 }
.icon-btn{
  width:34px; height:34px; min-height:34px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); display:grid; place-items:center; cursor:pointer; padding:0;
  color:var(--muted); transition:all var(--tr);
}
.icon-btn:hover{ color:var(--primary2); border-color:var(--primary); background:var(--primary-soft) }
.icon-btn.dg:hover{ color:var(--danger); border-color:var(--danger); background:var(--danger-soft) }
/* 第五轮 A-3：提醒中心的「停用」「归档」原来都是默认灰 + 铃铛 / 对勾，
   两个图标都不说明自己要干什么，颜色也一模一样，用户分不清差别。
   现在按语义分流：停用 = 铃铛划斜线 + 琥珀色（--warn，三套主题各有取值，不新增色值）；
   归档 = 收纳箱 + 中性灰（--card2 / --muted）。配色全部派生自既有主题变量。 */
.icon-btn.warn{ color:var(--warn); border-color:color-mix(in srgb,var(--warn) 38%,transparent); background:color-mix(in srgb,var(--warn) 10%,transparent) }
.icon-btn.warn:hover{ color:var(--warn); border-color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent) }
.icon-btn.arch{ color:var(--muted); border-color:var(--line); background:var(--card2) }
.icon-btn.arch:hover{ color:var(--text); border-color:var(--muted); background:var(--card2) }
.icon-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round }
/* ===== 第五轮 B：目标看板「打卡总览」=====
   纯 CSS 柱状图：外层 .bc-bar 是轨道，内层 i.p = 应做（浅）、i.d = 已完成（实色）。
   不引入任何图表库，保证单文件零外部依赖。颜色全部派生自主题变量。 */
.bc-wrap{ display:flex; flex-direction:column }
.bc-mod{ padding:12px 0; border-top:1px solid var(--line) }
.bc-mod:first-child{ border-top:none; padding-top:2px }
.bc-mod:last-child{ padding-bottom:2px }
.bc-mod-h{ display:flex; align-items:center; gap:8px; margin-bottom:9px; flex-wrap:wrap }
.bc-mod-n{ font-weight:600; font-size:.88rem; display:inline-flex; align-items:center; gap:6px; color:var(--text) }
.bc-mod-n svg{ width:15px; height:15px }
.bc-mod-s{ margin-left:auto; display:inline-flex; gap:12px; align-items:baseline; font-size:.78rem; color:var(--muted) }
.bc-mod-s b{ color:var(--text); font-weight:600; font-size:.88rem }
.bc-chart{ display:flex; align-items:stretch; gap:2px; height:58px; overflow:hidden }
.bc-bar{ position:relative; flex:1 1 0; min-width:3px; background:var(--card2); border-radius:3px; overflow:hidden }
.bc-bar > i{ position:absolute; left:0; right:0; bottom:0; display:block; border-radius:3px 3px 0 0; transition:height var(--tr) }
.bc-x{ display:flex; gap:2px; margin-top:5px; font-size:.6rem; color:var(--muted); overflow:hidden; line-height:1.3 }
.bc-x > span{ flex:1 1 0; min-width:3px; text-align:center; white-space:nowrap; overflow:hidden }
.bc-empty{ font-size:.8rem; color:var(--muted); padding:8px 0 }
.bc-cfg{ display:flex; flex-wrap:wrap; gap:7px }
/* 第五轮 A-3：提醒中心的图标语义图例（手机上没有 hover，tooltip 摸不到，必须给文字） */
.rem-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin:10px 0 2px; font-size:.75rem; color:var(--muted) }
.rem-legend>span{ display:inline-flex; align-items:center; gap:5px }
.rem-legend .ic-w{ color:var(--warn); display:inline-flex }
.rem-legend .ic-a{ color:var(--muted); display:inline-flex }
.rem-legend .ic-d{ color:var(--danger); display:inline-flex }

.empty{ text-align:center; padding:34px 16px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:8px }
.empty svg{ width:64px; height:64px; stroke:var(--primary); fill:none; stroke-width:1.6; margin-bottom:4px; opacity:.9; background:var(--primary-soft); border-radius:50%; padding:13px; box-shadow:0 0 0 9px color-mix(in srgb,var(--primary-soft) 60%,transparent), 0 4px 10px color-mix(in srgb,var(--primary) 14%,transparent) }
.empty p{ margin:0; font-size:.86rem; color:var(--muted) }
.empty .empty-act{ margin-top:8px }

.stat{ background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md); padding:14px }
.stat .s-lab{ font-size:.74rem; color:var(--muted); display:flex; align-items:center; gap:5px }
.stat .s-val{ font-size:1.5rem; font-weight:700; margin-top:3px; line-height:1.2 }
.stat .s-sub{ font-size:.72rem; color:var(--muted) }
.pos{ color:var(--danger) } /* 国内习惯：支出/负向 = 红 */
.neg{ color:var(--success) } /* 收入/正向 = 绿 */

.bar{ height:9px; background:var(--bg2); border-radius:20px; overflow:hidden }
.bar > i{ display:block; height:100%; border-radius:20px; background:linear-gradient(90deg,var(--primary),var(--primary2)); transition:width .5s ease }
.prog-row{ margin-bottom:14px }
.prog-top{ display:flex; justify-content:space-between; font-size:.84rem; margin-bottom:6px; gap:10px }
.prog-top b{ font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

/* 今天要处理 */
.today{
  background:linear-gradient(145deg,var(--primary-soft),var(--card));
  border:1px solid color-mix(in srgb,var(--primary) 26%,transparent);
  border-radius:var(--r-lg); padding:18px; margin-bottom:20px; box-shadow:var(--shadow);
}
/* ---- 打卡入口卡片（第三轮 · 模块三）----
   虚线圆形图标 + 浅绿线框按钮，与实线任务卡片形成视觉区分。
   颜色全部走主题变量，森系 / 浅色 / 深色三套主题都能正确显示
   （指令里示例的 #ccc 是硬编码，深色主题下会看不见，故改用 var(--line)）。 */
.ck-card{
  display:flex; align-items:center; gap:12px;
  background:var(--card); border:1px solid var(--line);
  border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.04);
  padding:12px 14px; margin-bottom:10px;
  transition:box-shadow .2s, transform .2s;
}
.ck-card:last-child{ margin-bottom:0 }
.ck-card:hover{ box-shadow:0 4px 14px rgba(0,0,0,.07); transform:translateY(-1px) }
.ck-ic{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  border:2px dashed var(--line); background:var(--card2); color:var(--primary);
  display:grid; place-items:center;
}
.ck-ic svg{ width:18px; height:18px }
.ck-txt{ flex:1; min-width:0; font-size:.86rem; font-weight:500; color:var(--text) }
.ck-btn{
  flex:0 0 auto; font-family:inherit; cursor:pointer;
  border:1px solid var(--primary); border-radius:8px; padding:7px 14px; font-size:.82rem;
  background:var(--primary-soft); color:var(--primary2);
  transition:background .2s, color .2s;
}
.ck-btn:hover{ background:var(--primary); color:var(--on-primary) }
.today h2{ margin:0 0 4px; font-size:1.08rem; display:flex; align-items:center; gap:9px; color:var(--primary2) }
html[data-theme="dark"] .today h2{ color:var(--primary) }
.today .t-sub{ font-size:.78rem; color:var(--muted); margin:0 0 13px }
.today .item{ background:var(--card) }

/* 模态 / 抽屉 */
.mask{
  position:fixed; inset:0; background:rgba(30,38,28,.46); backdrop-filter:blur(3px);
  z-index:100; display:none; align-items:center; justify-content:center; padding:18px;
}
.mask.on{ display:flex }
.modal{
  background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:520px; max-height:86vh; overflow-y:auto; padding:20px;
  animation:pop .2s ease;
}
.modal.wide{ max-width:740px }
@keyframes pop{ from{ opacity:0; transform:translateY(14px) scale(.98) } }
.modal-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px }
.modal-head h3{ margin:0; font-size:1.08rem; flex:1 }
.modal-foot{ display:flex; gap:10px; margin-top:18px }
.modal-foot .btn{ flex:1 }

.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); background:var(--card);
  z-index:110; box-shadow:var(--shadow-lg); transform:translateX(102%); transition:transform .26s ease;
  overflow-y:auto; padding:20px 18px calc(30px + env(safe-area-inset-bottom));
}
.drawer.on{ transform:none }

/* 移动底部导航 */
.botnav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--card); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.botnav-in{ display:flex; justify-content:space-around; align-items:stretch }
.bn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:52px; min-width:44px; border:none; background:none; color:var(--muted);
  font-size:.66rem; cursor:pointer; padding:4px 2px; border-radius:12px; font-family:var(--font);
}
.bn svg{ width:21px; height:21px; stroke:currentColor; fill:rgba(140,154,77,.12); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round }
.bn.active{ color:var(--primary2); font-weight:700 }
html[data-theme="dark"] .bn.active{ color:var(--primary) }

/* 更多面板 */
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:105; background:var(--card);
  border-radius:24px 24px 0 0; box-shadow:var(--shadow-lg); padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%); transition:transform .26s ease; max-height:82vh; overflow-y:auto;
}
.sheet.on{ transform:none }
.sheet-bar{ width:42px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px }
.mgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px }
.mg-item{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 6px;
  border-radius:var(--r-md); background:var(--card2); border:1px solid var(--line);
  cursor:pointer; font-size:.74rem; text-align:center; color:var(--text); min-height:78px; justify-content:center;
}
.mg-item.active{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary2); font-weight:700 }
.mg-item svg{ width:22px; height:22px; stroke:currentColor; fill:rgba(140,154,77,.12); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round }

/* toast */
#toasts{ position:fixed; left:50%; transform:translateX(-50%); bottom:auto; top:16px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw }
.toast{
  background:var(--text); color:var(--card); padding:11px 17px; border-radius:22px; font-size:.85rem;
  box-shadow:var(--shadow-lg); animation:tin .25s ease; display:flex; align-items:center; gap:8px;
}
.toast.err{ background:var(--danger); color:#fff }
.toast.ok{ background:var(--primary2); color:#fff }
@keyframes tin{ from{ opacity:0; transform:translateY(-12px) } }

/* 开关 */
.sw{ position:relative; width:46px; height:27px; flex:0 0 46px; border-radius:20px; background:var(--line); cursor:pointer; transition:background var(--tr); border:none; padding:0 }
.sw::after{ content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform var(--tr); box-shadow:0 1px 3px rgba(0,0,0,.2) }
.sw.on{ background:var(--primary) }
.sw.on::after{ transform:translateX(19px) }
.sw-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line) }
.sw-row:last-child{ border-bottom:none }
.sw-row .sr-txt{ flex:1; min-width:0 }
.sw-row .sr-txt b{ display:block; font-size:.9rem; font-weight:600 }
.sw-row .sr-txt span{ font-size:.74rem; color:var(--muted) }
.mod-ord{ display:flex; align-items:center; gap:6px; flex:0 0 auto }
.mod-ord .icon-btn{ width:30px; height:30px; min-height:30px; border-radius:8px; padding:0; border:1px solid var(--line); background:var(--card2); color:var(--muted) }
.mod-ord .icon-btn svg{ width:15px; height:15px }
.mod-ord .btn-sm{ min-height:30px; padding:4px 10px }
#bkThr{ width:56px; min-height:30px; padding:4px 7px; font-size:.82rem; border-radius:8px; display:inline-block; vertical-align:middle }

/* 日历 */
.cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; width:100% }
.cal-wd{ text-align:center; font-size:.72rem; color:var(--muted); padding:5px 0; font-weight:600 }
.cal-cell{
  aspect-ratio:1/1.25; border-radius:12px; border:1px solid var(--line); background:var(--card2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  cursor:pointer; font-size:1rem; position:relative; min-height:56px; transition:all var(--tr); padding:3px;
}
.cal-cell > span:first-child{ font-size:1.05rem; font-weight:600 }
.cal-cell.out{ opacity:.32 }
.cal-cell.today{ border-color:var(--primary); border-width:2px; font-weight:700; color:var(--primary2) }
html[data-theme="dark"] .cal-cell.today{ color:var(--primary) }
.cal-cell.sel{ background:var(--primary-soft); border-color:var(--primary) }
.cal-cell .dots{ display:flex; gap:3.5px; height:9px; align-items:center }
.cal-cell .dot{ width:8px; height:8px; border-radius:50%; background:var(--primary) }
.cal-cell .dot.d0{ background:var(--danger) } .cal-cell .dot.d1{ background:var(--warn) } .cal-cell .dot.d2{ background:var(--primary) }
.cal-cell.hasover{ background:var(--danger-soft) }
/* 移动端：压缩日历格子，保证月视图 6 行在单屏内完整纵向展示，且 7 列无横向截断 */
@media (max-width:768px){
  .cal-grid{ gap:3px }
  .cal-wd{ padding:3px 0; font-size:.66rem }
  .cal-cell{ aspect-ratio:auto; min-height:0; padding:2px; font-size:.82rem; border-radius:9px }
  .cal-cell > span:first-child{ font-size:.92rem }
  .cal-cell .dots{ height:6px; gap:2.5px }
  .cal-cell .dot{ width:6px; height:6px }
}
@media (max-width:420px){
  .cal-grid{ gap:2px }
  .cal-cell{ padding:1px; font-size:.72rem; border-radius:7px }
  .cal-cell > span:first-child{ font-size:.82rem }
  .cal-wd{ font-size:.6rem }
}

/* 书架 */
.shelf{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:16px }
.book{ cursor:pointer; text-align:center }
.book-cv{
  aspect-ratio:3/4.3; border-radius:5px 11px 11px 5px; display:flex; align-items:flex-end; padding:9px;
  color:#fff; font-size:.72rem; font-weight:700; box-shadow:var(--shadow); position:relative; overflow:hidden;
  border-left:5px solid rgba(0,0,0,.22); line-height:1.32; text-shadow:0 1px 3px rgba(0,0,0,.3);
  word-break:break-all; overflow-wrap:anywhere;
}
.book-cv .bstat{ position:absolute; top:7px; right:7px; background:rgba(255,255,255,.94); color:#333; font-size:.62rem; padding:1px 7px; border-radius:8px; text-shadow:none }
.book-nm{ font-size:.76rem; margin-top:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.book-au{ font-size:.68rem; color:var(--muted) }
.shelf-board{ height:11px; background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000)); border-radius:3px; margin:0 0 22px; box-shadow:var(--shadow) }
.stars{ color:var(--warn); font-size:.8rem; letter-spacing:1px }

/* markdown */
.md{ font-size:.92rem; word-break:break-word }
.md h1,.md h2,.md h3{ margin:.9em 0 .45em; line-height:1.35 }
.md h1{ font-size:1.28rem } .md h2{ font-size:1.14rem } .md h3{ font-size:1.02rem }
.md p{ margin:.55em 0 } .md ul,.md ol{ margin:.5em 0; padding-left:1.35em }
.md li{ margin:.22em 0 }
.md code{ background:var(--bg2); padding:1.5px 6px; border-radius:6px; font-size:.86em; font-family:ui-monospace,Menlo,Consolas,monospace }
.md pre{ background:var(--bg2); padding:12px; border-radius:var(--r-sm); overflow-x:auto; margin:.7em 0 }
.md pre code{ background:none; padding:0 }
.md blockquote{ border-left:3px solid var(--primary); margin:.7em 0; padding:.25em 0 .25em 12px; color:var(--muted) }
.md a{ color:var(--primary2) }
.md hr{ border:none; border-top:1px solid var(--line); margin:1em 0 }
.md table{ border-collapse:collapse; width:100%; margin:.7em 0; font-size:.86rem }
.md th,.md td{ border:1px solid var(--line); padding:6px 9px; text-align:left }
.md th{ background:var(--card2) }

/* 同步状态 */
.syncdot{ display:inline-flex; align-items:center; gap:6px; font-size:.74rem; color:var(--muted); padding:5px 11px; border-radius:20px; background:var(--card2); border:1px solid var(--line) }
.syncdot i{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 8px }
.syncdot.ok i{ background:var(--success) } .syncdot.ok{ color:var(--success) }
.syncdot.run i{ background:var(--warn); animation:bl 1s infinite } .syncdot.run{ color:var(--warn) }
.syncdot.err i{ background:var(--danger) } .syncdot.err{ color:var(--danger) }
.syncdot.off i{ background:var(--muted) }
@keyframes bl{ 50%{ opacity:.25 } }

.hint{ font-size:.76rem; color:var(--muted); background:var(--card2); border:1px dashed var(--line); border-radius:var(--r-sm); padding:10px 12px; margin:10px 0 }
.warnbar{
  display:flex; align-items:center; gap:9px; background:#FBF0D2; color:#8A6A0C; border:1px solid #EBD79A;
  padding:10px 13px; border-radius:var(--r-md); font-size:.82rem; margin-bottom:16px;
}
html[data-theme="dark"] .warnbar{ background:#3A3116; color:var(--warn); border-color:#5A4A20 }
.warnbar .btn{ margin-left:auto }
.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch }
.kanban{ display:grid; grid-template-columns:repeat(3,minmax(200px,1fr)); gap:12px }
.kcol{ background:var(--card2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px; min-height:90px }
.kcol h4{ margin:0 0 10px; font-size:.84rem; display:flex; align-items:center; gap:7px }
.kcol h4 span{ margin-left:auto; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:0 8px; font-size:.7rem; color:var(--muted) }
.tree{ list-style:none; padding-left:0; margin:0 }
.tree ul{ list-style:none; margin:6px 0 0; padding-left:18px; border-left:1.5px dashed var(--line) }
.tree li{ margin:6px 0 }
.tnode{ display:flex; align-items:flex-start; gap:9px; padding:9px 11px; background:var(--card2); border:1px solid var(--line); border-radius:var(--r-sm) }
.tnode.kr{ background:var(--primary-soft); border-color:color-mix(in srgb,var(--primary) 26%,transparent) }
.hm{ display:grid; grid-template-columns:repeat(auto-fit,minmax(13px,1fr)); gap:3.5px }
.hm i{ aspect-ratio:1/1; border-radius:4px; background:var(--bg2); display:block }
.hm i.l1{ background:color-mix(in srgb,var(--primary) 28%,var(--bg2)) }
.hm i.l2{ background:color-mix(in srgb,var(--primary) 55%,var(--bg2)) }
.hm i.l3{ background:color-mix(in srgb,var(--primary) 78%,var(--bg2)) }
.hm i.l4{ background:var(--primary2) }

/* ============ 4. 响应式 ============ */
@media (max-width:900px){
  /* 桌面侧边栏切换为浮动抽屉 */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0;
    width:min(296px,88vw); flex:0 0:auto;
    margin:0; border-radius:0 22px 22px 0; border-right:1px solid var(--line);
    transform:translateX(-105%); transition:transform .28s cubic-bezier(.4,.1,.2,1);
    z-index:75; padding-top:14px; display:flex;
  }
  .sidebar.on{ transform:translateX(0); box-shadow:8px 0 40px -10px rgba(20,30,15,.32) }
  .sidebar.collapsed{ width:min(296px,88vw) }
  .sidebar.collapsed .brand-txt,
  .sidebar.collapsed .nav-item > span,
  .sidebar.collapsed .nav-item .nv-badge,
  .sidebar.collapsed .nav-section-title{ display:initial }
  .sidebar.collapsed .nav-item{ justify-content:flex-start; padding:10px 12px }
  .sidebar.collapsed .brand{ justify-content:flex-start; padding:6px 6px 8px }
  .sidebar.collapsed .sb-handle{ transform:none }
  /* 浮动汉堡按钮 */
  .sb-fab{ display:grid; position:fixed; top:14px; left:14px; z-index:80;
    width:46px; height:46px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--text); box-shadow:0 8px 30px -10px rgba(20,30,15,.32);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background .22s, color .22s, border-color .22s, transform .22s;
  }
  .sb-fab.open{ background:var(--primary); color:#fff; border-color:transparent }
  .sb-fab:active{ transform:scale(.94) }
  .sb-fab svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .sb-head{ display:none }
  .topbar{ display:flex }
  /* 移动端触摸区：按钮最小 44×44，操作组间距 ≥8px */
  .content .icon-btn, .content .btn-sm{ min-height:44px; min-width:44px }
  .it-actions{ gap:8px }
  .botnav{ display:block }
  .content{ padding:62px 16px 92px }
  /* 移动端搜索面板：整屏，避让顶部刘海与底部安全区 */
  .gs-box{ top:0; left:0; right:0; transform:none; width:100%; max-height:100%; height:100%;
    border-radius:0; border:0 }
  .gs-head{ padding-top:calc(11px + env(safe-area-inset-top)) }
  .gs-body{ padding-bottom:calc(16px + env(safe-area-inset-bottom)) }
  .g2,.g3,.g4{ grid-template-columns:1fr }
  .gauto{ grid-template-columns:1fr 1fr }
  .kanban{ grid-template-columns:1fr }
  .card{ padding:10px; border-radius:var(--card-radius); margin-bottom:10px }
  .card-head h3 svg, .card-head h2 svg{ width:26px; height:26px; padding:5px }
  .empty svg{ width:54px; height:54px; padding:11px }
  .today{ padding:15px }
  .sec-title{ font-size:1.2rem }
  .card-head h2, .card-head h3{ font-size:1.05rem }
  .row > *{ min-width:100% }
  .modal{ max-width:none; border-radius:var(--r-lg) }
  .mask{ align-items:flex-end; padding:0 }
  .modal{ max-height:92vh; border-radius:22px 22px 0 0; padding-bottom:calc(20px + env(safe-area-inset-bottom)) }
  .shelf{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:12px }
  .stat .s-val{ font-size:1.3rem }
  #toasts{ top:66px }
}
@media (max-width:420px){
  .gauto{ grid-template-columns:1fr }
}
@media print{ .sidebar,.botnav,.topbar{ display:none } }

/* ============ 全局视觉密度优化（紧凑密度，字体沿用四级层级） ============ */
body{ font-size:0.875rem; line-height:1.6 }
.card{ margin-bottom:14px }
.card-head{ margin-bottom:11px }
.item{ padding:11px 12px; gap:9px; border-radius:12px }
/* ★ 触摸区铁律：移动端主按钮必须 ≥44px。原来是 38px，手指点上容易点空。 */
.btn{ min-height:44px; padding:8px 16px; font-size:.86rem; border-radius:8px }
.btn-sm{ min-height:32px; padding:5px 11px; font-size:.8rem }
.btn-icon{ min-height:36px; width:36px }
input, select, textarea{ font-size:16px; padding:8px 11px; border-radius:var(--r-sm) }
#bkThr{ min-height:28px }
.sw-row{ padding:9px 0; gap:9px }
.chips{ gap:7px }
.chip{ font-size:.8rem; padding:5px 12px; border-radius:20px }
.grid.g4 .stat, .grid.g3 .stat, .grid.g2 .stat{ padding:12px }
.stat .s-val{ font-size:1.5rem }
.tab{ font-size:.86rem; padding:7px 14px; border-radius:var(--r-md) }
.row{ gap:9px }
.mod-ord .icon-btn{ width:28px; height:28px; min-height:28px }


/* ============ 表达练嘴 / 摘抄 / 灵感 / AI学习 / 健康 通用卡片 ============ */
.exp-card{ background:var(--card); border-radius:var(--r-md); padding:13px 14px; margin-bottom:11px; border:1px solid var(--line) }
.exp-head{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:8px }
.exp-title{ font-size:1.02rem; font-weight:700; color:var(--primary2); letter-spacing:.5px }
.exp-lv{ font-size:.7rem; padding:2px 9px; border-radius:20px; background:var(--primary-soft); color:var(--primary2); font-weight:600 }
.exp-cnt{ font-size:.7rem; padding:2px 9px; border-radius:20px; background:var(--accent-soft); color:var(--accent); font-weight:600 }
.exp-txt{ font-size:.93rem; color:var(--text); line-height:1.78; white-space:pre-wrap; margin-bottom:10px }
.exp-btns{ display:flex; gap:7px; flex-wrap:wrap }
.exp-btn{ display:inline-flex; align-items:center; gap:5px; padding:5px 13px; font-size:.82rem; border:1.5px solid var(--primary); background:transparent; color:var(--primary2); border-radius:24px; cursor:pointer; min-height:30px; transition:all .15s ease }
.exp-btn:hover{ background:var(--primary-soft); transform:translateY(-1px) }
.exp-btn-ok{ border-color:var(--primary2); background:var(--primary); color:var(--on-primary); font-weight:600 }
.exp-btn-ok:hover{ background:var(--primary2) }
.exp-card:last-child{ margin-bottom:0 }

.mat-item{ display:flex; flex-direction:column; gap:8px; padding:9px 11px; background:var(--card); border-radius:var(--r-sm); margin-bottom:8px; border-left:3px solid var(--primary) }
.mat-tag{ font-size:.7rem; padding:1px 8px; background:var(--primary-soft); color:var(--primary2); border-radius:20px; align-self:flex-start; font-weight:600 }
.mat-txt{ font-size:.88rem; color:var(--text); line-height:1.7 }
.mat-foot{ display:flex; justify-content:space-between; align-items:center; gap:8px }

.aig-scroll{ display:flex; gap:12px; overflow-x:auto; padding:6px 2px 12px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch }
.aig-scroll::-webkit-scrollbar{ height:4px }
.aig-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px }
.aig-card{ flex:0 0 240px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px; display:flex; flex-direction:column; gap:6px; scroll-snap-align:start; min-height:170px; cursor:pointer; transition:transform .15s ease }
.aig-card:hover{ transform:translateY(-2px); border-color:var(--primary) }
.aig-cover{ height:80px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft)); color:var(--primary2) }
.aig-cover svg{ width:36px; height:36px }
.aig-vtitle{ font-size:.94rem; font-weight:600; color:var(--text); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.aig-vmeta{ font-size:.73rem; color:var(--muted); display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px }
.aig-tag{ font-size:.68rem; padding:1px 7px; background:var(--primary-soft); color:var(--primary2); border-radius:20px; font-weight:600 }
.aig-vbtn{ font-size:.7rem; padding:3px 11px; border:1px solid var(--primary); background:transparent; color:var(--primary2); border-radius:18px; cursor:pointer; display:inline-flex; align-items:center; gap:3px; min-height:28px }
.aig-vbtns{ display:flex; gap:6px; align-items:center }

.ait-card{ background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 7%,transparent),transparent); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px }

.ait-btn{ font-size:.8rem; padding:5px 13px; border:1px solid var(--primary); background:transparent; color:var(--primary2); border-radius:20px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; min-height:32px }
.ait-btn:hover{ background:var(--primary-soft) }
.ait-btn.faved{ background:var(--primary); color:var(--on-primary) }

.afs-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 13px; margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; gap:11px }
.afs-info{ flex:1; min-width:0 }

.afs-m{ font-size:.75rem; color:var(--muted); margin-top:2px }

.afs-act button{ font-size:.74rem; padding:3px 9px; border-radius:16px; min-height:28px }

.coin-rule-row:last-child{ border-bottom:none }
.coin-rule-row .cr-lab{ flex:1; font-size:.9rem; color:var(--text) }
.coin-rule-row .cr-inp{ width:60px; min-height:32px; padding:4px 9px; font-size:.95rem; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card); color:var(--primary2); text-align:center; font-weight:600 }

.lib-sort{ display:flex; align-items:center; gap:9px; flex-wrap:wrap }
.lib-sort .ls-label{ font-size:.8rem; color:var(--muted); margin-right:4px }
.lib-sort .ls-opt{ font-size:.8rem; padding:4px 11px; border-radius:18px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--text) }
.lib-sort .ls-opt.on{ border-color:var(--primary); color:var(--primary2); background:var(--primary-soft) }


/* ---------------- 18.6/18.7 提醒中心 / 成就殿堂 样式 ---------------- */
.cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; padding:6px 4px; width:100% }
.cal-h{ text-align:center; font-size:.72rem; color:var(--muted); padding:4px 0; font-weight:600 }
.cal-d{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:.8rem; color:var(--text); background:transparent; position:relative; min-height:34px }
.cal-e{ display:block }
.cal-d.cal-today{ background:var(--primary); color:var(--on-primary); font-weight:700 }
.cal-d.cal-dot b{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--accent) }

/* ---------------- 18.8 心情日记 ----------------
   日历刻意用独立的 mcal-*，不复用提醒中心的 .cal-d：
   两边格子结构不同（这边要装 emoji + 可点选），共用一套 class 必然要改对方，风险不划算。
   网格尺寸 / 翻月按钮 / 星期头保持与「提醒日历」一致的观感。 */
/* emoji 渲染基线（日历格 + 心情选择区共用）。
   踩过的坑：日历格子用的是 <i> 标签，而 <i> 的浏览器默认值是 font-style:italic。
   彩色 emoji 没有真正的斜体字形，浏览器会改用「合成倾斜」把整块位图斜切 —— 看起来就是歪的。
   另外全局 --font 里没有声明任何 emoji 字体，系统 fallback 不稳定，
   所以这里把彩色 emoji 字体显式排在最前面，并锁死 font-weight / transform / line-height。 */
.mcal-d, .mcal-h, .mcal-e{ font-style:normal }
.mcal-d .mc-e, .mood-b .mb-e{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--font);
  font-style:normal; font-weight:normal;
  transform:none; line-height:1;
  display:inline-block; flex:none;          /* flex:none 是关键：不给它伸缩，避免被 flex 挤压变形 */
  font-variant-emoji:emoji;                /* 支持的浏览器按彩色 emoji 渲染（不支持的直接忽略） */
}
.mood-grid{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; width:100% }
.mood-b{ position:relative; aspect-ratio:1; min-height:54px; border-radius:14px; border:1.5px solid var(--line); background:var(--card2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:all var(--tr) }
.mood-b .mb-e{ font-size:26px }
.mood-b:active{ transform:scale(.93) }
.mood-b.on{ border-color:var(--primary); border-width:2.5px; background:var(--primary-soft); box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 22%,transparent) }
.mood-b.on::after{ content:''; position:absolute; right:4px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--primary) }
.mood-b .mb-n{ position:absolute; left:0; right:0; bottom:2px; text-align:center; font-size:.56rem; line-height:1.1; color:var(--muted) }
.mood-b.on .mb-n{ color:var(--primary2); font-weight:700 }
.mood-extra{ margin-top:8px }
.mood-cus-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px }
@media (max-width:768px){
  .mood-grid{ gap:6px }
  .mood-b{ min-height:50px; border-radius:12px }
  .mood-b .mb-e{ font-size:23px }
  .mood-b .mb-n{ font-size:.52rem }
}
@media (max-width:360px){
  .mood-grid{ gap:4px }
  .mood-b{ min-height:46px }
  .mood-b .mb-e{ font-size:20px }
  .mood-b .mb-n{ display:none }
}

/* 翻月控件：‹ 标题 › 横排一行、整体居中。
   不放进 .card-head —— 那里左边还挂着 h3，会把按钮组挤到右边，窄屏甚至被挤换行。 */
.mcal-nav{ display:flex; align-items:center; justify-content:center; gap:6px; margin:2px 0 6px }
.mcal-nav-b{ width:44px; min-width:44px; height:44px; min-height:44px; padding:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:12px; background:var(--card2); color:var(--text); font-size:1.2rem; line-height:1; cursor:pointer; font-family:var(--font) }
.mcal-nav-b:active{ transform:scale(.92) }
.mcal-nav-t{ min-height:44px; padding:0 14px; display:inline-flex; align-items:center; border:1px solid transparent; border-radius:12px; background:transparent; color:var(--text); font-size:1rem; font-weight:700; font-family:var(--font); cursor:pointer }
.mcal-nav-t:hover{ background:var(--card2); border-color:var(--line) }

.mcal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; padding:6px 4px; width:100% }
.mcal-h{ text-align:center; font-size:.72rem; color:var(--muted); padding:4px 0; font-weight:600 }
.mcal-d{ aspect-ratio:1; min-height:44px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:transparent; border:1.5px solid transparent; position:relative; transition:all var(--tr) }
.mcal-e{ display:block }
/* emoji 容器做成正方形（宽高相等）+ line-height 等于高度，保证字形不被拉伸也不被裁切 */
.mcal-d .mc-e{ font-size:14px; width:16px; height:16px; line-height:16px; text-align:center }
.mcal-d .mc-n{ font-size:.76rem; line-height:1.15; color:var(--text) }
.mcal-d.cal-today{ border-color:var(--primary) }
.mcal-d.cal-today .mc-n{ color:var(--primary2); font-weight:700 }
.mcal-d.out{ opacity:.3 }
.mcal-d.sel{ background:var(--primary); border-color:var(--primary) }
.mcal-d.sel .mc-n{ color:var(--on-primary); font-weight:700 }
/* 窄屏：7 列要挤进 375px，同时每格触摸区必须 ≥44px。
   321px 内容宽下：gap 2px → 每格 43.6px（差一点点），改 gap 1px + 去掉左右 padding → 每格 45px。 */
@media (max-width:768px){
  .mcal-grid{ gap:1px; padding:4px 0 }
  .mcal-h{ font-size:.66rem; padding:3px 0 }
  .mcal-d{ min-height:44px }
  .mcal-d .mc-e{ font-size:13px; width:15px; height:15px; line-height:15px }
  .mcal-d .mc-n{ font-size:.72rem }
}

/* 回忆推送：窄条，默认折叠成一行，没有历史数据时整块不渲染 */
.mem-bar{ margin-top:10px; border:1px dashed var(--line); border-radius:12px; background:var(--surface); overflow:hidden }
.mem-head{ display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:0 12px; cursor:pointer; background:transparent; border:0; text-align:left; font-size:.86rem; color:var(--text) }
.mem-head .mh-e{ font-size:18px; line-height:1; flex:0 0 auto }
.mem-head .mh-d{ flex:0 0 auto; font-weight:700; color:var(--primary2); font-size:.82rem }
.mem-head .mh-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:.82rem }
.mem-head .mh-x{ flex:0 0 auto; color:var(--muted); display:flex }
.mem-body{ border-top:1px solid var(--line); padding:2px 0 }
/* mem-row 从 <button> 拆成「行容器 + 主按钮 + 屏蔽按钮」：
   HTML 不允许 button 套 button，而「不再推送这条」必须能单独点。 */
.mem-row{ display:flex; align-items:stretch; gap:0; border-top:1px solid var(--line) }
.mem-row:first-child{ border-top:0 }
.mem-row .mr-main{ display:flex; align-items:flex-start; gap:9px; flex:1; min-width:0; padding:9px 4px 9px 12px; background:transparent; border:0; cursor:pointer; text-align:left; font-size:inherit; color:inherit }
.mem-row .mr-mute{ flex:0 0 auto; width:44px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; color:var(--muted); opacity:.55; cursor:pointer }
.mem-row .mr-mute:hover{ opacity:1; color:var(--danger) }
.mem-row .mr-mute:active{ transform:scale(.9) }
.mem-row .mr-e{ font-size:20px; line-height:1.2; flex:0 0 auto }
.mem-row .mr-c{ flex:1; min-width:0 }
.mem-row .mr-d{ font-size:.76rem; color:var(--primary2); font-weight:700 }
.mem-row .mr-x{ font-size:.84rem; color:var(--muted); margin-top:3px; word-break:break-word; line-height:1.55 }
.mem-foot{ display:flex; align-items:center; gap:6px; padding:7px 12px; border-top:1px solid var(--line); font-size:.76rem; color:var(--muted) }
.mem-foot .lnk{ background:none; border:0; padding:0 2px; color:var(--primary2); font-weight:700; font-size:.76rem; cursor:pointer; text-decoration:underline; min-height:28px }

/* 随机漫步：一条记录的大卡片 */
.wand-title{ font-size:1.05rem; font-weight:700; line-height:1.55; color:var(--text); word-break:break-word }
.wand-body{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:.88rem; line-height:1.7; color:var(--muted); white-space:pre-wrap; word-break:break-word }

/* 想法列表：⋯ 默认只露一个按钮，点开才出现编辑 / 删除，防误触 */
/* 提交按钮单独抬到 46px：通用 .btn-block 只有 38px，手指点不准 */
.card [data-act="moodThAdd"]{ min-height:46px }
.th-time{ font-size:.74rem; color:var(--muted) }
.th-item{ position:relative }
/* 「⋯」菜单：内联展开（不用绝对定位浮层）。
   为什么不用浮层：笔记 / 错题这类条目是 .card，而 .card 是 overflow:hidden，
   绝对定位的菜单会被裁掉一截；浮层还会盖住下面的内容，窄屏上更容易出界。
   内联展开把下方内容推下去，任何容器里都完整可见，触摸区也好点。
   全模块共用这一份，不出现两套风格。
   flex:0 0 100% 是防御：菜单的父容器有可能是 flex 横向的（每日计划的 .item 就是），
   不加的话菜单会被当成横向 flex item，挤成一条 85px 的窄缝、按钮文字全被压扁。 */
.th-menu{ margin-top:8px; flex:0 0 100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:5px }
.th-menu button{ display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:0 11px; background:transparent; border:0; border-radius:8px; cursor:pointer; font-size:.87rem; color:var(--text); text-align:left }
.th-menu button:hover{ background:var(--surface-2) }
.th-menu button.dg{ color:var(--danger) }
.th-menu button svg{ width:15px; height:15px; flex:0 0 auto }
/* 「⋯」按钮：触控热区 44×44（铁律）。普通 icon-btn 是 34px，
   ⋯ 是卡片上唯一的操作入口、且移动端单指点击，必须够大。 */
/* ── 认知地图（第三批）────────────────────────────────────────
   聚类卡和详情都是块级，PC 上两列、窄屏单列即可，不用管 flex 挤压
   （菜单才需要操心那个，这里没有横向排列的操作区）。 */
.map-sec{ margin-top:4px }
.map-h{ display:flex; align-items:center; gap:6px; font-weight:600; font-size:.92rem; margin-bottom:10px; color:var(--text) }
.map-h svg{ width:16px; height:16px }
.map-cl{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px }
/* 维度切换 chip 提到 44px。全局 .chip 是 30px（标签筛选用，视觉上要紧凑），
   但这是本批新增的主交互按钮，触摸区必须达标 —— 局部加高，不动全局以免波及别的模块。 */
.map-sec .chip{ min-height:44px; padding:4px 16px; font-size:.82rem }
/* ★ 详情用绝对定位浮层，不用文档流。
   用文档流的话，一个 8 条的类会把 grid 整行撑到极高，同排其他卡片跟着留一大片白。
   浮层只盖住自己那张卡，其他卡片不受影响。 */
.map-cl-i{ position:relative }
.map-cl-i{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 13px }
.map-det{ position:absolute; left:0; right:0; top:100%; z-index:30; margin-top:6px;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.14); padding:10px 12px; max-height:300px; overflow:auto }
.map-det-it{ padding:6px 0; border-bottom:1px solid var(--line); font-size:.85rem }
.map-det-it:last-child{ border-bottom:0 }
.map-det-it div{ margin-top:2px; color:var(--muted); word-break:break-word }
@media (max-width:640px){
  .map-cl{ grid-template-columns:1fr }
}
.icon-btn.menu-btn{ width:44px; height:44px; min-height:44px }
.icon-btn.menu-btn svg{ width:18px; height:18px }
/* 菜单展开时让宿主容器换行，否则 flex:0 0 100% 的菜单会把旁边的勾选框 / 正文挤扁。
   第二批接入时发现：运动计划的 .item、收藏视频的 .afs-card 都是 nowrap flex，
   菜单一展开，兄弟项被压缩（正文挤成一竖条）。
   用 :has 做渐进增强：支持的浏览器换行（最佳），不支持的退回「菜单全宽、兄弟被压」
   —— 菜单本身仍完整可见可用，不会崩。 */
@supports selector(:has(*)){
  .item:has(> .th-menu), .v-row:has(> .th-menu), .afs-card:has(> .th-menu){ flex-wrap:wrap }
}
.celebrate{ position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); animation:fadein .3s ease }
.celebrate .cel-card{ background:linear-gradient(135deg,#a4b06b,#8c9a4d); padding:32px 40px; border-radius:18px; color:#fff; text-align:center; box-shadow:0 18px 60px rgba(140,154,77,.5); min-width:240px }
.celebrate .cel-ic{ width:64px; height:64px; margin:0 auto 12px; background:rgba(255,255,255,.2); border-radius:50%; display:flex; align-items:center; justify-content:center }
.celebrate .cel-t{ font-size:.85rem; opacity:.9 }
.celebrate .cel-n{ font-size:1.6rem; font-weight:700; margin-top:6px }
@keyframes fadein{ from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
.badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-top:12px }
.badge-card{ background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:18px 12px; text-align:center; opacity:.55; transition:all .2s }
.badge-card.on{ opacity:1; border-color:var(--primary); background:var(--primary-soft); box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 14%,transparent) }
.badge-ic{ width:46px; height:46px; margin:0 auto 10px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted) }
.badge-card.on .badge-ic{ background:var(--primary); color:var(--on-primary) }
.badge-name{ font-size:.92rem; font-weight:700; margin-bottom:4px }
.badge-desc{ font-size:.72rem; color:var(--muted); line-height:1.35; min-height:32px }
.badge-st{ margin-top:8px; font-size:.7rem; color:var(--muted); font-weight:600 }
.badge-st.on{ color:var(--primary) }
.big-coin{ font-size:2.6rem; font-weight:800; color:var(--primary); font-family:'Georgia',serif }
.coin-rules-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px }
.coin-rules-grid label{ display:flex; flex-direction:column; gap:5px; font-size:.8rem; color:var(--muted) }
.coin-rules-grid input{ padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:.95rem; background:var(--surface) }
.coin-src-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px 14px; margin-top:4px }
.coin-src-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line) }
.coin-src-row:last-child{ border-bottom:none }
.cs-lab{ font-size:.86rem; color:var(--text) }
.cs-val{ font-weight:700; color:var(--primary); font-size:.92rem }
.snap-list{ display:flex; flex-direction:column; gap:10px }

/* ---------------- 视频 / 健康 通用卡片样式 ---------------- */
.v-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:6px }
.v-card{ background:var(--card2); border-radius:14px; padding:13px; margin-bottom:0; border:1px solid var(--line); transition:transform .15s; box-shadow:var(--shadow) }
.v-card:hover{ transform:translateY(-1px) }
.v-card.v-pool{ border-style:dashed }
.v-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px }
.v-tags{ display:flex; gap:5px; flex-wrap:wrap }
.v-src{ font-size:.7rem; color:var(--muted); padding:2px 8px; border-radius:10px; background:var(--card) }
.v-title{ font-size:1rem; font-weight:700; margin:8px 0; line-height:1.4 }
.v-desc{ font-size:.82rem; color:var(--muted); margin-bottom:10px; line-height:1.45 }
.v-meta{ font-size:.76rem; color:var(--muted); margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.v-actions{ display:flex; gap:6px; flex-wrap:wrap }
.v-actions .btn{ flex:1; min-width:64px; padding:6px 8px; font-size:.8rem; justify-content:center }
.v-row{ display:flex; gap:10px; align-items:center; padding:10px; background:var(--card2); border:1px solid var(--line); border-radius:12px; margin-bottom:8px }
.v-row .v-cover{ flex-shrink:0; width:60px; height:60px; border-radius:10px; background:linear-gradient(135deg,var(--primary-soft),var(--card)); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:.7rem; font-weight:700 }
.v-row .v-info{ flex:1; min-width:0 }
.v-row .v-info .vt{ font-size:.92rem; font-weight:600; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
.v-row .v-info .vm{ font-size:.7rem; color:var(--muted); margin-top:3px }
.v-row .v-act{ flex-shrink:0; display:flex; gap:4px }
.item.pinned{ border-left:3px solid var(--primary); background:var(--primary-soft) }
.v-row .icon-btn{ width:34px; height:34px }

/* ---------------- 通用 Tab 切换样式 ---------------- */
.tab-bar{ display:flex; gap:8px; padding:4px; background:var(--surface-2); border-radius:14px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch }
.tab-bar::-webkit-scrollbar{ display:none }
.tab-bar .tab{ flex:1; min-width:80px; padding:10px 12px; border-radius:10px; text-align:center; font-size:.88rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s; white-space:nowrap; display:flex; align-items:center; justify-content:center; gap:5px }
.tab-bar .tab.on{ background:var(--primary); color:var(--on-primary); box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 26%,transparent) }
.tab-bar .tab:hover:not(.on){ background:var(--surface) }

/* ---------------- 全局悬浮添加按钮 ---------------- */
.global-fab{ position:fixed; bottom:80px; right:18px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; box-shadow:0 8px 24px rgba(140,154,77,.45); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:80; transition:transform .2s, box-shadow .2s; border:none }
.global-fab:hover{ transform:translateY(-2px) box-shadow:0 12px 32px rgba(140,154,77,.55) }
.global-fab:active{ transform:scale(.95) }
.global-fab svg{ width:24px; height:24px }
@media (min-width:900px){ .global-fab{ bottom:30px; right:30px; width:60px; height:60px } }
.fab-menu{ position:fixed; bottom:150px; right:18px; background:var(--surface); border-radius:14px; padding:8px; box-shadow:0 12px 36px rgba(0,0,0,.18); z-index:90; display:flex; flex-direction:column; gap:4px; min-width:180px; animation:slideup .2s ease }
@keyframes slideup{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fab-menu .fab-item{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; cursor:pointer; font-size:.88rem; transition:background .15s; border:none; background:transparent; text-align:left; width:100%; color:var(--text) }
.fab-menu .fab-item:hover{ background:var(--surface-2) }
.fab-mask{ position:fixed; inset:0; z-index:75; background:transparent }

/* ============ 模块六 · UI 美化（过渡 / 进入动画 / 空状态） ============
   卡片圆角、阴影、内边距已统一收敛到 --card-radius(12px) / --card-shadow(0 2px 8px) / --card-pd(16px)，
   这里只补交互细节：hover 变色、卡片进入动画、空状态、以及「减少动效」适配。 */

/* 卡片 hover：轻微抬起 + 阴影加深，0.2s 平滑 */
.card{ transition:background var(--tr), border-color var(--tr), box-shadow var(--tr) }
.card:hover{ box-shadow:0 4px 14px color-mix(in srgb,var(--text) 9%,transparent) }

/* 普通按钮 hover：变色为主（primary / accent / warn / danger / ghost 各有自己的 hover，用 :not 避开，不覆盖） */
.btn:not(.btn-primary):not(.btn-accent):not(.btn-warn):not(.btn-danger):not(.btn-ghost):hover{
  background:var(--primary-soft); border-color:color-mix(in srgb,var(--primary) 32%,transparent); color:var(--primary2);
}
.btn:not(.btn-primary):not(.btn-accent):not(.btn-warn):not(.btn-danger):not(.btn-ghost):hover svg{ color:var(--primary2) }
.chip:hover{ border-color:color-mix(in srgb,var(--primary) 32%,transparent); color:var(--primary2) }
.chip.on:hover{ background:var(--primary-soft) }

/* 切换模块时卡片依次淡入。
   只在 switchView 时挂 .view-in —— 模块内的勾选/筛选也会整体重绘，
   若无差别地每次都放动画，勾一个任务整页都会闪一下。 */
@keyframes cardIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
#content.view-in > *{ animation:cardIn .24s cubic-bezier(.4,0,.2,1) both }
#content.view-in > *:nth-child(2){ animation-delay:.03s }
#content.view-in > *:nth-child(3){ animation-delay:.06s }
#content.view-in > *:nth-child(4){ animation-delay:.09s }
#content.view-in > *:nth-child(5){ animation-delay:.12s }
#content.view-in > *:nth-child(n+6){ animation-delay:.15s }

/* 打卡入口卡片（模块三）：保持虚线边框，用主题变量，与实线任务卡片形成视觉区分 */
.ck-btn{ transition:background var(--tr), color var(--tr), box-shadow var(--tr), transform var(--tr) }
.ck-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 10px color-mix(in srgb,var(--primary) 20%,transparent) }
.ck-card{ transition:box-shadow var(--tr), transform var(--tr), border-color var(--tr) }

/* 空状态：柔和光环 + 提示文字（图表区与列表共用） */
.empty{ padding:38px 18px; gap:10px }
.empty p{ font-size:.875rem }
.empty .hint-sm{ font-size:.75rem; max-width:30em; line-height:1.6 }

/* 尊重系统「减少动效」偏好 */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;
  }
}
</style>
</head>

<script>

   个人全能工作台 · 核心层

(function(){
'use strict';

   init() 里会再用 toast 给用户一次可见提示。 */
if(window.location.protocol === 'file:'){
  console.warn('[PWA] 当前通过 file:// 协议打开：通知、Service Worker、PWA 安装均不可用。请改用 http/https 访问（localhost 或部署到服务器）。');
}

/* ---------------- 0. 内联 SVG 图标库（不使用 emoji 当图标） ---------------- */
var ICONS = {

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  up:'<path d="M12 21V8M6 12l6-6 6 6M4 3h16"/>',
  cloud:'<path d="M17 18a4 4 0 0 0 .5-8A6 6 0 0 0 6 10.5 3.5 3.5 0 0 0 6.5 18z"/><path d="M12 13v6M9.5 16.5L12 19l2.5-2.5"/>',

function svg(name, cls){
  return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.custom)+'</svg>';
