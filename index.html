/* ---------------- 1. 工具函数 ---------------- */
var U = {
  $:function(s,r){ return (r||document).querySelector(s) },
  $$:function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)) },
  uid:function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) },
  esc:function(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  },
  pad:function(n){ return n<10?'0'+n:''+n },
  today:function(){ var d=new Date(); return U.dstr(d) },
  dstr:function(d){ return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate()) },
  parse:function(s){ if(!s) return null; var p=String(s).slice(0,10).split('-'); return new Date(+p[0],+p[1]-1,+p[2]) },
  cn:function(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); return (+p[1])+'月'+(+p[2])+'日' },
  diffDays:function(a,b){ // b - a，天
    var d1=U.parse(a), d2=U.parse(b); if(!d1||!d2) return 0;
    return Math.round((d2-d1)/86400000);
  },
  addDays:function(s,n){ var d=U.parse(s)||new Date(); d.setDate(d.getDate()+n); return U.dstr(d) },
  now:function(){ return new Date().toISOString() },
  hm:function(){ var d=new Date(); return U.pad(d.getHours())+':'+U.pad(d.getMinutes()) },
  relTime:function(iso){
    if(!iso) return '';
    var t=new Date(iso), n=new Date(), s=Math.floor((n-t)/1000);
    if(s<60) return '刚刚';
    if(s<3600) return Math.floor(s/60)+'分钟前';
    if(s<86400) return Math.floor(s/3600)+'小时前';
    if(s<604800) return Math.floor(s/86400)+'天前';
    return U.dstr(t);
  },
  ddlText:function(ddl){
    if(!ddl) return '';
    var d=U.diffDays(U.today(), ddl);
    if(d<0) return '逾期'+(-d)+'天';
    if(d===0) return '今天到期';
    if(d===1) return '明天到期';
    return d+'天后';
  },
  clamp:function(v,a,b){ return Math.max(a,Math.min(b,v)) },
  num:function(v,d){ var n=parseFloat(v); return isNaN(n)?(d===undefined?0:d):n },
  colorOf:function(str){ // 由字符串稳定生成森系配色
    var pal=['#8C9A4D','#6E7C3A','#A9764F','#7D9A86','#B08A4E','#5F7C6A','#9A7B4F','#75885A','#A2905C','#6B8E7B'];
    var h=0; str=String(str||'');
    for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
    return pal[h%pal.length];
  },
  download:function(name, text, mime){
    try{
      var blob=new Blob([text],{type:mime||'application/json;charset=utf-8'});
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove() },400);
      return true;
    }catch(e){ return false }
  },
  /* 第五轮 C：新增可选第三参 ms（自定义停留时长）。不传时保持原行为，老调用点全部不受影响。 */
  toast:function(msg, kind, ms){
    var box=U.$('#toasts'); if(!box) return;
    var d=document.createElement('div');
    d.className='toast'+(kind?' '+kind:'');
    d.innerHTML=(kind==='err'?svg('warn','ic-sm'):kind==='ok'?svg('check','ic-sm'):svg('info','ic-sm'))+'<span>'+U.esc(msg)+'</span>';
    box.appendChild(d);
    setTimeout(function(){ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(function(){ d.remove() },300) }, ms||(kind==='err'?3600:2200));
  },
  /* 统一空状态：图标 + 引导文字 + 行动按钮（按钮跳转到对应模块的新增表单） */
  empty:function(icon, text){
    var mod={'daily':'daily','memo':'memo','video':'fitness','express':'express','books':'books','inspire':'inspire','notes':'notes','wrongq':'wrongq','heart':'health','fitness':'fitness','goals':'goals','board':'goals','calendar':'calendar','excerpt':'notes','bell':'reminder','mood':'mood','plant':''}[icon]||'';
    var btn=mod?'<button class="btn btn-primary btn-sm empty-act" data-go="'+mod+'">去添加</button>':'';
    return '<div class="empty">'+svg(icon)+'<p>'+U.esc(text)+'</p>'+btn+'</div>';
  },
  /* 迷你 Markdown 渲染（内联实现，不依赖外部库） */
  md:function(src){
    var s=U.esc(src||'');
    var blocks=[];
    s=s.replace(/```([\s\S]*?)```/g,function(m,c){ blocks.push(c.replace(/^\n/,'')); return '\u0000CB'+(blocks.length-1)+'\u0000' });
    s=s.replace(/^\s*([-*_]){3,}\s*$/gm,'<hr>');
    // 表格：连续的 | ... | 行
    s=s.replace(/(?:^[ \t]*\|.*\|[ \t]*$\n?)+/gm, function(block){
      var lines=block.trim().split('\n').map(function(l){ return l.trim() });
      if(lines.length<2) return block;
      var cells=function(l){
        return l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){ return c.trim() });
      };
      var isSep=/^\|?[\s:\-|]+\|?$/.test(lines[1])&&lines[1].indexOf('-')>-1;
      if(!isSep) return block;
      var head=cells(lines[0]), body=lines.slice(2).map(cells);
      return '<table><thead><tr>'+head.map(function(c){ return '<th>'+c+'</th>' }).join('')+'</tr></thead><tbody>'+
        body.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+c+'</td>' }).join('')+'</tr>' }).join('')+
        '</tbody></table>';
    });
    s=s.replace(/^###### (.*)$/gm,'<h3>$1</h3>').replace(/^##### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^#### (.*)$/gm,'<h3>$1</h3>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
    s=s.replace(/^&gt; ?(.*)$/gm,'<blockquote>$1</blockquote>');
    s=s.replace(/(<\/blockquote>)\s*<blockquote>/g,'<br>');
    s=s.replace(/^\s*[-*+] \[( |x|X)\] (.*)$/gm,function(m,c,t){
      return '<li style="list-style:none;margin-left:-1.1em">'+(c===' '?'☐':'☑')+' '+t+'</li>';
    });
    s=s.replace(/^\s*[-*+] (.*)$/gm,'<li>$1</li>');
    s=s.replace(/^\s*\d+\. (.*)$/gm,'<li data-ol="1">$1</li>');
    s=s.replace(/(<li(?: data-ol="1")?>[\s\S]*?<\/li>)(?!\s*<li)/g,function(m){
      return (m.indexOf('data-ol')>-1?'<ol>':'<ul>')+m+(m.indexOf('data-ol')>-1?'</ol>':'</ul>');
    });
    s=s.replace(/<\/ul>\s*<ul>/g,'').replace(/<\/ol>\s*<ol>/g,'');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(m,alt,src){
      var url=src; if(S&&S.files&&S.files[src]) url=S.files[src].data;
      return '<img class="md-img" alt="'+U.esc(alt)+'" src="'+U.esc(url)+'">';
    });
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.split(/\n{2,}/).map(function(p){
      var t=p.trim(); if(!t) return '';
      if(/^<(h1|h2|h3|ul|ol|blockquote|hr|pre|table)/.test(t)) return t;
      return '<p>'+t.replace(/\n/g,'<br>')+'</p>';
    }).join('');
    s=s.replace(/\u0000CB(\d+)\u0000/g,function(m,i){ return '<pre><code>'+blocks[+i]+'</code></pre>' });
    return s;
  },
  /* 内联 SVG 折线图 */
  lineChart:function(pts, opt){
    opt=opt||{}; var w=opt.w||600, h=opt.h||170, pad=opt.pad||{t:12,r:12,b:24,l:34};
    if(!pts || pts.length===0) return U.empty('plant','这里还空空的，快来添点料～');
    var vals=pts.map(function(p){ return p.v }), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    if(mx===mn){ mx=mn+1; mn=mn-1 }
    var rg=mx-mn, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
    var X=function(i){ return pad.l+(pts.length===1?iw/2:iw*i/(pts.length-1)) };
    var Y=function(v){ return pad.t+ih-(v-mn)/rg*ih };
    var line='', area='', dots='';
    pts.forEach(function(p,i){ line+=(i?' L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1) });
    area=line+' L'+X(pts.length-1).toFixed(1)+' '+(pad.t+ih)+' L'+X(0).toFixed(1)+' '+(pad.t+ih)+' Z';
    pts.forEach(function(p,i){
      dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="var(--card)" stroke="var(--primary2)" stroke-width="2"/>';
    });
    var gl='';
    for(var k=0;k<=3;k++){
      var yy=pad.t+ih*k/3, vv=(mx-rg*k/3);
      gl+='<line x1="'+pad.l+'" y1="'+yy.toFixed(1)+'" x2="'+(w-pad.r)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>';
      gl+='<text x="4" y="'+(yy+3.5).toFixed(1)+'" font-size="9" fill="var(--muted)">'+vv.toFixed(opt.dec===undefined?1:opt.dec)+'</text>';
    }
    var lb=''; var step=Math.max(1,Math.ceil(pts.length/6));
    pts.forEach(function(p,i){
      if(i%step===0||i===pts.length-1) lb+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+U.esc(p.l||'')+'</text>';
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block" preserveAspectRatio="none">'+
      gl+'<path d="'+area+'" fill="var(--primary)" opacity=".13"/>'+
      '<path d="'+line+'" fill="none" stroke="var(--primary2)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots+lb+'</svg>';
  },
  /* 内联 SVG 饼图 */
  pie:function(segs, size){
    var tot=segs.reduce(function(a,b){ return a+b.v },0);
    size=size||150;
    if(!tot) return U.empty('plant','这里还空空的，快来添点料～');
    var cx=size/2, cy=size/2, r=size/2-6, a0=-Math.PI/2, out='';
    segs.forEach(function(s){
      var a1=a0+s.v/tot*Math.PI*2;
      var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      var big=(a1-a0)>Math.PI?1:0;
      if(s.v/tot>0.9999){
        out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+s.c+'"/>';
      }else{
        out+='<path d="M'+cx+' '+cy+' L'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+big+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+s.c+'" stroke="var(--card)" stroke-width="1.5"/>';
      }
      a0=a1;

/* ---------------- 2. 存储层（localStorage 优先 + 损坏检测 + 快照恢复） ---------------- */
var KEY='wb_worktable_v1', KEY_BAK='wb_worktable_v1_snapshot', KEY_UI='wb_worktable_ui';
var DB={
  ok:true, err:'',
  read:function(){
    var raw=null;
    try{ raw=localStorage.getItem(KEY) }
    catch(e){ DB.ok=false; DB.err='浏览器存储不可用（可能是隐私模式）：'+e.message; return null }
    if(!raw) return null;
    try{
      var o=JSON.parse(raw);
      if(!o || typeof o!=='object' || !o.__wb) throw new Error('数据结构不完整');
      return o;
    }catch(e){
      DB.ok=false; DB.err='本地数据解析失败：'+e.message;
      try{ localStorage.setItem(KEY+'_corrupt_'+Date.now(), raw) }catch(_){}
      var bak=null;
      try{ bak=localStorage.getItem(KEY_BAK) }catch(_){}
      if(bak){ try{ var b=JSON.parse(bak); if(b&&b.__wb){ DB.err+='（已自动回退到上一次可用快照）'; return b } }catch(_){} }
      return null;
    }
  },
  write:function(obj){
    try{
      var txt=JSON.stringify(obj);
      localStorage.setItem(KEY, txt);
      // 每 10 次写入留一份快照，防止结构损坏无从恢复
      obj.__wc=(obj.__wc||0)+1;
      if(obj.__wc%10===1) localStorage.setItem(KEY_BAK, txt);
      DB.ok=true; DB.err='';
      return true;
    }catch(e){
      DB.ok=false;
      DB.err=(e&&e.name==='QuotaExceededError')?'本地存储空间已满，请导出备份后清理部分数据':('保存失败：'+(e.message||e));
      U.toast(DB.err,'err');
      return false;
    }
  },
  ui:{
    get:function(){ try{ return JSON.parse(localStorage.getItem(KEY_UI)||'{}') }catch(e){ return {} } },
    set:function(o){ try{ localStorage.setItem(KEY_UI, JSON.stringify(o)) }catch(e){} }
  }
};

var DRAFT_FILES={};   // 表单草稿：{ fk: [fileId,...] }，保存后写入对应记录
function getFile(id){ return (S&&S.files)?S.files[id]:null }
function compressImage(file, cb){
  var reader=new FileReader();
  reader.onerror=function(){ cb('') };
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var maxW=1280, w=img.width||maxW, h=img.height||maxW;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.82));
      }catch(e){ cb(reader.result) }
    };
    img.onerror=function(){ cb(reader.result) };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function fileKind(mime, name){
  mime=mime||'';
  if(mime.indexOf('image')>=0) return 'image';
  if(mime.indexOf('audio')>=0) return 'audio';
  if(mime.indexOf('pdf')>=0) return 'pdf';
  var n=(name||'').toLowerCase();
  if(/\.(jpg|jpeg|png|gif|webp|bmp)$/.test(n)) return 'image';
  if(/\.(mp3|wav|m4a|ogg|aac|flac)$/.test(n)) return 'audio';
  if(/\.pdf$/.test(n)) return 'pdf';
  return 'file';
}
function processFiles(fk, fileList){
  var ids=DRAFT_FILES[fk]||(DRAFT_FILES[fk]=[]);
  var total=fileList.length, done=0;
  if(!total){ U.toast('没有选择到文件','err'); return }
  S.files=S.files||{};
  for(var i=0;i<total;i++){
    (function(file){
      var id=U.uid(), mime=file.type||'', kind=fileKind(mime,file.name),
        rec={id:id, name:file.name||'未命名文件', mime:mime, type:kind, size:file.size||0, createdAt:U.now(), data:''};
      S.files[id]=rec;
      var finish=function(data){ rec.data=data||''; DRAFT_FILES[fk].push(id); if(++done===total){ save(); renderFileList(fk); U.toast('已添加 '+total+' 个文件','ok') } };
      if(kind==='image') compressImage(file, finish);
      else{ var r=new FileReader(); r.onload=function(){ finish(r.result) }; r.onerror=function(){ finish('') }; r.readAsDataURL(file) }
    })(fileList[i]);
  }
}

function ensureDrawPad(){
  var dp=document.getElementById('drawPad');
  if(dp) return dp;
  dp=document.createElement('div'); dp.id='drawPad'; dp.className='dp'; dp.innerHTML=drawPadHtml();
  document.body.appendChild(dp);
  var canvas=dp.querySelector('#dpCanvas');
  dp._canvas=canvas; dp._strokes=[]; dp._size=5; dp._color='#2E3A2B'; dp._drawing=false; dp._cur=null;
  function pos(e){ var r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left), y:(e.clientY-r.top)} }
  function start(e){ e.preventDefault(); dp._drawing=true; var p=pos(e); dp._cur={c:dp._color,s:dp._size,pts:[p]}; dp._strokes.push(dp._cur); }
  function move(e){ if(!dp._drawing) return; e.preventDefault(); dp._cur.pts.push(pos(e)); dpRedraw(dp); }
  function end(){ dp._drawing=false; dp._cur=null; }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  return dp;
}
function dpRedraw(dp){
  var canvas=dp._canvas; if(!canvas) return;
  var dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr) }
  var ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  ctx.lineCap='round'; ctx.lineJoin='round';
  dp._strokes.forEach(function(st){
    if(!st.pts.length) return;
    ctx.strokeStyle=st.c; ctx.lineWidth=st.s; ctx.beginPath(); ctx.moveTo(st.pts[0].x,st.pts[0].y);
    for(var i=1;i<st.pts.length;i++) ctx.lineTo(st.pts[i].x,st.pts[i].y);
    if(st.pts.length===1) ctx.lineTo(st.pts[0].x+0.1,st.pts[0].y+0.1);
    ctx.stroke();
  });
}
function openDrawPad(fk){
  var dp=ensureDrawPad(); dp._fk=fk;
  dp._strokes=[]; dp._size=5; dp._color='#2E3A2B'; dp._drawing=false; dp._cur=null;

}

function countRecords(){
  var n=0;
  n+=S.plans.length+S.memos.length+S.express.length+S.books.length+S.inspires.length+
     S.notes.length+S.excerpts.length+S.goals.length+S.fitness.records.length+S.wrongs.length+S.reminders.length+
     S.videos.length+S.healthItems.length+S.healthTips.length;
  /* 心情计入（一天一条，量可控）；想法不计入 —— 一天能写七八条，
     计进去会把「建议导出备份」的提醒刷成骚扰，反而没人看了。 */
  n+=(S.moods||[]).length;
  (S.custom||[]).forEach(function(c){ n+=(c.items||[]).length });
  n+=(S.prompts||[]).filter(function(p){ return !p.demo }).length;
  return n;
}
function checkBackupReminder(){
  var n=countRecords();
  if(n>0 && n-(S.settings.lastBackupCount||0)>=(S.settings.backupThreshold||10)){
    UI.backupTip=true;
    var bar=U.$('#backupBar'); if(bar) bar.style.display='flex';
  }
}

function reorderNav(from,to){

  var item=base[fi]; base.splice(fi,1); if(fi<ti) ti--; base.splice(ti,0,item);
  S.settings.navOrder=base; save(); render();

function toCSV(rows){
  if(!rows||!rows.length) return '';
  var cols=Object.keys(rows[0]);
  var esc=function(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v };
  var lines=[cols.join(',')].concat(rows.map(function(r){ return cols.map(function(c){ return esc(r[c]) }).join(',') }));
  return '﻿'+lines.join('\r\n');
}

/* 今天要处理（置顶聚合区） */
/* 健康打卡项今天是否应该做（第三轮 · 模块三）
   原本是 VIEWS.healthCheckin 内部的局部函数，这里提取为公共函数供「今日要处理」复用。
   逻辑与原来完全一致，未做改动。 */
function healthShouldDoToday(h, T){
  T=T||U.today();
  var last=h.lastDoneDate;
  if(!last) return true;
  if(h.freq==='daily') return last!==T;
  if(h.freq==='weekly'){ var wk=U.addDays(last,7); return wk<=T }
  if(h.freq==='monthly'){ var ym=last.slice(0,7); return ym!==T.slice(0,7) }
  return true;
}

/* 打卡入口卡片配置（第三轮 · 模块三）
   只列源码中确实具备「独立打卡功能 + 对应页面路由」的模块，其余模块一律不臆造：
     · fitness 减肥塑形 → S.fitness.plan（运动计划模板，rep 为对象）；第 3 批联动后改读 S.plans
     · express 表达能力 → S.express（date 字段）
     · health  健康养生 → S.healthItems（freq + lastDoneDate），入口在「打卡」Tab
   pending(T) 返回「今天还没完成的项数」，返回 0 表示已打卡 → 不显示卡片。 */
var CHECKIN_MODULES=[
  { id:'fitness', icon:'fitness',
    tip:function(n){ return '今天还有 '+n+' 项运动打卡没完成' },
    pending:function(T){
      /* 模块四联动后：逐个模板判定，全部以 S.plans 里的按日期联动任务为准。
         逐模板（而不是全局先判有没有联动任务）是为了兼容「部分模板有任务、
         部分模板尚未生成」的中间状态，避免口径跳变。 */
      return (S.fitness.plan||[]).filter(function(tpl){
        var task=fitnessTaskOn(tpl.id, T);
        if(task) return !task.done;                 // 今天有排期 → 以该任务的完成状态为准
        if(tplRep(tpl)) return false;               // 有重复规则但今天没排期 → 今天不是执行日
        /* 一次性计划：若已排过一次（说明执行日已过），不再反复提醒；
           从未生成过任务的老数据则退回模板自身的 done 兜底 */
        var ever=(S.plans||[]).some(function(p){ return p.sourceType==='fitness' && p.sourceId===tpl.id });
        return ever ? false : !tpl.done;
      }).length;
    } },
  { id:'express', icon:'express',
    tip:'今天的表达练习还没打卡',
    pending:function(T){ return (S.express||[]).some(function(e){ return e.date===T })?0:1 } },
  { id:'health', icon:'heart',
    tip:function(n){ return '今天还有 '+n+' 项健康打卡没完成' },
    pending:function(T){
      return (S.healthItems||[]).filter(function(h){
        return healthShouldDoToday(h,T) && h.lastDoneDate!==T;
      }).length;
    } }
];

/* 生成「今日要处理」下方的打卡入口卡片 */
function todayCheckinHtml(T){
  var out='';
  CHECKIN_MODULES.forEach(function(m){
    if(S.settings.show[m.id]===false) return;    // 模块被隐藏则不显示
    var n=0;
    try{ n=m.pending(T) }catch(e){ return }
    if(!n) return;                                // 今天已打卡 → 不显示该卡片
    var tip=(typeof m.tip==='function')?m.tip(n):m.tip;
    out+='<div class="ck-card">'+
      '<div class="ck-ic" aria-hidden="true">'+svg(m.icon)+'</div>'+
      '<div class="ck-txt">'+U.esc(tip)+'</div>'+
      '<button class="ck-btn" data-act="goCheckin" data-id="'+m.id+'">去打卡</button>'+
    '</div>';
  });
  return out;
}

/* 同步全局悬浮加号的显隐（第三轮 · 模块一修复）
   原因：必须用 style.display，不能用 hidden 属性。

function syncFab(){

  f.hidden=false;                                          // 清掉可能残留的 hidden 属性
  f.style.display = S.settings.hideFab ? 'none' : '';      // '' 表示回退到 CSS 里的 display:flex
}
var VIEWS={};

/* ---------------- 6.5 输入框内容保护（第六轮修复 4，优先级最高）----------------
   现象：从桌面 PWA 打开工作台，在任意输入框里打字后切到别的 APP，再切回来内容全没了。
   根因：visibilitychange 里无条件 render()，而 render() 是 c.innerHTML=html 全量重建，
        未保存的输入内容随之被丢弃。PWA 独立窗口比普通标签页更容易被系统回收，
        切回必定重绘，所以这个问题在 PWA 里必现。
   方案（指令里的 A+B 组合）：
     · render() 前后做「快照 → 重绘 → 回填」，统一机制，不逐个输入框写
     · 同时把值记进 UI.drafts 并防抖落盘，APP 被强杀重开后也能恢复
   只回填「用户最近编辑过且尚未被提交消费掉」的框，避免提交成功后表单该清空却没清空。 */
var DRAFT_SEL='input,textarea,select';
var DRAFT_OK_TYPE={text:1,search:1,url:1,tel:1,email:1,number:1};
var DRAFT_MAX=300;
/* 可入草稿的判定：只收文本类输入。
   密码（type=password，如 WebDAV 的 wdPass）、文件、日期、复选/单选一律排除，
   另外提供 data-nodraft 让页面可以显式声明某个框不参与。 */
function isDraftable(el){
  if(!el||!el.tagName) return false;
  var tg=el.tagName.toLowerCase();
  if(tg==='textarea'||tg==='select') return !(el.disabled||el.readOnly||el.hasAttribute('data-nodraft'));
  if(tg!=='input') return false;
  if(el.disabled||el.readOnly||el.hasAttribute('data-nodraft')) return false;
  var tp=(el.getAttribute('type')||'text').toLowerCase();
  return !!DRAFT_OK_TYPE[tp];
}
/* 稳定标识：有 id 用 id；没有 id 的用「从 body 往下的兄弟下标路径 + 标签 + type」。
   DOM 是同构重建的，路径可复现，所以无 id 的输入框也能对上号。 */
function draftKeyOf(el){
  if(!el) return '';
  if(el.id) return '#'+el.id;
  var parts=[], n=el, root=(el.ownerDocument&&el.ownerDocument.body)||null;
  while(n&&n!==root){
    var p=n.parentNode; if(!p) break;
    var i=0, s=n.previousElementSibling;
    while(s){ i++; s=s.previousElementSibling }
    parts.unshift(i);
    n=p;
  }
  return 'p:'+parts.join('.')+'|'+el.tagName.toLowerCase()+'|'+(el.getAttribute('type')||'').toLowerCase();
}
/* 结构指纹：回填前比对，防止路径撞车时把值写进另一个框 */
function draftSig(el){
  return el.tagName.toLowerCase()+'|'+(el.getAttribute('type')||'').toLowerCase()+'|'+
         (el.getAttribute('name')||'')+'|'+(el.getAttribute('placeholder')||'');
}
function draftSet(k, v){
  if(!k) return;
  if(!UI.drafts||typeof UI.drafts!=='object') UI.drafts={};
  if(v===''||v==null){ delete UI.drafts[k] }
  else{
    UI.drafts[k]={v:v, t:Date.now()};
    var ks=Object.keys(UI.drafts);
    if(ks.length>DRAFT_MAX){                      /* 超出上限时淘汰最旧的，避免草稿无限膨胀 */
      ks.sort(function(a,b){ return (UI.drafts[a].t||0)-(UI.drafts[b].t||0) });
      for(var i=0;i<ks.length-DRAFT_MAX;i++) delete UI.drafts[ks[i]];
    }
  }
  saveDraftsSoon();
}
/* 某输入框被「提交动作」读取过 → 打上消费时间戳。
   判定依据：所有新增/保存动作都通过 val(id) 读表单，读了就意味着这条内容已被消费，
   回填时应跳过。比起在 afterChange 里一刀切，这样只影响真正被提交的那几个框，
   不会把别处正在编辑的内容一起清掉。 */
function markConsumed(k){ if(!k) return; if(!UI.__consumed) UI.__consumed={}; UI.__consumed[k]=Date.now() }
function draftLive(k){
  var d=UI.drafts&&UI.drafts[k]; if(!d) return null;
  var c=UI.__consumed&&UI.__consumed[k]||0;
  return d.t>c ? d.v : null;
}
var _draftTimer=null;
function saveDraftsSoon(){
  if(_draftTimer) return;
  _draftTimer=setTimeout(function(){ _draftTimer=null; flushDrafts() },600);
}
function flushDrafts(){
  if(_draftTimer){ clearTimeout(_draftTimer); _draftTimer=null }
  try{ var u=DB.ui.get(); u.drafts=UI.drafts||{}; DB.ui.set(u) }catch(e){}
}
/* 重绘前记录 #content 里所有输入框的值与「谁有焦点」 */
function formSnapshot(root){
  var out=[]; if(!root||!root.querySelectorAll) return out;
  var fs=root.querySelectorAll(DRAFT_SEL), af=document.activeElement;
  for(var i=0;i<fs.length;i++){
    var el=fs[i];
    if(!isDraftable(el)) continue;
    out.push({k:draftKeyOf(el), s:draftSig(el), v:el.value, f:(el===af)});
  }
  return out;
}
/* 重绘后回填。两条放行规则：
     1) 重绘前焦点就在这个框上（用户正在编辑，哪怕还没触发过 input 事件）
     2) 有草稿，且草稿时间晚于该框被提交消费的时间（切后台/切模块/强杀重开都走这条）
   回填后把光标放到末尾，并尽量不滚动页面。 */
function formRestore(root, snap){
  /* 注意：不能因为 snap 为空就提前返回。
     从日历切回备忘录时，快照取自日历视图（里面没有输入框）→ snap 长度为 0，
     但草稿里是有内容的，必须继续走规则 2 才能回填；首次渲染时 #content 为空同理。 */
  if(!root) return;
  snap=snap||[];
  var fmap={}, i;
  for(i=0;i<snap.length;i++) fmap[snap[i].k]=snap[i];
  var fs=root.querySelectorAll(DRAFT_SEL), caret=null;
  for(i=0;i<fs.length;i++){
    var el=fs[i];
    if(!isDraftable(el)) continue;
    var k=draftKeyOf(el), rec=fmap[k], v=null, refocus=false;
    /* 规则 1：重绘前焦点就在这个框上 → 直接用快照值（覆盖草稿，最贴近用户当下所见） */
    if(rec && rec.s===draftSig(el) && rec.f){ v=rec.v; refocus=true }
    /* 规则 2：查草稿。注意不能只在快照里找 —— 切模块 / 刷新重开时，
       旧视图里根本没有这个框（比如从日历切回备忘录），快照里自然没有它，
       那样就恢复不了。所以这里一律直接查 UI.drafts。 */
    if(v==null) v=draftLive(k);
    if(v==null||v===el.value){ if(refocus) caret=el; continue }
    el.value=v;
    if(refocus) caret=el;
  }
  if(caret){
    try{
      caret.focus({preventScroll:true});
      var L=(caret.value||'').length;
      if(caret.setSelectionRange) caret.setSelectionRange(L,L);
    }catch(e){}
  }
}
function render(opts){
  opts=opts||{};
  var _c0=U.$('#content'), _snap=formSnapshot(_c0);
  applyTheme(); clearStaleDrafts(); renderNav();
  syncFab();
  var v=UI.view, html=backupBarHtml()+storageErrHtml();
  /* 离开心情日记时收掉想法菜单：菜单是绝对定位浮层，
     不收会挂在下个视图的 DOM 上（视图切走后它的宿主 .th-item 已经没了） */
  /* 切到别的视图才收菜单。菜单是绝对定位浮层，视图切走后它的宿主 DOM 已经没了，
     不收会挂在下个视图上。★ 不能写成无条件清空：同一视图内的勾选 / 筛选也会 render，
     那样菜单刚打开就被自己清掉了（第二批改造时踩过）。 */
  if(UI.menu && UI.menuView && UI.menuView!==v){ UI.menu=''; UI.menuView=''; menuOff() }
  /* 今日要处理只出现在「每日计划」模块，避免每个模块重复 */
  if(v==='daily') html+=todayHtml();
  var fn=VIEWS[v];
  if(!fn && v.indexOf('cm_')===0) fn=VIEWS.__custom;
  html+=fn?fn(v):'<div class="card"><div class="empty">'+svg('warn')+'<p>模块不存在</p></div></div>';
  var c=U.$('#content');
  /* 切换模块跳到顶部；模块内操作保持当前滚动位置，不跳顶 */
  var prev=(!opts.switchView)?window.scrollY:0;
  c.innerHTML=html; c.scrollTop=0;
  /* 模块六：切换模块时给内容挂 .view-in，让卡片依次淡入；
     模块内操作（勾选/筛选）同样会整体重绘，这里刻意不挂，
     否则勾一个任务整页都会重新闪一遍。
     先移除 → 强制回流 → 再加回，动画才能重复触发。 */
  c.classList.remove('view-in');
  if(opts.switchView){ void c.offsetWidth; c.classList.add('view-in') }
  if(opts.switchView){ window.scrollTo(0,0); }
  else { window.scrollTo(0,prev); }
  formRestore(U.$('#content'), _snap);
  DB.ui.set({view:v, drafts:UI.drafts||{}});
  if(window.innerWidth<=900) closeDrawer();
  /* 设置页每次 render 都会重建 DOM，重建后恢复「安装到桌面」按钮的显隐与状态文字 */
  if(typeof PWA!=='undefined'&&PWA&&PWA.sync) PWA.sync();
  /* 设置页 render 完再拉模型列表：DOM 就绪 + 只改下拉那块，不触发二次 render */
  if(v==='settings') AI.loadModels();
}
function go(v){
  UI.view=v; closeSheet(); closeDrawer(); render({switchView:true});
  /* 进入视图后的钩子：AI 自动档位（B/C）在这里触发，而不是写在 VIEWS 里。
     渲染函数必须保持无副作用 —— 否则每次 afterChange 都可能连带发一次请求。 */
  afterEnterView(v);
}
/* 视图进入钩子（批次一）。目前只有练嘴素材用到：
   档位 A 完全不自动触发，B/C 每天最多自动跑一次，失败静默降级到静态池。 */
function afterEnterView(v){
  try{
    if(v==='express') autoMatsIfNeeded();
  }catch(e){}
}
function matsAutoOn(){
  /* AI 自动化档位：A=全手动，B=建议制（默认），C=全自动。
     练嘴素材只覆盖 UI 展示层、不写 S，所以 B 和 C 对它的行为一样：
     都是"后台生成好给你看"，区别只在是否弹提示。 */
  var lv=AI.autoLevel?AI.autoLevel():'B';
  return lv!=='A';
}
var _matsFired='';
function autoMatsIfNeeded(){
  if(!matsAutoOn()) return;
  var T=U.today();
  if(UI.matsToday===T||_matsFired===T) return;   /* 一天最多自动跑一次 */
  _matsFired=T; UI.matsToday=T;
  setTimeout(function(){ ACT.aiMatsAsk(true) },60);
}

/* ---------------- 7. 每日计划 ---------------- */
/* ---------------- 重复规则 ---------------- */
var WK=['日','一','二','三','四','五','六'];
function addMonths(s,m){
  var d=U.parse(s); if(!d) return s; var day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+m);
  var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last)); return U.dstr(d);
}
function addYears(s,y){
  var d=U.parse(s); if(!d) return s; var day=d.getDate(), mon=d.getMonth();
  d.setFullYear(d.getFullYear()+y);
  if(d.getMonth()!==mon){ var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); }
  return U.dstr(d);
}
function nextRepeatDate(rep, from){
  if(!rep) return null;
  if(rep.t==='daily') return U.addDays(from,1);
  if(rep.t==='weekday'){
    var d=U.addDays(from,1), g=new Date(d+'T00:00:00').getDay();
    while(g===0||g===6){ d=U.addDays(d,1); g=new Date(d+'T00:00:00').getDay(); }
    return d;
  }
  if(rep.t==='weekly'){
    var w=rep.w||[]; if(!w.length) return null;
    for(var i=1;i<=7;i++){ var d=U.addDays(from,i); if(w.indexOf(new Date(d+'T00:00:00').getDay())>=0) return d; }
    return null;
  }
  if(rep.t==='interval') return U.addDays(from, Math.max(1, rep.n||1));
  if(rep.t==='monthly') return addMonths(from,1);
  if(rep.t==='yearly') return addYears(from,1);
  return null;
}
function repeatLabel(rep){
  if(!rep) return '';
  if(rep.t==='daily') return '每天';
  if(rep.t==='weekday') return '每工作日';
  if(rep.t==='weekly') return '每周 '+ (rep.w||[]).map(function(x){ return '周'+WK[x] }).join('、');
  if(rep.t==='interval') return '每 '+rep.n+' 天';
  if(rep.t==='monthly') return '每月同日';
  if(rep.t==='yearly') return '每年同日';
  return '';
}
function repeatControlsHtml(pfx, rep){
  rep=rep||{};
  var opts=[['none','不重复'],['daily','每天'],['weekday','每工作日'],['weekly','每周固定'],['interval','每 N 天'],['monthly','每月同日'],['yearly','每年同日']];
  var sel='<select id="'+pfx+'Repeat" class="repeat-sel">'+opts.map(function(o){ return '<option value="'+o[0]+'"'+(rep.t===o[0]?' selected':'')+'>'+o[1]+'</option>' }).join('')+'</select>';
  var wkp=WK.map(function(n,i){ var on=(rep.w||[]).indexOf(i)>=0; return '<label class="wk-pick'+(on?' on':'')+'"><input type="checkbox" value="'+i+'"'+(on?' checked':'')+'>周'+n+'</label>' }).join('');
  var optsDiv='<div id="'+pfx+'RepeatOpts" class="repeat-opts">'+
    '<div data-r="weekly" style="display:'+(rep.t==='weekly'?'flex':'none')+'">'+wkp+'</div>'+
    '<div data-r="interval" style="display:'+(rep.t==='interval'?'flex':'none')+'"><span>每</span><input id="'+pfx+'EveryN" type="number" min="1" max="365" value="'+(rep.n||2)+'"><span>天重复一次</span></div>'+
  '</div>';
  return sel+optsDiv;
}
function onRepeatChange(sel){
  var opts=document.getElementById(sel.id+'Opts');
  if(!opts) return;
  opts.querySelectorAll('[data-r]').forEach(function(d){ d.style.display = d.getAttribute('data-r')===sel.value?'flex':'none'; });
}
function readRepeat(pfx){
  var rt=val(pfx+'Repeat')||'none';
  if(rt==='none') return null;
  if(rt==='weekly'){
    var w=U.$$('#'+pfx+'RepeatOpts input[type=checkbox]:checked').map(function(c){ return +c.value });
    /* pfx+'Date'：运动计划新增表单的「起始日期」输入框（exDate），用于「每周固定」未勾选星期时的默认星期 */
    if(!w.length){ var base=val(pfx+'Ddl')||val(pfx+'Date')||UI.dailyDate||U.today(); w=[new Date(base+'T00:00:00').getDay()] }
    return {t:'weekly', w:w};
  }
  if(rt==='interval') return {t:'interval', n:U.clamp(U.num(val(pfx+'EveryN')),1,365)};
  return {t:rt};
}
/* 从 start 到 end（含）按重复规则生成所有命中的日期 */
function genRepeatDates(rep, start, end){
  var out=[], guard=0, cur=start;
  if(rep.t==='interval'){
    var n=Math.max(1, rep.n||1), off=0;
    while(U.diffDays(cur,end)>=0 && guard<1000){
      if(off%n===0) out.push(cur);
      cur=U.addDays(cur,1); off++; guard++;
    }
    return out;
  }
  var base=new Date(start+'T00:00:00');
  while(U.diffDays(cur,end)>=0 && guard<1000){
    var g=new Date(cur+'T00:00:00').getDay();
    var ok=false;
    if(rep.t==='daily') ok=true;
    else if(rep.t==='weekday') ok=(g!==0&&g!==6);
    else if(rep.t==='weekly') ok=((rep.w||[]).indexOf(g)>=0);
    else if(rep.t==='monthly') ok=(new Date(cur+'T00:00:00').getDate()===base.getDate());
    else if(rep.t==='yearly'){ var a=new Date(cur+'T00:00:00'); ok=(a.getMonth()===base.getMonth()&&a.getDate()===base.getDate()); }
    if(ok) out.push(cur);
    cur=U.addDays(cur,1); guard++;
  }
  return out;
}

/* ---------------- 18.5 减肥塑形 · 运动计划与每日计划联动（第三轮 · 模块四） ----------------
   设计要点：
     · 模板存在 S.fitness.plan（含 rep 重复规则对象）；每条模板按重复规则在 S.plans 中
       展开成一批「联动任务」，标记 sourceType:'fitness' / sourceId:模板id。
     · 统计与「今日还有几项没打卡」一律以 S.plans 为准，不再依赖模板上的 done 布尔值
       （模板 done 不分日期，勾一次就永久算完成，这是旧实现的缺陷）。
     · 日期计算全部复用 genRepeatDates，不手写日期循环。
     · rep 是对象（{t:'daily'|'weekday'|'weekly'|'monthly'|'yearly'|'interval'}），不是字符串。 */

var FIT_MAX_PER_TPL=400;      // 单个模板最多展开的任务条数
var FIT_MAX_TOTAL=3000;       // S.plans 总长度熔断阈值
var FIT_KEEP_DONE_DAYS=90;    // 已完成任务保留天数，超过则归档计数后删除
var FIT_KEEP_UNDONE_DAYS=1;   // 未完成的过期任务保留天数（避免堆积成「逾期」噪音）
var FIT_SPAN_DEFAULT=365;     // 用户添加计划时「连续天数」留空的默认窗口（第 3 批既有口径）
var FIT_SPAN_BACKFILL=90;     // 老数据补迁移的窗口：90 天足够，排一整年只会让任务数线性膨胀
var FIT_HORIZON=90;           // 预排窗口：始终保证「今天 ~ 今天+89 天」有运动任务，滚动续排

/* 本周判定：周一为一周起始（与日历模块 2274 行逻辑一致） */
function inThisWeek(dateStr){
  if(!dateStr) return false;
  var sd=U.parse(U.today());
  var off=(sd.getDay()+6)%7;              // 周一=0 … 周日=6
  sd.setDate(sd.getDate()-off);
  var ws=U.dstr(sd);                      // 本周一
  var we=U.addDays(ws,6);                 // 本周日
  return dateStr>=ws && dateStr<=we;      // U.dstr 零填充，字符串比较可靠
}

/* 取某模板在指定日期的联动任务（没有则返回 null） */
function fitnessTaskOn(tplId, date){
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType==='fitness' && p.sourceId===tplId && p.date===date) return p;
  }
  return null;
}

/* 打卡统计：只统计 sourceType==='fitness' 的已完成任务（视频打卡 vCheckin 不写入 S.plans，天然不计入） */
function getFitnessStats(){
  var T=U.today(), F=S.fitness;
  var list=S.plans.filter(function(p){ return p.sourceType==='fitness' && p.done===true });
  var yKey=T.slice(0,4), mKey=T.slice(0,7);
  var archY=(F.archivedY&&F.archivedY[yKey])||0;   // 归档快照：保证清理后年/月统计不倒退
  var archM=(F.archivedM&&F.archivedM[mKey])||0;
  return {
    today: list.filter(function(p){ return p.date===T }).length,
    week:  list.filter(function(p){ return inThisWeek(p.date) }).length,
    month: list.filter(function(p){ return p.date.slice(0,7)===mKey }).length + archM,
    year:  list.filter(function(p){ return p.date.slice(0,4)===yKey }).length + archY,
    archived: F.archivedCount||0
  };
}

/* 按模板的重复规则展开联动任务到 S.plans。
   返回 {added:n, updated:n, skipped:n}；skipped>0 表示触发了总量熔断。
   · 已在 sourceId+date 上存在 → 只同步标题/优先级/热量等模板派生字段，保留 done 与 doneAt
     （不能覆盖完成状态，否则用户补录后再次同步会把已完成冲掉）
   · 无 rep（一次性计划）→ 只展开 start 当天 span 条（默认 1 条） */
/* 老数据兜底：早期模板只有 freq 文本（如「每天」）而没有 rep 对象，
   不推断的话「每天」的计划只会生成今天 1 条，切到其它日期就空了（模块五按天显示会直接暴露）。
   只映射语义完全确定的几种；「每周 N 次」无法反推具体星期，保持一次性。 */
function freqToRep(freq){
  var f=String(freq||'').replace(/\s/g,'');
  if(f==='每天'||f==='每日') return {t:'daily'};
  if(f==='每工作日') return {t:'weekday'};
  if(f==='每月'||f==='每月同日') return {t:'monthly'};
  if(f==='每年'||f==='每年同日') return {t:'yearly'};
  return null;
}
/* 统一取模板的重复规则：优先 rep 对象，没有再用 freq 文本兜底 */
function tplRep(tpl){ return (tpl&&tpl.rep) || freqToRep(tpl&&tpl.freq) }
function fitnessSyncTemplate(tpl, opts){
  /* opts 为可选参数（模块五新增，不传时行为与第三轮完全一致）：
       opts.start  起始日期（运动计划表单可指定目标日期），默认今天
       opts.span   生成窗口天数；留空/0 时：有重复规则 → 一年，无重复规则 → 仅起始日 1 天
     日期计算仍然全部走 genRepeatDates，不手写重复规则。 */
  opts=opts||{};
  var res={added:0, updated:0, skipped:0};
  if(!tpl) return res;
  if(S.plans.length>=FIT_MAX_TOTAL){ res.skipped=1; return res }
  var start=opts.start||U.today();
  var rep=tplRep(tpl);
  var span=U.num(opts.span,0);
  /* 默认口径：重复计划「def」天 / 一次性计划 1 天。
     def 默认 FIT_SPAN_DEFAULT(365)，即第 3 批用户添加计划时留空「连续天数」的既有行为；
     老数据补迁移会显式传 def=FIT_SPAN_BACKFILL(90)，避免一次性灌进一年的任务。 */
  var def=U.num(opts.def,0)>0?U.num(opts.def,0):FIT_SPAN_DEFAULT;
  if(span<=0) span=rep?def:1;
  span=U.clamp(span,1,365);
  var end=U.addDays(start, span-1);
  var dates=[];
  if(rep){
    try{ dates=genRepeatDates(rep, start, end) || [] }
    catch(e){ console.warn('⚠️ 重复规则解析失败，按连续天数处理:', e&&e.message); dates=[] }
  }
  if(!dates.length){                               // 无重复规则 / 解析失败 → 从 start 起连续 span 天
    dates=[];
    for(var di=0; di<span; di++) dates.push(U.addDays(start, di));
  }
  dates=dates.slice(0, FIT_MAX_PER_TPL);           // 单模板上限，防止 localStorage 被灌爆
  var room=FIT_MAX_TOTAL-S.plans.length;
  if(dates.length>room) dates=dates.slice(0, Math.max(0,room));
  var exist={};
  S.plans.forEach(function(p){
    if(p.sourceType==='fitness' && p.sourceId===tpl.id) exist[p.date]=p;
  });
  dates.forEach(function(date){
    var old=exist[date];
    if(old){
      old.title=tpl.name;                          // 只同步派生字段，done / doneAt 保持原样
      old.pri='P1';
      old.kcal=tpl.kcal||null;
      res.updated++;
    }else{
      S.plans.push({
        id:U.uid(), title:tpl.name, pri:'P1', date:date, time:'', ddl:date,
        done:false, createdAt:U.now(),
        sourceType:'fitness', sourceId:tpl.id,
        repeat:rep?{t:rep.t}:null,                  // 仅用于列表上的「循环」角标，不参与生成
        kcal:tpl.kcal||null
      });
      res.added++;
    }
  });
  return res;
}

/* 首次升级时把「还没有任何联动任务」的老模板补一遍，避免出现
   「新模板走 S.plans、老模板走 done 布尔值」的混合口径 */
var FIT_FREQ_MIGRATED=false;
function fitnessBackfill(){
  if(!S.fitness) return 0;
  var n=0;
  if(S.fitness.linked!==true){
    (S.fitness.plan||[]).forEach(function(tpl){
      if(S.plans.some(function(p){ return p.sourceType==='fitness' && p.sourceId===tpl.id })) return;
      var r=fitnessSyncTemplate(tpl, { def:FIT_SPAN_BACKFILL }); n+=r.added;
    });
    S.fitness.linked=true;
  }
  /* 模块五补迁移：第三轮升级过的老模板只有 freq 文本、没有 rep 对象（如「每天」），
     当时只展开了 1 条任务，切到其它日期会显示空白。这里对这类模板补一次完整展开。
     每次开屏最多跑一次（内存标记），命中过就不再重复；已有任务只同步字段、不冲掉完成状态。
     窗口用 FIT_SPAN_BACKFILL(90 天) 而不是一年：健身计划本来就会调整，排一年意义不大，
     而任务数是「模板数 × 天数」线性膨胀的，90 天足够覆盖日常使用又不撑爆 localStorage。 */
  if(!FIT_FREQ_MIGRATED){
    FIT_FREQ_MIGRATED=true;
    (S.fitness.plan||[]).forEach(function(tpl){
      if(tpl.rep || !freqToRep(tpl.freq)) return;
      if(!S.plans.some(function(p){ return p.sourceType==='fitness' && p.sourceId===tpl.id })) return;
      n+=fitnessSyncTemplate(tpl, { def:FIT_SPAN_BACKFILL }).added;
    });
  }
  return n;
}

/* 滚动续排：把预排窗口从「一次性铺一年」改成「始终覆盖未来 FIT_HORIZON 天」。
   为什么必须有这一步：fitnessSyncTemplate 只在「首次迁移」和「用户添加计划」两处被调用，
   一旦把窗口从 365 天降到 90 天，第 91 天起运动计划就会凭空断供、页面显示空白。
   这里在每次开屏时把窗口重新补齐——已存在的日期只同步字段，不重复生成。
   只处理「有重复规则」的模板；一次性计划是用户明确指定的，不自动续排。 */
function fitnessMaintain(){
  if(!S.fitness) return 0;
  var T=U.today(), n=0;
  (S.fitness.plan||[]).forEach(function(tpl){
    if(!tplRep(tpl)) return;
    n+=fitnessSyncTemplate(tpl, { start:T, span:FIT_HORIZON }).added;
  });
  return n;
}
/* 裁剪超出窗口的「未完成」未来任务，回收把窗口从一年降到 90 天后多出来的那部分。
   安全边界（很重要）：
   · 只裁「有重复规则」的模板 —— 这些任务是可以再生的预排，进入窗口后由 fitnessMaintain 自动补回，不会丢计划；
   · 一次性模板（无 rep）绝不裁 —— 那是用户明确指定的日期，删了就真没了；
   · 已完成的任务绝不裁 —— 完成状态是统计数据的唯一来源。 */
function fitnessTrimFuture(){
  if(!S.fitness) return 0;
  var T=U.today(), horizon=U.addDays(T, FIT_HORIZON-1), n=0;
  var rep={};
  (S.fitness.plan||[]).forEach(function(t){ if(tplRep(t)) rep[t.id]=1 });
  var keep=[];
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType==='fitness' && !p.done && rep[p.sourceId] && p.date>horizon){ n++; continue }
    keep.push(p);
  }
  if(n) S.plans=keep;
  return n;
}

/* 数据清理：只清理 fitness 联动任务，不碰其它任务。
   入口在 afterChange()，24 小时最多扫一次，避免每次变更都全表扫描。 */
/* 第五轮修复 3：往按日期归档快照里记一笔。done/plan 都是增量。 */
function fitnessStatAdd(date, done, plan){
  var F=S.fitness; if(!F) return;
  if(!F.dailyStat||typeof F.dailyStat!=='object') F.dailyStat={};
  var d=date||U.today();
  var o=F.dailyStat[d]||{done:0,plan:0};
  o.done+=(done||0); o.plan+=(plan||0);
  F.dailyStat[d]=o;
}
function fitnessCleanup(force){
  var F=S.fitness; if(!F) return 0;
  var T=U.today();
  if(!force && F.lastCleanup===T) return 0;
  var doneLine=U.addDays(T,-FIT_KEEP_DONE_DAYS);
  var undoneLine=U.addDays(T,-FIT_KEEP_UNDONE_DAYS);
  var keep=[], n=0;
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType!=='fitness'){ keep.push(p); continue }
    if(p.done && p.date<doneLine){
      /* 归档：把完成数累计进快照，保证年/月统计不因清理而倒退 */
      F.archivedCount=(F.archivedCount||0)+1;
      var yk=(p.date||T).slice(0,4), mk=(p.date||T).slice(0,7);
      F.archivedY[yk]=(F.archivedY[yk]||0)+1;
      F.archivedM[mk]=(F.archivedM[mk]||0)+1;
      /* 第五轮修复 3：按日期记账。已完成 → done+1、plan+1（它本来就是应做的一项）。
         注意顺序：必须先写入快照，再丢弃这条任务，否则数据就丢了。 */
      fitnessStatAdd(p.date, 1, 1);
      n++;
      continue;
    }
    /* 过期未完成：直接丢弃，不进完成统计；但要记 plan，否则历史完成率会虚高 */
    if(!p.done && p.date<undoneLine){ fitnessStatAdd(p.date, 0, 1); n++; continue }
    keep.push(p);
  }
  if(n) S.plans=keep;
  F.lastCleanup=T;
  return n;
}

/* ── 第三批 · 阶段2：D1 今日执行顺序建议 ──────────────────────────────
   ★ 兜底逻辑（用户划为重点）：拿 AI 返回的序号序列，和今日待办 id 求交集。
   - 返回里命中今日待办的，按返回顺序排前面；
   - 今日待办里没被返回的，按原顺序补到末尾（绝不凭空消失）；
   - 返回里多出来的（不在今日待办里的），直接丢弃（绝不凭空新增）。
   返回值保证：今日待办 id 一个不少、一个不多，顺序由 AI 决定，缺漏自动补齐。
   即使 AI 返回空 / 乱码 / 重复，也不会出错、不会丢任务。 */
function d1Order(text, todayIds){
  var toks=(String(text||'').match(/\d+/g)||[]).map(Number);
  var picked=[], seen={};
  toks.forEach(function(n){
    var i=n-1;                                  /* AI 给的是 1-based 序号 */
    if(i>=0 && i<todayIds.length && !seen[i]){ picked.push(todayIds[i]); seen[i]=1; }
  });
  /* 漏掉的按原顺序补到末尾 */
  return picked.concat(todayIds.filter(function(id,idx){ return !seen[idx] }));
}

/* D1 结果渲染。只展示「顺序 + 原任务标题」，永不展示 AI 的原始文本 ——
   这是结构上保证"禁止评价性措辞"能落到用户眼前：哪怕 AI 在回答里夹带了
   "你总是先做简单的"这种点评，我们也只解析出序号、把点评整体丢弃。 */
function d1ResultHtml(){
  var r=UI.d1Result; if(!r) return '';
  if(r.busy) return '<div class="d1-box"><div class="hint-sm">'+svg('sparkle','ic-sm')+'AI 正在排今日顺序…</div></div>';
  if(r.err) return '<div class="d1-box d1-err"><div class="hint-sm">'+U.esc(r.err)+'</div>'+
    '<div class="row" style="margin-top:8px;gap:8px"><button class="btn btn-sm btn-ai" data-act="d1Ask">重试</button>'+
    '<button class="btn btn-sm" data-act="d1Clear">关闭</button></div></div>';
  var ord=r.order||[];
  if(!ord.length) return '';
  var roman=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  var items=ord.map(function(id,i){
    var p=findIn(S.plans,id); if(!p) return '';
    return '<div class="d1-it"><span class="d1-n">'+(roman[i]||(i+1)+'.')+'</span>'+
      '<span class="d1-t">'+U.esc(p.title)+'</span>'+
      (p.pri&&p.pri!=='P1'?'<span class="badge b-'+p.pri.toLowerCase()+'">'+p.pri+'</span>':'')+
      (p.ddl?'<span class="badge b-over">'+svg('clock','ic-sm')+' '+U.cn(p.ddl)+'</span>':'')+'</div>';
  }).join('');
  return '<div class="d1-box"><div class="d1-hd">'+svg('sparkle','ic-sm')+'<span>AI 建议的今日执行顺序（'+ord.length+' 项）</span>'+
    '<span class="spacer"></span><button class="btn btn-sm" data-act="d1Ask">重新排序</button></div>'+
    items+'<div class="hint-sm" style="margin-top:8px">只排顺序，不改任何任务。AI 不评价你先做哪个。</div></div>';
}

/* 下周一（含今天）。今天周一 → +7，其余 → 距下一个周一的天数。
   ★ 用 new Date(d+'T00:00:00').getDay() 拿星期，和 daily 视图的 WK[...] 同一套写法，避免时区歧义。 */
function nextMonday(){
  var d=new Date(U.today()+'T00:00:00');
  var day=d.getDay();                        /* 0=周日 … 6=周六 */
  var add=(8-day)%7; if(add===0) add=7;
  return U.addDays(U.today(), add);
}
/* N2 解析：把 AI 返回的「自测题」清洗成干净的问题列表。
   ★ 结构性丢弃（沿用 D1 教训）：剥掉编号前缀后，只保留"像问题"的行
     （以 ？/? 结尾或含疑问词），导语 / 点评 / 解释一律过滤掉 ——
     哪怕 AI 在前面加了一段"以下是自测题："，也不会显示给用户。
   ★ 兜底：若一行疑问特征都没有（模型没按要求来），退而保留全部非空行，至少不空白。 */
function quizParse(text){
  var lines=String(text||'').split(/\r?\n/).map(function(x){
    return x.replace(/^\s*[\-\*•]+\s*/,'')
            .replace(/^\s*\d+[\.、\)．]\s*/,'')
            .replace(/^[一二三四五六七八九十百]+[、．.]\s*/,'')
            .replace(/^\s*第[一二三四五六七八九十百\d]+[题步][\.、\)．:：]?\s*/,'')
            .trim();
  }).filter(function(x){ return x && x.length>0 });
  var qre=/[？?]$|问|如何|为什么|为何|怎样|怎么|什么|哪些|请解释|解释|说明|区别|举例|如果|是否|能否|可否|概括|简述|计算|推导/;
  var qs=lines.filter(function(x){ return qre.test(x) });
  if(!qs.length) qs=lines;
  return qs.slice(0,8);
}
/* N2 结果渲染。只展示「题号 + 问题」，不展示 AI 原始文本（quizParse 已过滤）。
   每题一个「我能答上来」勾选（仅本机会话态，不保存），贴合"费曼自测"的用法。 */
function noteQuizHtml(n){
  var r=UI.noteQuiz; if(!r||r.id!==n.id) return '';
  if(r.busy) return '<div class="quiz-box"><div class="hint-sm"><i class="ai-spin"></i> AI 正在出题…</div></div>';
  if(r.err) return '<div class="quiz-box quiz-err"><div class="hint-sm">'+U.esc(r.err)+'</div>'+
    '<div class="row" style="margin-top:8px;gap:8px"><button class="btn btn-sm btn-ai" data-act="noteQuiz" data-id="'+n.id+'">重试</button>'+
    '<button class="btn btn-sm" data-act="noteQuizClear">关闭</button></div></div>';
  var qs=r.quiz||[]; if(!qs.length) return '';
  var roman=['①','②','③','④','⑤','⑥','⑦','⑧'];
  var items=qs.map(function(q,i){
    var on=(r.checked&&r.checked[i])?' on':'';
    var tick=(r.checked&&r.checked[i])?svg('check','ic-sm'):'';
    return '<div class="quiz-it" data-act="quizToggle" data-id="'+n.id+'" data-i="'+i+'"><span class="ck-box'+on+'">'+tick+'</span>'+
      '<span class="quiz-q">'+U.esc(q)+'</span></div>';
  }).join('');
  return '<div class="quiz-box"><div class="quiz-hd">'+svg('sparkle','ic-sm')+'<span>费曼自测题（'+qs.length+' 道）</span>'+
    '<span class="spacer"></span><button class="btn btn-sm" data-act="noteQuiz" data-id="'+n.id+'">重新生成</button></div>'+
    items+
    '<div class="row" style="margin-top:8px;gap:8px">'+
      '<button class="btn btn-sm" data-act="noteQuizCopy" data-id="'+n.id+'">'+svg('copy','ic-sm')+'复制</button>'+
      '<button class="btn btn-sm" data-act="noteQuizClear">清空</button></div>'+
    '<div class="hint-sm" style="margin-top:6px">勾选＝「我能答上来」。自测态只留在本机，不保存。</div></div>';
}

function aiDecompose(text, period, deadline, grain){
  grain=grain||'normal';
  var days=deadline?Math.max(7,U.diffDays(U.today(),deadline)):(period==='月度'?30:period==='季度'?90:365);
  var weeks=Math.max(1,Math.round(days/7));
  var hit=null;
  for(var i=0;i<DECOMP.length;i++){ if(DECOMP[i].k.test(text)){ hit=DECOMP[i]; break } }
  function grainTasks(orig){
    if(grain==='fine') return orig;
    if(grain==='rough'){
      var last=orig[orig.length-1]||'按里程碑验收完成度';
      return [ '达成「'+text.slice(0,14)+(text.length>14?'…':'')+'」的里程碑：'+last ];
    }
    /* normal：把每日动作两两合并成周度动作 */
    var out=[];
    for(var i=0;i<orig.length;i+=2){ out.push(orig[i]+(orig[i+1]?('；'+orig[i+1]):'')) }
    return out.length?out:[orig[0]];
  }
  function build(src){ return {id:U.uid(), name:src.n, target:src.t||100, current:0,
    tasks:grainTasks(src.tasks).map(function(t){ return {id:U.uid(), t:t, done:false} })} }
  var krs;
  if(hit){
    krs=hit.krs(weeks).map(build);
  }else{
    krs=[
      {id:U.uid(), name:'把目标拆成 '+weeks+' 周的里程碑并全部完成', target:weeks, current:0, tasks:[
        {id:U.uid(), t:'写清"做到什么程度算成功"的验收标准', done:false},
        {id:U.uid(), t:'倒排时间，切成每周一个可交付的小结果', done:false},
        {id:U.uid(), t:'把本周的动作拆进每日计划', done:false}
      ]},
      {id:U.uid(), name:'累计完成 '+(weeks*3)+' 次核心动作打卡', target:weeks*3, current:0, tasks:[
        {id:U.uid(), t:'找出推动目标的那 1 个高杠杆动作', done:false},
        {id:U.uid(), t:'固定每周 3 个时间块只做这件事', done:false},
        {id:U.uid(), t:'每次做完记录一句进展', done:false}
      ]},
      {id:U.uid(), name:'完成 '+Math.max(3,Math.round(weeks/2))+' 次复盘与调整', target:Math.max(3,Math.round(weeks/2)), current:0, tasks:[
        {id:U.uid(), t:'每两周检查一次进度偏差', done:false},
        {id:U.uid(), t:'识别最大阻碍并写下应对办法', done:false},
        {id:U.uid(), t:'该砍的子目标果断砍掉', done:false}
      ]}
    ].map(build);
  }
  return {
    id:U.uid(), title:text, objective:(hit?hit.o:'达成：'+text), period:period||'年度',
    deadline:deadline||U.addDays(U.today(),days), krs:krs, createdAt:U.now(),
    risk:['前两周热情最高，容易一次性排太满 → 把每周量压到你觉得"有点少"的程度',
          '中途某周断掉后就全放弃 → 允许断，规则是"断了就从下一天继续，不清零"']
  };
}
/* ── 批次一：goals 真接 AI ──────────────────────────────────────────────
   把模型的 Markdown 文本解析成 OKR 结构。
   ★ 解析必须「宽容」：模型不会 100% 遵守格式，所以只要能捞到 KR 就算成功，
     捞不到才提示重试。同时永远保留 AI 原文，方便用户手工参考。
   ★ target 不要求模型单独给（多一个字段就多一分跑偏的风险），
     直接从 KR 名字里正则取第一个数字——「完成 100 次朗读」自然就是 100。 */
function parseGoalOkr(text){
  var krs=[], obj='', cur=null;
  String(text||'').split(/\r?\n/).forEach(function(raw){
    var s=String(raw||'').replace(/^\s*[#*>]+/,'')
        .replace(/^\s*[-*•]+\s*/,'').trim();
    if(!s) return;
    var mo=s.match(/^(?:Objective|目标|O)\s*[:：]?\s*(.+)$/i);
    if(mo && !obj){ obj=mo[1].trim(); return }
    var mk=s.match(/^(?:KR|关键结果)\s*(\d+)?\s*[:：\.、]?\s*(.+)$/i);
    if(mk){
      var name=String(mk[2]||'').trim();
      var mt=name.match(/(\d+(?:\.\d+)?)/);
      cur={ id:U.uid(), name:name, target:mt?U.clamp(+mt[1],1,999999):100,
            current:0, tasks:[] };
      krs.push(cur); return;
    }
    /* 子任务：只认列表符开头的行，且必须已经有一个 KR 在手上 */
    if(cur && /^\s*[-*•]\s*\S/.test(raw)){
      var tt=String(raw).replace(/^\s*[-*•]+\s*/,'').replace(/^\s*\d+[\.、\)]\s*/,'').trim();
      if(tt) cur.tasks.push({ id:U.uid(), t:tt, done:false });
    }
  });
  /* 完全没解析出 KR，但原文里有列表 → 兜底成一个 KR，别让用户白等一次 */
  if(!krs.length){
    var fallback=[];
    String(text||'').split(/\r?\n/).forEach(function(raw){
      if(/^\s*[-*•]\s*\S/.test(raw)){
        var tt=String(raw).replace(/^\s*[-*•]+\s*/,'').trim();
        if(tt) fallback.push({ id:U.uid(), t:tt, done:false });
      }
    });
    if(fallback.length) krs.push({ id:U.uid(), name:'AI 给出的行动项', target:fallback.length, current:0, tasks:fallback });
  }
  return { objective:obj, krs:krs };
}

/* 解析 AI 生成的练嘴素材。
   约定格式（宽容解析：认 ### 标题 / 类型: / 难度: / 其余当正文）：
     ### 标题
     类型: 朗读
     难度: 中级
     正文正文……
   ★ 类型值必须落在 EXPRESS_TYPES 里，否则归为"朗读"——
     不然又会出现两套 type 并存的旧毛病。 */
function parseExpMats(text){
  var out=[], cur=null;
  function push(){
    if(cur && String(cur.text||'').trim().length>=20){
      var tp=String(cur.type||'');
      cur.type=EXPRESS_TYPES.indexOf(tp)>=0?tp:'朗读';
      var lv=String(cur.level||'').replace(/[（(].*?[)）]/g,'').trim();
      cur.level=(/初级|中级|高级/.test(lv))?lv:'通用';
      out.push(cur);
    }
    cur=null;
  }
  String(text||'').split(/\r?\n/).forEach(function(raw){
    var s=String(raw||'').trim(); if(!s) return;
    var mh=s.match(/^#{1,6}\s*(.+)$/);
    if(mh){ push(); cur={title:mh[1].replace(/^\d+[\.、\)]\s*/,'').trim(), type:'朗读', level:'通用', text:''}; return }
    if(!cur) return;
    /* 一行里同时写 "类型: 朗读 | 难度: 中级" 也能吃下 */
    var both=s.match(/类型\s*[:：]\s*([^|]{1,10})\s*\|?\s*(?:难度\s*[:：]\s*([^|]{1,10}))?/);
    if(both){ cur.type=(both[1]||'').trim(); if(both[2]) cur.level=both[2].trim(); return }
    var ml=s.match(/^(?:难度|级别|Level)\s*[:：]\s*(.+)$/i);
    if(ml){ cur.level=ml[1].trim(); return }
    var mx=s.match(/^(?:正文|内容|文本|Body)\s*[:：]\s*(.*)$/i);
    if(mx){ cur.text=String(mx[1]||'').trim(); return }
    if(/^[-*=]{3,}$/.test(s)) return;                 /* 分隔线，忽略 */
    if(/^(?:以下是|好的|没问题|希望)/.test(s)&&!cur.text) return;  /* 常见开场白，丢掉 */
    cur.text=cur.text?(cur.text+'\n'+s):s;
  });
  push();
  return out.slice(0,5);
}

function goalProgress(g){
  var tot=0, dn=0;
  (g.krs||[]).forEach(function(k){ (k.tasks||[]).forEach(function(t){ tot++; if(t.done) dn++ }) });
  var byTask=tot?dn/tot:0;
  var byNum=0, cnt=0;
  (g.krs||[]).forEach(function(k){ if(k.target){ byNum+=U.clamp(U.num(k.current)/U.num(k.target,1),0,1); cnt++ } });
  byNum=cnt?byNum/cnt:0;
  return Math.round((byTask*0.5+byNum*0.5)*100);
}
function krProgress(k){
  var tot=(k.tasks||[]).length, dn=(k.tasks||[]).filter(function(t){ return t.done }).length;
  var a=tot?dn/tot:0, b=k.target?U.clamp(U.num(k.current)/U.num(k.target,1),0,1):0;
  return Math.round((a*0.5+b*0.5)*100);
}

/* ---------------- 9. 目标看板 ---------------- */
/* ================= 第五轮 B：目标看板 · 打卡总览 =================
   数据来源（均已读源码确认，未凭空发明）：
     · fitness → S.plans 中 sourceType==='fitness' 且 done===true 的条目，按 p.date 归集；
                 口径与 getFitnessStats() 完全一致（同一条过滤谓词）。
                 视频打卡（vCheckin）只写 S.fitness.records 与健康同步项，不产生 S.plans，
                 所以天然不计入，符合「视频打卡不算健身打卡」的要求。
     · health  → S.healthItems，逐条 freq/wday/mday 推算「应做」，逐条 doneDates 统计「完成」。
                 doneDates 是本次新增的日期数组（老数据用 lastDoneDate 作种子），
                 因为原结构只保存「最后一次打卡日期」，无法还原历史。
                 视频打卡自动同步出来的「完成一次运动」项被排除。
     · express → S.express，条目自带 date 字段，直接按日期归集；该模块没有计划，应做数恒为 0。
   ------------------------------------------------------------------ */
var BOARD_CHECKIN=[
  {key:'fitness', name:'减肥塑形', icon:'fitness', color:'var(--primary)'},
  {key:'health',  name:'健康养生', icon:'heart',   color:'var(--accent)'},
  {key:'express', name:'表达能力', icon:'express', color:'color-mix(in srgb, var(--primary) 45%, var(--accent))'}
];
var BOARD_DIMS=[['day','日'],['week','周'],['month','月'],['year','年']];
/* 时间分桶：日=最近30天；周=最近12周（周一为起点，与 inThisWeek 同口径）；
   月=最近12个自然月；年=当前自然年 12 个月（按月聚合，不是 365 个日点）。 */
function boardBuckets(dim){
  var T=U.today(), out=[], i;
  if(dim==='day'){
    /* 第五轮修复 3：30 根柱子在手机上太密、标签对不齐，收敛到 14 根 */
    for(i=13;i>=0;i--){ var d=U.addDays(T,-i); out.push({from:d,to:d,label:(+d.slice(5,7))+'/'+(+d.slice(8,10))}) }
    return out;
  }
  if(dim==='week'){
    var t0=U.parse(T), off=(t0.getDay()+6)%7;      /* 周一=0 … 周日=6，与 inThisWeek 一致 */
    var thisMon=U.addDays(T,-off);
    for(i=11;i>=0;i--){ var mon=U.addDays(thisMon,-7*i); out.push({from:mon,to:U.addDays(mon,6),label:(+mon.slice(5,7))+'/'+(+mon.slice(8,10))}) }
    return out;
  }
  if(dim==='month'){
    var n0=U.parse(T);
    for(i=11;i>=0;i--){
      var dt=new Date(n0.getFullYear(), n0.getMonth()-i, 1), y=dt.getFullYear(), m=dt.getMonth();
      out.push({from:y+'-'+U.pad(m+1)+'-01', to:y+'-'+U.pad(m+1)+'-'+U.pad(new Date(y,m+1,0).getDate()), label:(m+1)+'月'});
    }
    return out;
  }
  var Y=+T.slice(0,4);
  for(var m3=0;m3<12;m3++){
    out.push({from:Y+'-'+U.pad(m3+1)+'-01', to:Y+'-'+U.pad(m3+1)+'-'+U.pad(new Date(Y,m3+1,0).getDate()), label:(m3+1)+'月'});
  }
  return out;
}
/* 视频打卡同步出来的健康项：按 B 的要求不计入健康打卡统计 */
function isVideoSyncHealth(h){ return h.sync==='video' || h.name==='完成一次运动' }
function boardHealthItems(){ return (S.healthItems||[]).filter(function(h){ return !isVideoSyncHealth(h) }) }
/* 某健康项在某天是否「排了班」——只看频率计划，不看完成情况 */
function healthScheduledOn(h, d){
  if(h.freq==='daily') return true;
  if(h.freq==='weekly'){ var w=U.parse(d); return w && w.getDay()===(h.wday==null?0:h.wday) }
  if(h.freq==='monthly') return (+d.slice(8,10))===(h.mday||1);
  return false;
}
function healthDoneDates(h){
  if(Array.isArray(h.doneDates)&&h.doneDates.length) return h.doneDates;
  return h.lastDoneDate?[h.lastDoneDate]:[];   /* 老数据兜底：只有最后一次 */
}
function boardCount(key, b, T){
  var done=0, plan=0, d, guard;
  if(key==='fitness'){
    (S.plans||[]).forEach(function(p){
      if(p.sourceType!=='fitness') return;
      if(!p.date||p.date<b.from||p.date>b.to) return;
      if(p.done===true) done++;
      if(p.date<=T) plan++;          /* 未来的预排不算「应做」，否则完成率会被拉低 */
    });
    /* 第五轮修复 3：运动任务只保留 90 天，90 天前的已被清理，
       光查 S.plans 的话月档和年档会被截断、数字和周档差不多。
       这里合并按日期归档快照把历史补回来。
       两者不重叠：只有被清理掉的任务才会进快照，现存任务不在快照里。 */
    var _ds=(S.fitness&&S.fitness.dailyStat)||{};
    for(var _k in _ds){
      if(!Object.prototype.hasOwnProperty.call(_ds,_k)) continue;
      if(_k<b.from||_k>b.to) continue;
      done+=(_ds[_k].done||0); plan+=(_ds[_k].plan||0);
    }
    return {done:done, plan:plan};
  }
  if(key==='health'){
    boardHealthItems().forEach(function(h){
      healthDoneDates(h).forEach(function(x){ if(x>=b.from&&x<=b.to) done++ });
      var end=(b.to<T?b.to:T);       /* 只统计到今天为止的应做 */
      d=b.from; guard=0;
      while(d<=end && guard<400){ if(healthScheduledOn(h,d)) plan++; d=U.addDays(d,1); guard++ }
    });
    return {done:done, plan:plan};
  }
  /* express：只有实际记录，没有计划 → 应做 0，完成率显示「—」 */
  (S.express||[]).forEach(function(x){ var dd=(x.date||'').slice(0,10); if(dd&&dd>=b.from&&dd<=b.to) done++ });
  return {done:done, plan:0};
}
function boardDimHint(d){
  return d==='day'  ?'按天：最近 14 天，每天一根柱'
       : d==='week' ?'按周：最近 12 周，周一为一周起点（与「本周统计」同口径）'
       : d==='month'?'按月：最近 12 个自然月'
       :              '按年：'+U.today().slice(0,4)+' 年 12 个月，按月聚合（不是 365 个日点）';
}
function boardCheckinHtml(){
  var dim=UI.boardDim||'week';
  var cfg=(S.settings&&S.settings.boardCheckin)||{fitness:true,health:true,express:true};
  var T=U.today(), bks=boardBuckets(dim);
  var dimChips=BOARD_DIMS.map(function(x){ return '<span class="chip'+(dim===x[0]?' on':'')+'" data-act="boardCheckinDim" data-v="'+x[0]+'">'+x[1]+'</span>' }).join('');
  var modChips=BOARD_CHECKIN.map(function(m){ return '<span class="chip'+(cfg[m.key]?' on':'')+'" data-act="boardCheckinToggle" data-v="'+m.key+'">'+svg(m.icon,'ic-sm')+' '+m.name+'</span>' }).join('');
  var mods=BOARD_CHECKIN.filter(function(m){ return cfg[m.key] });
  var step=dim==='day'?5:dim==='week'?3:1;
  var body=mods.length?mods.map(function(m){
    var cells=bks.map(function(b){ return boardCount(m.key,b,T) });
    var tot=0, tp=0, maxV=0;
    cells.forEach(function(c){ tot+=c.done; tp+=c.plan; maxV=Math.max(maxV,c.done,c.plan) });
    var bars='', xs='';
    bks.forEach(function(b,i){
      var c=cells[i];
      var ph=maxV?Math.round(c.plan/maxV*100):0, dh=maxV?Math.round(c.done/maxV*100):0;
      var tip=b.label+'：完成 '+c.done+(c.plan?' / 应做 '+c.plan:'');
      bars+='<div class="bc-bar" title="'+U.esc(tip)+'">'+
        (c.plan?'<i class="p" style="height:'+ph+'%;background:color-mix(in srgb,'+m.color+' 24%,transparent)"></i>':'')+
        '<i class="d" style="height:'+dh+'%;background:'+m.color+'"></i></div>';
      xs+='<span>'+((i%step===0||i===bks.length-1)?b.label:'')+'</span>';
    });
    return '<div class="bc-mod"><div class="bc-mod-h">'+
      '<span class="bc-mod-n">'+svg(m.icon)+U.esc(m.name)+'</span>'+
      '<span class="bc-mod-s"><b>'+tot+' 次</b><span>完成率 '+(tp?Math.round(tot/tp*100)+'%':'—')+'</span></span></div>'+
      (maxV?'<div class="bc-chart">'+bars+'</div><div class="bc-x">'+xs+'</div>'
           :'<div class="bc-empty">这段时间还没有打卡记录</div>')+
      '</div>';
  }).join(''):'<div class="bc-empty">一个模块都没选，在下面挑一个吧</div>';
  return '<section class="card" data-mod="board"><div class="card-head"><h3>'+svg('check2')+'打卡总览</h3><div class="spacer"></div>'+dimChips+'</div>'+
    '<div class="hint-sm" style="margin-bottom:12px">'+boardDimHint(dim)+'</div>'+
    '<div class="bc-wrap">'+body+'</div>'+
    '<div class="bc-cfg" style="margin-top:12px;border-top:1px solid var(--line);padding-top:11px">'+modChips+'</div>'+
    '<div class="hint-sm" style="margin-top:10px;line-height:1.7">口径：减肥塑形 = 已完成的运动联动任务 ÷ 已排任务（视频打卡不计入）；'+
    '健康养生 = 实际打卡日期 ÷ 按频率推算的应做次数（历史日期从本次更新开始记录，更早的无法回溯）；'+
    '表达能力 = 练习记录条数，该模块没有计划，完成率显示「—」。</div></section>';
}
VIEWS.board=function(){

/* ---------------- 10. 日历 ---------------- */
VIEWS.calendar=function(){
  var T=U.today();
  if(!UI.calMonth){ var t=U.parse(T); UI.calMonth=t.getFullYear()+'-'+U.pad(t.getMonth()+1) }
  var sel=UI.calSel||T, mode=UI.calMode||'month';
  var mp=UI.calMonth.split('-'), y=+mp[0], mo=+mp[1]-1;
  var byDate={};
  S.plans.forEach(function(p){
    var k=p.ddl||p.date; if(!k) return;
    (byDate[k]=byDate[k]||[]).push(p);
  });
  S.goals.forEach(function(g){ if(g.deadline) (byDate[g.deadline]=byDate[g.deadline]||[]).push({title:'目标截止：'+g.title,pri:'P0',goal:true}) });
  var cells='', wd=['一','二','三','四','五','六','日'];
  var head=wd.map(function(w){ return '<div class="cal-wd">'+w+'</div>' }).join('');
  if(mode==='month'){
    var first=new Date(y,mo,1), fd=(first.getDay()+6)%7;
    var start=new Date(y,mo,1-fd);
    for(var i=0;i<42;i++){
      var d=new Date(start); d.setDate(start.getDate()+i);
      var ds=U.dstr(d), out=d.getMonth()!==mo;
      var items=(byDate[ds]||[]).filter(function(p){ return !p.done });
      var hasOver=items.some(function(p){ return !p.goal&&U.diffDays(T,ds)<0 });
      var dots=items.slice(0,3).map(function(p){ return '<i class="dot d'+({P0:0,P1:1,P2:2}[p.pri]||2)+'"></i>' }).join('');
      cells+='<div class="cal-cell'+(out?' out':'')+(ds===T?' today':'')+(ds===sel?' sel':'')+(hasOver?' hasover':'')+'" data-act="calPick" data-v="'+ds+'">'+
        '<span>'+d.getDate()+'</span><span class="dots">'+dots+'</span></div>';
      if(i>=34&&d.getMonth()!==mo&&(i+1)%7===0) break;
    }
  }else{
    var sd=U.parse(sel), off=(sd.getDay()+6)%7, ws=new Date(sd); ws.setDate(sd.getDate()-off);
    for(var j=0;j<7;j++){
      var dd=new Date(ws); dd.setDate(ws.getDate()+j);
      var ds2=U.dstr(dd), it2=(byDate[ds2]||[]).filter(function(p){ return !p.done });
      var ho=it2.some(function(p){ return !p.goal&&U.diffDays(T,ds2)<0 });
      cells+='<div class="cal-cell'+(ds2===T?' today':'')+(ds2===sel?' sel':'')+(ho?' hasover':'')+'" style="aspect-ratio:auto;min-height:76px" data-act="calPick" data-v="'+ds2+'">'+
        '<span style="font-size:.72rem;color:var(--muted)">'+(+ds2.slice(5,7))+'/'+(+ds2.slice(8,10))+'</span>'+
        '<span style="font-weight:700">'+it2.length+'</span><span style="font-size:.64rem;color:var(--muted)">项待办</span></div>';
    }
  }
  var dayItems=(byDate[sel]||[]);
  var dayList=dayItems.map(function(p){
    if(p.goal) return '<div class="item"><div class="it-body"><div class="it-title">'+U.esc(p.title)+'</div><div class="it-meta"><span class="tag">目标节点</span></div></div></div>';
    var od=!p.done&&U.diffDays(T,p.ddl||sel)<0;
    return '<div class="item'+(p.done?' done':'')+(od?' over':'')+'">'+
      '<button class="cbx'+(p.done?' on':'')+'" data-act="togglePlan" data-id="'+p.id+'" aria-label="完成">'+svg('check')+'</button>'+
      '<div class="it-body"><div class="it-title">'+U.esc(p.title)+'</div>'+
      '<div class="it-meta"><span class="badge b-'+p.pri.toLowerCase()+'">'+p.pri+'</span>'+(od?'<span class="badge b-over">'+U.ddlText(p.ddl)+'</span>':'<span>'+U.ddlText(p.ddl)+'</span>')+'</div></div></div>';
  }).join('')||U.empty('calendar','这一天没有安排');
  var mn=U.pad(mo+1);
  return '<h1 class="sec-title">'+svg('calendar')+'日历</h1>'+
    '<p class="sec-sub">圆点颜色代表优先级（红 P0 / 黄 P1 / 绿 P2），底色变红说明这天有逾期未处理。</p>'+
    '<section class="card" data-mod="calendar"><div class="card-head">'+
      '<h3>'+y+' 年 '+mn+' 月</h3><div class="spacer"></div>'+
      '<span class="chip'+(mode==='month'?' on':'')+'" data-act="calMode" data-v="month">月视图</span>'+
      '<span class="chip'+(mode==='week'?' on':'')+'" data-act="calMode" data-v="week">周视图</span>'+
      '<button class="icon-btn" data-act="calShift" data-v="-1" aria-label="上一月">'+svg('close')+'</button>'+
      '<button class="btn btn-sm" data-act="calShift" data-v="0">回到本月</button>'+
      '<button class="icon-btn" data-act="calShift" data-v="1" aria-label="下一月">'+svg('plus')+'</button></div>'+
      '<div class="cal-grid">'+(mode==='month'?head:'')+cells+'</div></section>'+
    '<section class="card" data-mod="calendar"><div class="card-head"><h3>'+U.cn(sel)+' 的安排'+(sel===T?'（今天）':'')+'</h3><div class="spacer"></div>'+

/* 备忘录列表区单独抽出来：页内搜索只重绘这一块，
   不整页 render —— 整页重建会把正在输入的搜索框也重建掉，光标就丢了。 */
function memoRowsHtml(){
  var tags={}; S.memos.forEach(function(m){ (m.tags||[]).forEach(function(t){ tags[t]=(tags[t]||0)+1 }) });
  var ft=UI.filters.memo||'', q=(UI.filters.memoQ||'').trim().toLowerCase();
  var list=S.memos.filter(function(m){
    if(ft&&(m.tags||[]).indexOf(ft)<0) return false;
    /* 匹配范围：正文 + 标签（需求二-3）。标签先 join 成字符串再一并搜。 */
    if(q&&(String(m.text||'')+' '+(m.tags||[]).join(' ')).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).slice().sort(function(a,b){ return (b.createdAt||'')<(a.createdAt||'')?-1:1 });
  var rows=list.map(function(m){
    return '<div class="item" style="display:block"><div style="display:flex;gap:10px;align-items:flex-start">'+
      '<div class="it-body"><div style="white-space:pre-wrap;word-break:break-word;font-size:.92rem">'+U.esc(m.text)+'</div>'+
      '<div class="it-meta">'+(m.tags||[]).map(function(t){ return '<span class="tag">'+U.esc(t)+'</span>' }).join('')+
      '<span>'+U.relTime(m.createdAt)+'</span></div></div>'+
      '<div class="it-actions">'+menuBtn('memo',m.id)+'</div></div>'+
      menuPop('memo',m.id,[
        {label:'AI 建议标签', act:'memoTag', icon:'tag'},
        {label:'编辑', act:'editMemo', icon:'edit'},
        {label:'删除', act:'delMemo', icon:'trash', danger:true}
      ])+
      '</div>';
  }).join('');
  /* 空状态必须区分「一条都没有」和「搜不到」—— 后者要告诉用户是关键词的问题（需求二-6）。
     搜不到时不用 U.empty：它会带一个「去添加」按钮，可用户要的是换个关键词，不是去添加。 */
  if(!rows){
    var emsg = q ? '没有匹配的备忘，换个关键词试试'
             : ft ? '「'+ft+'」这个标签下还没有备忘'
             : '还没有备忘，随手记一条';
    rows='<div class="empty">'+svg('memo')+'<p>'+U.esc(emsg)+'</p>'+
      ((q||ft)?'<button class="btn btn-sm" data-act="memoResetFilter">清除筛选</button>':'')+'</div>';
  }
  return rows;
}
function memoRenderList(){
  var box=U.$('#memoList'); if(!box) return;
  box.innerHTML=memoRowsHtml();
  /* 清空按钮在列表外面（和输入框一起），只重绘列表不会更新它 ——
     不在这里同步显隐的话，输完字想一键清空时按钮压根没出现。 */
  var cw=U.$('#memoClearWrap');
  if(cw) cw.style.display=(UI.filters.memoQ||'').trim()?'':'none';
}
VIEWS.memo=function(){
  var tags={}; S.memos.forEach(function(m){ (m.tags||[]).forEach(function(t){ tags[t]=(tags[t]||0)+1 }) });
  var ft=UI.filters.memo||'', q=(UI.filters.memoQ||'');
  var chips='<span class="chip'+(!ft?' on':'')+'" data-act="filterMemo" data-v="">全部 '+S.memos.length+'</span>'+
    Object.keys(tags).map(function(t){ return '<span class="chip'+(ft===t?' on':'')+'" data-act="filterMemo" data-v="'+U.esc(t)+'">'+U.esc(t)+' '+tags[t]+'</span>' }).join('');
  /* 页内搜索：输入即筛，不点按钮。和标签筛选并列，两者是"与"的关系（需求二-4）。
     清空按钮**常驻 DOM**（空关键词时用 display:none 藏起来）：它和输入框在同一个卡片里，
     而输入时只重绘列表，不重建这张卡片 —— 靠重新渲染把它变出来是做不到的，
     只能由 memoRenderList 单独同步显隐。 */
  var hasQ=!!String(q||'').trim();
  var searchBox='<section class="card" data-mod="memo"><div class="row" style="gap:8px">'+
    '<div style="flex:1"><input id="memoQ" placeholder="搜索备忘（正文 + 标签）" value="'+U.esc(q)+'" style="min-height:44px"></div>'+
    '<div style="flex:0 0 auto'+(hasQ?'':';display:none')+'" id="memoClearWrap">'+
      '<button class="btn" data-act="clearMemoQ" style="min-height:44px" aria-label="清空搜索">'+svg('close','ic-sm')+'清空</button></div>'+
    '</div></section>';
  return '<h1 class="sec-title">'+svg('memo')+'备忘录</h1><p class="sec-sub">随手记，按时间倒序，用标签分类。</p>'+
    '<section class="card" data-mod="memo"><div class="field"><textarea id="mText" placeholder="想记点什么…（Ctrl / ⌘ + Enter 快速保存）"></textarea></div>'+
      '<div class="row"><div style="flex:2"><input id="mTags" placeholder="标签，逗号分隔：工作, 生活"></div>'+
      '<div style="flex:0 0 auto"><button class="btn btn-primary" data-act="addMemo">'+svg('plus')+'保存</button></div></div></section>'+
    searchBox+
    '<div class="chips">'+chips+'</div><div class="list" id="memoList">'+memoRowsHtml()+'</div>';
};

  '其他':  { search:'https://www.bilibili.com/',                                 appSearch:'' }
};
/* 从链接域名反推平台：健康 Tips / 手动添加的条目常常只有 url，
   plat/source 是「小红书 · 内置推荐」这类带后缀的字符串，直接查表查不到，
   以前一律回落 B站，于是小红书链接的跳转按钮会显示成「跳转 B站」。 */
function platOfUrl(u){
  if(!u) return '';
  if(/douyin\.com|iesdouyin\.com/i.test(u)) return '抖音';
  /* 第八轮：小红书官方短链域名是 xhslink.**cn**（不是 .com）。
     原来只写了 xhslink\.com，用户的 https://xhslink.cn/o/xxx 直接漏掉，
     于是被最下面兜底回落成 B站 —— 按钮显示「跳转 B站」，实际也跳错地方。 */
  if(/xiaohongshu\.com|xhslink\.(com|cn)/i.test(u)) return '小红书';
  if(/bilibili\.com|b23\.tv|acg\.tv/i.test(u)) return 'B站';
  return '';
}
/* 来源下拉框：选项直接取 PLATS 的键，杜绝手打「bilibili」「b站」「小red书」匹配不上的问题 */
function platSelect(id, cur, emptyLabel){
  var h='<select id="'+id+'">';
  if(emptyLabel) h+='<option value=""'+(cur?'':' selected')+'>'+U.esc(emptyLabel)+'</option>';
  h+=Object.keys(PLATS).map(function(k){
    return '<option value="'+U.esc(k)+'"'+(cur===k?' selected':'')+'>'+U.esc(k)+'</option>';
  }).join('');
  return h+'</select>';
}
/* 第七轮修复 3：从分享文案里抠出第一个 http(s) 链接。
   典型输入：「【抖音】这拉伸太爽了！ 复制此链接，打开Dou音搜索… https://v.douyin.com/xxxx/ 复制本条信息…」 */
function extractUrl(text){
  if(!text) return '';
  var m=String(text).match(/https?:\/\/[^\s，,。、；：！？"'）)】\]]+/i);
  return m?m[0]:'';
}
/* 第九轮修复 2.1：统一的链接清洗入口。
   从**任意多个候选文本**里依次找，返回第一个「整串就是 URL」的纯链接；都找不到返回 ''。

   为什么必须用它、而不是 /^https?:\/\//i.test(整个字符串)：
   用户粘进来的从来都是整段分享文案（前文后语 + emoji + 链接），
   用 test 去判断「整串是否以 http 开头」必然失败；
   而 extractUrl 用的是 match，能直接从文案中间**抠出**链接子串。
   凡是涉及「这个字段里到底有没有链接」的判断，一律走这里。 */
function cleanUrl(){
  var parts=Array.prototype.slice.call(arguments);
  for(var i=0;i<parts.length;i++){
    var u=extractUrl(parts[i]);
    if(u) return u;
  }
  return '';
}
/* 严格判定：整串就是一个 URL（没有空格、没有中文、没有 emoji） */
function isValidUrl(u){
  return /^https?:\/\/\S+$/i.test(String(u||''));
}
/* 第九轮修复 3：清洗某个「链接相关字段」，把链接填进 url 框，并同步来源下拉框。
   isInput=true 表示来自 input 防抖（用户可能还在打字）→ 不动当前框的内容，只填目标 url 框。
   分三类字段：
     · 链接框（vUrl / htUrl，没有 to）→ 内容应该就是纯链接，发现多余文字就替换掉
     · 标题框（vTitle / htTitle）     → 链接进 url 框；失焦（change）时再把标题清理成干净名称
     · 正文框（htBody）               → 链接进 url 框，正文一字不动 */
function cleanUrlField(t, cfg, isInput){
  if(!t||!cfg) return;
  var _u=cleanUrl(t.value);
  if(!cfg.to){
    if(_u&&_u!==t.value){ t.value=_u; draftSet('#'+t.id,_u); U.toast('已提取链接','ok') }
  }else{
    /* 标题框 / 正文框：把抠到的链接填进对应的 url 字段，**和粘贴路径行为一致**。

       目标框里已经是个像样的纯链接时才不覆盖，免得冲掉用户手填的。 */
    var _to=document.getElementById(cfg.to);
    if(_u&&_to&&!isValidUrl(_to.value)){ _to.value=_u; draftSet('#'+cfg.to,_u) }

    if((t.id==='vTitle'||t.id==='htTitle')&&!isInput){
      if(_u&&t.value.length>_u.length){
        var _c=cleanShareTitle(t.value);
        if(_c&&_c!==t.value){ t.value=_c; draftSet('#'+t.id,_c) }

  }
  var _p=platOfUrl(_u||t.value);

/* 第九轮修复 4：给已经存进库的老数据兜底。
   以前 url 存的是整段文案（含空格/中文），这里就地抠出纯链接并回填，
   老数据不用重新添加一遍。 */
function healVideoUrl(v){
  if(!v) return '';
  if(isValidUrl(v.url)) return v.url;
  var u=cleanUrl(v.url, v.title, v.note, v.body);
  if(u){ v.url=u; return u }
  return '';
}
/* 第九轮修复 1：弹窗里的链接行 —— **如实显示存的是什么**。
   以前写的是 raw||web：url 无效时回退显示 web（搜索链接），
   弹窗上看着是个像样的链接，实际一点开就是搜索页。
   这个"好心"的回退把真正的证据藏了起来，前几轮排查一直被它误导。
   现在三种情况分开显示，用户截一张图就能看出库里到底存了什么。 */
function urlLineHtml(v){
  v=v||{};
  var u=String(v.url||'');
  if(isValidUrl(u)) return '<div class="pm-url">'+U.esc(u)+'</div>';
  /* 没有 url 但有 BV 号 / aid：能精确定位到具体视频，不算「没存链接」。
     内置推荐池和老的手工条目就是这种，以前 raw||web 会显示成真实视频页，
     改成只看 url 的话它们会被误标成"跳转会落到搜索页"，属于误报。 */
  if(v.bv)  return '<div class="pm-url">'+U.esc('https://www.bilibili.com/video/'+v.bv)+'</div>';
  if(v.aid) return '<div class="pm-url">'+U.esc('bilibili://video/'+v.aid)+'</div>';
  if(u) return '<div class="pm-url" style="color:var(--danger);word-break:break-all">'+U.esc(u)+'</div>'+

  return '<div class="pm-url" style="color:var(--danger)">（未存链接）</div>'+

/* 抠出链接后，把对应的「来源」下拉框选到该平台 */
function syncPlatSelect(selId, url){
  if(!selId) return '';
  var p=platOfUrl(url); if(!p) return '';
  var sel=document.getElementById(selId); if(!sel) return '';
  sel.value=p; draftSet('#'+selId, p);
  return p;
}
/* 第八轮修复 1：把整段分享文案里的链接剥掉，留下干净标题。
   例子（用户真实样本）：
     「两个新款对比视频来啦～都是两位数送吊坠！🐛 https://xhslink.cn/o/xxx 复制这段，去【小红书】发现更多好内容~」
     → 「两个新款对比视频来啦～都是两位数送吊坠！🐛」
     「【抖音】这拉伸太爽了！ 复制此链接，打开Dou音搜索，直接观看视频！ https://v.douyin.com/xxx/ 复制本条信息…」
     → 「这拉伸太爽了」
   策略：先只取链接之前那一段（用户真正写的内容基本都在链接前），再抹掉平台话术。 */
function cleanShareTitle(text){
  var s=String(text||'').trim();
  if(!s) return '';
  var i=s.search(/https?:\/\//i);
  if(i>0) s=s.slice(0,i);                                    /* 链接之前的部分 */
  else    s=s.replace(/https?:\/\/\S*/gi,'');                /* 链接打头 → 直接抹掉 */
  s=s.replace(/【[^】]*】/g,'')                               /* 【抖音】【小红书】 */
   .replace(/复制[^\n，。！]*(链接|信息|这段|本条)[^\n，。！]*/g,'') /* 复制此链接…/复制本条信息… */
   .replace(/打开[^\n，。！]*(搜索|查看|观看)[^\n，。！]*/g,'')     /* 打开Dou音搜索… */
   .replace(/直接观看视频！?/g,'')
   .replace(/[\s\u3000]+/g,' ')
   .replace(/^[\s\-—~～,，。、:：!！]+|[\s\-—~～,，。、:：]+$/g,'');

}
/* 需要处理「粘贴分享文案」的字段：src=对应的来源下拉框，to=提取后回填到哪里。

   第七轮要求「整段就是一个光秃秃的链接」才提取，但用户粘的从来都是完整分享文案

   这个保护是多余的：把链接填进 url 字段并不会改动正文，不存在「破坏用户文字」的风险。

var PASTE_URL_FIELDS={
  vUrl:  { src:'vSrc'  },
  htUrl: { src:'htSrc' },
  htBody:{ src:'htSrc', to:'htUrl' },        /* 正文：链接进 url 字段，正文一字不动 */
  vTitle:{ src:'vSrc',  to:'vUrl'  },        /* 标题：链接进 url 字段，标题清理成干净名称 */
  htTitle:{src:'htSrc', to:'htUrl' }
};
function platName(v){
  var n=v&&(v.plat||v.source||v.a);
  if(PLATS[n]) return n;
  var g=platOfUrl(v&&v.url); if(g) return g;
  return 'B站';

/* 真实网页地址：有 BV 号直接指向视频页，否则回落平台搜索页（搜索页永不 404） */
function videoUrl(v){
  if(!v) return '';
  if(v.bv) return 'https://www.bilibili.com/video/'+v.bv;
  /* 第九轮修复 2：用 cleanUrl（match 抠子串）而不是 test 判断整串。
     老数据里 url 存的是整段分享文案，test 判定"不是链接"→ 直接掉到搜索页。 */
  var _u=cleanUrl(v.url); if(_u) return _u;
  var p=PLATS[platName(v)];
  return p.search+encodeURIComponent(v.kw||v.title||v.t||'');

/* APP 唤起地址。
   第六轮修复 1：原来抖音/小红书一律拼搜索 scheme，而且**完全没读用户自己添加的 v.url**，
   所以粘贴具体视频/笔记的分享链接后点「跳转 APP」，只会落到平台的搜索框。
   现在优先级改为：
     1) 用户自己添加的原始链接（http/https）→ 直接用它（平台 APP 靠 Universal Link 识别并定位）
     2) B站有 aid / bv → bilibili://video/... 直达

function videoAppUrl(v){
  if(!v) return '';
  var n=platName(v), p=PLATS[n];
  /* 第八轮：B站能从链接里抠出 BV 号就直接走原生协议，直达视频页。

  var bvm=String(v.url||'').match(/\/(BV[0-9A-Za-z]+)/);
  if(bvm) return 'bilibili://video/'+bvm[1];

  if(n==='B站'&&v.aid) return 'bilibili://video/'+v.aid;
  if(n==='B站'&&v.bv)  return 'bilibili://video/'+v.bv;

}
/* ===== 第八轮修复 4：短链用 intent 协议唤起 =====
   安卓包名，用于构造 intent:// */
var PLAT_PKG={
  'B站':'tv.danmaku.bili',
  '抖音':'com.ss.android.ugc.aweme',
  '小红书':'com.xingin.xhs'
};
function isAndroid(){ return /Android/i.test(navigator.userAgent||'') }
/* intent 唤起地址。
   为什么需要：用户分享的几乎都是短链（b23.tv / xhslink.cn / v.douyin.com）。
   短链走整页导航时，Chrome 会先请求短链、拿到 302 重定向后再转交 APP，
   这一层会把原始路径信息丢掉，APP 解析不出视频/笔记 ID，于是落到搜索页。
   intent:// 把原始链接直接交给 APP，由 APP 自己完成短链还原，就能定位到具体内容。
   S.browser_fallback_url 保证没装 APP 时仍能回落网页版，不会白屏。 */
function intentUrl(u, pkg){
  if(!u||!pkg||!/^https?:\/\//i.test(u)) return '';
  return 'intent://'+String(u).replace(/^https?:\/\//i,'')+
         '#Intent;scheme=https;package='+pkg+
         ';S.browser_fallback_url='+encodeURIComponent(u)+';end';

/* 在系统浏览器新标签打开：WebView 里 window.open 常被拦，优先用 a[target=_blank] 触发 */
function openExternal(url){
  if(!url) return false;
  try{
    var a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
    a.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ a.parentNode.removeChild(a) }catch(e){} },0);
    return true;
  }catch(e){}
  try{ if(window.open(url,'_blank','noopener')) return true }catch(e){}
  try{ window.location.href=url; return true }catch(e){}
  return false;
}
/* 唤起前的确认框（第六轮修复 2.1）。

   原来的实现从点击那一刻就开始 1.5s 倒计时，倒计时一到就误判「唤起失败」，
   偷偷用浏览器把网页版打开了 —— 用户从 APP 返回，看到的就是视频网页版而不是工作台。

function openInApp(v){

/* 真正执行唤起（第六轮修复 1.2 / 2.2） */
function launchApp(v){

       B站的 BV 号也因为走了网页重定向而定位不到，把原本好的 B站也弄坏了。
       改回 window.location.href 整页导航：系统识别域名后弹「用 XX 打开吗」，
       交给 APP 自己解析，才能定位到具体视频（抖音会有 1-2 秒停留，属正常）。
       整页导航期间工作台会被替换，从 APP 返回时重新加载一次 —— 这是预期行为，
       与第六轮修掉的「返回后变成视频网页版」不是一回事（那是 iframe 引起的）。

       第八轮修复 4：整页导航对**短链**还不够 —— Chrome 要先请求短链、302 之后再转交 APP，
       原始路径在这一层被丢掉，APP 解析不出视频 ID，于是又回到搜索页。

/* ===== 内置推荐池（只读，永不写入个人库） ===== */
function sampleArr(arr,n){
  var s=(arr||[]).slice();
  for(var i=s.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=s[i]; s[i]=s[j]; s[j]=t; }
  return s.slice(0,n);
}
/* 紧凑数组 [bv,aid,标题,UP主,时长] 还原为对象 */
function fitPoolAll(cat){
  var cats=(cat&&cat!=='全部')?[cat]:Object.keys(FIT_VID), out=[];
  cats.forEach(function(c){
    (FIT_VID[c]||[]).forEach(function(r,i){
      out.push({ id:'fp_'+c+'_'+i, bv:r[0], aid:r[1], title:r[2], author:r[3], duration:r[4],
                 cat:c, plat:'B站', source:'B站', pool:true });
    });
  });
  return out;
}
function fitPoolCount(cat){ return fitPoolAll(cat).length }
function samplePool(cat){ return sampleArr(fitPoolAll(cat),10) }
function poolFor(cat){
  UI.fitPool=UI.fitPool||{};
  if(!UI.fitPool[cat]||!UI.fitPool[cat].length) UI.fitPool[cat]=samplePool(cat);
  return UI.fitPool[cat];
}
/* 只读查找内置池条目：播放时不落库，保证推荐池与个人库隔离 */
function poolItemById(id){
  if(!id) return null;
  UI.fitPool=UI.fitPool||{};
  for(var k in UI.fitPool){
    var arr=UI.fitPool[k]||[];
    for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i] }
  }
  var m=/^fp_(.+)_(\d+)$/.exec(id);
  if(m){ var list=fitPoolAll(m[1]); for(var n=0;n<list.length;n++){ if(list[n].id===id) return list[n] } }
  return null;
}
/* 阶段二：AI 学习「收藏视频」统一入口。
   老数据就是这个数组，只是条目没有 id —— 见下面的 ensureAigFavIds()。 */
function aigFavVideos(){ return (S&&S.aigFavs&&S.aigFavs.videos)||[] }
/* 阶段二：给历史收藏视频补 id。
   老结构是 {t,bv,aid,...} 没有 id，而播放 / 去重 / 搜索定位三条链路都靠 id，
   不补的话收藏视频点了没反应（anyVideoById 找不到）。
   只在启动后跑一次，补到几条就返回几；不改动任何已有字段，纯粹"加字段"。 */
var __aigFavIdsDone=false;
function ensureAigFavIds(){
  if(__aigFavIdsDone) return 0;
  __aigFavIdsDone=true;
  var arr=aigFavVideos(), n=0;
  for(var i=0;i<arr.length;i++){ if(!arr[i].id){ arr[i].id='af_'+U.uid(); n++ } }
  return n;
}
/* 阶段二：anyVideoById 扩展新数据源 S.aigFavs.videos。
   顺序：自有健身库 → 健康视频库 → AI 收藏视频 → 内置池。
   不扩这条，AI 收藏视频点播放会"找不到视频"。 */
function anyVideoById(id){ return findIn(S.videos,id)||findIn(S.healthVideos||[],id)||findIn(aigFavVideos(),id)||poolItemById(id) }
/* 去重：同链接（BV）或同标题即视为已存在。
   阶段二：加可选 scope ——
     scope==='aig' → 只在 AI 收藏视频里查重（新增视频时用）
     默认（不传）  → 仍在健身自有库 S.videos 里查重，行为与改造前完全一致。
   为什么不无条件把 aigFavs 加进默认查重：那是跨模块查重，
   用户在健身里加一条「帕梅拉」，恰好 AI 收藏里有同名视频就会被判重复而拒绝添加 —— 误伤。
   查重应该是"同一个库内"的事，跨库只做"找得到"（anyVideoById），不做"算重复"。 */
function dupVideo(v,scope){
  if(!v) return null;
  var u=videoUrl(v), t=(v.title||v.t||'').trim();
  var list=(scope==='aig')?aigFavVideos():(S.videos||[]);
  return list.filter(function(x){
    if(v.bv&&x.bv&&x.bv===v.bv) return true;
    if(u&&videoUrl(x)===u) return true;
    return !!(t&&(x.title||x.t||'').trim()===t);
  })[0]||null;
}
/* 只有「收藏 / 打卡」才把内置池视频落库，来源标记 pool */
function materializeVideo(id){
  var own=findIn(S.videos,id); if(own) return own;
  /* 阶段二：命中的是 AI 收藏视频 → 它本身就是一条完整记录，直接返回，
     不要把它复制进健身库（那会造成同一条视频两个库各存一份，删一个另一个还在）。 */
  var af=findIn(aigFavVideos(),id); if(af) return af;
  var pv=poolItemById(id); if(!pv) return null;
  var dup=dupVideo(pv); if(dup) return dup;
  var v={ id:U.uid(), title:pv.title, url:videoUrl(pv), bv:pv.bv, aid:pv.aid,
          duration:pv.duration, cat:pv.cat, source:pv.source, plat:pv.plat, author:pv.author,
          note:'', fav:false, manual:false, src:'pool', checkins:{}, addedAt:U.now() };
  S.videos=S.videos||[]; S.videos.push(v);
  return v;
}

/* ---------------- 18.5 F1 体重趋势解读（批次六） ----------------
   ★ scene = insight（分析腔），不用 guide（攻略腔）—— 理由同 W1，见 17.5 的注释。
   ★ 输入只有三样：近 30 天的「日期 + 体重 + 体脂」、前端算好的派生数据（BMI / 区间变化 /
     近 7 天缺口合计 ÷7700）、记录跨度。
     ★ 不给 note（备注里常有私人信息，且对趋势没用）
     ★ 不给 deficit 明细（逐日缺口会诱导模型做"哪天偷吃了"的因果推断，那是编造）
       —— 只给前端算好的「近 7 天合计 ÷ 7700」这个聚合值。
   ★ 四条红线写进 prompt，且前端不提供任何写入路径（结果只有复制 / 清空）：
       ① 不得写入或修改 records[].deficit  ② 不得生成 targetWeight
       ③ 不得生成运动康复动作               ④ 不得生成饮食处方
     BMI 分档由前端算好（18.5 / 24 / 28，与页面「BMI」统计卡同一套）再交给模型，
     避免模型按别的口径自己算出一个分档 —— 页面 4880 行与 HEALTH_POOL 文案的分档本来就
     不一致，再让模型算一遍只会更乱。
   ★ 少于 3 条记录 → ACT 里直接拦，零请求。demo 过滤同上。 */
function fitTrendStats(){
  var F=S.fitness||{}, pf=F.profile||{}, T=U.today();
  var recs=(F.records||[]).filter(function(r){
    return !r.demo && r.date && r.weight!=null && r.weight!=='';
  }).slice().sort(function(a,b){ return String(a.date)<String(b.date)?-1:1 });
  if(recs.length<3) return null;
  /* 近 30 天；不足 3 条时退到「最近 30 条记录」，保证喂给模型的一定够看趋势。
     ★ fallback 必须带出去：这时喂进去的其实是跨了 30 天以上的记录，
       却在 prompt 里写「近 30 天」等于对模型撒谎，它会据此判断"最近一个月"。 */
  var win=recs.filter(function(r){ return U.diffDays(r.date,T)<=30 });
  var fallback=false;
  if(win.length<3){ win=recs.slice(-30); fallback=true; }
  var h=U.num(pf.height);
  var first=win[0], last=win[win.length-1];
  var bmi=h?(U.num(last.weight)/Math.pow(h/100,2)):0;
  var band=bmi?(bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖'):'—';
  /* 与页面「近 7 天缺口」统计卡同一套算式，两边数字必须对得上 */
  var kcal7=recs.filter(function(r){ return U.diffDays(r.date,T)<=7 })
                .reduce(function(a,b){ return a+U.num(b.deficit) },0);
  return { recs:win, n:win.length, total:recs.length, first:first, last:last,
           bmi:bmi, band:band, kcal7:kcal7, fallback:fallback,
           span:(win.length>1?(first.date+' ~ '+last.date):last.date) };
}
function fitTrendPrompt(st){
  var s=[], d=U.num(st.last.weight)-U.num(st.first.weight);
  /* ★ fallback（近 30 天不足 3 条、退到最近 30 条记录）时不能再说"近 30 天" ——
       那会让模型以为这些是最近一个月的记录，跨度提示必须跟喂进去的数据一致。 */
  s.push(st.fallback
    ? '下面是我的体重记录（最近 '+st.n+' 条，跨度超过 30 天）。'
    : '下面是我的体重记录（近 30 天，共 '+st.n+' 条）。');
  s.push('★ 只给日期与数值：不含备注，也不含每天的热量缺口明细。');
  s.push('');
  st.recs.forEach(function(r){
    s.push(r.date+'　体重 '+U.num(r.weight).toFixed(1)+' kg'+
           (r.fat?('　体脂 '+U.num(r.fat).toFixed(1)+'%'):''));
  });
  s.push('');
  s.push('【我已经算好的派生数据 · 直接引用，不要重算】');
  s.push('- 最新 BMI：'+(st.bmi?st.bmi.toFixed(1):'—')+'（页面分档：'+st.band+'）');
  s.push('- 区间变化：'+U.num(st.first.weight).toFixed(1)+' → '+U.num(st.last.weight).toFixed(1)+
         ' kg（累计 '+(d>=0?'+':'')+d.toFixed(1)+' kg）');
  s.push('- 近 7 天热量缺口合计：'+st.kcal7+' kcal（约等于 '+(st.kcal7/7700).toFixed(2)+' kg 脂肪）');
  s.push('- 记录跨度：'+st.span);
  s.push('');
  s.push('请基于上面的数据，说说体重 / 体脂这段时间大概是什么走势，以及有哪些可能的影响因素。');
  s.push('★ 四条红线（违反即整段作废）：');
  s.push('1. 不许写入或修改我的任何记录字段 —— 你没有写入权限，也不要建议我修改或补录（尤其是热量缺口 deficit）。');
  s.push('2. 不许给我生成目标体重 / 目标体脂 / "你应该减到 X kg"这类数字 —— 目标是我自己的事；页面已有自己的 BMI 分档口径，你按别的标准算出来的会和它不一致。');
  s.push('3. 不许推荐任何运动动作 / 康复动作 / 拉伸方案 —— 你不知道我的伤病和禁忌。');
  s.push('4. 不许给饮食处方 / 食谱 / 具体克数 —— 我的饮食记录目前只是占位入口，没有结构化数据支撑。');
  s.push('★ 其它硬约束：');
  s.push('5. 不许编造我没记录过的数字。体重 ±1kg 上下的波动是正常水分波动，不要据此下结论。');
  s.push('6. 这是"解读"不是"事实"。用"看起来""似乎"这类留余地的措辞。');
  if(st.n<5) s.push('7. 记录只有 '+st.n+' 条：开头先说"记录不多，趋势判断会比较粗略"，再做很轻的观察。');
  s.push('8. 输出用 Markdown 小标题分 2-3 段，300 字以内，不要开场白和客套话。');
  return s.join('\n');
}
