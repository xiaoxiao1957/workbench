/* 提醒：计算下一次发生的公历日期（不含提前量） */
function remOcc(r, from){
  from=from||new Date(); var f=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  var d=new Date(f);
  if(r.type==='birthday'){
    var cand;
    if(r.calendar==='lunar'){ cand=lunarToSolar(f.getFullYear(), r.month, r.day); if(!cand||cand<f) cand=lunarToSolar(f.getFullYear()+1, r.month, r.day); }
    else { cand=new Date(f.getFullYear(), r.month-1, r.day); if(cand<f) cand=new Date(f.getFullYear()+1, r.month-1, r.day); }
    return cand;
  }
  if(r.type==='contact' || (r.type==='cycle'&&r.freq==='week')){
    var wd=(r.type==='contact')?r.wday:(r.wday!=null?r.wday:1);
    var diff=(wd - f.getDay()+7)%7;
    return new Date(f.getFullYear(),f.getMonth(),f.getDate()+diff);
  }
  if(r.type==='cycle'&&r.freq==='month'){
    var md=r.mday||1;
    d=new Date(f.getFullYear(),f.getMonth(),md); if(d<f) d=new Date(f.getFullYear(),f.getMonth()+1,md);
    return d;
  }
  if(r.type==='cycle'&&r.freq==='year'){
    d=new Date(f.getFullYear(),(r.month||1)-1,r.day||1); if(d<f) d=new Date(f.getFullYear()+1,(r.month||1)-1,r.day||1);
    return d;
  }
  return null;
}

  recExpress:function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
      U.toast('当前浏览器不支持录音，请改用「上传录音」','err'); return;
    }
    if(UI.__rec){ try{ UI.__rec.stop() }catch(e){} return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mr=new MediaRecorder(stream), chunks=[];
      mr.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data) };
      mr.onstop=function(){
        try{ stream.getTracks().forEach(function(t){ t.stop() }) }catch(e){}
        var blob=new Blob(chunks,{type:'audio/webm'}), r=new FileReader();
        r.onload=function(){
          var id=U.uid();
          S.files=S.files||{}; S.files[id]={id:id,name:'录音-'+U.today()+'.webm',mime:blob.type||'audio/webm',type:'audio',size:blob.size,createdAt:U.now(),data:r.result};
          DRAFT_FILES['express']=DRAFT_FILES['express']||[]; DRAFT_FILES['express'].push(id);

  /* AI技巧：收藏 → 写入最下方的「提示词模板 & 使用技巧库」（S.tips），再次点击取消收藏
     第五轮 A-1：原来不管什么内容都写死 cat:'实用技巧'，导致「提示词模板库」Tab 永远为空。
     现在按该条的 kind 落到对应分类：提示词模板 / 实用技巧。
     老收藏（没有 kind 的）不受影响，仍在原分类里。 */
  /* 第五轮修复 1：原来不管 kind 是什么，一律写进 S.tips。
     但 VIEWS.aiguide 里两个 Tab 读的是两个不同数组 ——
       「提示词模板库」→ S.prompts，「使用技巧心法」→ S.tips
     存错数组了，所以带「提示词模板」分类的内容全躺在 S.tips 里，提示词模板库永远为空。
     现在按 kind 分流写入；取消收藏时两个数组都查，否则取消模板类收藏会找不到。 */
  aigFavTip:function(){
    var t=UI.aigTip; if(!t) return;
    S.tips=S.tips||[]; S.prompts=S.prompts||[];
    function idxOf(arr){ for(var i=0;i<arr.length;i++){ if(arr[i].title===t.title) return i } return -1 }
    var iP=idxOf(S.prompts), iT=idxOf(S.tips);
    if(iP>-1||iT>-1){
      if(iP>-1) S.prompts.splice(iP,1);
      if(iT>-1) S.tips.splice(iT,1);
      U.toast('已取消收藏','ok');
    } else {
      var isP=(aigTipCat(t)==='提示词模板');   /* 复用 aigTipCat，老数据（无 kind）仍走关键词兜底 */
      var rec={id:U.uid(),cat:isP?'提示词模板':'实用技巧',title:t.title,body:t.body,kind:t.kind||null,createdAt:U.now()};
      if(isP) S.prompts.unshift(rec); else S.tips.unshift(rec);
      U.toast('已收藏到「'+(isP?'提示词模板库':'使用技巧心法')+'」','ok');
    }
    afterChange();
  },
  aigTipNext:function(){
    var rest=AIG_TIPS.filter(function(x){ return !UI.aigTip||x.title!==UI.aigTip.title });
    UI.aigTip=rest[Math.floor(Math.random()*rest.length)]||AIG_TIPS[0];
    render();
  },

    else if(sc==='books'){ rows=S.books.map(function(b){ return {书名:b.title,作者:b.author||'',状态:b.status||'',评分:b.rating||'',进度:b.progress||'',短评:(b.review||'').replace(/\s+/g,' '),开始:(b.started||'').slice(0,10),读完:(b.finished||'').slice(0,10)} }) }
    else { rows=null }
    if(fmt==='csv'){
      if(sc==='all'){
        rows=[]; S.notes.forEach(function(n){ rows.push({类型:'学习笔记',标题:n.title,内容:n.content||''}) });
        S.excerpts.forEach(function(e){ rows.push({类型:'摘抄',标题:'',内容:e.text}) });
        S.books.forEach(function(b){ rows.push({类型:'读书',标题:b.title,内容:(b.review||'')}) });

      payload=JSON.stringify(o,null,2);

  doImportMerge:function(){

    var added=0;
    ['plans','goals','memos','express','books','inspires','notes','excerpts','prompts','tips','reminders','wrongs','videos','healthItems','healthTips'].forEach(function(k){
      if(!Array.isArray(o[k])) return;
      var have={}; S[k].forEach(function(x){ have[x.id]=1 });
      o[k].forEach(function(x){ if(x&&x.id&&!have[x.id]){ S[k].push(x); added++ } });
    });
    if(o.fitness&&Array.isArray(o.fitness.records)){
      var hd={}; S.fitness.records.forEach(function(r){ hd[r.date]=1 });
      o.fitness.records.forEach(function(r){ if(r&&!hd[r.date]){ S.fitness.records.push(r); added++ } });
    }
    if(Array.isArray(o.custom)){
      var hc={}; (S.custom||[]).forEach(function(c){ hc[c.id]=1 });
      o.custom.forEach(function(c){ if(c&&!hc[c.id]){ S.custom.push(c); added++ } });
    }
    UI.__import=null; closeModal(); afterChange(); U.toast('已合并导入 '+added+' 条','ok');
  },

  testNotify:function(){
    /* 修复：不再绕 NOTIFY.ask() 间接请求权限，改为直接调用 requestPermission()，
       避免 ask() 内部的权限竞态把"已授权"误判为"未授权"。 */
    // 1. Notification API 不可用
    if(typeof Notification === 'undefined'){
      U.toast('当前浏览器不支持通知 API，请升级浏览器或检查安全设置','err');
      return;
    }
    // 2. 已授权：直接发送
    if(Notification.permission === 'granted'){
      /* fire 现在优先走 SW，是异步的，必须用回调拿结果 */
      NOTIFY.fire('工作台测试提醒','如果你看到这条系统通知，说明推送链路正常。','test', function(ok){
        U.toast(ok ? '已发送测试通知，请在通知栏查看' : '通知发送失败，请看控制台日志', ok?'ok':'err');
        render();
      });
      return;
    }
    // 3. 已被拒绝：给出明确的人工开启路径
    if(Notification.permission === 'denied'){
      U.toast('通知权限已被拒绝。请在浏览器设置 → 站点设置 → 通知 → 允许','err');
      return;
    }
    // 4. 尚未决定（default）：主动弹出授权请求
    U.toast('正在请求通知权限，请在弹出的对话框中点击「允许」','');
    Notification.requestPermission().then(function(p){
      if(p === 'granted'){
        U.toast('通知权限已授权，正在发送测试通知…','ok');
        /* 延迟 300ms 确保 Notification.permission 属性已同步，再发通知 */
        setTimeout(function(){
          /* fire 现在优先走 SW，是异步的，必须用回调拿结果 */

    /* 第六轮修复 3：图文/文字条目的正文里常粘着一条小红书/抖音链接，
       以前只是纯文本，看得见点不动；现在自动渲染成可点击链接，并在底部给「在 APP 中打开」。 */
    var url=(t.url&&/^https?:\/\//i.test(t.url))?t.url:'';
    openModal(t.title,
      '<div class="hint" style="margin-bottom:10px">'+U.esc(t.cat||'')+' · '+hTypeLabel(t)+' · 来源 '+U.esc(t.source||'原创')+'</div>'+
      '<div style="white-space:pre-wrap;line-height:1.7;font-size:.94rem;word-break:break-word">'+autolink(t.body||'')+'</div>',
      '<button class="btn" data-act="closeModal">关闭</button>'+
      (url?'<button class="btn btn-primary" data-act="openTipInApp" data-id="'+t.id+'">'+svg('up','ic-sm')+' 在 APP 中打开</button>':''));
  },
  /* 复用问题 1 修好的跳转逻辑：有原始链接就先用链接唤起 APP */
  openTipInApp:function(d){
    var t=findIn(S.healthTips,d.id); if(!t) return;
    closeModal();
    openInApp({ title:t.title, t:t.title, cat:t.cat||'', url:t.url||'',
                kw:t.kw||t.title, plat:t.plat||t.source||'', source:t.plat||t.source||'' });
  },
  hMove:function(d){
    var t=findIn(S.healthTips,d.id); if(!t) return;
    openModal('移动分类','<div class="field"><label class="fl">选择新分类</label><select id="hmCat">'+HEALTH_TIP_CATS.filter(function(c){ return c!=='全部' }).map(function(c){ return '<option value="'+c+'"'+(t.cat===c?' selected':'')+'>'+c+'</option>' }).join('')+'</select></div>',
      '<button class="btn" data-act="closeModal">取消</button>'+
      '<button class="btn btn-primary" data-act="saveHealthTipCat" data-id="'+d.id+'">保存</button>');
  },
  saveHealthTipCat:function(d){
    var t=findIn(S.healthTips,d.id); if(!t) return;
    t.cat=val('hmCat'); afterChange(); closeModal(); U.toast('已移动','ok');
  }
};


/* ---------------- 26. 事件绑定 ---------------- */
function bind(){
  document.addEventListener('click', function(ev){
    var go=ev.target.closest?ev.target.closest('[data-go]'):null;
    var ac=ev.target.closest?ev.target.closest('[data-act]'):null;
    if(ac){
      ev.preventDefault();
      var fn=ACT[ac.getAttribute('data-act')];
      if(fn){
        var d={ id:ac.getAttribute('data-id'), v:ac.getAttribute('data-v'), k:ac.getAttribute('data-k'), t:ac.getAttribute('data-t'), i:ac.getAttribute('data-i') };
        /* 通用转发：把元素上其余的 data-* 属性一并带上（短横线转小驼峰，如 data-sid → d.sid）。
           原因：以前这里逐个登记 data-id/v/k/t/i，漏掉的 data-st / data-sid / data-s / data-c / data-d
           全是 undefined，导致 goSource 跳转、摘抄收录出处、练嘴素材打卡等动作静默失效。 */
        try{
          var ats=ac.attributes;
          for(var ai=0; ai<ats.length; ai++){
            var an=ats[ai].name;
            if(an.indexOf('data-')!==0 || an==='data-act') continue;
            var key=an.slice(5).replace(/-([a-z0-9])/g, function(_,c){ return c.toUpperCase() });
            if(d[key]===undefined) d[key]=ats[ai].value;
          }
        }catch(e){}
        fn(d, ac);
      }
      return;
    }
    if(go){ ev.preventDefault(); go2(go.getAttribute('data-go')); return }
    if(ev.target.id==='mask') closeModal();
  });
  /* 第六轮修复 4：输入即记草稿（防抖落盘）。input 在输入框上冒泡，
     一次委托覆盖全部模块的全部输入框，不需要逐个绑定。
     不进草稿的：密码 / 文件 / 日期 / 复选单选（见 isDraftable）。 */
  document.addEventListener('input', function(ev){
    var t=ev.target;
    if(!isDraftable(t)) return;
    draftSet(draftKeyOf(t), t.value==null?'':t.value);
  });
  /* 第七轮修复 3：粘贴分享文案时自动抠出链接、并把「来源」下拉框选到对应平台。
     一次委托覆盖 vUrl / htUrl / htBody，不需要等 DOM 重建后再逐个绑定。 */
  document.addEventListener('paste', function(ev){
    var t=ev.target; if(!t||!t.id) return;
    var cfg=PASTE_URL_FIELDS[t.id]; if(!cfg) return;
    var txt='';
    try{ txt=((ev.clipboardData||window.clipboardData).getData('text')||'') }catch(e){ txt='' }
    if(!txt) return;
    var u=extractUrl(txt);
    if(!u) return;                                   /* 没抠到链接 → 维持浏览器默认粘贴行为 */
    if(cfg.onlyIfPure){
      /* 正文框：只有「整段就光秃秃一个链接」时才搬到链接字段，有正文就不动，避免破坏用户写的字。
         注意：必须先判断再 preventDefault —— 否则「有正文」这种被拦掉了又不做处理，
         整段文字就凭空消失了（默认粘贴也被掐掉）。 */
      if(txt.trim()!==u) return;
      ev.preventDefault();
      var to=document.getElementById(cfg.to);
      if(to){ to.value=u; draftSet('#'+cfg.to, u) }
      t.value=''; draftSet('#'+t.id, '');
      var p2=syncPlatSelect(cfg.src, u);
      U.toast(p2?'链接已填入「链接」框，来源设为 '+p2:'链接已填入「链接」框','ok');
      return;
    }
    ev.preventDefault();
    t.value=u; draftSet('#'+t.id, u);
    var p=syncPlatSelect(cfg.src, u);
    U.toast(p?'已提取链接，来源设为 '+p:'已提取链接','ok');
  });
  /* change 事件委托：日期选择器 + 重复规则展开（避免在 IIFE 内联 onchange 不可用） */
  document.addEventListener('change', function(ev){
    var t=ev.target; if(!t) return;
    /* 下拉框在部分浏览器/输入法下不触发 input，这里补记一次草稿 */
    if(isDraftable(t)) draftSet(draftKeyOf(t), t.value==null?'':t.value);
    /* 第七轮修复 3：手填（非粘贴）链接时，也顺手把来源下拉框同步到识别出的平台 */
    var pcfg=PASTE_URL_FIELDS[t.id];
    if(pcfg&&!pcfg.onlyIfPure){
      var _p=platOfUrl(extractUrl(t.value));
      if(_p){
        var _sel=document.getElementById(pcfg.src);
        if(_sel&&_sel.value!==_p){ _sel.value=_p; draftSet('#'+pcfg.src, _p); U.toast('来源已自动设为 '+_p,'ok') }
      }
    }
    if(t.matches&&t.matches('.wk-pick input[type=checkbox]')){
      var lab=t.closest('.wk-pick'); if(lab) lab.classList.toggle('on', t.checked); return;
    }
    if(!t.id) return;
    if(t.id==='dayPicker'){ ACT.pickDay() }
    else if(t.id==='fitDayPicker'){ ACT.pickFitDay() }
    else if(t.id==='pRepeat'||t.id==='epRepeat'||t.id==='exRepeat'){ onRepeatChange(t) }
  });
  U.$('#moreClose').addEventListener('click', closeSheet);
  U.$('#sbTop').addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}) });
  /* 抽屉 / 折叠 */
  var fab=U.$('#sbFab'), mask=U.$('#sbMask'), handle=U.$('#sbHandle');
  if(fab) fab.addEventListener('click', toggleDrawer);
  if(mask) mask.addEventListener('click', closeDrawer);
  if(handle) handle.addEventListener('click', toggleCollapse);
  /* 全局悬浮添加按钮 */
  var gFab=U.$('#globalFab');
  if(gFab){
    gFab.addEventListener('click', function(ev){
      ev.stopPropagation();
      openFabMenu(gFab);
    });
  }
  document.addEventListener('keydown', function(ev){
    if((ev.ctrlKey||ev.metaKey) && ev.key==='.'){ ev.preventDefault(); var f=U.$('#globalFab'); if(f) f.click() }
  });
  /* 导航拖拽排序（桌面端拖拽 / 移动端用 ↑ 置顶） */
  var DRAG=null;
  document.addEventListener('dragstart', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el){ DRAG=el.getAttribute('data-go'); el.classList.add('dragging') }
  });
  document.addEventListener('dragend', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el) el.classList.remove('dragging');
    U.$$('.nav-item[data-go]').forEach(function(n){ n.classList.remove('drag-over'); n.style.boxShadow='' });
    DRAG=null;
  });
  document.addEventListener('dragover', function(e){
    if(!DRAG) return;
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el && el.getAttribute('data-go')!==DRAG){ e.preventDefault(); el.classList.add('drag-over') }
  });
  document.addEventListener('dragleave', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null; if(el) el.classList.remove('drag-over');
  });
  document.addEventListener('drop', function(e){
    if(!DRAG) return;
    e.preventDefault();
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    U.$$('.nav-item[data-go]').forEach(function(n){ n.classList.remove('drag-over'); n.style.boxShadow='' });
    if(el && el.getAttribute('data-go')!==DRAG){ reorderNav(DRAG, el.getAttribute('data-go')) }
    DRAG=null;
  });
  document.addEventListener('keydown', function(ev){
    var t=ev.target;
    if(!t||!t.id) return;
    var enter=ev.key==='Enter';
    var mod=ev.ctrlKey||ev.metaKey;
    if(enter&&!mod){
      if(t.id==='pTitle'){ ev.preventDefault(); ACT.addPlan() }
      else if(t.id==='nQ'){ ev.preventDefault(); ACT.searchNotes() }
      else if(t.id==='aiQ'){ ev.preventDefault(); ACT.searchAi() }
      else if(t.id==='bTitle'||t.id==='bAuthor'){ ev.preventDefault(); ACT.addBook() }
      else if(t.id==='exName'){ ev.preventDefault(); ACT.addEx() }
      else if(t.id==='qTitle'){ ev.preventDefault(); var b=U.$('[data-act="qAddSave"]'); if(b) b.click() }
      else if(t.id==='cmName'){ ev.preventDefault(); ACT.cmCreate() }
    }
    if(enter&&mod){
      if(t.id==='mText'){ ev.preventDefault(); ACT.addMemo() }
      else if(t.id==='iText'){ ev.preventDefault(); ACT.addInspire() }
      else if(t.id==='xText'){ ev.preventDefault(); ACT.addExc() }
      else if(t.id==='eRef'){ ev.preventDefault(); ACT.addExp() }
      else if(t.id==='cmText'){ ev.preventDefault(); var a=U.$('[data-act="cmAdd"]'); if(a) a.click() }
    }
    if(ev.key==='Escape'){ closeModal(); closeSheet() }
  });
  window.addEventListener('focus', function(){ if(S&&S.settings.notify.enabled) NOTIFY.check() });
  document.addEventListener('visibilitychange', function(){
    /* 第六轮修复 4：切后台先把草稿落盘（不等防抖），这样 APP 被强杀也丢不了；
       切回前台照常跨天检查 + 重绘，重绘后由 formRestore 把草稿回填。 */
    if(document.hidden){ flushDrafts(); return }
    rollover(); render();
  });
  /* 安卓返回键：抽屉优先关闭，再返回上一模块 */
  window.addEventListener('popstate', function(){
    if(U.$('#sidebar').classList.contains('on')){ closeDrawer(); return }
    if(U.$('#mask').classList.contains('on')){ closeModal(); return }
    if(U.$('#moreSheet').classList.contains('on')){ closeSheet(); return }
    if(UI.prevView && moduleById(UI.prevView)){ var p=UI.prevView; UI.prevView=null; goKeep(p) }
    else if(UI.view!=='daily'){ goKeep('daily') }
  });
}
function go2(v){
  if(v!=='settings'&&!moduleById(v)){ v='daily' }
  UI.prevView=UI.view; UI.__formFk=null;
  UI.view=v; closeSheet(); closeModal(); pushHist(); render({switchView:true});
}
function goKeep(v){
  if(v!=='settings'&&!moduleById(v)) v='daily';
  UI.__formFk=null;
  UI.view=v; closeSheet(); closeModal(); render({switchView:true});
}

/* ---------------- 27. 初始化 ---------------- */
function rollover(){
  if(!S) return;
  var T=U.today(), ch=false;
  S.plans.forEach(function(p){
    /* 模块四：运动计划联动任务不顺延。
       一条模板会预生成一整年（最多 400 条）的按日期任务，若沿用顺延逻辑，
       每过一天就会把「昨天没做的跑步」搬到今天，几周后就堆成几十条同名的今日任务。
       联动任务保持原日期，过期未完成的由 fitnessCleanup() 回收。 */
    if(p.sourceType==='fitness') return;
    if(!p.done&&p.date&&p.date<T){ p.date=T; ch=true }
  });
  var keys=Object.keys(S.notified||{}), kill=0;
  keys.forEach(function(k){ if(k.indexOf('@'+T)<0){ delete S.notified[k]; kill++ } });
  if(ch||kill) DB.write(S);
}
/* 第五轮 A-2：老用户一次性补齐。S.healthTips 是持久化数组，老用户库里只有原来的 6 条，
   单纯改 demoData() 对他们完全无效。这里按标题去重补一次，只补「内置种子」里缺的条目。
   用 __healthTipsV2 标记只跑一次 —— 之后用户手动删掉的内置条目不会再被塞回来。 */
/* 第五轮 B：老数据一次性迁移 —— 补 doneDates 种子 + 给视频打卡同步项补 sync 标记。
   只跑一次（__healthDoneV1），之后用户手动改的不受影响。 */
function healthDoneDatesMigrate(){
  if(S.__healthDoneV1) return 0;
  S.__healthDoneV1=1;
  var n=0;
  (S.healthItems||[]).forEach(function(h){
    if(!h.sync && h.name==='完成一次运动'){ h.sync='video'; n++ }
    if(!Array.isArray(h.doneDates)){ h.doneDates=h.lastDoneDate?[h.lastDoneDate]:[]; n++ }
  });
  return n;
}
function healthTipsTopup(){
  if(S.__healthTipsV2) return 0;
  S.__healthTipsV2=1;
  S.healthTips=S.healthTips||[];
  var have={}; S.healthTips.forEach(function(t){ have[t.title]=1 });
  var miss=demoData().healthTips.filter(function(t){ return !have[t.title] });
  if(!miss.length) return 0;
  S.healthTips=S.healthTips.concat(miss);
  return miss.length;
}
function init(){
  var raw=DB.read(), fresh=!raw;
  S=normalize(raw?raw:demoData());
  if(fresh){ DB.write(S) }
  rollover();
  /* 模块四：老数据迁移 —— 给尚无任何联动任务的运动计划模板补生成一次，
     避免出现「新模板走 S.plans、老模板走 done 布尔值」的混合口径。只跑一次（linked 标记）。 */
  try{
    var backfilled=fitnessBackfill();
    /* 滚动续排：保证未来 90 天都有任务（只补缺口，已存在的日期不重复生成） */
    var topped=fitnessMaintain();
    /* 裁剪：回收窗口由一年降到 90 天后多出来的未来预排任务（只裁可再生且未完成的） */
    var trimmed=fitnessTrimFuture();
    /* 开屏先回收一次过期联动任务：长期未打开时，否则首屏「逾期」会被一堆历史运动任务占满 */
    var cleaned=fitnessCleanup(false);
    /* 注意：清理/回填只改内存，必须显式写库，否则刷新后脏数据又回来了 */
    if(backfilled||topped||trimmed||cleaned){
      DB.write(S);
      if(backfilled) setTimeout(function(){ U.toast('已为 '+backfilled+' 项运动计划排入每日计划','ok') },1200);
      if(trimmed) console.log('ℹ️ 运动计划预排窗口收敛为 '+FIT_HORIZON+' 天，回收 '+trimmed+' 条超窗任务');
    }
  }catch(e){ console.warn('⚠️ 运动计划回填/续排/清理失败（不影响主功能）:', e&&e.message) }
  try{
    var hDone=healthDoneDatesMigrate(), htAdded=healthTipsTopup();
    if(hDone){ DB.write(S); console.log('ℹ️ 健康打卡历史记录已启用（doneDates），迁移 '+hDone+' 处') }
    if(htAdded){ DB.write(S); console.log('ℹ️ 健康 Tips 已补齐 '+htAdded+' 条（共 '+S.healthTips.length+' 条）') }
  }catch(e){ console.warn('⚠️ 健康 Tips 补齐失败（不影响主功能）:', e&&e.message) }
  var ui=DB.ui.get();
  /* 第六轮修复 4：恢复上次未提交的输入草稿（APP 被强杀重开也还在） */
  if(ui.drafts&&typeof ui.drafts==='object') UI.drafts=ui.drafts;
  if(ui.view&&(ui.view==='settings'||moduleById(ui.view))) UI.view=ui.view;
  if(S.settings.show[UI.view]===false) UI.view='daily';
  UI.dailyDate=U.today(); UI.calSel=U.today(); UI.fitDay=null;
  SYNC.status=S.settings.webdav.enabled?'idle':'off';
  bind(); applySidebarCollapsed(); render();
  /* 修复：原先只在初始化这一刻有权限才启动定时器。
     若用户当时还没授权（permission 为 default），定时器永远不会启动，
     必须刷新页面才行。这里改为：已授权则立即启动，否则注册轮询等授权。 */
  if(S.settings.notify.enabled){
    if(NOTIFY.can()){
      NOTIFY.start();
    }else{
      /* 每 5 秒检查一次权限，一旦授权成功就自动启动定时器。
         不设硬超时（原实现有 60 秒限制，用户晚于 1 分钟授权就失效了）。 */
      var checkPermInterval = setInterval(function(){
        /* 用户中途在设置里关掉提醒 → 停止轮询，不再无意义地空转 */
        if(!S.settings.notify.enabled){ clearInterval(checkPermInterval); return }
        if(NOTIFY.can()){
          clearInterval(checkPermInterval);
          NOTIFY.start();
          U.toast('通知权限已就绪，后台提醒已启动','ok');
        }
      }, 5000);
      /* 页面从后台切回前台时主动检查一次权限。
         修复要点：外层只判断 visibilityState，内层做一次 can() 判断即可，
         不要写成 if(!can()){ if(can()){...} } —— 那样内层永远不成立，是死代码。 */
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState !== 'visible') return;
        if(NOTIFY.timer) return;              // 定时器已在运行，无需重复启动
        if(!S.settings.notify.enabled) return;
        if(NOTIFY.can()){
          clearInterval(checkPermInterval);
          NOTIFY.start();
          U.toast('通知权限已就绪，后台提醒已启动','ok');
        }
      });
    }
  }
  if(!DB.ok) U.toast(DB.err,'err');
  else if(location.protocol==='file:') U.toast('当前是 file:// 本地打开，通知与 PWA 安装不可用，请改用 http/https 访问','err');
  else if(fresh) setTimeout(function(){ U.toast('已载入演示数据，可在设置里一键清空','ok') },600);
  /* PWA：注入 manifest + 注册 Service Worker（安卓添加到主屏幕后可走通知栏） */
  try{ PWA.boot() }catch(e){ console.warn('⚠️ PWA 初始化失败（不影响主功能）:', e&&e.message) }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
