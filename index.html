      '<div class="stat"><div class="s-lab">今日</div><div class="s-val">'+st.today+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本周</div><div class="s-val">'+st.week+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本月</div><div class="s-val">'+st.month+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本年</div><div class="s-val">'+st.year+'</div><div class="s-sub">次完成'+
        (st.archived?'<span title="已归档的历史完成数" style="opacity:.7"> · 含归档 '+st.archived+'</span>':'')+'</div></div>'+
    '</div></section>';
  /* -------- 模块五 · 我的运动计划「按天显示」 --------
     数据源：S.plans 中 sourceType==='fitness' && date===所选日期 的联动任务，
     与上方「打卡情况」统计同源；勾选直接走 ACT.togglePlan，统计天然实时同步。
     日期选择器 id 用 fitDayPicker（新起），与「今日记录」表单里的 fDate 完全独立，互不干扰。 */
  var day=UI.fitDay||T;
  var dd=U.diffDays(T, day);                       // 正数=未来天数，负数=过去天数
  var dayTag=day===T?'今天':dd===1?'明天':dd===-1?'昨天':(dd>0?dd+' 天后':(-dd)+' 天前');
  var PR={P0:0,P1:1,P2:2};
  var dayTasks=S.plans.filter(function(p){ return p.sourceType==='fitness' && p.date===day })
    .sort(function(a,b){
      var pa=PR[a.pri]===undefined?3:PR[a.pri], pb=PR[b.pri]===undefined?3:PR[b.pri];
      if(pa!==pb) return pa-pb;
      return (a.createdAt||'')<(b.createdAt||'')?-1:1;
    });
  var dayDone=dayTasks.filter(function(p){ return p.done }).length;
  var dayRows=dayTasks.map(function(p){
    var tpl=p.sourceId?findIn(F.plan,p.sourceId):null;
    return '<div class="item'+(p.done?' done':'')+'" data-p="'+(PR[p.pri]===undefined?1:PR[p.pri])+'">'+
      '<button class="cbx'+(p.done?' on':'')+'" data-act="togglePlan" data-id="'+p.id+'" aria-label="完成">'+svg('check')+'</button>'+
      '<div class="it-body"><div class="it-title">'+U.esc(p.title||'')+'</div>'+
      '<div class="it-meta">'+
        '<span class="badge b-'+String(p.pri||'P1').toLowerCase()+'">'+U.esc(p.pri||'P1')+'</span>'+
        (p.kcal?'<span>约 '+p.kcal+' kcal</span>':'')+
        (tpl?'<span class="tag">'+U.esc(tpl.freq||'一次性')+'</span>':'')+
        (p.doneAt?'<span class="hint-sm">'+U.esc(String(p.doneAt).slice(11,16))+' 完成</span>':'')+
      '</div></div></div>';
  }).join('');
  /* 空状态：当天与历史日期文案分开，避免出现「今天」这种错位的措辞 */
  var dayEmpty='<div class="empty"><div style="font-size:2rem;line-height:1" aria-hidden="true">🌿</div>'+
    '<p>'+(day===T?'今天没有安排运动，休息一下 🌿':U.cn(day)+'没有安排运动')+'</p>'+
    '<span class="hint-sm">'+(F.plan&&F.plan.length
      ? '可在下方「添加运动计划」里排一条，或切换日期看看其它天'
      : '在下方「添加运动计划」里加一项，就会自动排进这里')+'</span></div>';
  var dayPick='<div class="card-head" style="margin-bottom:12px"><div class="day-head">'+svg('calendar')+
      '<input type="date" id="fitDayPicker" class="day-picker" value="'+day+'">'+
      '<span class="day-tag">'+dayTag+' · 周'+WK[new Date(day+'T00:00:00').getDay()]+'</span>'+
      (dayTasks.length?'<span class="day-tag">'+dayDone+' / '+dayTasks.length+' 已完成</span>':'')+
    '</div><div class="spacer"></div>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="-1">前一天</button>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="0">今天</button>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="1">后一天</button></div>';
  /* 计划模板（管理区）：置顶 / 删除 / 老数据补打卡 */
  var planArr=F.plan.slice();
  planArr.sort(function(a,b){ var pa=a.pinned?1:0, pb=b.pinned?1:0; if(pa!==pb) return pb-pa; return 0 });
  var plan=planArr.map(function(p){
    /* 所选日期已有联动任务 → 状态只在上方「当日任务」里勾选，这里给一个只读状态框，
       避免同一条任务出现两个可点勾选框；所选日期不是执行日时：
       一次性/老数据保留可点勾选框（走 toggleEx 补打卡），重复计划显示只读的「本日不练」。 */
    var t=fitnessTaskOn(p.id, day);
    var lead;
    if(t) lead='<span class="cbx'+(t.done?' on':'')+'" style="cursor:default;opacity:.45" title="'+U.cn(day)+'已排期，请在上方当日任务里勾选">'+svg('check')+'</span>';
    else if(tplRep(p)) lead='<span class="cbx" style="cursor:default;opacity:.3" title="'+U.cn(day)+'不是该计划的执行日">'+svg('check')+'</span>';
    else lead='<button class="cbx'+(p.done?' on':'')+'" data-act="toggleEx" data-id="'+p.id+'" aria-label="补打卡">'+svg('check')+'</button>';
    var on=t?!!t.done:!!p.done;
    return '<div class="item'+(p.pinned?' pinned':'')+'">'+lead+
      '<div class="it-body"><div class="it-title'+(on?'" style="text-decoration:line-through;opacity:.6':'')+'">'+U.esc(p.name)+'</div>'+
      '<div class="it-meta"><span class="tag">'+U.esc(p.freq||'一次性')+'</span>'+(p.kcal?'<span>约 '+p.kcal+' kcal/次</span>':'')+
        (t?'<span class="badge b-'+(t.done?'p2':'p1')+'">'+(t.done?'已完成':'待完成')+'</span>':'<span class="hint-sm">'+U.cn(day)+'不练</span>')+'</div></div>'+
      '<div class="it-actions">'+menuBtn('fitplan',p.id)+'</div>'+
      menuPop('fitplan',p.id,[
        {label:(p.pinned?'取消置顶':'置顶'), act:'pinEx', icon:'top'},
        {label:'删除', act:'delEx', icon:'trash', danger:true}
      ])+'</div>';
  }).join('')||U.empty('fitness','还没有运动计划，在下方「添加运动计划」里加一项');
  var plan2Rows=(F.plan&&F.plan.length?'<div class="hint-sm" style="margin-top:10px">饮食记录 · 预留入口（占位，可在后续迭代直接接入）</div>':'');
  /* 模块五：页面顺序 = 打卡情况 → 我的运动计划（按天）→ 其它原有模块（顺序不变）→ 添加运动计划表单 */
  return ckStat+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('fire')+'我的运动计划</h3><div class="spacer"></div>'+
      '<button class="btn btn-sm" data-act="resetEx">重置本周勾选</button></div>'+
      dayPick+
      '<div class="list">'+(dayRows||dayEmpty)+'</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)">'+
        '<div class="card-head" style="margin-bottom:10px"><h3 style="font-size:.94rem">计划模板</h3>'+
        '<div class="spacer"></div><span class="hint-sm">置顶 · 删除 · 老数据补打卡</span></div>'+
        '<div class="list">'+plan+'</div></div>'+
    '</section>'+
    '<div class="grid g4" style="margin:18px 0">'+
      '<div class="stat"><div class="s-lab">'+svg('fitness','ic-sm')+'当前体重</div><div class="s-val">'+(last?last.weight+' <span style="font-size:.8rem;font-weight:400;color:var(--muted)">kg</span>':'—')+'</div>'+
        '<div class="s-sub '+(delta>0?'pos':'neg')+'">'+(recs.length>1?(delta>0?'累计 +':'累计 ')+delta.toFixed(1)+' kg':'开始记录')+'</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('info','ic-sm')+'BMI</div><div class="s-val">'+(bmi?bmi.toFixed(1):'—')+'</div><div class="s-sub">'+bmiTxt+'（身高 '+(pf.height||'—')+' cm）</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('target','ic-sm')+'距目标</div><div class="s-val '+(toTarget>0?'pos':'neg')+'">'+(last?(toTarget>0?toTarget.toFixed(1):'达成'):'—')+'</div><div class="s-sub">目标 '+(pf.targetWeight||'—')+' kg</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('fire','ic-sm')+'近 7 天缺口</div><div class="s-val neg">'+kcal7+'</div><div class="s-sub">约等于 '+(kcal7/7700).toFixed(2)+' kg 脂肪</div></div>'+
    '</div>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('board')+'近 30 天体重趋势</h3></div>'+U.lineChart(wPts,{dec:1})+
      (fPts.length>1?'<div class="card-head" style="margin-top:16px"><h3 style="font-size:.94rem">体脂率趋势 (%)</h3></div>'+U.lineChart(fPts,{dec:1,h:140}):'')+'</section>'+
    /* 批次六 · F1：体重趋势解读卡片。包一层 #fitTrendBox 供 fitTrendPaint() 局部重绘。 */
    '<div id="fitTrendBox">'+fitTrendHtml()+'</div>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>今日记录</h3></div>'+
      '<div class="row"><div><label class="fl">日期</label><input id="fDate" type="date" value="'+T+'"></div>'+
      '<div><label class="fl">体重 kg</label><input id="fW" type="number" step="0.1" inputmode="decimal" placeholder="68.5"></div>'+
      '<div><label class="fl">体脂 %</label><input id="fF" type="number" step="0.1" inputmode="decimal" placeholder="23.1"></div>'+
      '<div><label class="fl">热量缺口 kcal</label><input id="fD" type="number" inputmode="numeric" placeholder="400"></div></div>'+
      '<div class="row"><div style="flex:3"><input id="fN" placeholder="备注（可选）"></div>'+
      '<div style="flex:0 0 auto"><button class="btn btn-primary" data-act="addFit">'+svg('plus')+'保存记录</button></div></div>'+
      '<div class="row" style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)">'+
      '<div><label class="fl">身高 cm</label><input id="fH" type="number" inputmode="numeric" value="'+(pf.height||'')+'"></div>'+
      '<div><label class="fl">目标体重 kg</label><input id="fT" type="number" step="0.1" inputmode="decimal" value="'+(pf.targetWeight||'')+'"></div>'+
      '<div style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn" data-act="saveFitProfile">更新身体参数</button></div></div>'+plan2Rows+'</section>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>历史记录</h3></div><div class="list">'+rows+'</div></section>'+
    /* 模块五：添加表单独立成区，放在最下方，新增「起始日期」（目标日期）与「连续天数」（批量添加） */
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('plus')+'添加运动计划</h3>'+
      '<div class="spacer"></div><span class="hint-sm">添加后自动排进每日计划</span></div>'+
      '<div class="row"><div style="flex:2"><label class="fl">运动项目</label>'+
        '<input id="exName" placeholder="运动项目，如：慢跑 40 分钟"></div>'+
      '<div><label class="fl">约消耗 kcal</label><input id="exKcal" type="number" inputmode="numeric" placeholder="300"></div></div>'+
      '<div class="row" style="margin-top:10px">'+
        '<div><label class="fl">起始日期</label><input id="exDate" type="date" value="'+(UI.fitDay||T)+'"></div>'+
        '<div><label class="fl">连续天数</label><input id="exSpan" type="number" min="1" max="60" inputmode="numeric" placeholder="留空=默认"></div>'+
        '<div style="flex:0 0 auto;display:flex;align-items:flex-end">'+
          '<button class="btn btn-primary" data-act="addEx">'+svg('plus')+'添加计划</button></div></div>'+
      '<div class="repeat-box" style="margin-top:12px"><label class="fl">重复</label>'+repeatControlsHtml('ex', null)+
      '<span class="repeat-tip">「连续天数」= 从起始日起连续排几天，填 7 就是一次排一周。留空时：选了重复规则则自动展开一年，未选则只排起始日 1 条。选择「每周固定」可指定每周几执行；「重置本周勾选」会清空本周完成状态。</span></div></section>';
};

      '<div class="v-meta">'+(v.duration?'<span>⏱ '+v.duration+' 分钟</span>':'')+(v.author?'<span>'+U.esc(v.author)+'</span>':'')+

    '<div class="hint-sm" style="margin:10px 0 14px">内置公开跟练链接池（仅展示推荐，手动添加与收藏的视频在「锻炼打卡」Tab）。点击「刷新」随机换 10 条。</div>'+

      '<div class="hint">只存元数据（标题 / 链接 / 时长 / 备注），不下载视频文件。来自抖音 / 小红书 / B站 / YouTube / Keep 等平台都可。</div>'+
      '<div class="row" style="margin-top:10px"><div style="flex:2"><input id="vTitle" placeholder="视频名称（如：帕梅拉15分钟燃脂）"></div>'+
        '<div style="flex:0 0 auto;display:flex;align-items:center">'+AI.btn('video','AI 起标题')+'</div></div>'+
      '<div class="ai-weak" id="aiWeak_video"></div>'+
      '<div class="row" style="margin-top:8px"><div style="flex:3"><input id="vUrl" placeholder="视频链接（B站 / 抖音 / 小红书…）——可直接粘贴整段分享文案，会自动提取链接"></div>'+
        '<div><input id="vDur" type="number" min="1" placeholder="时长（分钟）"></div></div>'+
      '<div class="row" style="margin-top:8px"><div><select id="vCat"><option value="">选择分类</option>'+FIT_CATS.filter(function(c){ return c!=='全部' }).map(function(c){ return '<option value="'+c+'">'+c+'</option>' }).join('')+'</select></div>'+
        '<div>'+platSelect('vSrc','B站','')+'</div>'+
        '<div><input id="vAuth" placeholder="UP 主 / 作者"></div></div>'+

        '<textarea id="vBrief" placeholder="这条视频想讲什么？写清要点/素材，也可以带上受众和口吻。例：讲我踩过的 3 个坑——断碳、只吃沙拉、信零卡饮料；给久坐上班族听，轻松点，1分钟左右" style="min-height:72px"></textarea></div>'+

VIEWS.fitnessCheckin=function(){
  var T=U.today();
  var cat=UI.fitCheckinCat||'全部';
  var cats=FIT_CATS.map(function(c){ return '<div class="chip'+(cat===c?' on':'')+'" data-act="fitCheckinCat" data-v="'+c+'">'+c+'</div>' }).join('');
  var q=(UI.fitCheckinQ||'').toLowerCase();
  var list=(S.videos||[]).slice().sort(function(a,b){ return (b.addedAt||'')<(a.addedAt||'')?-1:1 });
  if(cat!=='全部') list=list.filter(function(v){ return v.cat===cat });
  if(q) list=list.filter(function(v){ return ((v.title||'')+' '+(v.cat||'')+' '+(v.author||v.source||'')+' '+(v.note||'')).toLowerCase().indexOf(q)>-1 });
  /* 本周打卡日历（最近 7 天） */
  var week=[]; for(var i=6;i>=0;i--) week.push(U.addDays(T,-i));
  var wkStats={}; week.forEach(function(d){ wkStats[d]=0 });
  (S.videos||[]).forEach(function(v){ Object.keys(v.checkins||{}).forEach(function(k){ if(wkStats[k]!=null) wkStats[k]++ }) });
  var wkHtml='<div class="grid g4" style="margin-bottom:14px">'+week.map(function(d){
    var has=wkStats[d]>0;
    return '<div class="stat" style="padding:10px"><div class="s-lab">'+U.cn(d).slice(5)+'</div><div class="s-val" style="font-size:1.4rem;color:'+(has?'var(--primary)':'var(--muted)')+'">'+wkStats[d]+'</div><div class="s-sub">次打卡</div></div>';
  }).join('')+'</div>';
  var rows=list.length?list.map(function(v){
    var days=Object.keys(v.checkins||{}).length;
    var last=days?(Object.keys(v.checkins).sort().reverse()[0]):'-';
    var todayCheck=v.checkins&&v.checkins[T];
    return '<div class="v-row"><div class="v-cover">'+svg('play','ic-sm')+'</div>'+
      '<div class="v-info"><div class="vt">'+U.esc(v.title)+'</div>'+
      '<div class="vm">'+U.esc(v.cat||'')+(v.author?' · '+U.esc(v.author):'')+(v.source?' · '+U.esc(v.source):'')+' · 累计 '+days+' 次'+(last!=='-'?' · 最近 '+U.cn(last):'')+'</div>'+
      '<div class="vm">'+srcTagHtml(v)+'</div></div>'+
      '<div class="v-act"><button class="icon-btn '+(todayCheck?'btn-primary':'')+'" data-act="vCheckin" data-id="'+v.id+'" title="'+(todayCheck?'今日已打卡':'打卡')+'">'+svg('check')+'</button>'+
      '<button class="icon-btn" data-act="playVideo" data-id="'+v.id+'" title="播放">'+svg('play')+'</button>'+
      menuBtn('video',v.id)+'</div></div>'+
      menuPop('video',v.id,[
        {label:'编辑', act:'vEdit', icon:'edit'},
        {label:'删除', act:'vDel', icon:'trash', danger:true}
      ]);
    }):U.empty('video','还没有视频，去「视频推荐」把喜欢的视频 ★ 收藏，或手动添加一条');
  return '<div class="row" style="margin-bottom:12px"><div style="flex:1"><input id="fcQ" placeholder="搜索标题 / 分类 / UP主…" value="'+U.esc(UI.fitCheckinQ||'')+'"></div>'+
    '<div style="flex:0 0 auto"><button class="btn" data-act="fitCheckinSearch">'+svg('search')+'搜索</button></div>'+
    '<div style="flex:0 0 auto"><button class="btn" data-act="fitCheckinClear">清空</button></div></div>'+
    '<div class="chips" style="margin-bottom:14px">'+cats+'</div>'+
    '<section class="card" data-mod="fitness" style="margin-bottom:18px"><div class="card-head"><h3>'+svg('calendar')+'本周打卡</h3><div class="spacer"></div><span class="hint-sm">运动自动同步至健康打卡</span></div>'+wkHtml+'</section>'+
    '<div>'+rows+'</div>';
};

/* ---------------- 13. 表达能力 ---------------- */
/* 每日练嘴素材池（表达练习短文 / 绕口令 / 即兴题目） */
/* 练习类型：一处定义，下拉和素材池共用。

  {title:'改变从当下开始', type:'朗读', level:'中级', text:'我们总喜欢说"等我有时间了就开始"。等周末再运动，等下个月再读书，等明年再学新技能。但真正拉开人与人差距的，就是那些不等的人。他们现在就开始，哪怕只做五分钟。'},
  {title:'学习的乐趣', type:'朗读', level:'初级', text:'很多人把学习当成任务，其实学习可以像拆盲盒——你不打开，永远不知道里面有什么惊喜。把"我必须学"换成"我想知道"，一切就轻了。'},
  {title:'面对镜头说一段开场白', type:'演讲', level:'中级', text:'先把你想讲的一句话精确到 15 字之内。镜头不会咬人，紧张可以让自我介绍变得更真诚；开场的三秒决定观众是否继续听下去。'},
  {title:'时间都去哪了', type:'朗读', level:'高级', text:'如果每天把最清醒的 90 分钟用于一件重要的事，30 天后你的状态会完全不同。重要的不是学了多久，而是什么时候学习。'},

  {title:'即兴吐槽练习', type:'即兴表达', level:'高级', text:'看到一段现象，30 秒准备，60 秒输出，5 秒金句收尾。先说现象→再说本质→最后提出一个让人思考的反问。'},
  {title:'训练绕口令：四是四', type:'绕口令', level:'初级', text:'四是四，十是十，十四是十四，四十是四十，舌头别打架。连续念三遍，每遍语速都比上一遍稍快。'},
  {title:'训练绕口令：牛郎恋刘娘', type:'绕口令', level:'中级', text:'牛郎恋刘娘，刘娘恋牛郎，牛郎年年恋刘娘。注意"牛"/"刘"互相切换的口型变化，先慢练后加速。'},
  {title:'解释一个抽象概念', type:'演讲', level:'高级', text:'把"区块链"用"全村记账本"讲给奶奶听。比喻要简单到任何人都能复述，而不是炫耀术语。'},
  {title:'用三句话总结一本书', type:'朗读', level:'中级', text:'一本书讲清楚这三句就够：核心问题 / 作者的答案 / 我的新认知。练写作，就是练这种压缩能力。'},
  {title:'说服一个人接受你的想法', type:'即兴表达', level:'高级', text:'结论先行 + 三个理由 + 一个反例。先说结果，再说支撑，最后主动承认一种反对意见。'},
  {title:'30 秒自我介绍', type:'演讲', level:'初级', text:'我是谁 + 我能做什么 + 我为什么在这里。三个动作语速均匀，总长度不超过 30 秒。'},
  {title:'讲一个失败经历', type:'即兴表达', level:'中级', text:'不讲自嘲，讲学习。从失败当时、做了哪些补救、今天的自己怎样了三段时间线出发。'},
  {title:'练习赞美别人', type:'对话沟通', level:'初级', text:'不要用"你很好"这种泛泛的话。要具体到对方的一个动作或一个细节，让对方立刻感觉到被看见。'},

VIEWS.express=function(){
  delete DRAFT_FILES['express']; UI.__formFk='express';
  var T=U.today();
  var list=S.express.slice().sort(function(a,b){ return a.date<b.date?1:-1 });
  var streak=0;
  for(var i=0;i<400;i++){
    var d=U.addDays(T,-i);
    if(S.express.some(function(e){ return e.date===d })) streak++;
    else if(i>0) break;
    else if(i===0) continue;
  }
  var mAvg=(function(){
    var m=list.filter(function(e){ return U.diffDays(e.date,T)<=30&&e.score });
    return m.length?(m.reduce(function(a,b){ return a+U.num(b.score) },0)/m.length):0;
  })();
  var mins=list.filter(function(e){ return U.diffDays(e.date,T)<=30 }).reduce(function(a,b){ return a+U.num(b.minutes) },0);
  var pts=list.slice(0,20).reverse().filter(function(e){ return e.score }).map(function(e){ return {v:U.num(e.score), l:(+e.date.slice(5,7))+'/'+(+e.date.slice(8,10))} });
  var typeCnt={};
  list.forEach(function(e){ typeCnt[e.type]=(typeCnt[e.type]||0)+1 });
  var segs=Object.keys(typeCnt).map(function(k){ return {n:k,v:typeCnt[k],c:U.colorOf(k)} });
  var rows=list.map(function(e){
    return '<div class="item" style="display:block"><div style="display:flex;gap:10px">'+
      '<div class="it-body"><div class="it-title">'+U.esc(e.title||e.type+'练习')+'</div>'+
      '<div class="it-meta"><span class="tag">'+U.esc(e.type)+'</span><span>'+U.cn(e.date)+'</span>'+
      (e.minutes?'<span>'+e.minutes+' 分钟</span>':'')+
      (e.score?'<span class="stars">'+'★'.repeat(Math.round(e.score/2))+'</span><span>自评 '+e.score+'/10</span>':'')+'</div>'+
      (e.audio?function(){ var af=getFile(e.audio); return af?('<div style="margin-top:8px"><audio controls preload="none" src="'+af.data+'" style="width:100%;height:34px"></audio></div>'):'' }():'')+
      (e.reflect?'<div style="margin-top:9px;padding:9px 11px;background:var(--card);border-radius:var(--r-sm);font-size:.85rem;color:var(--text);border-left:3px solid var(--primary)">'+U.esc(e.reflect)+'</div>':'')+
      '</div><div class="it-actions">'+menuBtn('express',e.id)+'</div></div>'+
      menuPop('express',e.id,[
        {label:'删除', act:'delExp', icon:'trash', danger:true}
      ])+'</div>';
  }).join('')||U.empty('express','还没有练习记录');
  return '<h1 class="sec-title">'+svg('express')+'表达能力</h1>'+
    '<p class="sec-sub">练习不在于时长，在于每次都留下一条具体的改进点。</p>'+
    (function(){
      /* AI 素材优先（只覆盖展示，不写 S）；没有就回落到内置池 */
      var isAI=!!(UI.aiMats&&UI.aiMats.length);
      var mats=isAI?UI.aiMats:(UI.expMats&&UI.expMats.length?UI.expMats:(UI.expMats=sampleArr(EXPRESS_POOL,5)));
      var T=U.today(), doneToday=S.express.some(function(e){ return e.date===T });
      return '<section class="card" data-mod="express" style="background:linear-gradient(180deg,rgba(140,154,77,.06),transparent)">'+
        '<div class="card-head"><h3>'+svg('express','ic-sm')+'每日练嘴小文章</h3>'+
        '<div class="spacer"></div>'+
        '<span class="tag" style="background:'+(doneToday?'rgba(140,154,77,.18)':'rgba(217,138,75,.18)')+';color:'+(doneToday?'var(--primary2)':'var(--warn)')+'">'+(doneToday?'✓ 今日已练习':'今日未练习')+'</span>'+
        '<button class="btn btn-sm" data-act="expRefresh">'+svg('refresh','ic-sm')+'换一批</button>'+
        '<button class="btn btn-sm btn-ai" data-act="aiMatsAsk"'+(UI.aiMatsBusy?' disabled':'')+'>'+
          (UI.aiMatsBusy?'<i class="ai-spin"></i>生成中…':svg('sparkle','ic-sm')+'AI 出素材')+'</button></div>'+
        '<div class="hint-sm" style="margin:0 0 8px">'+
          (isAI?svg('sparkle','ic-sm')+' <b>AI 针对你的反思出的一组素材</b>，刷新页面会回到内置素材'
               :'当前是内置素材（共 '+EXPRESS_POOL.length+' 条轮换）。'+
                (matsAutoOn()?'档位非「手动」时，每天首次进入会自动让 AI 出一组针对性的。':'当前档位为「手动」，点「AI 出素材」才会生成。'))+
        '</div>'+

              '<button class="exp-btn" data-act="expCopy" data-t="'+U.esc(m.text)+'">'+svg('copy','ic-sm')+'复制</button>'+
              '<button class="exp-btn" data-act="expEdit" data-t="'+U.esc(m.title)+'" data-d="'+U.esc(m.text)+'">'+svg('edit','ic-sm')+'编辑</button>'+
              '<button class="exp-btn exp-btn-ok" data-act="expUseMat" data-t="'+U.esc(m.title)+'" data-d="'+U.esc(m.text)+'">'+svg('check','ic-sm')+'完成</button>'+
            '</div></div>';
        }).join('')+'</section>';
    })()+
    '<div class="grid g4" style="margin-bottom:18px">'+
      '<div class="stat"><div class="s-lab">'+svg('fire','ic-sm')+'连续打卡</div><div class="s-val">'+streak+' <span style="font-size:.8rem;font-weight:400;color:var(--muted)">天</span></div><div class="s-sub">'+(S.express.some(function(e){return e.date===T})?'今天已完成':'今天还没打卡')+'</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('star','ic-sm')+'30 天平均自评</div><div class="s-val">'+(mAvg?mAvg.toFixed(1):'—')+'</div><div class="s-sub">满分 10 分</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('clock','ic-sm')+'30 天练习时长</div><div class="s-val">'+mins+'</div><div class="s-sub">分钟</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('board','ic-sm')+'累计次数</div><div class="s-val">'+S.express.length+'</div><div class="s-sub">次练习</div></div>'+
    '</div>'+
    '<section class="card" data-mod="express"><div class="card-head"><h3>'+svg('plus')+'今日打卡</h3></div>'+
      '<div class="row"><div><label class="fl">日期</label><input id="eDate" type="date" value="'+T+'"></div>'+
      '<div><label class="fl">类型</label><select id="eType">'+EXPRESS_TYPES.map(function(t){ return '<option>'+U.esc(t)+'</option>' }).join('')+'</select></div>'+

      '<div class="field"><label class="fl">练习主题</label><input id="eTitle" placeholder="例如：3 分钟自我介绍练习"></div>'+
      '<div class="field"><label class="fl">反思日志（今天哪里不好、下次怎么改）</label><textarea id="eRef" placeholder="气息不稳，长句容易断 → 下次提前标注换气点"></textarea></div>'+
      '<div class="field"><label class="fl">录音 / 音频（可选）</label>'+
        '<div class="fu-btns"><button class="btn btn-sm" data-act="pickFiles" data-fk="express" data-accept="audio/*">'+svg('upload','ic-sm')+'上传录音</button>'+
        '<button class="btn btn-sm" id="recExpBtn" data-act="recExpress">'+svg('mic','ic-sm')+'开始录音</button></div>'+

      '<button class="btn btn-primary btn-block" data-act="addExp">'+svg('check')+'完成打卡</button></section>'+
    (pts.length>1?'<section class="card" data-mod="express"><div class="card-head"><h3>'+svg('board')+'自评趋势</h3></div>'+U.lineChart(pts,{dec:0,h:150})+'</section>':'')+
    (segs.length?'<section class="card" data-mod="express"><div class="card-head"><h3>练习类型分布</h3></div><div class="grid g2" style="align-items:center">'+U.pie(segs,140)+
      '<div>'+segs.map(function(s){ return '<div class="prog-row"><div class="prog-top"><b>'+U.esc(s.n)+'</b><span>'+s.v+' 次</span></div><div class="bar"><i style="width:'+Math.round(s.v/list.length*100)+'%;background:'+s.c+'"></i></div></div>' }).join('')+'</div></div></section>':'')+
    '<section class="card" data-mod="express"><div class="card-head"><h3>练习与反思日志</h3></div><div class="list">'+rows+'</div></section>'+
    expressWeakHtml();
};
function expressWeakHtml(){
  var kws=weakKeywords();
  if(!kws.length) return '';
  return '<section class="card" data-mod="express"><div class="card-head"><h3>'+svg('warn','ic-sm')+'近期高频短板关键词</h3><div class="spacer"></div><span class="hint-sm">基于反思日志词频</span></div>'+
    '<div class="kw-cloud">'+kws.map(function(k){
      var fs=13+Math.min(11,k.n*2);
      return '<span class="kw" style="font-size:'+fs+'px">'+U.esc(k.w)+'</span>';
    }).join('')+'</div>'+
    '<div class="hint" style="margin-top:8px">出现越多，说明越该重点练。下次练习可专门挑 1 个词做针对性训练。</div></section>';
}
function starHtml(n, act, id){
  var out='';
  for(var i=1;i<=5;i++){
    out+='<span style="cursor:pointer;color:'+(i<=n?'var(--warn)':'var(--line)')+'" data-act="'+act+'" data-id="'+id+'" data-v="'+i+'">★</span>';
  }
  return '<span class="stars" style="font-size:1rem;letter-spacing:2px">'+out+'</span>';
}

/* ---------------- 16.5 心情日记 ----------------
   数据：S.moods（一天一条，再次点选 = 覆盖）/ S.thoughts（一天多条，带精确时刻）
   两个键都进了 normalize 白名单（老备份不崩）、mergeData 的 arrKeys（同步不丢）、
   clearDemo / clearAll 的清理名单（清空不残留）。 */
var MOODS_DEF=['😄','🥰','😌','😎','🥳','😴','😐','😔','😢','😠','😰','🤯'];
var MOODS_EXT=['😊','😇','😍','🤗','🤔','😳','🙃','🥲','😤','😱','🤒','😭'];
/* 刻意避开 🫡 🫠 这类 Unicode 14 才有的新表情：老安卓会渲染成豆腐块 */
var MOOD_NAME={'😄':'开心','🥰':'幸福','😌':'平静','😎':'得意','🥳':'兴奋','😴':'疲惫',
  '😐':'一般','😔':'低落','😢':'难过','😠':'生气','😰':'焦虑','🤯':'崩溃',
  '😊':'微笑','😇':'安心','😍':'心动','🤗':'温暖','🤔':'琢磨','😳':'尴尬',
  '🙃':'无奈','🥲':'苦笑','😤':'不服','😱':'吓到','🤒':'不舒服','😭':'大哭'};
/* 自定义表情校验。按「字符数（码点）」算，绝不能按字节 / 按 UTF-16 长度：
   组合表情 👨‍👩‍👧（7 个码点）、肤色变体 👍🏽、带变异选择符的 ❤️ 都是多码点，
   按字节截会截出半个 emoji 或一堆乱码。超长明确报错，绝不静默截断。 */
function moodEmojiErr(s){
  s=String(s==null?'':s).trim();
  if(!s) return '还没填表情';
  /* 先查非法字符，再查长度：贴了一串 HTML 进来时报「不能带符号」，
     比报「超长」更贴近用户的真实错误，也避免危险字符借长度校验蒙混过去。 */
  if(/[\u0000-\u001f\u007f]/.test(s)) return '里面混进了不可见的控制字符';
  if(/[<>"'`]/.test(s)) return '只能放表情，不能带 < > " \' 这类符号';
  var n;
  try{ n=[...s].length }catch(e){ n=Array.from(s).length }
  if(n>4) return '最多 4 个字符，你贴进来的是 '+n+' 个';
  return '';
}
function moodOf(date){
  var r=null; (S.moods||[]).forEach(function(m){ if(m.date===date) r=m }); return r;
}
function thoughtsOf(date){
  return (S.thoughts||[]).filter(function(t){ return t.date===date })
    .sort(function(a,b){ return (a.createdAt||'')<(b.createdAt||'')?-1:1 });
}
/* 回忆推送：匹配「日期号数相同」的历史条目（DD 相同，跨月跨年都算），
   即把「往年今日」+「过往同日」两条规则合成一条。
     为什么不能只认 MM-DD：月日相同的两条必然相隔整数年，
     那样「N 个月前的今天」这个文案永远不可能出现，第二条规则等于白写。
     改成按号数匹配后，3 月 8 日 / 6 月 8 日 / 去年 9 月 8 日都会被推出来。
   排序分两层：
     ① 天与天之间：离今天近的优先（近期回忆先出现，符合打开日记时的心理预期）
     ② 同一天多条想法：取「记录时刻」离当下时刻最近的那条（环形距离，跨 0 点也正确） */
function moodMemories(){
  var T=U.today(), dd=String(T).slice(8), byDay={}, out=[];
  if(!T||T.length<10) return out;
  function slot(d){ return byDay[d]||(byDay[d]={date:d, mood:null, ths:[]}) }
  /* mute：用户在回忆推送里点了「不再推送这条」。
     这是心理安全开关 —— 被翻出来的旧事未必都想再看一遍，
     尤其是负面情绪的记录，硬推等于把人按回当时的处境。 */
  (S.moods||[]).forEach(function(m){ var d=String(m.date||''); if(m.mute) return; if(d&&d<T&&d.slice(8)===dd) slot(d).mood=m });
  (S.thoughts||[]).forEach(function(t){ var d=String(t.date||''); if(t.mute) return; if(d&&d<T&&d.slice(8)===dd) slot(d).ths.push(t) });
  var n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
  Object.keys(byDay).sort().reverse().forEach(function(d){
    var it=byDay[d], best=null, bd=1e9;
    it.ths.forEach(function(t){
      var dt=new Date(t.createdAt); if(isNaN(dt)) return;
      var diff=Math.abs((dt.getHours()*60+dt.getMinutes())-nowMin);
      diff=Math.min(diff, 1440-diff);   /* 环形：23:58 与 00:03 相距 5 分钟，不是 1435 */
      if(diff<bd){ bd=diff; best=t }
    });
    out.push({date:d, mood:it.mood, thought:best, n:it.ths.length});
  });
  return out;
}
/* 被屏蔽的回忆：按「天」去重（一天可能同时有心情和多条想法） */
function moodMutedList(){
  var ds={};
  (S.moods||[]).forEach(function(m){ if(m.mute&&m.date) ds[String(m.date)]=1 });
  (S.thoughts||[]).forEach(function(t){ if(t.mute&&t.date) ds[String(t.date)]=1 });
  return Object.keys(ds).sort().reverse();
}
/* 屏蔽一整天：心情和想法一起 mute。
   只 mute 想法不 mute 心情的话，那天还会因为「有心情记录」继续被推出来，等于没屏蔽。 */
function moodMemMute(date){
  date=String(date||''); if(!date) return;
  (S.moods||[]).forEach(function(m){ if(String(m.date)===date) m.mute=true });
  (S.thoughts||[]).forEach(function(t){ if(String(t.date)===date) t.mute=true });
  afterChange();
  U.toast('已不再推送 '+U.cn(date)+' 的回忆','ok');
}
function moodMemUnmuteAll(){
  var n=0;
  (S.moods||[]).forEach(function(m){ if(m.mute){ delete m.mute; n++ } });
  (S.thoughts||[]).forEach(function(t){ if(t.mute){ delete t.mute; n++ } });
  afterChange(); U.toast(n?('已恢复 '+n+' 条记录的推送'):'没有被屏蔽的回忆', n?'ok':'');
}
function moodMemLabel(date){
  var T=U.today(), dd=U.diffDays(date,T);
  if(dd<=0) return '今天';
  var y=Math.floor(dd/365);
  if(y>=1) return y===1?'去年的今天':y+' 年前的今天';
  /* 月数用 round 不用 floor：号数相同的两条间隔都是整月长度，
     2 月 8 日 → 3 月 8 日 是 28 天，floor(28/30)=0 会说出「28 天前」，
     可用户的心智里这就是「一个月前」。 */
  var mo=Math.round(dd/30);
  if(mo>=1) return mo+' 个月前的今天';
  return dd+' 天前的今天';
}
/* ── 通用「⋯」操作菜单（第二批：全模块交互统一改造）──────────────────────
   为什么要抽成组件：十几个模块各写一套，必然出现改漏的那一次。
   心情日记的 moodThMenu 是最早实现的一套（已跑通 148 项），现在把它的逻辑
   提上来做统一实现，心情自己改走通用函数 —— 只保留 data-act="moodThMenu"
   这个名字，是为了让已有的心情测试继续打在原来的按钮上，不是两套实现。

   状态只有一个：UI.menu = '模块:条目id'。全局同时只允许一个菜单展开。
   各模块只传菜单项配置，不自己拼 HTML。 */
var _menuH=null;
function menuOff(){
  if(_menuH){ try{ document.removeEventListener('click',_menuH,true) }catch(e){} _menuH=null }
}
/* 开菜单的那一帧不注册，否则同一次点击会立刻把它关掉 */
function menuOutside(){
  menuOff();
  setTimeout(function(){
    menuOff();
    _menuH=function(e){
      var t=e.target;
      if(t&&t.closest&&(t.closest('.th-menu')||t.closest('[data-act="menu"]')||t.closest('[data-act="moodThMenu"]'))) return;
      menuOff();
      if(UI.menu){ UI.menu=''; render() }
    };
    document.addEventListener('click',_menuH,true);
  },0);
}
function menuIsOpen(m,id){ return UI.menu===m+':'+id }
function menuToggle(m,id){
  UI.menu=(UI.menu===m+':'+id)?'':(m+':'+id);
  UI.menuView=UI.menu?(UI.view||''):'';
  if(UI.menu) menuOutside(); else menuOff();
  render();
}
function menuBtn(m,id){
  return '<button class="icon-btn menu-btn" data-act="menu" data-m="'+U.esc(m)+'" data-id="'+U.esc(id)+'"'+
    ' aria-label="更多操作" title="更多" aria-expanded="'+(menuIsOpen(m,id)?'true':'false')+'">'+svg('more')+'</button>';
}
/* items: [{label, act, icon, danger, v, m, id, data}]
   —— v→data-v、m→data-m 是常用附加参数的快捷写法；
   —— id 存在时**覆盖**菜单按钮的 data-id（默认用菜单自己的 id）；
   —— data 是任意 data-* 的逃生舱：{k:'x'} → data-k="x"。
   为什么要有后两个：第二批接入时发现自定义模块条目这条链上，
   菜单的定位 id（cid+'|'+it.id，必须唯一，否则同一模块的所有条目会一起展开）
   和 cmDel 要读的参数（data-id=cid、data-t=it.id）不是一回事。
   与其去改 cmDel 的读法，不如让菜单生成的 data-* 和原来的按钮逐字一致 ——
   既有函数一行不动，风险最小。 */
function menuPop(m,id,items){
  if(!menuIsOpen(m,id)) return '';
  return '<div class="th-menu">'+(items||[]).map(function(it){
    var bid=(it.id!==undefined&&it.id!==null)?it.id:id, extra='';
    if(it.data) Object.keys(it.data).forEach(function(k){
      var vv=it.data[k];
      if(vv!==undefined&&vv!==null&&k!=='id') extra+=' data-'+k+'="'+U.esc(String(vv))+'"';
    });
    return '<button class="'+(it.danger?'dg':'')+'" data-act="'+U.esc(it.act)+'" data-id="'+U.esc(bid)+'"'+
      (it.v!==undefined&&it.v!==null?' data-v="'+U.esc(String(it.v))+'"':'')+
      (it.m!==undefined&&it.m!==null?' data-m="'+U.esc(String(it.m))+'"':'')+extra+'>'+
      svg(it.icon||'dot','ic-sm')+U.esc(it.label)+'</button>';
  }).join('')+'</div>';
}

/* ---------------- 16.4 M1 月度情绪回顾（批次五 · 阶段一） ----------------
   渲染函数：只依赖 UI.moodReview 与当前显示的月份（UI.moodMonth）。
   ★ 结果绑定月份：r.ym 与当前显示月份不一致时整个结果作废，翻到别的月不能还挂着上个月的结论。
   ★ 空月（UI.moodReview 为 null 或 ym 不匹配）→ 只显示按钮 + "未调用模型（零消耗）" 提示。
   ★ crisis → .crisis-box 渲染，且不给复制按钮（援助文案是后端给的确定性内容，不是用户原创）。
   ★ 本地重绘：结果区用 moodReviewPaint() 局部刷新，不走 render()（render 会重建整页 DOM）。 */
function moodReviewHtml(){
  var ym=UI.moodMonth||U.today().slice(0,7);
  var label=parseInt(ym.slice(0,4),10)+'年'+parseInt(ym.slice(5),10)+'月';
  var r=UI.moodReview, valid=(r&&r.ym===ym);
  var head='<section class="card" data-mod="mood"><div class="card-head"><h3>'+svg('mood')+label+' 情绪回顾</h3>'+
    '<div class="spacer"></div>'+AI.sceneBtn('moodReview','AI 月度情绪回顾','moodReviewAsk')+'</div>';
  if(!valid){
    return head+'<div class="hint-sm" style="margin-top:8px">未调用模型（零消耗）</div></section>';
  }
  if(r.busy) return head+'<div class="hint" style="margin-top:10px"><i class="ai-spin"></i> AI 正在回顾 '+label+'…</div></section>';
  if(r.crisis){                                        /* 后端判定的危机：文案由后端提供 */
    return head+'<div class="crisis-box" style="margin-top:10px">'+
      AI.aiOut(r.text||'（后端判定为危机场景，但未返回文案）','')+'</div></section>';
  }
  if(r.err) return head+'<div class="hint err" style="margin-top:10px">'+U.esc(r.err)+'</div></section>';
  var txt=String(r.text||'').trim();
  if(!txt) return head+'<div class="hint-sm" style="margin-top:8px">未调用模型（零消耗）</div></section>';
  /* 空数据：后端确定性占位文案（模型一次都没调），不给复制按钮 */
  if(r.empty) return head+'<div class="ai-out" style="margin-top:10px">'+U.esc(txt).replace(/\n/g,'<br>')+
    '</div><div class="hint-sm" style="margin-top:6px">'+label+' 没有记录，未调用模型（零消耗）</div></section>';
  return head+'<div class="ai-out" style="margin-top:10px">'+U.esc(txt).replace(/\n/g,'<br>')+
    '<div class="ai-acts" style="margin-top:8px">'+
      '<button class="btn btn-sm" data-act="moodRvCopy">复制回顾</button>'+
      '<button class="btn btn-sm" data-act="moodRvClear">清空</button></div></div></section>';
}

   ★ 不用 render()：render 会重建整页 DOM，正在 #thText 里打字的想法会被截掉一半。 */

/* ---------------- 16.5 随机漫步（批次一） ----------------
   flomo 的「随机回顾」是用户最爱的功能之一，而它其实不需要 AI —— 纯随机算法。
   数据来源直接复用全局搜索的 SEARCH_SRC（21 个源，统一 get/t/b），
   不需要为每个模块再写一遍聚合代码。跳转复用 gsGo 那套定位机制。 */
function wanderScopes(){
  var seen={}, out=[{id:'all', name:'全部'}];
  (typeof SEARCH_SRC!=='undefined'?SEARCH_SRC:[]).forEach(function(s){
    /* ★ 与 wanderPick 同一套排除规则：周期提醒没有具体日期，
       翻出来只会显示"某年某月某日"这种假日期，且点进去也定位不到。
       不排除的话，范围里会出现一个永远抽不出东西的死选项。 */
    if(String(s.v)==='reminder') return;
    var nm=String(s.m||s.v||'').split(' · ')[0];
    var key=String(s.v)+'|'+nm;
    if(seen[key]) return; seen[key]=1;
    out.push({ id:String(s.v), name:nm });
  });
  return out;
}
/* 抽一条。scope='all' 时全池等概率；否则只从该模块抽。
   ★ 排除 reminder：周期事件没有具体日期，随机翻出来没有"那年的今天"的感觉。 */
function wanderPick(scope){
  var pool=[];
  (typeof SEARCH_SRC!=='undefined'?SEARCH_SRC:[]).forEach(function(s,si){
    if(s.v==='reminder') return;
    if(scope&&scope!=='all'&&String(s.v)!==String(scope)) return;
    var arr=[]; try{ arr=s.get()||[] }catch(e){ arr=[] }
    arr.forEach(function(x){
      var t=String(s.t?s.t(x):'').trim();
      if(!t) return;
      pool.push({ si:si, id:x&&x.id?String(x.id):'', title:t.slice(0,120),
                  body:String(s.b?s.b(x):'').slice(0,400),
                  v:s.v, m:String(s.m||s.v),
                  date:String((x&&(x.date||x.createdAt||x.updatedAt||x.addedAt||x.at))||'').slice(0,10) });
    });
  });
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
VIEWS.wander=function(){
  var scopes=wanderScopes();
  var w=UI.wander;
  var scopesHtml='<div class="chips">'+scopes.map(function(s){
    return '<span class="chip'+(UI.wanderScope===s.id?' on':'')+'" data-act="wanderScope" data-v="'+U.esc(s.id)+'">'+U.esc(s.name)+'</span>';
  }).join('')+'</div>';
  var card;
  if(!w){
    card='<section class="card" data-mod="wander"><div class="empty">'+svg('shuffle')+
      '<p>点下面的按钮，随机翻出一条你记过的东西</p></div>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        '<button class="btn btn-primary" data-act="wanderRoll">'+svg('shuffle')+'抽一条</button>'+
      '</div></section>';
  }else{
    var ago='';
    if(w.date&&/^\d{4}-\d{2}-\d{2}$/.test(w.date)){
      var dd=U.diffDays(w.date,U.today());
      ago=dd<=0?'今天':(dd<30?dd+' 天前':(dd<365?Math.round(dd/30)+' 个月前':(Math.floor(dd/365)+' 年前')));
    }
    card='<section class="card" data-mod="wander">'+
      '<div class="card-head"><h3>'+svg('shuffle')+'翻到一条</h3><div class="spacer"></div>'+
      '<span class="tag">'+U.esc(w.m)+'</span>'+
      (ago?'<span class="chip">'+U.esc(w.date)+' · '+U.esc(ago)+'</span>':'')+'</div>'+
      '<div class="wand-title">'+U.esc(w.title)+'</div>'+
      (w.body?'<div class="wand-body">'+U.esc(w.body)+'</div>':'')+
      '<div class="row" style="margin-top:14px">'+
        '<button class="btn btn-primary" data-act="wanderRoll">'+svg('shuffle','ic-sm')+'换一条</button>'+
        '<button class="btn" data-act="wanderGo">'+svg('link','ic-sm')+'跳到原文</button>'+
        '<button class="btn" data-act="wanderCopy">'+svg('copy','ic-sm')+'复制</button>'+
      '</div></section>';
  }
  return '<h1 class="sec-title">'+svg('shuffle')+'随机漫步</h1>'+
    '<p class="sec-sub">从你记过的所有东西里随机翻出一条。没有算法推荐，只有偶然——很多时候，正是"偶然翻到"的那条最有用。</p>'+
    scopesHtml+card+
    '<section class="card" data-mod="wander"><div class="hint">'+svg('info','ic-sm')+
    '数据来源与「全局搜索」同一套（21 个源），覆盖 15 个模块，不含周期提醒。'+
    '<br>范围选「全部」时全池等概率；选定某个模块后只从该模块抽。</div></section>';
};

/* ---------------- 17.5 W1 错题薄弱点分析（批次六） ----------------
   ★ scene = insight（分析腔）。调研报告里写的「复用 guide」已过时：guide.system 是
     "攻略作者 / 输出分步骤"，会把分析写成"步骤一 步骤二"，和 M1 复用 review 被套
     5 段模板是同一个坑 —— system 权重高于 user prompt，前端 prompt 压不住。
   ★ 只喂统计值：q / wrong / correct 一条都不进 prompt。W1 要找的是模式不是读单题，
     而且喂了题面模型一定会照着题面编造「具体知识点」——那恰恰是统计值看不出来的东西。
   ★ demo 过滤：与 moodMonthText / insightInput 同一套闸门（!w.demo）。
   ★ 结果只读：只有「复制 / 清空」两个出口，没有任何写回 S.wrongs 的路径。
   ★ 结果区局部重绘（wrongAIPaint），不整体 render —— render 会重建搜索框，
     把用户正在输入的 wqQ 清掉。 */
function wrongAITop(obj,limit){
  var a=[];
  for(var k in obj){ if(Object.prototype.hasOwnProperty.call(obj,k)) a.push([k,obj[k]]) }
  a.sort(function(x,y){ return (y[1]-x[1])||((x[0]<y[0])?-1:(x[0]>y[0])?1:0) });
  return limit?a.slice(0,limit):a;
}
/* 返回 null = 没有可分析的错题（一条都没有，或全是示例数据）。 */
function wrongAIStats(){
  var arr=(S.wrongs||[]).filter(function(w){ return !w.demo });
  if(!arr.length) return null;
  var cause={}, subj={}, tag={}, reviewed=0, tagged=0;
  arr.forEach(function(w){
    cause[String(w.cause||'其他')]=(cause[String(w.cause||'其他')]||0)+1;
    var s=String(w.subject||'').trim(); subj[s||'未填科目']=(subj[s||'未填科目']||0)+1;
    var ts=(w.tags||[]).map(function(t){ return String(t||'').trim() }).filter(function(t){ return t });
    if(ts.length) tagged++;
    ts.forEach(function(t){ tag[t]=(tag[t]||0)+1 });
    if(w.reviewed) reviewed++;
  });
  return { n:arr.length, cause:cause, subject:subj, tag:tag, reviewed:reviewed, tagged:tagged };
}
function wrongAIStatsText(st){
  var L=[];
  L.push('- 错题总数：'+st.n+' 道（已复习 '+st.reviewed+' 道，复习率 '+Math.round(st.reviewed/st.n*100)+'%）');
  var c=wrongAITop(st.cause);
  L.push('- 错因分布：'+c.map(function(p){ return p[0]+' '+p[1]+' 道' }).join('、'));
  var s=wrongAITop(st.subject);
  L.push('- 科目分布：'+s.map(function(p){ return p[0]+' '+p[1]+' 道' }).join('、'));
  var t=wrongAITop(st.tag,12);
  /* 标签最多喂 12 个：不说明的话模型会以为看到的就是全部 */
  L.push('- 高频标签（最多 12 个）：'+(t.length?t.map(function(p){ return p[0]+'×'+p[1] }).join('、'):'没有打过标签'));
  return L.join('\n');
}
function wrongAIPrompt(st){
  var s=[];
  s.push('下面是我的错题本统计值（共 '+st.n+' 道）。');
  s.push('★ 我只给你统计值，不给题面原文 —— 我要找的是模式，不是讲题，你也讲不了。');
  s.push('');
  s.push(wrongAIStatsText(st));
  s.push('');
  s.push('请基于上面的统计值，帮我看看错题集中在哪些地方、可能反映什么薄弱点。');
  s.push('★ 硬约束（违反即整段作废）：');
  s.push('1. 只基于上面的统计数字说话。我没有给你题面，你也不知道具体是哪道题 —— 不许编造我没写过的知识点、题目、科目或数字。');
  s.push('2. 这是"解读"不是"事实"。用"看起来""似乎""从这些分布推测"这类留有余地的措辞，不要下"你就是 XX 不行"这种定性结论。');
  s.push('3. 不要给"多刷题""认真审题"这类空泛建议，也不要列具体的知识点清单或出题 —— 你不知道我具体错在哪道题上。');
  if(st.n<5) s.push('4. 本次只有 '+st.n+' 道错题，样本很少：开头必须先写一句"只有 '+st.n+' 道，分析会比较粗略"，然后只做很轻的观察，不要硬凑篇幅。');
  else       s.push('4. 不要逐条复述统计值（那部分我已经看过了），直接说这些数字意味着什么。');
  s.push('5. 输出用 Markdown 小标题分 2-3 段，300 字以内，不要开场白和客套话。');
  return s.join('\n');
}

  if(!st) return head+'<div class="hint-sm" style="margin-top:8px">还没有可分析的错题（示例数据不计入）。先录入几道再分析，未调用模型（零消耗）。</div></section>';

function remDaysInMonth(y,m){
  var map={};
  (S.reminders||[]).forEach(function(r){
    if(!r.enabled||r.archived) return;
    if(r.type==='birthday'){
      var d=r.calendar==='lunar'?lunarToSolar(y,r.month,r.day):new Date(y,r.month-1,r.day);
      if(d&&d.getFullYear()===y&&(d.getMonth()+1)===m) map[d.getDate()]=(map[d.getDate()]||0)+1;
    } else if(r.type==='contact'||(r.type==='cycle'&&r.freq==='week')){
      var wd=(r.type==='contact')?r.wday:(r.wday!=null?r.wday:1);
      for(var dd=1;dd<=31;dd++){ var dt=new Date(y,m-1,dd); if(dt.getMonth()!==m-1) continue; if(dt.getDay()===wd) map[dd]=(map[dd]||0)+1; }
    } else if(r.type==='cycle'&&r.freq==='month'){
      var md=U.clamp(r.mday||1,1,new Date(y,m-1,0).getDate()); map[md]=(map[md]||0)+1;
    } else if(r.type==='cycle'&&r.freq==='year'){
      if((r.month||1)===m) map[r.day||1]=(map[r.day||1]||0)+1;
    }
  });
  return map;
}
function remFromForm(id){
  var type=val('rType'), name=val('rName')||'提醒';
  var o={ id:id||U.uid(), type:type, name:name, desc:val('rDesc'), enabled:true, createdAt:U.now() };
  if(type==='birthday'){ o.calendar=val('rCal'); o.month=U.clamp(U.num(val('rMonth'),1),1,12); o.day=U.clamp(U.num(val('rDay'),1),1,31); o.aheadDays=U.clamp(U.num(val('rAhead'),0),0,30) }
  else if(type==='contact'){ o.freq='week'; o.wday=U.clamp(U.num(val('rWday'),0),0,6) }
  else { o.freq=val('rFreq'); if(o.freq==='week') o.wday=U.clamp(U.num(val('rWday'),0),0,6); else if(o.freq==='month') o.mday=U.clamp(U.num(val('rMday'),1),1,31); else { o.month=U.clamp(U.num(val('rYm'),1),1,12); o.day=U.clamp(U.num(val('rYd'),1),1,31) } }
  return o;
}

   目标：把「已启用且未归档」的提醒导出成 RFC 5545 日历文件，交给手机自带日历接管推送。
   全部纯 JS 字符串拼接 + Blob 下载，不引入任何第三方库。
   复用的既有能力：remOcc()（算下次发生日）、U.pad / U.today / U.num、U.download()（Blob 下载）。
   ------------------------------------------------------------------ */
var ICS_BYDAY=['SU','MO','TU','WE','TH','FR','SA'];   /* wday 0=周日 */
function icsStampUTC(d){
  return d.getUTCFullYear()+''+U.pad(d.getUTCMonth()+1)+''+U.pad(d.getUTCDate())+'T'+
         U.pad(d.getUTCHours())+U.pad(d.getUTCMinutes())+U.pad(d.getUTCSeconds())+'Z';
}
/* 浮动本地时间（不带 Z、不带 TZID）：手机日历会按本机时区解释，正是我们要的效果 */
function icsLocal(d,h){ return d.getFullYear()+''+U.pad(d.getMonth()+1)+''+U.pad(d.getDate())+'T'+U.pad(h)+'0000' }
/* RFC 5545 §3.3.11：文本里的反斜杠、分号、逗号、换行必须转义 */
function icsEsc(v){
  return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r\n|\r|\n/g,'\\n');
}
/* RFC 5545 §3.1：一行不超过 75 个八位组（不含 CRLF），续行以一个空格开头。
   按「字节」而非「字符」切，且只在 UTF-8 字节数组层面操作，绝不会把中文劈成乱码。 */
function icsBuild(lines){
  var enc=new TextEncoder(), chunks=[], CRLF=new Uint8Array([13,10]), SP=new Uint8Array([32]);
  lines.forEach(function(line){
    var a=enc.encode(line);
    if(a.length<=75){ chunks.push(a,CRLF); return }
    var off=0, first=true;
    while(off<a.length){
      var n=first?75:74, end=Math.min(off+n,a.length);
      if(!first) chunks.push(SP);
      chunks.push(a.subarray(off,end), CRLF);
      off=end; first=false;
    }
  });
  var total=0; chunks.forEach(function(c){ total+=c.length });
  var buf=new Uint8Array(total), p=0;
  chunks.forEach(function(c){ buf.set(c,p); p+=c.length });
  return buf;
}
/* 重复规则：生日/每年→YEARLY；每月→MONTHLY；每周/定期联系→WEEKLY(+BYDAY)；每日→DAILY */
function icsRRule(r){
  if(r.type==='birthday') return 'RRULE:FREQ=YEARLY';
  if(r.type==='contact')  return 'RRULE:FREQ=WEEKLY;BYDAY='+ICS_BYDAY[r.wday!=null?r.wday:0];
  if(r.type==='cycle'){
    var f=r.freq||'month';
    if(f==='day')   return 'RRULE:FREQ=DAILY';
    if(f==='week')  return 'RRULE:FREQ=WEEKLY;BYDAY='+ICS_BYDAY[r.wday!=null?r.wday:1];
    if(f==='month') return 'RRULE:FREQ=MONTHLY;BYMONTHDAY='+(r.mday||1);
    if(f==='year')  return 'RRULE:FREQ=YEARLY;BYMONTH='+(r.month||1)+';BYMONTHDAY='+(r.day||1);
  }
  return '';
}
/* 闹钟：默认当天 9:00；设了提前天数就落在「提前 N 天的 9:00」。
   事件是 00:00 起的全天语义，这里统一按 09:00 起算，所以偏移 = ahead*24-9 小时。 */
function icsTrigger(r){
  var ahead=Math.max(0, U.num(r.aheadDays,0));
  if(ahead<=0) return 'TRIGGER;RELATED=START:PT9H';
  var hours=ahead*24-9, d=Math.floor(hours/24), h=hours%24;
  if(d<=0) return 'TRIGGER;RELATED=START:-PT'+h+'H';
  return 'TRIGGER;RELATED=START:-P'+d+'D'+(h>0?'T'+h+'H':'');
}
function icsCount(){ return (S.reminders||[]).filter(function(r){ return r.enabled && !r.archived }).length }
function remToIcs(){
  var list=(S.reminders||[]).filter(function(r){ return r.enabled && !r.archived });
  if(!list.length){ U.toast('没有可导出的提醒（需「已启用」且未归档）','err'); return 0 }
  var stamp=icsStampUTC(new Date()), L=[], n=0;
  L.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WorkBench//Personal Worktable//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH');
  L.push('X-WR-CALNAME:'+icsEsc('工作台提醒'),'X-WR-TIMEZONE:local');
  list.forEach(function(r){
    var d=remOcc(r); if(!d) return;   /* 算不出下次日期的（缺字段等）直接跳过，不写坏事件 */
    var desc=[];
    if(r.desc) desc.push(r.desc);
    if(r.type==='birthday'){
      desc.push(r.calendar==='lunar'?'农历 '+r.month+' 月 '+r.day+' 日（公历日期每年不同，导入后请按年份核对）':'公历 '+r.month+' 月 '+r.day+' 日');
    }
    if(U.num(r.aheadDays,0)>0) desc.push('提前 '+r.aheadDays+' 天提醒');
    L.push('BEGIN:VEVENT','UID:'+r.id+'@workbench','DTSTAMP:'+stamp);
    L.push('DTSTART:'+icsLocal(d,9),'DTEND:'+icsLocal(d,10));
    var rr=icsRRule(r); if(rr) L.push(rr);
    L.push('SUMMARY:'+icsEsc(r.name||'提醒'));
    L.push('DESCRIPTION:'+icsEsc(desc.join('\n')));
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc((r.name||'提醒')+' 到时间了'),icsTrigger(r),'END:VALARM');
    L.push('END:VEVENT');
    n++;
  });
  if(!n){ U.toast('没有可导出的提醒（无法计算下次日期）','err'); return 0 }
  L.push('END:VCALENDAR');
  var ok=U.download('工作台提醒_'+U.today()+'.ics', icsBuild(L), 'text/calendar;charset=utf-8');
  if(!ok){ U.toast('导出失败，请检查浏览器下载权限','err'); return 0 }
  return n;
}
/* 第五轮 A-3：只换图标 / 配色 / title，动作名 remToggle、remArchive 与既有逻辑一律不动，
   因此老数据、老流程、事件委托全部不受影响。 */
/* 第二批：这两个按钮收进「⋯」菜单。动作名 remToggle / remArchive / remDelete 与
   既有逻辑一律不动，只是从「返回按钮 HTML」改成「返回菜单项配置」。 */
function remMenuItems(r){
  var items=[{label:'编辑', act:'editRem', icon:'edit'}];
  if(r.archived||!r.enabled) items.push({label:'重新启用提醒', act:'remToggle', icon:'bell'});
  else items.push({label:'停用提醒', act:'remToggle', icon:'bellOff'});
  /* 归档态才给「彻底删除」；未归档只给「归档」—— 两步才删得掉，不会手滑清空记录 */
  if(r.archived) items.push({label:'彻底删除', act:'remDelete', icon:'trash', danger:true});
  else items.push({label:'归档', act:'remArchive', icon:'archive'});
  return items;
}

/* 第五轮 A-2：健康 Tips 的 type 目前只有两种真实取值 ——
     text  = 纯文字（点开就是一段正文，没有配图）
     video = 视频（带 url，走统一播放弹窗）
   原实现把 text 标成「图文」，但点开只有文字、没有图，标签与内容不符。
   注意：现阶段**不支持 image 类型**（渲染 / 收藏 / 播放三条链路都只处理 text 与 video），
   所以下面如实标成「文字」，不再虚构「图文」。 */
function hTypeLabel(t){ return ((t&&t.type)==='video')?'视频':'文字' }
function hTypeTag(t){ return '<span class="tag'+(hTypeLabel(t)==='视频'?' green':'')+'">'+hTypeLabel(t)+'</span>' }
/* 第六轮修复 3：正文里的 http(s) 链接自动变成可点击的 <a>。
   先 U.esc 再做正则替换 —— 此时 & < > " ' 都已经是实体，插进 href 也不会被注入；
   末尾的中英文标点不计入链接，避免把「。」「）」一起吞进去。 */
function autolink(text){
  var s=U.esc(text==null?'':String(text));
  return s.replace(/(https?:\/\/[^\s<>"'，。；：！？、）)】》」』…]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* 第五轮 A-1：把一条 AI 技巧映射到它在【收藏】下的归属子页（提示词模板库 / 使用技巧心法）。
   只按 kind 判定；老数据没有 kind 时按标题关键词兜一次，避免老收藏被错误归类。 */
function aigTipCat(t){
  if(!t) return '实用技巧';
  if(t.kind==='prompt') return '提示词模板';
  if(t.kind==='tip') return '实用技巧';
  return /提问|提示词|prompt|追问|追加一句|截图/i.test(t.title||'')?'提示词模板':'实用技巧';
}
/* ===== 阶段二：AI 学习指南改成两级 tab（结构照 VIEWS.health / VIEWS.healthFav）=====
   一级 UI.aigTab ：rec 学习推荐 / fav 收藏
     学习推荐 = 系统推荐池（推荐学习视频 + 每日实用技巧），不放任何用户数据
     收藏     = 用户自己的数据（收藏视频 / 提示词模板库 / 使用技巧心法）
   二级 UI.aigFavTab（仅在「收藏」下）：video 收藏视频 / prompt 提示词模板库 / tip 使用技巧心法

   按**数据来源**区分，不按名字合并：
     「提示词模板 & 使用技巧库」= 用户收藏数据（S.prompts / S.tips）→ 归【收藏】
     「每日实用技巧」           = 系统每日推荐（AIG_TIPS）          → 归【学习推荐】

   数据零迁移：S.aigFavs.videos / S.prompts / S.tips 三个存储位置一个都没动，
   改的只是"在哪一页显示"，所以不存在"搬迁丢数据"的可能。
   唯一的新增动作是给老收藏视频补 id（ensureAigFavIds），属于"加字段"，不动已有字段。 */
function aigFavTab(){
  /* 老状态兼容：改造前 UI.aiTab 存的是 prompt / tip，这一层现在叫 aigFavTab。
     进入时搬一次，老用户的子 tab 位置不会跳。 */
  if(!UI.__aigTabMig){
    UI.__aigTabMig=true;
    if(UI.aiTab==='tip'||UI.aiTab==='prompt'){ UI.aigFavTab=UI.aiTab; UI.aiTab=null }
  }
  return UI.aigFavTab||'video';
}

/* ---------------- 20.5 PWA：Manifest / Service Worker / 安装引导 ---------------- */
/* 纯新增代码：不读取、不修改 S 里的业务数据，不触碰 save / 同步 / 渲染等既有逻辑。
   PWA.base 用页面所在目录而非写死 "/"，部署在根目录时计算结果就是 "/"，
   与规范一致；万一部署到子目录也不会因路径写死而 404。 */
var PWA={
  deferredPrompt:null,   // beforeinstallprompt 事件暂存，用户点击后手动触发
  swReg:null,
  swOk:false,
  base:(function(){ var p=location.pathname.replace(/[^/]*$/,''); return p||'/' })(),
  /* 是否已从桌面图标启动（standalone PWA 模式） */
  standalone:function(){
    try{
      if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) return true;
      if(window.navigator&&window.navigator.standalone===true) return true;  // iOS Safari
    }catch(e){}
    return false;
  },
  btn:function(){ return document.getElementById('installBtn') },
  show:function(){ var b=PWA.btn(); if(b) b.style.display='inline-flex' },
  hide:function(){ var b=PWA.btn(); if(b) b.style.display='none' },
  /* 设置页每次 render 都会重建 DOM，用它把按钮与状态文字恢复成当前应有的样子 */
  sync:function(){
    var b=PWA.btn(); if(!b) return;
    if(PWA.standalone()||!PWA.deferredPrompt) b.style.display='none';
    else b.style.display='inline-flex';
    var s=document.getElementById('pwaState');
    if(s) s.textContent=PWA.standalone()?'已安装':(PWA.deferredPrompt?'可安装':'未安装');
    var h=document.getElementById('pwaHint');
    if(h){
      h.textContent = PWA.swOk
        ? '离线缓存已就绪：断网也能打开，手机重启后桌面图标不会失效。'
        : '尚未启用离线缓存：请确认页面通过 HTTPS 访问，且 sw.js 与本页面放在同一目录下。';
    }
  },
  /* 第二轮修复：PWA.icon() 与 PWA.manifest() 已整体移除。
     原实现用 Canvas 画图标 + Blob URL 注入 manifest，但 Chrome 不会把 blob: 的 manifest
     和 data: 的图标识别为可安装 PWA，只能生成普通书签（重启后可能失效）。
     现在改为在 <head> 中静态引用真实文件 manifest.webmanifest 与 icon-192/512.png，
     让 Chrome 能正常生成 WebAPK。 */
  /* 注册 Service Worker：SW 必须是独立 .js 文件，无法用 Blob / 内联方式注册
     注册路径 = PWA.base + 'sw.js'：部署在站点根目录时即 '/sw.js'，
     与 sw.js 实际存放位置一致；子目录部署时也能自动跟随。 */
  register:function(){
    /* ④ 用 window.isSecureContext 代替 location.protocol!=='https:'。
       原因：http://localhost 同样属于安全上下文，但 protocol 是 'http:'，
       旧判断会把本地调试环境一并排除，导致 SW 永远注册不上。 */
    if(!('serviceWorker' in navigator) || !window.isSecureContext){
      console.warn('ℹ️ 当前环境不支持 Service Worker（需要 HTTPS 或 localhost），离线与推送功能不可用');
      return;
    }
    navigator.serviceWorker.register(PWA.base+'sw.js')
      .then(function(reg){
        PWA.swReg=reg; PWA.swOk=true;
        console.log('✅ Service Worker 注册成功:', reg.scope);
        /* 注册成功后，若之前已拿到延迟的安装提示再显示按钮，避免按钮闪烁 */
        if(PWA.deferredPrompt) PWA.show();
        PWA.sync();
      })
      .catch(function(err){
        /* 注册失败只影响离线与推送，不阻断主功能 */
        console.warn('⚠️ Service Worker 注册失败:', err&&err.message);
        PWA.sync();
      });
  },
  /* 用户点击「安装到桌面」 */
  install:function(){
    var dp=PWA.deferredPrompt;
    if(!dp){ U.toast('当前浏览器未给出安装提示，请用浏览器菜单「添加到主屏幕 / 安装应用」','err'); return }
    dp.prompt();   // 弹出系统安装对话框
    dp.userChoice.then(function(r){
      console.log('用户选择: '+(r&&r.outcome));
      if(r&&r.outcome==='accepted') U.toast('正在安装到桌面…','ok');
      PWA.deferredPrompt=null;   // 必须置空，否则无法再次触发
      PWA.hide();
    }).catch(function(){ PWA.deferredPrompt=null; PWA.hide() });
  },
  boot:function(){
    /* 第二轮修复：不再动态注入 manifest，直接用 <head> 里的
       <link rel="manifest" href="manifest.webmanifest"> 真实文件引用。 */
    if(PWA.standalone()) console.log('✅ 当前运行在 PWA 模式下（已从桌面图标启动）');
    else console.log('ℹ️ 当前在浏览器标签页中打开');
    PWA.register();
  }
};
/* 安装相关事件尽早挂载：Chrome 可能在页面 load 前后就触发 beforeinstallprompt */
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();       // 阻止 Chrome 自动弹出安装条
  PWA.deferredPrompt=e;     // 暂存事件，供「安装到桌面」按钮手动触发
  PWA.show();
});
window.addEventListener('appinstalled', function(){
  console.log('✅ PWA 已成功安装到桌面');
  PWA.deferredPrompt=null;
  PWA.hide();
});

/* ---------------- 全局搜索 ----------------
   19 个模块的数据各在各的数组里，找不到东西是最大痛点。

     否则搜出来的全是推荐内容，用户自己的东西反而被淹没。
   ★ tab 回调：跳转后要把模块的子页拨到位，不然那条藏在别的 tab 后面，
     用户点了跳转却看不见，等于没跳。 */
/* ══════════════════════════════════════════════════════════════════════════
 * AI 助手统一调用层（B1）
 * ══════════════════════════════════════════════════════════════════════════
 * 铁律（与后端 /api/ai 的契约一一对应）：
 *  ① AI 不可用时只给友好提示 —— 绝不抛异常、不白屏、不影响原有功能

 *  ③ 任何情况下按钮都必须恢复可用（finally 兜底）
 *  ④ 后端场景上限：title 150 / polish 800 / script 2500 / guide 4000 / plan 4000
 *  ⑤ 不出现任何模型名：前端只传 scene，选模型是后端的事（B2 设置页同）

 * 调用链（单向，无环）：
 *   ACT.aiAsk → AI.ask → AI.run → fetch /api/ai → AI.fill（只改 DOM，不调 render）
 * AI.fill 之后不触发 render()，避免输入框内容被重建时清掉。
 * ══════════════════════════════════════════════════════════════════════════ */
var AI_USAGE_KEY='wb_ai_usage_v1';

var AI={

    moodReview:{ scene:'mood', src:'', label:'AI 月度情绪回顾', empty:'' },
