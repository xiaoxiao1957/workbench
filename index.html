  usage:function(){
    try{
      var o=JSON.parse(localStorage.getItem(AI_USAGE_KEY)||'{}');
      if(!o || o.date!==U.today()) o={date:U.today(),neurons:0,calls:0,reminded:false};
      return o;
    }catch(e){ return {date:U.today(),neurons:0,calls:0,reminded:false} }
  },
  addUsage:function(n){
    try{
      var o=this.usage();
      o.neurons=Math.round(((o.neurons||0)+(Number(n)||0))*100)/100;
      o.calls=(o.calls||0)+1;
      localStorage.setItem(AI_USAGE_KEY,JSON.stringify(o));
      return o;
    }catch(e){ return this.usage() }
  },

  /* 复用同步密钥。没填就不带 —— 后端没设 SYNC_TOKEN 时照样能用。 */
  token:function(){
    var w=(S.settings&&S.settings.webdav)||{};
    return w.token||UI.__wdToken||'';
  },

  /* 统一的 AI 按钮 HTML。id 固定，方便 loading 时直接定位。 */
  btn:function(spot,label){
    var c=this.spots[spot]; if(!c) return '';
    return '<button class="btn btn-sm btn-ai" id="aiBtn_'+spot+'" data-act="aiAsk" data-spot="'+spot+'">'+
           svg('sparkle','ic-sm')+(label||'AI 帮我想')+'</button>';
  },

  ask:function(spot){
    var c=this.spots[spot]; if(!c) return;
    var el=U.$(c.src);
    var v='';
    if(typeof c.promptFor==='function') v=String(c.promptFor()||'').trim();
    else if(el) v=String(el.value||'').trim();
    if(!v){ U.toast(c.empty,'err'); if(el) el.focus(); return }
    this.run(spot,c,v,U.$('#aiBtn_'+spot));
  },

  /* ── 以下是 B2 新增 ────────────────────────────────────────── */

  /* 设置项：prefer（主力模型 id，空=后端自动）、threshold（用量提醒阈值）
     老数据没有 settings.ai，读的时候一律给默认值，不写 normalize 也能跑。 */
  /* 场景可用性探测。后端 GET /api/ai?op=models 会回 scenes 列表，
     前端据此判断 insight / review 是否真的存在 ——
     ★ 有了它，前后端谁先部署都行：后端还没上时入口直接置灰，
       而不是等用户点了才收到 400 unknown scene。 */
  sceneReady:function(id){
    if(!Array.isArray(UI.aiScenes)) return true;   /* 还没拉到列表：先放行，别一上来就灰 */
    for(var i=0;i<UI.aiScenes.length;i++){ if(UI.aiScenes[i].id===id) return true }
    return false;
  },
  sceneBtn:function(spot,label,act){
    var c=this.spots[spot]; if(!c) return '';
    if(!this.sceneReady(c.scene)){
      return '<button class="btn btn-sm" disabled title="后端还没部署这个能力（' + c.scene + '），部署后自动启用" '+
             'style="opacity:.5;cursor:not-allowed">'+svg('sparkle','ic-sm')+label+'</button>';
    }
    return '<button class="btn btn-sm btn-ai" data-act="'+act+'"'+(this.busy?' disabled':'')+'>'+
      (this.busy?'<i class="ai-spin"></i>生成中…':svg('sparkle','ic-sm')+label)+'</button>';
  },
  /* 思维框架列表来自 ?op=models 的 frameworks —— 后端加一个，前端按钮自动多一个，不写死。 */
  fwList:function(){ return Array.isArray(UI.aiFrameworks)?UI.aiFrameworks:[] },
  fwOrDefault:function(id){
    var l=this.fwList();
    for(var i=0;i<l.length;i++){ if(l[i].id===id) return l[i] }
    return l.length?l[0]:{ id:'', name:'默认洞察', desc:'', guard:null };
  },

  /* ── 批次二：洞察的数据聚合 ────────────────────────────────────────
     默认只吃「文本类」源：笔记 / 想法 / 灵感 / 摘抄 + 书评。
     其余（任务、打卡、错题、健康视频…）默认不选 —— 那些是流水数据是看不出"我在想什么"的。
     ★ moods 特殊处理：只有 emoji 没有文字，逐条喂给模型会被编成情绪叙事。
       所以这里只做**统计**（按 emoji 归类计数 + 日期分布），把统计结论当背景事实给模型，
       并在 insight scene 的 system 里明确禁止"逐个分析单个表情"。 */
  INSIGHT_SRC:[
    { k:'notes',   n:'学习笔记', on:true,  get:function(){ return (S.notes||[]).filter(function(x){ return !x.demo }).map(function(x){
        return { date:String(x.updatedAt||x.createdAt||'').slice(0,10), text:(x.title?x.title+'：':'')+String(x.content||'').replace(/[#*`>\-\[\]]/g,' ').trim() } }) } },
    { k:'thoughts',n:'想法',     on:true,  get:function(){ return (S.thoughts||[]).filter(function(x){ return !x.demo }).map(function(x){
        return { date:x.date||'', text:String(x.text||'') } }) } },
    { k:'inspires',n:'灵感记录', on:true,  get:function(){ return (S.inspires||[]).filter(function(x){ return !x.demo }).map(function(x){
        return { date:String(x.createdAt||'').slice(0,10), text:String(x.text||'') } }) } },
    { k:'excerpts',n:'摘抄本',   on:true,  get:function(){ return (S.excerpts||[]).filter(function(x){ return !x.demo }).map(function(x){
        return { date:String(x.createdAt||'').slice(0,10), text:String(x.text||'')+(x.source?'（出自'+x.source+'）':'') } }) } },
    { k:'books',   n:'书评',     on:true,  get:function(){ return (S.books||[]).filter(function(x){ return x.review && !x.demo }).map(function(x){
        return { date:String(x.updatedAt||'').slice(0,10), text:'读《'+x.title+'》：'+x.review } }) } },
    { k:'moods',   n:'心情（仅统计）', on:true, stat:true, get:function(){ return (S.moods||[]).filter(function(m){ return !m.demo }) } }
  ],
  insightSrcKeys:function(){
    var sel=UI.insightSrc||null;
    var a=[];
    this.INSIGHT_SRC.forEach(function(s){
      if(sel) { if(sel.indexOf(s.k)>=0) a.push(s) }
      else if(s.on) a.push(s);          /* 没手动选过就用默认勾选的那几个 */
    });
    return a;
  },
  /* 拼给模型的输入。返回 { text, n, byDate }：
     text 送去后端，n 是参与的记录条数（判断够不够 10 条），byDate 供结果页做「点开看那天」。
     ★ byDate 存在 UI 不进 S —— 它只服务当前这一次结果的展示，不该进备份、不该触发同步。 */
  insightInput:function(){
    var self=this, parts=[], n=0, byDate={};
    function push(date,mod,txt){
      if(date){ (byDate[date]=byDate[date]||[]).push(mod+' · '+txt) }
      return '- '+(date?date+' ':'')+'['+mod+'] '+txt;
    }
    var self=this;
    this.insightSrcKeys().forEach(function(s){
      if(s.stat) return;                       /* moods 走下面的统计分支 */
      var arr=[]; try{ arr=s.get()||[] }catch(e){ arr=[] }
      var lines=[];
      arr.forEach(function(x){
        var t=String(x.text||'').trim(); if(!t) return;
        lines.push(push(x.date||'', s.n, t.slice(0,300)));
        n++;
      });
      if(lines.length) parts.push('【'+s.n+'】\n'+lines.join('\n'));
    });
    /* 心情：只统计不逐条 */
    var hasMoodSrc=this.insightSrcKeys().some(function(s){ return s.stat });
    if(hasMoodSrc && (S.moods||[]).length){
      var cnt={}, tot=0;
      (S.moods||[]).forEach(function(m){
        var e=m.emoji||''; cnt[e]=(cnt[e]||0)+1; tot++;
      });
      var nm=self.MOOD_NAMES;
      var lines=Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a] }).map(function(e){
        return (nm[e]||e)+' '+cnt[e]+' 天';
      });
      parts.push('【心情统计】共记录 '+tot+' 天：'+lines.join('，')+'。'+
        '↑ 这是汇总数字，不代表每天都发生了什么，请只当作背景参考，不要逐条解读单个表情。');
      n+=tot;
    }
    return { text:parts.join('\n\n'), n:n, byDate:byDate };
  },
  /* ── 批次二：回顾的数据聚合 ────────────────────────────────────────
     日 / 周 / 月只是时间窗不同，聚合口径完全一致（这也是后端只做一个 scene 的原因）。
     compare=true 时额外返回 prev 窗口的文本，交给后端的 buildUser 拼成【本期】【上期】。 */
  reviewWindow:function(gran){
    var T=U.today();
    if(gran==='day')   return { start:T, end:T, label:'今天', days:1 };
    if(gran==='month') return { start:U.addDays(T,-29), end:T, label:'近 30 天', days:30 };
    return { start:U.addDays(T,-6), end:T, label:'近 7 天', days:7 };   /* week */
  },
  /* 存备忘用的粒度名。只有 3 个固定值，保证标签栏收敛。
     注意和 reviewWindow 的 label 区分开：那个是「近 7 天」这种给用户看的窗口描述，
     这个是「本周」这种进标签的粒度名 —— 混用会让标签出现「AI 回顾·近 7 天」这种别扭的写法。 */
  granLabel:function(gran){
    if(gran==='day') return '今日';
    if(gran==='month') return '近30天';
    return '本周';
  },
  /* 上期窗口。日=昨天、周=上一个 7 天、月=上一个 30 天 —— 长度与本期一致，
     否则「本周 vs 上周」会因为天数不同而得出假的结论（比如长假周对比工作周）。 */
  prevWindow:function(win,gran){
    var len=win.days||7;
    return { start:U.addDays(win.start,-len), end:U.addDays(win.start,-1),
             label:(gran==='day')?'昨天':(gran==='month')?'上一个 30 天':'上一个 7 天', days:len };
  },
  /* 回顾的输入。**结构上**就把「做过的事」和「想过的事」分开写，
     而不是混在一排 [标签] 里让模型自己去分辨 ——
     上一版事故：thoughts 里一句感悟被写成了"针对性能瓶颈进行了深度复盘"。
     想法就是想法，它不是行动；两段分开之后，模型想混也混不起来。 */
  reviewText:function(win){
    var self=this, act=[], think=[], byDate={};
    function inWin(d){ return d && d>=win.start && d<=win.end }
    function put(arr,d,label,txt){
      arr.push('- '+d+' '+label+' '+txt);
      (byDate[d]=byDate[d]||[]).push(label.replace(/[\[\]]/g,'')+' · '+txt);
    }
    /* ── 做过的事：真实发生过、留下痕迹的行为 ── */
    (S.plans||[]).filter(function(p){ return !p.demo }).forEach(function(p){
      var d=p.date||''; if(!inWin(d)) return;
      put(act,d,'[任务]',String(p.title||'')+(p.done?'（已完成）':'（未完成）'));
    });
    (S.notes||[]).filter(function(x){ return !x.demo }).forEach(function(x){
      var d=String(x.updatedAt||x.createdAt||'').slice(0,10); if(!inWin(d)) return;
      put(act,d,'[笔记]',String(x.title||'未命名'));
    });
    (S.excerpts||[]).filter(function(x){ return !x.demo }).forEach(function(x){
      var d=String(x.createdAt||'').slice(0,10); if(!inWin(d)) return;
      put(act,d,'[摘抄]',String(x.text||'').slice(0,160));
    });
    (S.books||[]).filter(function(x){ return x.review && !x.demo }).forEach(function(x){
      var d=String(x.updatedAt||x.createdAt||'').slice(0,10); if(!inWin(d)) return;
      put(act,d,'[书评]','读《'+String(x.title||'')+'》：'+String(x.review).slice(0,160));
    });
    (S.express||[]).filter(function(x){ return !x.demo }).forEach(function(x){
      var d=x.date||''; if(!inWin(d)) return;
      put(act,d,'[练习]',(x.type||'')+' '+(x.minutes||0)+' 分钟'+(x.score?' 自评 '+x.score+' 分':''));
    });
    (S.fitness&&S.fitness.records||[]).forEach(function(x){
      var d=x.date||''; if(!inWin(d)) return;
      put(act,d,'[体重]',(x.weight==null?'—':x.weight+'kg'));
    });
    /* ── 想过的事：感悟 / 闪念，明确不算行动 ── */
    (S.thoughts||[]).filter(function(x){ return !x.demo }).forEach(function(x){
      var d=x.date||''; if(!inWin(d)) return;
      put(think,d,'[想法]',String(x.text||'').slice(0,200));
    });
    (S.inspires||[]).filter(function(x){ return !x.demo }).forEach(function(x){
      var d=String(x.createdAt||'').slice(0,10); if(!inWin(d)) return;
      put(think,d,'[灵感]',String(x.text||'').slice(0,200));
    });
    /* ── 心情：只给汇总数字，不给逐日 emoji ──
       上一版把逐日 emoji 喂进去，模型立刻解读成"心态轻松/愉悦/懒散"。
       单日 emoji 支撑不了这种结论，所以这里只留统计。 */
    var moodStat='';
    if((S.moods||[]).length){
      var mc={}, tot=0;
      (S.moods||[]).filter(function(m){ return !m.demo }).forEach(function(m){
        var d=m.date||''; if(!inWin(d)) return;
        mc[m.emoji||'']=(mc[m.emoji||'']||0)+1; tot++;
      });
      if(tot){
        var parts=Object.keys(mc).sort(function(a,b){ return mc[b]-mc[a] }).map(function(e){
          return (self.MOOD_NAMES[e]||e)+' '+mc[e]+' 天';
        });
        moodStat='【心情统计】'+win.label+'共记录 '+tot+' 天：'+parts.join('、')+'。'+
          '\n↑ 这是按天汇总的数字，只当背景参考；不要解读单个表情，不要据此推断某天发生了什么。';
      }
    }
    /* 今天还没结束 —— 一天没过完，完成率低是正常的，不许拿它下结论 */
    var head='';
    if(win.end>=U.today()){
      var nd=new Date(), p2=function(n){ return (n<10?'0':'')+n };
      head='（注意：今天 '+U.today()+' 还没结束，当前 '+p2(nd.getHours())+':'+p2(nd.getMinutes())+
        '。涉及今天的部分只能说"截至目前完成了 X 项"，不要计算完成率或失败率。）\n\n';
    }
    var body='【做过的事】共 '+act.length+' 条\n'+(act.length?act.join('\n'):'（无）')+
      '\n\n【想过的事 · 这些是想法和感悟，不是已完成的行动】共 '+think.length+' 条\n'+
      (think.length?think.join('\n'):'（无）')+
      (moodStat?'\n\n'+moodStat:'');
    /* n 只数真实记录条数：不含标题行、不含心情统计段 —— 门槛判断和"共 N 条参与"都用它 */
    return { text:head+body, n:act.length+think.length, byDate:byDate };
  },
  /* emoji → 中文名。洞察和回顾共用同一张表，免得两处说法不一致 */
  MOOD_NAMES:{ '😄':'愉悦','😊':'不错','😐':'平静','😔':'低落','😢':'难过','😡':'生气',
               '🤯':'焦虑','😴':'疲惫','🥳':'兴奋','😌':'放松','🙏':'感激' },
  /* 把结果文本里出现的日期做成可点 chip —— 「聚类结果可点开看那天记了什么」。
     ★ 刻意不依赖模型的输出格式：不管它写 "2026-09-08" 还是 "9月8日"，
       只要文本里出现我们 byDate 里有的日期 key，就高亮成可点的。
       模型爱怎么排版都行，这层是前端确定性的。 */
  /* 作用在「已经渲染好的 HTML」上：只做日期替换 + chip 注入，不再转义。
     ★ 调用方必须保证传入的是已转义/已渲染的 HTML，否则有注入风险。 */
  linkDatesHtml:function(html,byDate){
    var keys=Object.keys(byDate||{}); if(!keys.length) return html;
    keys.forEach(function(d){
      var patterns=[d, d.slice(5).replace(/^0/,'')+'月'+(+d.slice(8,10))+'日'];
      patterns.forEach(function(p){
        if(!p) return;
        var re=new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
        html=html.replace(re,'@@D' + d + '@@');
      });
    });
    /* @@D<日期>@@ → 可点 chip。同一日期可能出现多次，全部点亮也没关系 */
    return html.replace(/@@D(\d{4}-\d{2}-\d{2})@@/g,function(_,d){
      return '<button class="dt-chip" data-act="insightDate" data-d="'+d+'" title="点开看这天记了什么">'+d.slice(5)+'</button>';
    });
  },
  linkDates:function(text,byDate){
    return this.linkDatesHtml(U.esc(String(text||'')),byDate);
  },
  /* 结果正文统一出口：先走内建 Markdown（U.md 内部先转义，零外链），再把日期点亮。
     ★ 顺序不能反 —— 先做 chip 的话，<button> 会被 U.md 当普通文本转义掉。 */
  aiOut:function(text,byDate){
    var src=String(text||''), h;
    try{ h=U.md(src) }catch(e){ h=U.esc(src) }
    return this.linkDatesHtml(h,byDate);
  },

  /* 把 AI 结果存进备忘录。批处理去重：同一段文本不重复存 ——
     用户连点两次「存为备忘」不会堆出两条一样的。 */
  saveMemo:function(text,tag){
    var t=String(text||'').trim();
    if(!t){ U.toast('没有可保存的内容','err'); return false }
    if(!Array.isArray(S.memos)) S.memos=[];
    for(var i=0;i<S.memos.length;i++){
      if(String(S.memos[i].text||'')===t){ U.toast('这条已经在备忘录里了','ok'); return false }
    }
    S.memos.unshift({ id:U.uid(), text:t, tags:[tag||'AI'], createdAt:U.now() });
    afterChange();
    U.toast('已存入备忘录','ok');
    return true;
  },

  cfg:function(){ return (S&&S.settings&&S.settings.ai)||{} },
  prefer:function(){ return this.cfg().prefer||'' },
  threshold:function(){ var n=Number(this.cfg().threshold); return (n>0)?n:8000 },
  /* AI 自动化档位（批次一）：
       A 手动   —— 所有 AI 都要用户点按钮才触发，最省、最可控
       B 建议制 —— 自动分析，但结果要用户点「采纳」才写入数据（默认）
       C 全自动 —— 后台静默跑
     ★ 档位只影响「是否自动发起请求」。会污染原始数据的动作（改记录、改 DDL、删改打卡）
       一律不受 C 档影响 —— 那是铁律，跟档位无关。 */
  autoLevel:function(){
    var lv=String((this.cfg().auto)||'').toUpperCase();
    return (lv==='A'||lv==='B'||lv==='C')?lv:'B';
  },

  /* 用量提醒：达阈值当天只提醒一次，跨天自动清零（usage() 已按天重置）。
     只 toast + 面板里标红，绝不拦截后续调用 —— 用户明确要「仅提示不拦截」。 */
  checkQuota:function(o){
    try{
      var thr=this.threshold();
      if((o.neurons||0)<thr || o.reminded) return;
      o.reminded=true;
      localStorage.setItem(AI_USAGE_KEY,JSON.stringify(o));
      U.toast('今日 AI 用量已达 '+Math.round(o.neurons||0)+' Neurons（提醒阈值 '+thr+'），还能继续用，只是提个醒','ok',4200);
    }catch(e){}
  },
  quotaHtml:function(){
    var o=this.usage(), thr=this.threshold(), n=Math.round((o.neurons||0)*10)/10;
    var pct=thr>0?Math.max(0,Math.min(100,Math.round(n/thr*100))):0;
    var over=n>=thr;
    return '<div class="ai-quota">今日 AI 用量 <b>'+n+'</b> / '+thr+' Neurons · '+o.calls+' 次调用'+
      '<div class="ai-bar'+(over?' over':'')+'"><i style="width:'+pct+'%"></i></div>'+
      (over?'<div style="color:var(--yellow-fg);margin-top:5px">已达今天的提醒阈值，仍可继续使用（阈值在设置里可改）</div>':'')+
      '</div>';
  },

  /* 全局助手：场景直接用后端已有的 5 个（后端一行不改的前提下能覆盖绝大多数提问）。
     没有独立的 chat 场景，通用提问走 guide（攻略式回答：分步骤、可执行）。 */
  chatScenes:[
    {id:'guide',  label:'通用解答'},
    {id:'plan',   label:'拆计划'},
    {id:'script', label:'写脚本'},
    {id:'title',  label:'起标题'},
    {id:'polish', label:'润色'}
  ],

  chat:function(){
    var inp=U.$('#aiInput');
    var q=inp?String(inp.value||'').trim():'';
    if(!q){ U.toast('先写下你想问什么','err'); if(inp) inp.focus(); return }
    /* 必须先挡在 UI.aiBusy=true 之前：否则 busy 时 call() 会直接 return，
       面板被自己置成 loading 却没有请求去收尾，就永远转圈了。 */
    if(this.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    UI.aiQ=q; UI.aiBusy=true; UI.aiAns=''; UI.aiErr='';
    this.chatRender();                       /* 先出 loading，绝不白屏 */
    var self=this;
    this.call('chat',{ scene:UI.aiScene||'guide', label:'AI 助手' },q,null,
      function(b){ self.onChatOk(b) },
      function(msg){ self.onChatFail(msg) });
  },
  onChatOk:function(b){
    UI.aiBusy=false;
    UI.aiAns=String(b.text||'').trim()||'（AI 这次没给出内容，换个问法再试一次）';
    UI.aiQuality=b.quality||'';
    this.chatRender();
    /* weak 小字：渲染完再填，因为 #aiWeak_chat 是这一次渲染才生成的 */
    var box=U.$('#aiWeak_chat');
    if(box&&b.quality==='weak') box.innerHTML=svg('info','ic-sm')+' 结果可能不太准，可重试';
  },
  onChatFail:function(msg){
    UI.aiBusy=false;
    UI.aiAns='';
    UI.aiErr=String(msg||'AI 暂时不可用');
    this.chatRender();
  },

  /* 面板渲染：只改 #aiBody，不调 render（render 会重建整个内容区并关掉浮层焦点） */
  chatRender:function(){
    var box=U.$('#aiBody'); if(!box) return;
    var clr=U.$('#aiClear'); if(clr) clr.classList.toggle('on', !!UI.aiQ);
    if(!UI.aiScene) UI.aiScene='guide';
    var h='<div class="ai-chips">'+this.chatScenes.map(function(s){
      return '<button class="ai-chip'+(UI.aiScene===s.id?' on':'')+'" data-act="aiScene" data-v="'+s.id+'">'+U.esc(s.label)+'</button>';
    }).join('')+'</div>';
    if(UI.aiBusy){
      h+='<div class="ai-msg"><div class="ai-load"><i class="ai-spin"></i>AI 正在思考…（复杂问题可能要十几秒）</div></div>';
    }else if(UI.aiAns){
      h+='<div class="ai-msg">'+
        '<div class="ai-ans">'+U.esc(UI.aiAns)+'</div>'+
        '<div class="ai-weak" id="aiWeak_chat"></div>'+
        '<div class="ai-acts">'+
          '<button class="btn btn-sm" data-act="aiCopy">复制结果</button>'+
          '<button class="btn btn-sm btn-ai" data-act="aiToMemo">存入备忘录</button>'+
          '<button class="btn btn-sm" data-act="aiRetry">再问一次</button>'+
        '</div></div>';
    }else if(UI.aiErr){
      h+='<div class="ai-msg"><div class="ai-ans" style="color:var(--danger)">'+U.esc(UI.aiErr)+'</div>'+
        '<div class="ai-acts"><button class="btn btn-sm btn-ai" data-act="aiRetry">重试一次</button></div>'+
        '<div class="ai-note">不影响其它功能，同步、备份、各模块照常可用。</div></div>';
    }else{
      h+='<div class="gs-tip">问什么都行：总结今天的安排、把一件事拆成步骤、写段文案、润色一段话。<br>'+
        '上面可以切换场景（拆计划 / 写脚本 / 起标题 / 润色），回车或点右边发送。</div>';
    }
    h+=this.quotaHtml();
    box.innerHTML=h;
  },

  /* 设置页的模型下拉：由 /api/ai?op=models 自动生成，后端加模型这里自动多一项。
     UI.aiModels 三态：undefined=没拉过 / null=拉取失败 / 数组=成功。 */
  /* 为什么不无条件自动拉：后端没部署时 /api/ai 是 404，
     浏览器控制台会留下「Failed to load resource」，用户每进一次设置页就多一条。
     所以：用过一次 AI（说明后端在）或用户手动点「读取可用模型」才发请求；
     拉失败过就本次会话不再自动重试，只留手动按钮。 */
  loadModels:function(force){
    if(!force){
      if(Array.isArray(UI.aiModels)) return;    /* 已成功 */
      if(UI.aiModels===null) return;            /* 已失败，等手动重试 */
      if(!UI.aiOk && !this.prefer()) return;    /* 还没用过 AI → 不主动打扰 */
    }
    UI.aiModels=null;
    var self=this, h={'accept':'application/json'};
    var tk=this.token(); if(tk) h['x-sync-token']=tk;
    fetch('/api/ai?op=models',{ headers:h }).then(function(r){ return r.json() }).then(function(j){
      UI.aiModels=(j&&j.ok&&Array.isArray(j.models))?j.models:null;
      /* 批次二：scenes / frameworks 一并收下。
         scenes  → 前端据此判断后端有没有 insight / review（部署顺序解耦）
         frameworks → 思维框架按钮自动遍历生成，后端加一个前端自动多一个 */
      if(j&&j.ok){
        if(Array.isArray(j.scenes)) UI.aiScenes=j.scenes;
        if(Array.isArray(j.frameworks)) UI.aiFrameworks=j.frameworks;
      }
    }).catch(function(){ UI.aiModels=null }).then(function(){ self.mountSettings() });
  },
  /* 批次二：开屏拉一次 scenes / frameworks。
     ★ 为什么开屏就拉，而不是等用户用到再拉：
       - op=models 只是列清单，不调模型、不耗 Neurons，成本≈0；
       - 但它是「入口该不该置灰」「框架按钮有几个」的唯一依据，
         等到点按钮才拉，框架区会一直停在"加载中…"—— 那不叫省请求，那叫坏体验。 */
  loadScenes:function(){
    if(Array.isArray(UI.aiScenes)&&Array.isArray(UI.aiFrameworks)) return;
    if(UI.__scenesFetching) return;
    UI.__scenesFetching=true;
    var self=this, h={'accept':'application/json'};
    var tk=this.token(); if(tk) h['x-sync-token']=tk;
    fetch('/api/ai?op=models',{ headers:h }).then(function(r){ return r.json() }).catch(function(){ return null }).then(function(j){
      UI.__scenesFetching=false;
      if(!j||!j.ok) return;
      var wasEmpty=!Array.isArray(UI.aiFrameworks);
      if(Array.isArray(j.scenes)) UI.aiScenes=j.scenes;
      if(Array.isArray(j.frameworks)) UI.aiFrameworks=j.frameworks;
      /* 顺手把模型列表也收下：同一次请求就有了，设置页不用再拉一遍 */
      if(Array.isArray(j.models)&&!Array.isArray(UI.aiModels)) UI.aiModels=j.models;
      /* 只在「框架列表刚从无到有」且人还在每日页时重绘一次。
         render() 自带表单快照/焦点恢复，正在打字也不会被打断。 */
      if(wasEmpty && UI.view==='daily') render();
    });
  },
  modelOptions:function(){
    var cur=this.prefer(), ms=UI.aiModels;
    if(!Array.isArray(ms)){
      return '<option value=""'+(cur?'':' selected')+'>自动（推荐）'+(ms===null?' —— 模型列表加载失败':' —— 模型列表加载中…')+'</option>'+
        (cur?'<option value="'+U.esc(cur)+'" selected>'+U.esc(cur)+'（已保存的选择）</option>':'');
    }
    var h='<option value=""'+(cur?'':' selected')+'>自动（推荐：主力失败自动降级）</option>';
    ms.forEach(function(m){
      var t=m.name||m.id;
      if(m.quality==='unstable') t+=' · 输出质量不稳定';
      if(!m.available) t+=' · 不可用（'+m.reason+'）';
      h+='<option value="'+U.esc(m.id)+'"'+(m.available?'':' disabled')+(cur===m.id?' selected':'')+'>'+U.esc(t)+'</option>';
    });
    return h;
  },
  modelNote:function(){
    var ms=UI.aiModels, cur=this.prefer();
    if(!Array.isArray(ms)){
      return ms===null
        ? '模型列表没读到：AI 接口可能还没部署。不影响同步与其它功能，下拉保持「自动」即可，也可以点下面「读取可用模型」再试一次。'
        : '还没读取：用过一次 AI 后会自动读取，也可以现在点下面「读取可用模型」。';
    }
    if(!cur) return '当前：自动（主力失败自动降级到备用模型）';
    for(var i=0;i<ms.length;i++){
      if(ms[i].id===cur){
        return '当前：'+ms[i].name+
          (ms[i].quality==='unstable'?' —— 输出质量不稳定，可能答非所问，不建议当主力':' —— '+ms[i].reason);
      }
    }
    return '当前：'+cur+'（后端已无此模型，建议改回「自动」）';
  },
  /* 只改设置页里的三个 DOM，不触发 render —— render 会重建整个设置页把输入框清空 */
  mountSettings:function(){
    var sel=U.$('#aiModel'); if(!sel) return;
    sel.innerHTML=this.modelOptions();
    var n=U.$('#aiModelNote'); if(n) n.textContent=this.modelNote();
    var u=U.$('#aiUseN'); if(u) u.textContent=String(Math.round((this.usage().neurons||0)*10)/10);
  },

  /* B2：run 保留原签名（三个「AI 帮我想」入口都在用它），内部转发到 call。
     全局助手复用同一个 call，只是把成功 / 失败回调换成聊天自己的渲染，
     这样 loading、超时、降级、用量埋点全都是一份逻辑，不会出现两套行为。 */
  run:function(spot,cfg,prompt,btn){ this.call(spot,cfg,prompt,btn,null,null) },

  /* extra（批次二新增，可选）：{framework, gran, compare} 这类 scene 自己的入参。
     不传就是老行为 —— 现有 6 个调用点一个都不用改。 */
  call:function(spot,cfg,prompt,btn,onOk,onFail,extra){
    if(this.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var self=this;
    this.busy=true;
    var html=btn?btn.innerHTML:'';
    if(btn){ btn.disabled=true; btn.innerHTML='<i class="ai-spin"></i>AI 想中…' }

    var ctrl=(typeof AbortController==='function')?new AbortController():null;
    /* 30 秒：先给一句人话提示（不中断，后端总预算 45 秒）；
       50 秒：真的没戏了，abort 掉，按钮必须还给用户。 */
    var tSlow=setTimeout(function(){
      if(btn) btn.innerHTML='<i class="ai-spin"></i>还在思考…';
      U.toast('AI 比平时慢，可能正在走备用通道，别急','ok');
    },30000);
    var tHard=setTimeout(function(){ if(ctrl) try{ ctrl.abort() }catch(e){} },50000);

    var h={'content-type':'application/json'};
    var tk=this.token(); if(tk) h['x-sync-token']=tk;

    /* prefer：设置页选的主力模型。留空 = 后端自动（主力失败自动降级）。
       前端只传 id，不传任何密钥，选谁跑是后端的事。 */
    var body={ scene:cfg.scene, prompt:prompt };
    var pf=this.prefer(); if(pf) body.prefer=pf;
    if(extra){ for(var ek in extra){ if(extra[ek]!==undefined&&extra[ek]!==null) body[ek]=extra[ek] } }

    var opt={ method:'POST', headers:h, body:JSON.stringify(body) };
    if(ctrl) opt.signal=ctrl.signal;

    fetch('/api/ai',opt).then(function(r){
      return r.json().catch(function(){
        return { ok:false, detail:'服务器返回了无法解析的内容（HTTP '+r.status+'）' };
      }).then(function(j){ return { status:r.status, body:j, hdr:r.headers } });
    }).then(function(res){
      /* ★ 响应一到就先解锁，再调 onOk —— onOk 里可能会 render()，
         如果带着 busy=true 去渲染，「生成中…」会一直挂在按钮上（批次二真机验证抓到的）。 */
      self.busy=false;
      var b=res.body||{};
      if(res.status>=400 || !b.ok){
        /* 后端保证过：全失败也是结构化 JSON + 友好文案，不会是裸错 */
        var em=b.detail||b.error||'AI 暂时不可用';
        U.toast(em,'err');
        if(b.fix) U.toast(b.fix,'err');
        if(onFail) onFail(em);
        return;
      }
      var o=self.addUsage(b.estNeurons);
      UI.aiOk=true;        /* 后端确实存在 → 设置页可以放心去读模型列表 */
      /* onOk 存在 = 全局助手（自己渲染结果区）；否则走原来的就地填充 */
      if(onOk) onOk(b); else self.fill(spot,cfg,b);
      /* 走了备用通道 → 小字提示，不打断操作 */
      if(b.degraded) U.toast('AI 已切换备用通道完成','ok');
      /* 输出质量存疑 → 就地小字，不报错、不阻塞（B2 文案统一为「可重试」） */
      var box=U.$('#aiWeak_'+spot);
      if(box) box.innerHTML=(b.quality==='weak')?(svg('info','ic-sm')+' 结果可能不太准，可重试'):'';
      if(b.quality==='weak') U.toast('结果可能不太准，可重试','ok');
      if(!onOk) U.toast('AI 已生成，看看合不合适','ok');
      /* 用量提醒：只提示一次，不拦截（阈值在设置页可改） */
      self.checkQuota(o);
    }).catch(function(e){
      self.busy=false;
      var msg=(e&&e.name==='AbortError')
        ? 'AI 暂时没响应（已等 50 秒），可以稍后再试'
        : 'AI 暂时不可用：' + String((e&&e.message)||e||'网络异常');
      U.toast(msg,'err');
      if(onFail) onFail(msg);
    }).then(function(){
      clearTimeout(tSlow); clearTimeout(tHard);
      self.busy=false;
      if(btn){ btn.disabled=false; btn.innerHTML=html }   /* ★ 无论如何都要还回去 */
    });
  },

  /* 填充结果：只改 DOM，不调 render（render 会重建输入框、清掉刚填的内容） */
  fill:function(spot,cfg,b){
    var text=String(b.text||'').trim();
    if(!text) return;
    if(spot==='video'){
      /* 场景约定：第一行标题，第二行标签。视频没有独立标签字段，
         标签追加进备注并在前面加「标签：」，不覆盖用户已有的备注。 */
      var lines=text.split(/\r?\n/).map(function(x){ return x.replace(/^[\-\d\.\s]+/,'').trim() }).filter(function(x){ return x });
      var t=U.$(cfg.src); if(t) t.value=lines[0]||text;
      if(lines.length>1){
        /* 注意：#vNote 是 <input>，不是 textarea —— input 的 value 里换行会被浏览器直接吞掉。
           所以用两个空格分隔，而不是 '\n'，否则标签会糊在原文末尾变成一坨。 */
        var n=U.$('#vNote');
        if(n) n.value=(n.value?n.value.replace(/\s*$/,'')+'  ':'')+'标签：'+lines.slice(1).join(' ');
      }
      return;
    }
    /* 新建弹窗（note）和编辑弹窗（noteEdit）走同一套：填回 textarea。
       B 档：填进输入框不算写入数据 —— 用户还得点「保存」才落库。 */
    if(spot==='note'||spot==='noteEdit'){
      var c=U.$(cfg.src); if(c){ c.value=text; if(c.dispatchEvent) try{ c.dispatchEvent(new Event('input',{bubbles:true})) }catch(e){} }
      return;
    }
    if(spot==='plan'){
      /* 拆解结果天然是多行，塞进单行输入框会被截断。
         改成内联结果卡：就地展示，逐条或一键加入计划，不弹窗不跳转。 */
      /* 剥序号：支持 "1." / "1、" / "- " / "第一步：" / "第二条：" 各种写法。
         分隔符必须是「可选」，否则 "第一步：列提纲" 里的中文冒号剥不掉，
         加进计划就变成 "第一步：列提纲" 这种带前缀的怪标题。 */
      var steps=text.split(/\r?\n/).map(function(x){
        return x.replace(/^\s*[\-\*•]+\s*/,'')
                .replace(/^\s*\d+[\.、\)．]\s*/,'')
                .replace(/^\s*第[一二三四五六七八九十百\d]+[步项条章节][\.、\)．:：]?\s*/,'')
                .trim();
      }).filter(function(x){ return x && x.length>0 });
      if(!steps.length) steps=[text];
      UI.aiSteps=steps; UI.aiStepsSrc='goal';   /* 区分于 D3 的「下周计划」，daily 视图据此决定是否显示"下周"提示 */
      UI.aiPlanPri=(U.$('#pPri')?U.$('#pPri').value:'P1')||'P1';
      UI.aiPlanDdl=(U.$('#pDdl')?U.$('#pDdl').value:'')||U.today();
      UI.aiPlanTime=(U.$('#pTime')?U.$('#pTime').value:'')||'';
      var box=U.$('#aiPlanBox');
      if(box) box.innerHTML=this.stepsHtml();
      return;
    }
  },

  stepsHtml:function(){
    var steps=UI.aiSteps||[];
    if(!steps.length) return '';
    var self=this;
    return '<div class="ai-steps">'+
      '<div class="ai-steps-hd">'+svg('sparkle','ic-sm')+'<span>AI 拆成 '+steps.length+' 步</span><span class="spacer"></span>'+
        '<button class="btn btn-sm btn-primary" data-act="aiStepsAddAll">全部加入计划</button>'+
        '<button class="btn btn-sm" data-act="aiStepsClear">清空</button></div>'+
      steps.map(function(s,i){
        return '<div class="ai-step"><span class="ai-step-t">'+U.esc(s)+'</span>'+
          '<button class="btn btn-sm btn-ai" data-act="aiStepAdd" data-i="'+i+'">加入</button></div>';
      }).join('')+'</div>';
  },

  /* ── 批次五 · 阶段一：M1 月度情绪回顾的输入聚合 ──────────────────────
     按**自然月**聚合（说"9月"而不是"近30天"）。
     ★ 心情只给「按天汇总的统计」（按 emoji 归类计数），逐日 emoji 一条都不进 prompt ——
       上一版把逐日 emoji 喂进去，模型立刻编出"3号低落说明那天被批评了"这种因果故事，
       单日表情支撑不了因果结论。
     ★ 想法是唯一带文字的素材，原样给，但明确标注"这些是想法，不是已完成的行动"。
     ★ 该月未过完时明确告知模型，别让它把"才记了2天"读成"整月都很糟"。
     ★ demo 过滤：moods / thoughts 都加 !x.demo，与 insightInput / reviewText 同一套闸门。
     返回 null 表示这个月没有任何可回顾记录（调用方据此零请求拦截）。
     ★ 危机不在前端判定：关键词匹配会把引用歌词、复述书摘、抄写句子误判成危机，
       而且会和后端的 gateway 检测形成两套口径。危机检测统一由后端负责，
       后端返回 crisis:true 时，前端渲染援助卡片（文案用后端给的，不带「AI 生成」字样）。 */
  moodMonthText:function(ym){
    if(!ym||ym.length<7) return null;
    var nm=MOOD_NAME;                                   /* 24 个表情全表，优先于只有 10 个的 AI.MOOD_NAMES */
    var moods=(S.moods||[]).filter(function(m){ return !m.demo && String(m.date||'').slice(0,7)===ym });
    var thoughts=(S.thoughts||[]).filter(function(t){ return !t.demo && String(t.date||'').slice(0,7)===ym });
    if(!moods.length && !thoughts.length) return null;   /* 空月：零请求 */
    /* 心情：按天汇总（不是逐日事件） */
    var byDay={};
    moods.forEach(function(m){ var d=String(m.date||'').slice(5); (byDay[d]=byDay[d]||{}); byDay[d][m.emoji||'']=(byDay[d][m.emoji||'']||0)+1 });
    var dayLines=Object.keys(byDay).sort().map(function(d){
      var e=byDay[d];
      var parts=Object.keys(e).sort(function(a,b){ return e[b]-e[a] }).map(function(k){ return (nm[k]||AI.MOOD_NAMES[k]||k)+'×'+e[k] });
      return d+'：'+parts.join(' ');
    });
    var days=Object.keys(byDay).length;                  /* 有心情的天数 */
    var lines=[];
    lines.push('【'+parseInt(ym.slice(0,4),10)+'年'+parseInt(ym.slice(5),10)+'月 情绪回顾】');
    lines.push('本月共 '+moods.length+' 条心情记录、'+thoughts.length+' 条想法（覆盖 '+days+' 天）。');
    if(dayLines.length) lines.push('【心情 · 按天汇总，仅供背景参考】\n'+dayLines.join('\n')+
      '（以上是按天汇总的表情计数，不是逐日事件，请勿逐条解读单个表情，也不要据此推断某天发生了什么。）');
    if(thoughts.length){
      lines.push('【想法 · 原样记录，这些是想法和感悟，不是已完成的行动】');
      thoughts.forEach(function(t){ lines.push('- '+String(t.text||'').slice(0,300)) });
    }
    var ymEnd=U.addDays(ym+'-01', 32);                  /* 下月附近，用于判断是否过完 */
    if((ym+'-01') <= U.today() && U.today() < (ymEnd.slice(0,7)+'-01')){
      lines.push('（注意：'+ym+' 还没过完，截至今天只记录了这么多，别把"才记了几天"读成"整月都很糟"。）');
    }
    return { text:lines.join('\n\n'), days:days, moodN:moods.length, thoughtN:thoughts.length };
  }
};

/* ── 批次五 · 阶段二：视频脚本的两个 prompt 构造 ──────────────────────

function videoScriptPrompt(){

/* 关键词高亮。先转义再替换，避免把用户输入当 HTML 执行 */
function gsHl(text, kw){
  var t=U.esc(text==null?'':String(text));
  if(!kw) return t;
  var k=U.esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return t.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>') }catch(e){ return t }
}
/* 上下文片段：优先截正文里命中的位置，正文没命中就退回标题 */
function gsCtx(title, body, kw){
  var k=String(kw||'').toLowerCase();
  var src=String(body||''), idx=src.toLowerCase().indexOf(k);
  if(idx<0){ src=String(title||''); idx=src.toLowerCase().indexOf(k) }
  if(idx<0){ src=String(body||title||''); idx=0 }
  var s=Math.max(0,idx-20), e=Math.min(src.length, idx+k.length+60);
  return (s>0?'…':'')+src.slice(s,e)+(e<src.length?'…':'');
}
function gsSearch(kw){
  var k=String(kw||'').toLowerCase().trim();
  if(!k) return { groups:[], total:0 };
  var out=[], total=0;
  for(var i=0;i<SEARCH_SRC.length;i++){
    var src=SEARCH_SRC[i], items=[];
    try{ items=src.get()||[] }catch(e){ items=[] }
    var hits=[];
    for(var j=0;j<items.length;j++){
      var x=items[j]; if(!x) continue;
      var ti=String(src.t(x)||''), bd=String(src.b(x)||'');
      if((ti+' '+bd).toLowerCase().indexOf(k)<0) continue;
      hits.push({
        id: src.id?String(src.id(x)||''):String(x.id||''),
        title: ti, ctx: gsCtx(ti,bd,kw)
      });
    }
    if(hits.length){ out.push({ si:i, v:src.v, m:src.m, n:hits.length, hits:hits.slice(0,8) }); total+=hits.length }
  }
  return { groups:out, total:total };
}

/* ── 第三批 · 阶段2：ME1 自动打标签的通用助手 ──────────────────────────
   已有标签池 = memo + notes 的全部标签并集。ME1 只从这个池里挑，不生成新标签。 */
function tagPool(){
  var set={};
  (S.memos||[]).forEach(function(m){ (m.tags||[]).forEach(function(t){ if(t) set[t]=1 }) });
  (S.notes||[]).forEach(function(n){ (n.tags||[]).forEach(function(t){ if(t) set[t]=1 }) });
  return Object.keys(set);
}
/* 解析 AI 返回的标签：拆成 token，只保留「已在池中」的，去重保序。
   ★ 这就是第二道保险 —— 不管模型吐什么格式、夹什么废话，最终进列表的只能是已有标签。 */
function tagParse(text, pool){
  var set={}; pool.forEach(function(t){ set[t]=1 });
  /* 按「非中英文/数字」切成纯词 run（冒号、句号、引号、空格都当分隔），
     这样「建议打：工作」也能切出独立的「工作」；再只保留池中的、去重保序。
     ★ 这是第二道保险：自由生成的标签（不在池里）一个都进不来。 */
  var toks=String(text||'').split(/[^a-zA-Z0-9\u4e00-\u9fa5]+/).filter(function(t){ return t && set[t] });
  var out=[], seen={};
  toks.forEach(function(t){ if(!seen[t]){ seen[t]=1; out.push(t) } });
  return out;
}
/* memo / notes 共用的「AI 建议标签」流程 */
function meTag(d, type, arr){
  if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
  var it=findIn(arr, d.id); if(!it) return;
  var pool=tagPool();

    '\n\n请挑出适合的标签，只输出一行，用逗号分隔，且每个都必须来自上面的已有标签列表。';
  UI.tagSuggest={ busy:true, type:type, id:it.id };
  render();
  AI.call('memoTag', AI.spots.memoTag, prompt, null, function(b){
    var sug=tagParse(String(b.text||''), pool);

      UI.tagSuggest={ err:'AI 没挑出匹配的标签，你可以手动加' };

/* ---------------- 23. WebDAV 同步 ---------------- */
function mergeData(remote){
  if(!remote) return;
  /* 心情日记（moods / thoughts）必须在这里：
     增量合并只认白名单里的键，漏了的话「从云端拉取 → 合并」会静默跳过它们，
     手机上记的一周心情一同步就没了。全量覆盖路径不受影响，所以本地测不出来。 */
  var arrKeys=['plans','memos','express','books','inspires','notes','excerpts','prompts','goals','custom','reminders','wrongs','videos','healthItems','healthTips','moods','thoughts'];
  arrKeys.forEach(function(k){
    if(Array.isArray(remote[k])){
      var local=S[k]||[], ids={}; local.forEach(function(x){ if(x&&x.id) ids[x.id]=1 });
      S[k]=local.concat(remote[k].filter(function(x){ return x&&x.id&&!ids[x.id] }));
    }
  });
  if(remote.fitness&&typeof remote.fitness==='object'){
    ['records','plan'].forEach(function(fk){
      if(Array.isArray(remote.fitness[fk])){
        var local=S.fitness[fk]||[], ids={}; local.forEach(function(x){ if(x&&x.id) ids[x.id]=1 });
        S.fitness[fk]=local.concat(remote.fitness[fk].filter(function(x){ return x&&x.id&&!ids[x.id] }));
      }
    });
  }
  if(Array.isArray(remote.custom)){
    (S.custom||[]).forEach(function(m){
      var rm=remote.custom.find(function(x){ return x&&x.id===m.id });
      if(rm&&Array.isArray(rm.items)){ var ids={}; (m.items||[]).forEach(function(it){ if(it&&it.id) ids[it.id]=1 }); m.items=(m.items||[]).concat(rm.items.filter(function(it){ return it&&it.id&&!ids[it.id] })) }
    });
  }
  S.updatedAt=U.now();
}
var SYNC={
  status:'off', msg:'', timer:null,
  cls:function(){ return this.status },
  text:function(){
    return {off:'未启用',idle:'待同步',run:'同步中…',ok:'已同步',err:'同步失败'}[this.status]||'未启用';
  },
  set:function(s,m){
    this.status=s; if(m) this.msg=m;
    var b=U.$('#syncBadge');
    if(b){ b.className='syncdot '+s; b.innerHTML='<i></i>'+U.esc(this.text()) }
    var l=U.$('#syncLog'); if(l&&m) l.textContent=m;
    var t=U.$('#tbSync');
    if(t) t.style.color=(s==='ok'?'var(--success)':s==='err'?'var(--danger)':s==='run'?'var(--warn)':'');
  },
  url:function(){
    var w=S.settings.webdav;
    if(!w.url) return null;
    return w.url.replace(/\/+$/,'')+'/'+(w.file||'worktable-backup.json');
  },
  auth:function(){
    var w=S.settings.webdav;
    return 'Basic '+btoa(unescape(encodeURIComponent((w.user||'')+':'+(w.pass||''))));
  },
  /* 统一请求头。
     ① Authorization：保留 WebDAV 语义（账号+应用密码），后端不用但留着无害
     ② x-sync-token：给云端代理做访问控制用（Pages 环境变量 SYNC_TOKEN）
        只有用户填了密钥才带 —— 没填就不带，
        这样「后端不设 SYNC_TOKEN」时前端零改动也能正常同步。 */
  hdrs:function(extra){
    var w=S.settings.webdav, h={'Authorization':this.auth()};
    if(w.token) h['x-sync-token']=w.token;
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  },
  /* 目录地址（仅供「测试连接」用）。
     测试要验证的是「目录在不在 + 账号密码对不对」，而不是「备份文件建没建」。
     早期版本直接拿文件路径（目录+/文件名）去 PROPFIND，结果第一次使用时
     文件必然不存在，网盘返回 404 就被翻译成「目录不存在」——
     用户明明建好了目录，却被反复误导去检查目录。现在改成探测目录本身。 */
  dirUrl:function(){
    var w=S.settings.webdav;
    if(!w.url) return null;
    return w.url.replace(/\/+$/,'')+'/';
  },
  /* 失败原因诊断。浏览器对 fetch 网络层错误一律只报「Failed to fetch」，
     真实原因（跨域被拦？线路不通？）被安全机制故意抹掉。
     这里用一次 no-cors HEAD 探测把它分出来：
       · 探测成功  → 物理线路是通的，正式请求被拦 → 一定是跨域（CORS）限制
       · 探测也失败 → 线路本身不通 → 域名被墙 / DNS 污染 / 地址写错 / 断网 / 混合内容
     workers.dev 域名在国内属于「线路不通」，坚果云直连属于「跨域被拦」，正好分开。 */
  probe:function(u){
    try{
      return fetch(u,{method:'HEAD',mode:'no-cors',cache:'no-store'})
        .then(function(){ return true },function(){ return false });
    }catch(e){ return Promise.resolve(false) }
  },
  explain:function(kind,e){
    var self=this, msg=(e&&(e.message||e))||'', u=this.url()||'';
    this.probe(u).then(function(alive){
      if(alive){
        self.set('err',kind+'失败：线路是通的，但被浏览器跨域（CORS）拦截 —— 目标网盘没放开浏览器直连（坚果云就是）。服务器地址改填 /api/webdav/（经本站代理）即可解决。');
      }else{
        var isWd=/workers\.dev/i.test(u), isHttp=/^http:\/\//i.test(u);
        var why=isWd?'这个地址是 workers.dev 域名 —— 在国内被墙，中转站本身再正常也连不上，与密码无关，必须改用「经本站代理」（地址填 /api/webdav/）。'
          :isHttp?'页面是 https，浏览器禁止 https 页面请求 http:// 地址（混合内容限制），请改用网盘的 https 地址。'
          :'请检查：① 手机是否断网/换网络试试 ② 地址有没有写错（多空格、少斜杠）③ 该域名是否被墙（换「经本站代理」最稳）。';
        self.set('err',kind+'失败：整个地址连不上（'+msg+'）。'+why);
      }
    });
  },
  /* 测试连接：对【目录】发一个最轻量的 PROPFIND（Depth:0），把返回码翻译成人话。
     四类结果必须分得清清楚楚（这是小白用户唯一的排障入口）：
       207 → 成功          401/403 → 密码错
       404 → 目录不存在    网络层抛错 → 跨域 / 线路不通（交给 explain 二次判定） */
  test:function(){
    var w=S.settings.webdav;
    if(!w.enabled||!w.url){ U.toast('请先填写并启用 WebDAV 配置','err'); return }
    var self=this, dir=this.dirUrl();
    this.set('run','正在测试连接… '+new Date().toLocaleTimeString());
    fetch(dir,{method:'PROPFIND',headers:this.hdrs({'Depth':'0'}),cache:'no-store'})
    .then(function(r){
      if(r.status===207||r.status===200){
        self.set('ok','测试通过：目录存在、账号密码正确（HTTP '+r.status+'）✓ 可以正常同步了。备份文件不用提前建，第一次点「上传到云端」时会自动创建。 '+new Date().toLocaleTimeString());
        U.toast('连接正常','ok');
      }
      else if(r.status===401||r.status===403){
        self.set('err','测试失败：同步密钥不对（HTTP '+r.status+'）。后端设了 SYNC_TOKEN 才需要填「同步密钥」，且必须和 Pages 环境变量里的一字不差；没设 SYNC_TOKEN 就留空。');
        U.toast('测试未通过，详见同步日志','err');
      }
      else if(r.status===404){
        self.set('err','测试失败：云端地址不可用（HTTP 404）。最常见的原因是 Functions 没部署成功 —— 检查仓库里有没有 functions/api/webdav/[[path]].js（路径必须带 [[path]]）。');
        U.toast('测试未通过，详见同步日志','err');
      }
      else self.set('err','测试返回 HTTP '+r.status+'（线路和密码都通过了，服务器没接受这个请求）');
      if(r.status!==207&&r.status!==200) U.toast('测试未通过，详见同步日志','err');
    })
    .catch(function(e){ self.explain('测试连接',e); U.toast('连接失败，详见同步日志','err') });
  },
  up:function(silent){
    var w=S.settings.webdav;
    if(!w.enabled||!w.url){ if(!silent) U.toast('请先填写并启用 WebDAV 配置','err'); return }
    SYNC.set('run','正在上传… '+new Date().toLocaleTimeString());
    fetch(SYNC.url(),{ method:'PUT', headers:SYNC.hdrs({'Content-Type':'application/json;charset=utf-8'}),
      body:JSON.stringify(S) })
    .then(function(r){
      if(r.ok||r.status===201||r.status===204){
        /* KV 最终一致：不说清楚，用户「传完立刻在另一台设备拉，拿到旧的」就会以为同步坏了 */
        SYNC.set('ok','上传成功 '+new Date().toLocaleString()+'（'+countRecords()+' 条）'
          +'。注意：云端全球同步约需 60 秒，另一台设备立刻拉取可能还是旧数据，等一分钟再拉即可。');
        S.settings.lastBackupCount=countRecords(); saveNow();
        var bar=U.$('#backupBar'); if(bar) bar.style.display='none';
        if(!silent) U.toast('已上传到云端','ok');
      }else if(r.status===401||r.status===403){
        SYNC.set('err','上传失败：同步密钥不对（HTTP '+r.status+'）。核对这里的「同步密钥」与 Pages 环境变量 SYNC_TOKEN 是否一字不差。');
        if(!silent) U.toast('上传失败：账号或应用密码不对','err');
      }else if(r.status===404||r.status===409){
        SYNC.set('err','上传失败：写入被拒绝（HTTP '+r.status+'）。先检查 KV 命名空间是否已绑定到本项目（绑定后要重新部署才生效）。');
        if(!silent) U.toast('上传失败：目录不存在','err');
      }else{
        SYNC.set('err','上传失败：HTTP '+r.status+'（网盘服务器返回了错误，稍后再试）');
        if(!silent) U.toast('上传失败 HTTP '+r.status,'err');
      }
    })
    .catch(function(e){
      SYNC.explain('上传',e);
      if(!silent) U.toast('上传失败，详见同步日志','err');
    });
  },
  down:function(){
    var w=S.settings.webdav;
    if(!w.enabled||!w.url){ U.toast('请先填写并启用 WebDAV 配置','err'); return }
    SYNC.set('run','正在拉取…');
    fetch(SYNC.url(),{ method:'GET', headers:SYNC.hdrs(), cache:'no-store' })
    .then(function(r){
      if(r.status===404){
        SYNC.set('err','云端还没有这个备份文件（第一次使用先点「上传到云端」）；也可能目录地址填错了。');
        U.toast('云端还没有备份文件','err');
        return null;
      }
      if(r.status===401||r.status===403){ throw new Error('账号或应用密码不对（HTTP '+r.status+'）') }
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(function(txt){
      if(txt===null||txt===undefined) return;   /* 上面已提示过（404） */
      var o=JSON.parse(txt);
      if(!o||!o.__wb) throw new Error('云端文件不是本工作台的备份');
      o=normalize(o);
      var remoteT=o.updatedAt||'', localT=S.updatedAt||'';
      openModal('从云端拉取',
        '<div style="font-size:.9rem;line-height:1.95">云端更新：<b>'+(remoteT?U.relTime(remoteT):'未知')+'</b>（'+(o.plans||[]).length+' 条任务）<br>'+
        '本地更新：<b>'+(localT?U.relTime(localT):'未知')+'</b>（'+S.plans.length+' 条任务）<br><br>'+
        '· <b>合并导入</b>：保留本地数据，把云端里本地没有的条目追加进来（按 id 去重）。<br>'+
        '· <b>覆盖导入</b>：用云端完全替换本地'+(remoteT&&localT&&remoteT<localT?'（<span style="color:var(--danger)">云端比本地旧，会丢失本地较新修改</span>）':'（建议先导出备份）')+'。</div>',
        '<button class="btn" data-act="closeModal">取消</button>'+
        '<button class="btn" data-act="doPullMerge">合并导入</button>'+

/* ---------------- 24. 通知与 Cron ---------------- */
function cronMatch(expr, d){
  if(!expr) return false;
  var f=expr.trim().split(/\s+/);
  if(f.length!==5) return false;
  var vals=[d.getMinutes(), d.getHours(), d.getDate(), d.getMonth()+1, d.getDay()];
  for(var i=0;i<5;i++){
    if(!fieldMatch(f[i], vals[i])) return false;
  }
  return true;
  function fieldMatch(f, v){
    if(f==='*') return true;
    return f.split(',').some(function(part){
      var st=1, base=part;
      if(part.indexOf('/')>-1){ var sp=part.split('/'); base=sp[0]; st=parseInt(sp[1],10)||1 }
      if(base==='*') return v%st===0;
      if(base.indexOf('-')>-1){
        var r=base.split('-'), a=+r[0], b=+r[1];
        return v>=a&&v<=b&&((v-a)%st===0);
      }
      return +base===v;
    });
  }
}

  timer:null, lastCron:'',
  can:function(){ return typeof Notification!=='undefined'&&Notification.permission==='granted' },
  ask:function(cb){
    if(typeof Notification==='undefined'){ U.toast('当前浏览器不支持通知','err'); return }

    if(Notification.permission==='denied'){ U.toast('通知已被浏览器拒绝，请在站点设置里手动开启','err'); cb&&cb(false); return }

  fire:function(title, body, tag, cb){

      try{

      });

    }

    if(!NOTIFY.can()){
      console.warn('[NOTIFY] 启动时权限不足，跳过启动');

    }

  }
};

}
/* 中文 2 字停用词表。认知地图和「表达短板词云」共用一份，避免两处各写一套。 */
var STOP_CN={'的':1,'了':1,'是':1,'我':1,'在':1,'有':1,'和':1,'也':1,'就':1,'都':1,'还':1,'不':1,'没':1,'着':1,'会':1,'要':1,'把':1,'被':1,'让':1,'给':1,'上':1,'下':1,'点':1,'次':1,'个':1,'这':1,'那':1,'他':1,'她':1,'它':1,'你':1,'我们':1,'自己':1,'以后':1,'时候':1,'可以':1,'需要':1,'觉得':1,'应该':1,'可能':1,'因为':1,'所以':1,'但是':1,'如果':1,'然后':1,'现在':1,'今天':1,'感觉':1,'一点':1,'一些':1,'这种':1,'总是':1,'一个':1,'这个':1,'那个':1,'什么':1,'怎么':1,'还是':1,'已经':1,'其实':1,'而且':1,'或者':1,'对于':1,'关于':1,'通过':1,'以及':1,'一直':1,'比较':1,'有点':1,'真的':1,'知道':1,'进行':1,'这次':1,'这样':1,'这里':1,'清楚':1,'很多':1};

/* 单字停用表。只给认知地图用 —— 词云(weakKeywords)走 2-gram，不需要这张表。
   为什么要有单字表：中文主题词常常是单字（跑/读/码），必须把单字纳入种子；
   但单字噪声又最大，所以得先砍掉通用字，数字量词尤其要砍 ——
   「三」类（三公里/三十/三处）就是活生生的教训。 */
var STOP_CN1={};
['的','了','是','我','在','有','和','也','就','都','还','不','没','着','会','要','把','被','让','给',
 '上','下','点','次','个','这','那','他','她','它','你','们','自','己','以','后','时','候','可','需',
 '觉','得','应','该','能','因','为','所','但','如','果','然','现','今','天','感','些','种','总','什',
 '么','怎','经','其','实','而','且','或','者','对','于','关','通','过','及','比','较','真','知','道',
 '进','行','很','多','到','说','想','看','做','来','去','出','回','又','再','里','中','好','大','小',
 '高','低','长','短','前','内','外','间','部','分','问','题','方','面','法','情','况','结','果','开',
 '始','完','成','作','地','一','二','三','四','五','六','七','八','九','十','百','千','万','亿','两',
 '半','几','每','各','第','零'].forEach(function(c){ STOP_CN1[c]=1 });

/* ── 中文 2-gram 词频（无外部分词库，纯滑动窗口）──────────────────────
   除了计数，还记每个词的左右邻字 —— 降噪要用：
   滑动窗口天然会把「每日计划」切成「日计」这种跨界串，它们每次出现
   都被同样的字包着，靠邻接字种类就能认出来。 */
function gramStat(texts){
  var cnt={}, ctx={};
  (texts||[]).forEach(function(t){
    t=String(t==null?'':t);
    for(var i=0;i<t.length-1;i++){
      var g=t.substr(i,2);
      if(!/^[\u4e00-\u9fa5][\u4e00-\u9fa5]$/.test(g)) continue;
      if(STOP_CN[g]) continue;
      cnt[g]=(cnt[g]||0)+1;
      var c=ctx[g]||(ctx[g]={L:{},R:{}});
      var L=t.charAt(i-1), R=t.charAt(i+2);
      if(/[\u4e00-\u9fa5]/.test(L)) c.L[L]=1;
      if(/[\u4e00-\u9fa5]/.test(R)) c.R[R]=1;
    }
  });
  return {cnt:cnt, ctx:ctx};
}

/* 降噪 + 取 top。
   ★ 两条规则：
     ① 出现 <2 次的不要（一次可能是随手打错的字）
     ② 出现 ≥3 次但左右邻字只有一种 → 它总是粘在同一段固定文字里，
        是更长片段的一部分，不是能独立表意的词（例：「每日计划」里的「日计」）。
        n<3 时不判这条：样本太少，容易把正常的词误杀。 */
function topGrams(st,limit){
  var out=[];
  var cnt=(st&&st.cnt)||{}, ctx=(st&&st.ctx)||{};
  Object.keys(cnt).forEach(function(g){
    var n=cnt[g];
    if(n<2) return;
    var c=ctx[g]||{L:{},R:{}};
    var L=Object.keys(c.L).length, R=Object.keys(c.R).length;
    if(n>=3 && (L<=1||R<=1)) return;
    out.push({w:g,n:n});
  });
  out.sort(function(a,b){ return b.n-a.n });
  return out.slice(0,limit||20);
}

/* ══════════════════════════════════════════════════════════════════
   认知地图：主题聚类 + 时间线热图
   ────────────────────────────────────────────────────────────────
   为什么不做真图谱：调研报告已论证 —— 没有双向链接数据结构，
   硬做出来的图是一堆孤立点，看着像回事实则没有信息量。
   所以做「聚类 + 热图」这对替代品：聚类回答"我在想什么"，热图回答"我什么时候在想"。

   ★ 成本原则：聚类 100% 本地算，一次 AI 都不调。
     AI 只做两件它确实比正则强的事 —— 给聚类起名字、写一句话总结。
     断网 / 没额度时功能完整可用，只是聚类叫「聚类 1」而不是「跑步记录」。
   ══════════════════════════════════════════════════════════════════ */
var MAP_MIN_CL=15,      /* 聚类门槛：文本记录条数 */
    MAP_MIN_HEAT=5,     /* 热图门槛 */
    MAP_MAX_CL=6;       /* 聚类个数上限（每个都要一次 AI 调用，不能无限） */

/* 6 个文本源，统一成 {id,m,label,d,txt} —— 聚类结果要能反查回原始条目，
   否则「点开看详情」就无从下手。 */
function mapSources(){
  var out=[];
  function add(id,m,label,d,txt){
    /* 上限 400 条：聚类是 O(种子数 × 条数) 的字符扫描，
       几百条已经是几十毫秒级，再多没必要 —— 而且热图看的是分布，抽样不影响结论。 */
    if(out.length>=400) return;
    txt=String(txt==null?'':txt).trim();
    if(txt.length>=4) out.push({id:id,m:m,label:label,d:String(d||'').slice(0,10),txt:txt});
  }
  (S.memos||[]).forEach(function(x){ add(x.id,'memo','备忘',(x.createdAt||'').slice(0,10),x.text) });
  (S.notes||[]).forEach(function(x){ add(x.id,'notes','笔记',(x.createdAt||x.updatedAt||'').slice(0,10),(x.title||'')+' '+(x.content||'')) });
  (S.inspires||[]).forEach(function(x){ add(x.id,'inspire','灵感',x.date,(x.text||'')+' '+(x.adds||[]).map(function(a){ return a&&a.t }).join(' ')) });
  (S.excerpts||[]).forEach(function(x){ add(x.id,'excerpt','摘抄',(x.createdAt||'').slice(0,10),x.text) });
  (S.express||[]).forEach(function(x){ if(x.reflect) add(x.id,'express','表达',x.date,x.reflect) });
  (S.wrongs||[]).forEach(function(x){ add(x.id,'wrongq','错题',x.date,(x.q||'')+' '+(x.subject||'')+' '+(x.cause||'')+' '+(x.tags||[]).join(' ')) });
  return out;
}
/* 数据指纹：只有源数据条数变了才重算聚类。
   ★ 必须缓存 —— AI 起好的名字存在 cluster 对象上，每次 render 重算会把它冲掉。 */
function mapFp(){
  return [(S.memos||[]).length,(S.notes||[]).length,(S.inspires||[]).length,
          (S.excerpts||[]).length,(S.express||[]).length,(S.wrongs||[]).length].join('-');
}
function mapCompute(){
  var fp=mapFp();
  if(UI.mapData && UI.mapData.fp===fp) return UI.mapData;
  var items=mapSources();
  var kws=mapSeeds(items.map(function(it){ return it.txt }),40);
  UI.mapData={fp:fp, items:items, kws:kws, clusters:mapCluster(items,kws), heat:mapHeat(items)};
  return UI.mapData;
}
/* ── 文档频率统计 ──
   df(一个字/词出现在多少「条」记录里) 比 tf(出现几次) 靠谱得多：
   同一条里反复叨叨一个词不代表它是主题，很多条都提到才算。
   ★ 这里刻意同时统计 1-gram 和 2-gram —— 只做 2-gram 会漏掉「跑」「读」「码」
     这类单字主题（「晨跑」「夜跑」「慢跑」里「跑」从不和同一个字相邻），
     而只做 1-gram 又会噪声爆炸。两个一起上，再靠下面的规则筛。 */
function dfStat(texts){
  var d1={}, d2={};
  (texts||[]).forEach(function(t){
    t=String(t==null?'':t);
    var s1={}, s2={};
    for(var i=0;i<t.length;i++){
      var c=t.charAt(i);
      if(!/[\u4e00-\u9fa5]/.test(c)) continue;
      if(STOP_CN1[c]) continue;
      s1[c]=1;
      if(i<t.length-1){
        var g=t.substr(i,2);
        if(/^[\u4e00-\u9fa5][\u4e00-\u9fa5]$/.test(g) && !STOP_CN[g]){
          if(STOP_CN1[g.charAt(0)]||STOP_CN1[g.charAt(1)]) continue;
          s2[g]=1;
        }
      }
    }
    Object.keys(s1).forEach(function(k){ d1[k]=(d1[k]||0)+1 });
    Object.keys(s2).forEach(function(k){ d2[k]=(d2[k]||0)+1 });
  });
  return {d1:d1, d2:d2};
}
/* 选种子：df 必须落在 [2, N*0.5] 区间。
   ★ 这是整套算法的命门 —— df 太低是偶然（只出现过一次的词），
     df 太高是通用字（一半以上记录都提到 → 没有区分度）。有信息量的词在中间。 */
function mapSeeds(texts,limit){
  var N=(texts||[]).length, lo=2, hi=Math.max(3,Math.ceil(N*0.5));
  var st=dfStat(texts), out=[];
  Object.keys(st.d2).forEach(function(g){
    var df=st.d2[g];
    if(df<lo||df>hi) return;
    out.push({w:g, df:df, len:2});
  });
  Object.keys(st.d1).forEach(function(c){
    var df=st.d1[c];
    if(df<lo||df>hi) return;
    out.push({w:c, df:df, len:1});
  });
  out.sort(function(a,b){ return (b.df-a.df)||(b.len-a.len) });
  return out.slice(0,limit||40);
}
/* 聚类：种子召回 → 类内共现检验 → 扩一轮 → 去重。
   四道关卡一道都不能省，省任何一道都会冒出「的书」「三」「率」这种伪主题。 */
function mapCluster(items,kws){
  var picked=[], N=(items||[]).length;
  var minDf1=Math.max(2, Math.min(3, Math.floor(N/6)));  /* 单字噪声大，门槛比 2-gram 高 */
  function recall(w){ return items.filter(function(it){ return it.txt.indexOf(w)>=0 }) }
  /* ★ 关卡一：类内共现检验 —— 一个类里必须存在被 ≥2 条共享的双字词。
     没有这个词，说明成员只是碰巧含同一个字，不是同一主题。
     典型反例：种子「率」召回「心率偏高」和「覆盖率提升」—— 都含率，但毫无关系。
     这条规则一发干掉全部碎片类，是 v3 相对 v2 最大的改进。 */
  function coherent(its){
    if(its.length>=6) return true;              /* 大类直接放行：规模本身就是证据 */
    var s2=mapSeeds(its.map(function(it){ return it.txt }),20), i, cnt=0;
    for(i=0;i<s2.length;i++){ if(s2[i].len===2 && s2[i].df>=2) return true }
    for(i=0;i<s2.length;i++){ if(s2[i].len===1 && s2[i].df>=2) cnt++ }
    return cnt>=2;                              /* 退一步：共享 ≥2 个单字也算有共同话题 */
  }
  (kws||[]).forEach(function(kw){
    if(picked.length>=MAP_MAX_CL) return;
    if(kw.len===1 && kw.df<minDf1) return;
    var its=recall(kw.w);
    if(its.length<2) return;
    if(!coherent(its)) return;                  /* 关卡一 */
    /* 关卡二：类内再找一个高 df 词，把它的相关条目也拉进来（只扩一轮，防发散） */
    if(its.length>=3){
      var s2=mapSeeds(its.map(function(it){ return it.txt }),12);
      for(var i=0;i<s2.length;i++){
        var c=s2[i];
        if(c.w===kw.w) continue;
        if(c.df<Math.max(2,Math.ceil(its.length*0.4))) continue;
        var add=recall(c.w).filter(function(it){ return its.indexOf(it)<0 });
        if(add.length && add.length<=Math.ceil(its.length*0.8)) its=its.concat(add);
        break;
      }
    }
    /* 关卡三：和已有类重叠 >60% 就丢弃，避免同一主题占好几个坑 */
    var drop=false;
    for(var j=0;j<picked.length;j++){
      var p=picked[j];
      var inter=its.filter(function(it){ return p.items.indexOf(it)>=0 }).length;
      if(inter/Math.min(its.length,p.items.length)>0.6){ drop=true; break }
    }
    if(drop) return;
    /* 关卡四：类标签优先用类内高频 2-gram —— 「跑」不如「跑步」好读 */
    var lab=kw.w;
    var ls=mapSeeds(its.map(function(it){ return it.txt }),8);
    for(var q=0;q<ls.length;q++){ if(ls[q].len===2 && ls[q].df>=2){ lab=ls[q].w; break } }
    picked.push({kw:kw.w, lab:lab, items:its, n:its.length, name:'', sum:'', busy:false, err:''});
  });
  picked.sort(function(a,b){ return b.n-a.n });
  return picked;
}
function mapHeat(items){
  var byDay={}, byMonth={}, n=0;
  (items||[]).forEach(function(it){
    if(!it.d) return;
    n++;
    byDay[it.d]=(byDay[it.d]||0)+1;
    var m=it.d.slice(0,7);
    byMonth[m]=(byMonth[m]||0)+1;
  });
  return {byDay:byDay, byMonth:byMonth, n:n};
}
/* 最近 n 天（本地日期，不用 toISOString —— 那是 UTC，GMT+8 下会把今天算成昨天） */
function mapLastDays(n){
  var out=[], b=new Date();
  for(var i=n-1;i>=0;i--) out.push(U.dstr(new Date(b.getFullYear(),b.getMonth(),b.getDate()-i)));
  return out;
}
/* 热图 SVG：手写，无外部图表库。颜色用 opacity 分 5 档，不引任何新依赖。 */
function mapHeatSvg(dim,heat){
  var cells='', lab='';
  function op(n,mx){ if(!n) return 0; var r=n/mx; return r>0.75?1:r>0.5?0.75:r>0.3?0.5:r>0.12?0.3:0.16 }
  if(dim==='month'){
    var ms=Object.keys(heat.byMonth).sort().slice(-12);
    if(!ms.length) return '';
    var mx=Math.max.apply(null,ms.map(function(m){ return heat.byMonth[m] }));
    var CW=40, CH=34, GP=6, cols=4;
    ms.forEach(function(m,i){
      var x=(i%cols)*(CW+GP), y=Math.floor(i/cols)*(CH+GP);
      var v=heat.byMonth[m];
      cells+='<rect x="'+x+'" y="'+y+'" width="'+CW+'" height="'+CH+'" rx="7" fill="var(--primary)" opacity="'+op(v,mx)+'"/>';
      cells+='<text x="'+(x+CW/2)+'" y="'+(y+CH/2-1)+'" text-anchor="middle" font-size="12" fill="var(--text)">'+(+m.slice(5,7))+'月</text>';
      cells+='<text x="'+(x+CW/2)+'" y="'+(y+CH/2+13)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+v+'</text>';
    });
    var rows=Math.ceil(ms.length/cols);
    lab='<div class="hint-sm" style="margin-top:6px">最近 '+ms.length+' 个月 · 颜色越深记录越多</div>';
    return '<svg viewBox="0 0 '+(cols*CW+(cols-1)*GP)+' '+(rows*CH+(rows-1)*GP)+'" style="width:100%;max-width:240px;height:auto" role="img" aria-label="按月记录密度热图">'+cells+'</svg>'+lab;
  }
  /* ★ 窗口自适应：硬画 5 周而数据只集中在 9 天，会留一大片空格子 ——
     用户第一眼会以为坏了。这里改成「至少覆盖到最早那条记录、最多 5 周」，
     并且整周对齐（每列 = 周一到周日），这样看起来是块完整的日历而不是散点。 */
  var have=Object.keys(heat.byDay).sort();
  var span=35;
  if(have.length){
    var oldest=new Date(have[0]+'T00:00:00'), nowD=new Date();
    var need=Math.ceil((nowD-oldest)/864e5)+1;
    span=Math.min(35, Math.max(14, Math.ceil(need/7)*7));   /* 2~5 周，整周取整 */
  }
  /* 起始日对齐到周一，让每行就是一周 */
  var startD=new Date();
  startD.setDate(startD.getDate()-(span-1));
  var off=(startD.getDay()+6)%7;              /* 0=周一 */
  startD.setDate(startD.getDate()-off);
  var days=[];
  for(var di=0;di<span+off;di++){
    var dd=new Date(startD.getFullYear(),startD.getMonth(),startD.getDate()+di);
    days.push(U.dstr(dd));
  }
  var rows=Math.ceil(days.length/7);
  var mx2=Math.max.apply(null,days.map(function(d){ return heat.byDay[d]||0 }).concat([1]));
  var S2=22, GP2=4, cols2=7;
  days.forEach(function(d,i){
    var x=(i%cols2)*(S2+GP2), y=Math.floor(i/cols2)*(S2+GP2), v=heat.byDay[d]||0;
    cells+='<rect x="'+x+'" y="'+y+'" width="'+S2+'" height="'+S2+'" rx="5" fill="var(--primary)" opacity="'+op(v,mx2)+'"'+(v?'':' stroke="var(--line)" stroke-width="1"')+'><title>'+U.cn(d)+' · '+v+' 条</title></rect>';
  });
  var wk=['一','二','三','四','五','六','日'].map(function(w,i2){
    return '<text x="'+(i2*(S2+GP2)+S2/2)+'" y="-4" text-anchor="middle" font-size="9" fill="var(--muted)">'+w+'</text>';
  }).join('');
  return '<svg viewBox="0 -14 '+(cols2*S2+(cols2-1)*GP2)+' '+(rows*S2+(rows-1)*GP2+14)+'" style="width:100%;max-width:280px;height:auto" role="img" aria-label="按天记录密度热图">'+wk+cells+'</svg>'+
    '<div class="hint-sm" style="margin-top:6px">最近 '+rows+' 周，每格一天（空白=当天没记录）· 悬停看条数</div>';
}
/* ── 认知地图卡片（挂在 daily 页底部，默认折叠）─────────────────────
   默认折叠是用户的要求：daily 已经有每日计划 + AI 回顾洞察，
   再塞一块展开的卡片会让首页变得很臃肿。折叠后首页只多一行标题。 */
function mapCard(){
  var open=!!UI.mapOpen;
  var head='<div class="card-head"><h3>'+svg('board','ic-sm')+'认知地图</h3><div class="spacer"></div>'+
    '<span class="hint-sm">主题聚类 · 时间线</span>'+
    '<button class="btn btn-sm" data-act="mapToggle" aria-expanded="'+(open?'true':'false')+'">'+
      svg(open?'up':'down','ic-sm')+(open?'收起':'展开')+'</button></div>';
  if(!open) return '<section class="card" data-mod="daily">'+head+'</section>';
  return '<section class="card" data-mod="daily">'+head+mapBody()+'</section>';
}
function mapBody(){
  var D=mapCompute(), items=D.items, heat=D.heat;
  /* ── 时间线热图 ── */
  var days=Object.keys(heat.byDay);
  var heatHtml;
  if(heat.n<MAP_MIN_HEAT){
    heatHtml='<div class="empty" style="padding:14px 8px">'+svg('calendar')+
      '<p>带日期的记录还不到 '+MAP_MIN_HEAT+' 条（现在 '+heat.n+' 条），画出来是一片空白。再记几条就有热图了。</p></div>';
  }else{
    var topDay=days.slice().sort(function(a,b){ return heat.byDay[b]-heat.byDay[a] })[0];
    var mons=Object.keys(heat.byMonth).sort(function(a,b){ return heat.byMonth[b]-heat.byMonth[a] });
    heatHtml='<div class="chips" style="margin:0 0 10px">'+
      '<span class="chip'+(UI.mapDim==='day'?' on':'')+'" data-act="mapDim" data-v="day">按天</span>'+
      '<span class="chip'+(UI.mapDim==='month'?' on':'')+'" data-act="mapDim" data-v="month">按月</span></div>'+
      mapHeatSvg(UI.mapDim||'day',heat)+
      '<div class="stat-row"><span>记录最多的一天</span><b>'+U.cn(topDay)+' · '+heat.byDay[topDay]+' 条</b></div>'+
      (mons.length?'<div class="stat-row"><span>最活跃的月份</span><b>'+(+mons[0].slice(5,7))+'月 · '+heat.byMonth[mons[0]]+' 条</b></div>':'')+
      '<div class="stat-row"><span>覆盖天数 / 总记录</span><b>'+days.length+' 天 / '+heat.n+' 条</b></div>';
  }
  /* ── 主题聚类 ── */

/* AI 命名：一次调用同时要「名字 + 一句话总结」，严格两行输出。
   ★ 只喂片段前 40 字 × 6 条 —— 够 AI 判断主题，又不至于把整篇笔记都发出去。 */
/* AI 起的名字必须过这道校验才能写进去。
   ★ 为什么要校验：模型偶尔会回「嗯，这个问题我觉得吧……说不太清楚」这种整句，
     不拦的话标题会直接变成「嗯，这个问题我觉得吧……说」—— 比不显示还糟。
     规则只挡「明显不是名字」的情况（带句读 / 以废话开头 / 长度离谱），
     正常输出（「跑步训练记录」）绝不会误伤。 */
function mapNameValid(s){
  s=String(s||'').trim();
  if(s.length<2||s.length>16) return false;
  if(/[。，！？、；：…,.!?;:~～"'“”‘’（）()《》]/.test(s)) return false;   /* 名字不该带句读和括号 */
  if(/^(嗯|啊|哦|呃|唉|这|那|我觉得|可能|大概|或许|说不清|不太|应该)/.test(s)) return false;
  return true;
}
function mapNamePrompt(c){
  var lines=c.items.slice(0,6).map(function(it){ return '- '+it.txt.slice(0,40) });
  return '下面是同一个主题下的一组个人记录片段：\n'+lines.join('\n')+
    '\n\n请做两件事，严格输出两行，不要任何说明、不要 Markdown、不要序号：\n'+
    '第一行：给这组记录起一个 4-8 字的主题名\n'+
    '第二行：用一句话（20-40 字）概括这组记录';
}

/* 表达训练短板关键词（内联词频，无外部分词库） */
function weakKeywords(){
  /* 复用通用 2-gram（停用词表也共用一份）。
     ★ 这里刻意不降噪、仍取前 14 个 —— 词云的展示口径必须和改造前一字不变，
       历史测试里有断言钉着它。降噪只用在认知地图上。 */
  var st=gramStat((S.express||[]).map(function(e){ return (e.reflect||'')+'' }));
  return Object.keys(st.cnt).map(function(k){ return {w:k,n:st.cnt[k]} })
    .sort(function(a,b){ return b.n-a.n }).slice(0,14);
}

  aiRiskOk:function(b,gid){
    var raw=String((b&&b.text)||'').trim();
    var rs=[];
    raw.split(/\r?\n/).forEach(function(raw2){
      var s=String(raw2||'').replace(/^\s*[-*•#>]+\s*/,'').trim();
      var m=s.match(/^(?:风险|Risk)\s*\d*\s*[:：\.、]?\s*(.+)$/i);
      if(m){ if(m[1].trim()) rs.push(m[1].trim()); return }
      /* 兜底：没写"风险N:"前缀但有编号列表，也认 */
      var m2=s.match(/^\d+[\.、\)]\s*(.+)$/);
      if(m2 && rs.length<5) rs.push(m2[1].trim());
    });
    UI.aiRisk=UI.aiRisk||{};
    UI.aiRisk[gid]={ busy:false, risks:rs, raw:raw, err:rs.length?'':'AI 这次没按格式输出，可以重试' };
    render();

  addEx:function(){
    var n=val('exName'); if(!n){ U.toast('请填写运动项目','err'); return }

    if(S.plans.length>=FIT_MAX_TOTAL){
      U.toast('任务总数已达上限（'+FIT_MAX_TOTAL+' 条），请先清理旧任务再添加','err'); return;
    }
    var startDate=val('exDate')||U.today();          // 目标日期，默认今天
    var span=U.clamp(U.num(val('exSpan'),0),0,60);   // 连续天数：留空=按重复规则默认口径，上限 60 天

              kcal:U.num(val('exKcal'),0)||null, done:false, createdAt:U.now() };
    S.fitness.plan.push(tpl);
    /* 模块四：按重复规则把模板展开成每日计划里的联动任务 */
    var r=fitnessSyncTemplate(tpl, { start:startDate, span:span });
    UI.fitDay=startDate;                             // 添加后视图定位到起始日，立刻能看到生成的任务
    afterChange();
    setTimeout(function(){
      /* exSpan 属于一次性设置，必须清空；否则下次添加会被上次的「连续天数」静默限制住。
         exDate 保留：连续录入同一天的计划时不用反复选日期。 */
      /* 第六轮修复 4：清空的同时要打上「已消费」标记，否则 render() 会把草稿又填回来 */
      ['exName','exKcal','exSpan'].forEach(function(id){ var e=U.$('#'+id); if(e) e.value=''; markConsumed('#'+id) });
      var e2=U.$('#exName'); if(e2) e2.focus();

    if(r.skipped) U.toast('已添加，但任务总数接近上限，部分日期未生成','err');
    else if(r.added) U.toast('已添加到运动计划，并生成 '+r.added+' 条打卡任务','ok');
    else U.toast('已添加到运动计划','ok');

  recExpress:function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
      U.toast('当前浏览器不支持录音，请改用「上传录音」','err'); return;
    }
    if(UI.__rec){ try{ UI.__rec.stop() }catch(e){} return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mr=new MediaRecorder(stream), chunks=[];
      mr.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data) };
      mr.onstop=function(){
        try{ stream.getTracks().forEach(function(t){ t.stop() }) }catch(e){}
        var blob=new Blob(chunks,{type:'audio/webm'}), r=new FileReader();
        r.onload=function(){
          var id=U.uid();
          S.files=S.files||{}; S.files[id]={id:id,name:'录音-'+U.today()+'.webm',mime:blob.type||'audio/webm',type:'audio',size:blob.size,createdAt:U.now(),data:r.result};
          DRAFT_FILES['express']=DRAFT_FILES['express']||[]; DRAFT_FILES['express'].push(id);

     B 档：点按钮才请求，复用 insight scene（后端已存在，一行不改）。

  wrongAIAsk:function(){

    UI.wrongAI={ busy:true, n:st.n };
    wrongAIPaint();
    AI.call('wrongAnalyze', AI.spots.wrongAnalyze, wrongAIPrompt(st), null, function(b){
      UI.wrongAI={ n:st.n, text:String(b.text||'').trim(), empty:!!b.empty, crisis:!!b.crisis };
      wrongAIPaint();
    }, function(msg){
      UI.wrongAI={ n:st.n, err:String(msg||'AI 暂时不可用') };
      wrongAIPaint();
    }, { framework:'default', count:st.n });

  /* ── 批次二：AI 回顾与洞察 ──────────────────────────────────────────
     ★ 架构约定（铁律 9）：这 12 个动作只做三件事 —— 改 UI 状态、发请求、写数据。
       结果一律交给 render() 重建，绝不在回调里直接改 DOM，

  aiRvTab:function(d){

       成本：那 0.1 秒里框架区显示"加载中…"，换来的是不打扰、零噪音。 */

  aiRvGran:function(d){ UI.reviewGran=(d&&d.v)||'week'; UI.reviewResult=null; render() },
  /* ── 批次五 · 阶段一：M1 月度情绪回顾 ────────────────────────────────
     B 档：点「AI 月度情绪回顾」才请求，复用 review scene。
     ★ 空月零请求：moodMonthText 返回 null（该月无心情也无想法）→ 直接拦截，零消耗。
     ★ 危机零请求：聚合里命中危机关键词 → 确定性渲染危机框，不调模型。
     ★ 结果绑定月份：UI.moodReview.ym 与当前显示月份一致才渲染；不一致（翻月）整段作废。
     ★ 8 条硬约束写进 prompt（不许编造/逐日解读/心理诊断贴标签/记录不足3天直说/想法非行动/平静朋友语气/不超300字/无记录只回一句）。
     ★ 危机不在这里拦截：那是后端 gateway 的职责（前端关键词匹配会把歌词/书摘误判成危机，
       也避免和后端搞成两套口径）。后端返回 crisis:true 时由渲染层出援助卡片。
     ★ 结果区用 moodReviewPaint() 局部重绘，不整页 render()。 */
  moodReviewAsk:function(){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var ym=UI.moodMonth||U.today().slice(0,7);
    var ag=AI.moodMonthText(ym);
    if(!ag){ U.toast(ym+' 还没有情绪记录，先记几天再来回顾','err'); return }   /* 空月：零请求 */
    var prompt=ag.text+
      '\n\n请基于上面的真实记录，做一份这个月的情绪回顾。\n'+
      '★ 硬约束（必须全部遵守）：\n'+
      '1. 不许编造我没给到的事件、原因或对话。\n'+
      '2. 不许逐日解读单个表情（上面是按天汇总的计数，不是逐日事件，不要据此推断某天发生了什么）。\n'+
      '3. 不许做任何心理诊断，不许给我贴标签（"你有抑郁倾向""你状态有问题"这类一律禁止）。\n'+
      '4. 如果本月记录不足 3 天，直接说"记录不多，先多记几天"，不要硬凑分析。\n'+
      '5. 想法只是想法和感悟，不是已完成的行动，不要当成"我做了什么"。\n'+
      '6. 语气像一位平静的朋友：描述事实 + 最多一个轻量观察，不评判、不说教、不喊口号。\n'+
      '7. 不超过 300 字。\n'+
      '8. 如果上面没有可分析的记录，只回一句"这个月暂时没有可回顾的情绪记录"。';
    UI.moodReview={ busy:true, ym:ym };
    moodReviewPaint();
    AI.call('moodReview', AI.spots.moodReview, prompt, null, function(b){
      var txt=String(b.text||'').trim();
      UI.moodReview={ ym:ym, text:txt, crisis:!!b.crisis, empty:!!b.empty };
      moodReviewPaint();
    }, function(msg){
      UI.moodReview={ ym:ym, err:String(msg||'AI 暂时不可用') };
      moodReviewPaint();
    });

  aiRvAsk:function(){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var g=UI.reviewGran||'week', win=AI.reviewWindow(g), cur=AI.reviewText(win);
    if(!cur.n){ U.toast(win.label+'还没有任何记录，先记点东西再来回顾','err'); return }
    /* count 是给后端的确定性事实：有没有数据不交给模型判断。
       上一版输入为空却输出"极高的执行失败率"，就是因为它把"没有记录"读成了"全是失败"。 */
    var extra={ gran:g, count:cur.n }, cmpLab='';
    if(UI.reviewCompare){
      var pw=AI.prevWindow(win,g), pv=AI.reviewText(pw);
      if(!pv.n) U.toast(pw.label+'没有记录，已改成只回顾本期','ok');
      else{
        extra.compare={ curRange:win.label+'（'+win.start+' ~ '+win.end+'）', cur:cur.text,
                        prevRange:pw.label+'（'+pw.start+' ~ '+pw.end+'）', prev:pv.text };
        cmpLab=' · 含与'+pw.label+'对比';
      }
    }
    UI.reviewResult={ busy:true, n:cur.n, label:win.label };
    render();
    AI.call('review', AI.spots.review, cur.text, null, function(b){
      UI.reviewResult={ text:String(b.text||''), n:cur.n, byDate:cur.byDate,
        label:win.label+'（'+win.start+' ~ '+win.end+'）'+cmpLab,
        crisis:!!b.crisis, empty:!!b.empty, degraded:!!b.degraded };
      render();
    }, function(msg){
      UI.reviewResult={ err:String(msg||'AI 暂时不可用'), n:cur.n, label:win.label };
      render();
    }, extra);
  },
  /* 「存为备忘」是本批次唯一会写 S 的动作 —— 必须走 afterChange()，
     否则不同步、不入库、刷新就没了。 */
  aiRvMemo:function(){
    var r=UI.reviewResult;
    /* 标签带粒度、不带日期。三个固定值，和洞察的「AI 洞察·框架名」同一套逻辑。
       为什么不统一成「AI 回顾」：那样今日 / 本周 / 近30天存进去全叫一个名字，分不清。
       为什么不带日期：带日期每存一次就是一个新标签，标签栏永远收敛不了（上一版踩过）。
       粒度只有 3 种 + 洞察 6 种 = 最多 9 个标签，会收敛。 */
    AI.saveMemo(r&&r.text, 'AI 回顾·'+AI.granLabel(UI.reviewGran||'week'));
  },

  /* ── 批次二 B2：书籍短评润色 ─────────────────────────────────
     B 档：点按钮才请求，复用 polish(150)。只把润色结果填回编辑弹窗的 #ebV，
     不自动落库（用户点「保存」才写回，和笔记润色同口径）。 */
  bookPolish:function(d){

    var ta=U.$('#ebV');

    var btn=U.$('#aiBtn_bookPolish');

    AI.call('bookPolish', AI.spots.bookPolish, prompt, btn, function(r){

     A 档：聚合用户真实书架喂给 guide，硬约束写进 prompt。

  bookSimilarAsk:function(){

      '\n★ 硬约束：只能推荐真实存在的书，禁止凭空编造书名或作者；如果我的书架里没有足够可关联的线索，就直接说「暂时没有可关联的」，不要硬凑。'+

  /* ── 第三批 · 阶段2：D1 今日执行顺序建议 ──────────────────────────
     B 档：点按钮才请求，复用 plan scene。
     ★ 硬约束：只让 AI 排顺序，不让它评价。prompt 里写死"只输出序号、禁止理由/点评"，
       前端再结构性丢弃 AI 原始文本（d1ResultHtml 只渲染序号→原标题），双重保险。
     ★ 兜底：d1Order 保证今日待办一个不少、一个不多。 */
  d1Ask:function(){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var T=U.today();
    /* 今日待办 = 今天未完成的计划项（含循环/目标拆解/读书联动等所有来源，
       因为用户要排的是"今天该做的事"，不只是自建项）。 */
    var todos=S.plans.filter(function(p){ return !p.done && p.date===T });
    if(!todos.length){ U.toast('今天还没有未完成的待办，加几条再来排','err'); return }
    var todayIds=todos.map(function(p){ return p.id });
    /* 给 AI 一份带 1-based 序号的清单，要求只回序号序列。
       注意：编号用的是「展示顺序」里的新下标，和 todayIds 数组下标一一对应。 */
    var numbered=todos.map(function(p,i){ return (i+1)+'. '+p.title }).join('\n');
    var prompt='今天我有以下 '+todos.length+' 件待办：\n'+numbered+
      '\n\n请按你建议的执行顺序排列它们，只输出一行序号（逗号分隔），例如「3,1,2」。'+
      '\n严禁输出任何理由、点评、建议或解释性文字，严禁评价我先做哪个后做哪个。只输出序号。';
    UI.d1Result={ busy:true };
    render();
    AI.call('planD1', AI.spots.planD1, prompt, null, function(b){
      var order=d1Order(String(b.text||''), todayIds);
      UI.d1Result={ order:order, label:T };
      render();
    }, function(msg){
      UI.d1Result={ err:String(msg||'AI 暂时不可用，可重试') };
      render();
    });
  },
  d1Clear:function(){ UI.d1Result=null; render() },

  /* ── 第三批 · 阶段3 · 批次一：N2 笔记费曼自测题 ──────────────────────
     B 档：从「⋯」菜单点「AI 自测题」才请求，复用 guide scene。
     ★ 硬约束（沿用 D1 教训）：只让 AI 出"考察是否真懂"的问题，prompt 写死"只输出题、不输导语/点评/评价"，
       前端再用 quizParse 结构性丢弃非问题行，双保险。
     ★ 宁可少出不许编：prompt 要求"内容太少就少出几道，不要硬凑"。 */
  noteQuiz:function(d){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var id=(d&&d.id)||(UI.noteQuiz&&UI.noteQuiz.id);
    var n=findIn(S.notes, id); if(!n) return;
    UI.openNote=id;                       /* 自测题渲染在展开的笔记卡片内，自动展开确保用户能看到结果 */
    if(!String(n.content||'').trim()){ U.toast('这条笔记正文还是空的，先写点东西','err'); return }
    var prompt='以下是一篇学习笔记的内容，请用「费曼学习法」为它生成自测题，检验我是否真懂了。\n\n'+
      '【笔记标题】'+String(n.title||'未命名')+'\n【笔记正文】\n'+String(n.content||'').slice(0,1500)+'\n\n'+
      '要求：\n1. 只输出自测题本身，每题一行（用 1. 2. 3. 编号），不要输出任何导语、解释或点评。\n'+
      '2. 题目要考察「是否真正理解」（能用自己的话讲清楚 / 能举例 / 能对比），而不是死记硬背的复述。\n'+
      '3. 出 3-5 道即可；如果笔记内容太少或太浅，就少出几道——不要硬凑篇幅。\n'+
      '4. 不要评价这份笔记写得好不好。';
    UI.noteQuiz={ busy:true, id:n.id };
    render();
    AI.call('noteQuiz', AI.spots.noteQuiz, prompt, null, function(b){
      var quiz=quizParse(String(b.text||''));
      if(!quiz.length){ UI.noteQuiz={ err:'AI 没产出可识别的题目，换个角度写写笔记再试' }; U.toast('没识别到题目，可重试','ok'); render(); return; }
      UI.noteQuiz={ id:n.id, quiz:quiz, checked:[] };
      render();
    }, function(msg){
      UI.noteQuiz={ err:String(msg||'AI 暂时不可用') };
      U.toast(String(msg||'AI 暂时不可用'),'err');
      render();
    });
  },
  noteQuizClear:function(){ UI.noteQuiz=null; render() },
  noteQuizCopy:function(d){
    var r=UI.noteQuiz; if(!r||!r.quiz||!r.quiz.length) return;
    copyText(r.quiz.map(function(q,i){ return (i+1)+'. '+q }).join('\n'));
  },
  quizToggle:function(d){
    var r=UI.noteQuiz; if(!r||!r.quiz) return;
    var i=parseInt(d&&d.i,10); if(isNaN(i)||!r.quiz[i]) return;
    if(!r.checked) r.checked=[];
    r.checked[i]=!r.checked[i];
    render();
  },

  /* ── 第三批 · 阶段3 · 批次一：D3 下周计划草案 ────────────────────────
     B 档：点「AI 起草下周计划」才请求，复用 plan scene，结果落 UI.aiSteps（与批次一目标拆解共用机制）。
     ★ 硬约束：只输出待办条目，不输出解释/点评；没参考信息就直说"暂时没有"，不硬凑。
     ★ 落点：UI.aiSteps + UI.aiStepsSrc='d3'，daily 视图 #aiPlanBox 复用 AI.stepsHtml() 展示，
       用户点「全部加入计划」即按 UI.aiPlanDdl(下周一) 批量入计划，零新增存储。
     ★ 确定性保障：真正空（既无待办也无目标）直接拦下不请求；AI 若回"信息太少"哨兵行，识别后清空不塞进计划。 */
  d3Ask:function(){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var T=U.today(), wkStart=U.addDays(T,-6);
    var pend=S.plans.filter(function(p){ return !p.done && p.date>=wkStart && p.date<=T })
                     .map(function(p){ return (p.pri||'P1')+' · '+p.title+(p.ddl&&p.ddl!==T?'（'+p.ddl+'）':'') });
    var goals=(S.goals||[]).map(function(g){
      var krs=(g.krs||[]).map(function(k){ return k.name||'' }).filter(function(x){ return x });
      return g.title+(krs.length?('：'+krs.join('、')):'');
    }).filter(function(x){ return x });
    if(!pend.length && !goals.length){ U.toast('本周还没有待办、也没有进行中的目标，先记点东西再来起草','err'); return }
    var prompt='以下是我的「本周待办」和「进行中的目标」，请帮我起草一份【下周计划】。\n\n'+
      (pend.length?('【本周未完成待办】\n'+pend.map(function(x){ return '- '+x }).join('\n')+'\n\n'):'')+
      (goals.length?('【进行中的目标】\n'+goals.map(function(x){ return '- '+x }).join('\n')+'\n\n'):'')+
      '要求：\n1. 只输出下周要做的「具体待办条目」，每条一行，不要输出任何解释、导语或点评。\n'+
      '2. 可以延续本周未完成的事项、围绕目标推进，但不要编造我没提过的任务。\n'+
      '3. 如果上面的参考信息很少（少于 3 条），就只输出一行「暂时没有可参考的待办，先手动加几条」——不要硬凑篇幅。\n'+
      '4. 条目控制在 5-10 条，具体可执行。';
    UI.aiStepsSrc='d3'; UI.aiSteps=[];        /* 先清掉旧结果（含可能残留的 goal 拆解），避免叠在一起 */
    UI.aiPlanDdl=nextMonday();
    UI.aiPlanPri=(U.$('#pPri')?U.$('#pPri').value:'P1')||'P1';
    UI.aiPlanTime='';
    AI.call('d3', AI.spots.d3, prompt, null, function(b){
      var steps=String(b.text||'').split(/\r?\n/).map(function(x){
        return x.replace(/^\s*[\-\*•]+\s*/,'')
                .replace(/^\s*\d+[\.、\)．]\s*/,'')
                .replace(/^\s*第[一二三四五六七八九十百\d]+[步项条章节][\.、\)．:：]?\s*/,'')
                .trim();
      }).filter(function(x){ return x && x.length>0 });
      if(!steps.length) steps=[String(b.text||'').trim()];
      /* 识别"信息太少"的兜底回复，不当成待办塞进计划（宁可少说不许编） */
      if(steps.length===1 && /暂时没有|先手动加|信息太少|不足以|不足\s*3/.test(steps[0])){
        UI.aiStepsSrc=null; UI.aiSteps=[];
        U.toast('AI 说参考信息太少，先手动加几条待办再来起草','ok');
        render(); return;
      }
      UI.aiSteps=steps; UI.aiStepsSrc='d3';
      render();
    }, function(msg){
      UI.aiStepsSrc=null; UI.aiSteps=[];
      U.toast(String(msg||'AI 暂时不可用'),'err');
      render();
    });
  },

  /* ── 第三批 · 阶段2：ME1 自动打标签（memo / notes） ──────────────────
     B 档：AI 分析出建议标签 → 弹窗让用户「采纳」才写入。
     ★ 双保险（用户划重点）：prompt 要求"只从已有标签选"，解析时再用 tagPool 过滤一遍，
       自由生成的标签一个都进不来，杜绝"标签栏爆炸"。
     ★ 只从已有标签列表选，不自由生成；采纳才写，不污染筛选栏。复用 title(150)。 */
  memoTag:function(d){ meTag(d, 'memo', S.memos) },
  noteTag:function(d){ meTag(d, 'notes', S.notes) },
  tagAdopt:function(){
    var s=UI.tagSuggest; if(!s||!s.tags||!s.tags.length){ closeModal(); return }
    var arr=(s.type==='memo')?S.memos:S.notes, it=findIn(arr,s.id);
    if(it){
      var merged=(it.tags||[]).slice();
      s.tags.forEach(function(t){ if(merged.indexOf(t)<0) merged.push(t) });
      it.tags=merged;

    }
    UI.tagSuggest=null; closeModal(); afterChange();

  /* 「聚类结果可点开看那天」—— 点结果里的日期 chip，弹出那天参与分析的全部原文。
     ★ 这是前端确定性展示：不管模型怎么排版，byDate 是我们在聚合时自己留的索引。 */
  insightDate:function(d){
    var k=d&&d.d; if(!k) return;
    var r=(UI.aiReviewTab==='insight')?UI.insightResult:UI.reviewResult;
    var arr=(r&&r.byDate&&r.byDate[k])||[];
    var body=arr.length
      ? '<div class="list">'+arr.map(function(x){
          return '<div class="item"><div class="it-body"><div class="it-title" style="font-size:.86rem">'+U.esc(x)+'</div></div></div>'
        }).join('')+'</div>'
      : '<p class="sec-sub">这天没有参与本次分析的记录。</p>';
    openModal(k+' 记了什么', body+
      '<p class="sec-sub" style="margin-top:10px">共 '+arr.length+' 条 · 这就是喂给 AI 的原文，AI 只能基于这些说话。</p>',
      '<button class="btn" data-act="closeModal">关闭</button>');
  },
  aiStepsAddAll:function(){
    var steps=(UI.aiSteps||[]).slice();
    if(!steps.length){ U.toast('没有可加入的步骤','err'); return }
    var pri=UI.aiPlanPri||'P1', ddl=UI.aiPlanDdl||U.today(), time=UI.aiPlanTime||'';
    steps.forEach(function(t){
      S.plans.push({ id:U.uid(), title:t, pri:pri, ddl:ddl, time:time,
        done:false, date:ddl, createdAt:U.now(), type:'once' });

  aiStepAdd:function(d){
    var i=parseInt(d&&d.i,10);
    var steps=UI.aiSteps||[];
    if(isNaN(i)||!steps[i]) return;
    var t=steps[i];

      time:UI.aiPlanTime||'', done:false, date:UI.aiPlanDdl||U.today(), createdAt:U.now(), type:'once' });
    steps.splice(i,1);

  aiStepsClear:function(){ UI.aiSteps=[]; UI.aiStepsSrc=null; render(); U.toast('已清空拆解结果','ok') },
  closeSearch:function(){ closeSearch() },
  clearSearch:function(){
    UI.gsQ=''; var i=U.$('#gsInput'); if(i){ i.value=''; try{ i.focus() }catch(e){} }

  gsGo:function(d){
    var src=SEARCH_SRC[parseInt(d.si,10)];
    if(!src) return;
    closeSearch();
    /* 先把子页拨到位，再切模块 —— 顺序反了会跳到一个看不见目标的 tab 上。
       把 d（命中的那个 .gs-item 按钮）透传给 tab：心情日记这类「按日期归档」的模块
       需要知道目标落在哪一天，否则会停在今天、定位不到那条。老 tab 都不接参数，不受影响。 */
    if(src.tab){ try{ src.tab(d) }catch(e){} }

  /* 每日技巧收藏 → 落进【收藏】下的二级 tab。★ 历史 bug，改这块必须回归：
     第五轮 A-1：原来不管什么内容都写死 cat:'实用技巧'，导致「提示词模板库」永远为空
                 → 现在按该条 kind 落到分类：提示词模板 / 实用技巧。
     第五轮修复 1：原来不管 kind 是什么，一律写进 S.tips。
                 但两个子页读的是两个不同数组 ——
                   提示词模板库 → S.prompts，使用技巧心法 → S.tips
                 存错数组，模板类内容全躺在 S.tips 里，模板库永远是空的。
                 → 现在按 kind 分流写入；取消收藏时两个数组都查，否则取消模板类收藏会找不到。
     第十轮（阶段二）：这两个数组的位置没变，变的只是它们在【收藏】下各占一个二级 tab。

  aigFavTip:function(){

    var iP=idxOf(S.prompts), iT=idxOf(S.tips);

  doExport:function(){
    var sc=UI.exp.scope, fmt=UI.exp.fmt, date=U.today(), name, payload, rows;
    if(sc==='notes'){ rows=S.notes.map(function(n){ return {标题:n.title,标签:(n.tags||[]).join(';'),更新:(n.updatedAt||'').slice(0,10),正文:n.content||''} }) }
    else if(sc==='excerpt'){ rows=S.excerpts.map(function(e){ return {正文:e.text,出处:e.source||'',分类:e.cat||'',时间:(e.createdAt||'').slice(0,10)} }) }
    else if(sc==='books'){ rows=S.books.map(function(b){ return {书名:b.title,作者:b.author||'',状态:b.status||'',评分:b.rating||'',进度:b.progress||'',短评:(b.review||'').replace(/\s+/g,' '),开始:(b.started||'').slice(0,10),读完:(b.finished||'').slice(0,10)} }) }
    else { rows=null }
    if(fmt==='csv'){
      if(sc==='all'){
        rows=[]; S.notes.forEach(function(n){ rows.push({类型:'学习笔记',标题:n.title,内容:n.content||''}) });
        S.excerpts.forEach(function(e){ rows.push({类型:'摘抄',标题:'',内容:e.text}) });
        S.books.forEach(function(b){ rows.push({类型:'读书',标题:b.title,内容:(b.review||'')}) });

      } else { name='工作台-'+(sc==='notes'?'学习笔记':sc==='excerpt'?'摘抄本':'读书记录')+'-'+date+'.csv'; }
      if(!rows||!rows.length){ U.toast('该范围暂无数据','err'); return }
      payload=toCSV(rows);
    } else {
      var o = sc==='all' ? S : ({__wb:1,__ver:S.__ver,__exportedAt:U.now(),scope:sc,
        notes:sc==='notes'?S.notes:undefined, excerpts:sc==='excerpt'?S.excerpts:undefined, books:sc==='books'?S.books:undefined});

      payload=JSON.stringify(o,null,2);

  testNotify:function(){
    /* 修复：不再绕 NOTIFY.ask() 间接请求权限，改为直接调用 requestPermission()，
       避免 ask() 内部的权限竞态把"已授权"误判为"未授权"。 */
    // 1. Notification API 不可用
    if(typeof Notification === 'undefined'){
      U.toast('当前浏览器不支持通知 API，请升级浏览器或检查安全设置','err');
      return;
    }
    // 2. 已授权：直接发送
    if(Notification.permission === 'granted'){
      /* fire 现在优先走 SW，是异步的，必须用回调拿结果 */
      NOTIFY.fire('工作台测试提醒','如果你看到这条系统通知，说明推送链路正常。','test', function(ok){
        U.toast(ok ? '已发送测试通知，请在通知栏查看' : '通知发送失败，请看控制台日志', ok?'ok':'err');
        render();
      });
      return;
    }
    // 3. 已被拒绝：给出明确的人工开启路径
    if(Notification.permission === 'denied'){
      U.toast('通知权限已被拒绝。请在浏览器设置 → 站点设置 → 通知 → 允许','err');
      return;
    }
    // 4. 尚未决定（default）：主动弹出授权请求
    U.toast('正在请求通知权限，请在弹出的对话框中点击「允许」','');
    Notification.requestPermission().then(function(p){
      if(p === 'granted'){
        U.toast('通知权限已授权，正在发送测试通知…','ok');
        /* 延迟 300ms 确保 Notification.permission 属性已同步，再发通知 */
        setTimeout(function(){
          /* fire 现在优先走 SW，是异步的，必须用回调拿结果 */
          NOTIFY.fire('工作台测试提醒','如果你看到这条系统通知，说明推送链路正常。','test', function(ok){
            U.toast(ok ? '已发送测试通知，请在通知栏查看' : '通知发送失败，请看控制台日志', ok?'ok':'err');
            render();   // 刷新设置页的权限状态 chip
          });
        }, 300);
      } else {
        U.toast('未获得通知权限。请在浏览器设置 → 站点设置 → 通知 → 允许','err');
        render();
      }
    }).catch(function(e){
      U.toast('请求通知权限时出错：'+((e&&e.message)||e),'err');
      console.error('[NOTIFY] requestPermission 异常:', e);
    });
  },

     videoTitlePrompt：让「AI 起标题」也能读到要点（标题 + 要点截断 300 字）。纯增量，
     没有 promptFor 的入口行为一字不变。
     videoScriptInner / videoScriptPaint：结果区局部重绘（只改结果容器，不整体 render ——
     整体 render 会重建表单，把用户刚填的标题 / 要点 / 链接全清空）。一个函数同时服务
     手动添加区的 #videoScriptBox 与编辑弹窗里的 #evScriptBox。 */
  vAdd:function(){
    var title=val('vTitle'); if(!title){ U.toast('请填写视频名称','err'); return }
    var cat=val('vCat')||'其他', src=val('vSrc')||'';
    /* 第九轮修复 2.2：**无条件**清洗，不再写 if(!url) 那种"仅在为空时兜底"。
       问题就出在那儿 —— 链接框里是整段分享文案（非空但无效），
       兜底被跳过，整串「🐛 https://x/xxx 复制这段…」被原样存进库。
       现在不管 url 里是什么先抠一次，抠不到再从标题、备注、作者里找。 */
    var url=cleanUrl(val('vUrl')) || cleanUrl(val('vTitle'), val('vNote'), val('vAuth')) || '';
    var dup=(S.videos||[]).filter(function(x){
      if(url&&x.url&&x.url===url) return true;
      return !!(title&&(x.title||'').trim()===title.trim());
    })[0];
    if(dup){ U.toast('已存在，无需重复添加','ok'); return }
    S.videos=S.videos||[];
    S.videos.push({
      id:U.uid(), title:title, url:url, duration:U.num(val('vDur'))||0,
      cat:cat, source:src, author:val('vAuth'), note:val('vNote'),
      brief:val('vBrief')||'', script:(UI.videoScript&&UI.videoScript.text)||'',
      fav:false, manual:true, src:'manual', checkins:{}, addedAt:U.now()
    });
    UI.videoScript=null;   /* 会话态不进 S、不进备份：落库后即清，避免污染下次添加 */
    afterChange(); U.toast('已添加到锻炼打卡','ok');
  },
  vFav:function(d){
    var v=anyVideoById(d.id); if(!v) return;
    var own=findIn(S.videos,d.id);
    if(!own){ v=materializeVideo(d.id); if(!v){ U.toast('收藏失败','err'); return } }
    v.fav=!v.fav; afterChange(); U.toast(v.fav?'已收藏，可在「锻炼打卡」找到':'取消收藏','ok');
  },

    var own=findIn(S.videos,d.id);
    if(!own){ v=materializeVideo(d.id); if(!v){ U.toast('操作失败','err'); return } }
    v.checkins=v.checkins||{}; var T=U.today();
    if(v.checkins[T]){ delete v.checkins[T]; afterChange(); U.toast('已取消今日打卡','ok'); return }
    v.checkins[T]=U.now();
    /* 自动写入健康打卡：运动完成记录 */
    S.healthItems=S.healthItems||[];
    var exists=S.healthItems.some(function(h){ return h.name==='完成一次运动' });
    if(!exists){
      S.healthItems.push({id:U.uid(),name:'完成一次运动',cat:'运动',time:'',freq:'daily',note:'视频打卡自动同步',sync:'video',doneDates:[],createdAt:U.now()});
    }
    var syncItem=S.healthItems.find(function(h){ return h.name==='完成一次运动' });

  vDel:function(d){
    var v=findIn(S.videos,d.id); if(!v) return;
