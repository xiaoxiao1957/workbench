      S.videos=S.videos.filter(function(x){ return x.id!==d.id });
      afterChange(); U.toast('已删除','ok');
    });
  },
  /* ── 批次五 · 阶段二：视频脚本 ───────────────────────────────────────
     B 档：点「AI 写脚本」才请求，复用 script scene。
     ★ 空输入零消耗：标题和要点都为空 → 不请求、toast、零消耗（沿用 B1 空书架不请求）。
     ★ 有标题没要点 → 不拦，但 toast 提醒"只能写出通用稿"。
     ★ 结果区局部重绘（videoScriptPaint）：整体 render 会清空刚填的标题/要点/链接。
     ★ 哨兵：模型回"先补充要点再写脚本"当空结果（要点还太少），不当脚本渲染。
     ★ 落库：生成的脚本随 vAdd 一起进 S.videos[].script（零新增顶层键），落库后清会话态。 */
  videoScriptAsk:function(){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var title=val('vTitle'), brief=val('vBrief');
    if(!title && !brief){ U.toast('先填视频名称或要点，AI 才好写脚本','err'); return }   /* 零消耗 */
    if(title && !brief) U.toast('没写要点，只能写出通用稿，先补要点更准','ok');
    var p=videoScriptPrompt();
    UI.videoScript={ busy:true };
    videoScriptPaint();
    var self=this;
    AI.call('videoScript', AI.spots.videoScript, p.prompt, null, function(b){
      var txt=String(b.text||'').trim();
      if(!txt || VIDEO_SCRIPT_EMPTY_RE.test(txt)){ UI.videoScript={ empty:true }; videoScriptPaint(); U.toast('要点还太少，先补充再写脚本','ok'); return }
      UI.videoScript={ text:txt };
      videoScriptPaint();
    }, function(msg){
      UI.videoScript={ err:String(msg||'AI 暂时不可用') }; videoScriptPaint();
    });
  },
  videoScriptCopy:function(){ var r=UI.videoScript; if(!r||!r.text) return; copyText(r.text) },
  videoScriptMemo:function(){ var r=UI.videoScript; if(!r||!r.text) return; AI.saveMemo(r.text,'视频脚本') },
  videoScriptClear:function(){ UI.videoScript=null; videoScriptPaint() },
  /* ── 批次五 · 阶段三：视频编辑 ───────────────────────────────────────
     补全 S.videos 只能增删的缺口：标题/链接/时长/分类/平台/作者/备注/要点都可改，
     已有脚本用只读区块展示（脚本是 AI 产出，手改后再生成会覆盖，用户会以为内容丢了）。
     弹窗内「重新生成脚本」复用 videoScriptPrompt 的构造，结果**写回这条已有视频记录**
     （afterChange 落库），不是只进 UI 会话态。 */
  vEdit:function(d){
    var v=findIn(S.videos,d.id); if(!v) return;
    openModal('编辑视频',
      '<div class="field"><label class="fl">标题</label><input id="evT" value="'+U.esc(v.title||'')+'"></div>'+
      '<div class="row"><div style="flex:2"><label class="fl">链接</label><input id="evUrl" value="'+U.esc(v.url||'')+'"></div>'+

      '<div class="row"><div><label class="fl">分类</label><select id="evCat">'+FIT_CATS.filter(function(c){ return c!=='全部' }).map(function(c){ return '<option'+(v.cat===c?' selected':'')+'>'+c+'</option>' }).join('')+'</select></div>'+
        '<div><label class="fl">平台</label>'+platSelect('evSrc', v.source||'B站','')+'</div>'+
        '<div><label class="fl">作者</label><input id="evAuth" value="'+U.esc(v.author||'')+'"></div></div>'+
      '<div class="field"><label class="fl">备注</label><input id="evNote" value="'+U.esc(v.note||'')+'"></div>'+
      '<div class="field"><label class="fl">要点 / 素材</label><textarea id="evBrief" style="min-height:80px">'+U.esc(v.brief||'')+'</textarea></div>'+
      (v.script?'<div class="field"><label class="fl">已有脚本（AI 生成，只读）</label><div class="ro-box" id="evScriptRO">'+U.esc(v.script)+'</div><div class="hint-sm">脚本由 AI 生成，重新生成会覆盖此处内容。</div></div>':'')+
      '<div id="evScriptBox"></div>',
      '<button class="btn" data-act="closeModal">取消</button>'+
      '<button class="btn btn-sm btn-ai" data-act="evScriptAsk" data-id="'+v.id+'">'+svg('sparkle','ic-sm')+'重新生成脚本</button>'+
      '<button class="btn btn-primary" data-act="evSave" data-id="'+v.id+'">保存</button>');
  },
  evSave:function(d){
    var v=findIn(S.videos,d.id); if(!v) return;
    v.title=val('evT')||v.title; v.url=val('evUrl')||''; v.duration=U.num(val('evDur'))||0;
    v.cat=val('evCat')||v.cat; v.source=val('evSrc')||v.source; v.author=val('evAuth'); v.note=val('evNote'); v.brief=val('evBrief');
    closeModal(); afterChange(); UI.videoScript=null; U.toast('已保存','ok');
  },
  evScriptAsk:function(d){
    if(AI.busy){ U.toast('AI 正在思考中，稍等一下','ok'); return }
    var v=findIn(S.videos,d.id); if(!v) return;
    var title=val('evT'), brief=val('evBrief');
    if(!title && !brief){ U.toast('标题和要点都为空，先填一点再生成脚本','err'); return }   /* 零消耗 */
    if(title && !brief) U.toast('没写要点，只能写出通用稿，先补要点更准','ok');
    var meta=[]; if(val('evDur')) meta.push('时长：'+val('evDur')+' 分钟'); if(val('evCat')) meta.push('分类：'+val('evCat')); if(val('evSrc')) meta.push('平台/来源：'+val('evSrc'));
    var prompt='我要做一条视频，请帮我写口播脚本。\n【主题】'+(title||'（未填）')+'\n';
    if(brief) prompt+='【要点 / 素材】\n'+brief.slice(0,800)+'\n';
    if(meta.length) prompt+='【其他信息】'+meta.join('；')+'\n';
    prompt+='\n★ 硬约束：\n1. 不许编造数据、案例、对话或事实。\n2. 结构化输出：开头抓人→主体分点→结尾收束，并标注每部分时长占比。\n3. 不写导语客套话，直接给脚本。\n4. 如果要点太少撑不起一条视频，直接说"要点还太少，先补充再写脚本"，不要硬凑。\n5. 口吻贴合要点里写的受众与语气。\n6. 中文不超过 900 字。\n7. 如果主题和要点都没填，只回一句"先补充要点再写脚本"。';
    UI.videoScript={ busy:true };
    videoScriptPaint();
    var self=this;
    AI.call('videoScript', AI.spots.videoScript, prompt, null, function(b){
      var txt=String(b.text||'').trim();
      if(!txt || VIDEO_SCRIPT_EMPTY_RE.test(txt)){ UI.videoScript={ empty:true }; videoScriptPaint(); U.toast('要点还太少，先补充再写脚本','ok'); return }
      v.script=txt; afterChange();          /* ★ 写回这条已有视频记录，刷新不丢 */
      UI.videoScript={ text:txt };
      videoScriptPaint();
    }, function(msg){
      UI.videoScript={ err:String(msg||'AI 暂时不可用') }; videoScriptPaint();
    });
  },

     导致打卡总览里除了今天全是空的。这里新增 doneDates 日期数组，往后每次打卡都留痕。

  toggleHealthItem:function(d){
    var h=findIn(S.healthItems,d.id); if(!h) return;
    var T=U.today();
    if(!Array.isArray(h.doneDates)) h.doneDates=h.lastDoneDate?[h.lastDoneDate]:[];

      h.lastDoneDate='';
      h.doneDates=h.doneDates.filter(function(x){ return x!==T });
      U.toast('已取消今日打卡','ok');
    } else {
      h.lastDoneDate=T;
      if(h.doneDates.indexOf(T)<0) h.doneDates.push(T);
      if(h.doneDates.length>400) h.doneDates=h.doneDates.slice(-400);

  hOpen:function(d){

    /* 第六轮修复 3：图文/文字条目的正文里常粘着一条小红书/抖音链接，
       以前只是纯文本，看得见点不动；现在自动渲染成可点击链接，并在底部给「在 APP 中打开」。
       第八轮修复 3：跳转能力只看 url 是否非空，**不再看 type**。
       用户选「文字/图文」但填了链接时，以前没有跳转入口。
       这里还从正文/标题里兜底抠一次 —— 老数据是 url 字段为空、链接只躺在正文里的，
       这样它们也能拿到跳转按钮，不需要重新添加一遍。 */
    /* 第九轮修复 2/4：这里也用 cleanUrl（match 抠子串），不再用 test 判断整串，
       并且 url **非空但无效**（整段文案）时同样要救回来。 */
    var url=cleanUrl(t.url, t.body, t.title);
    if(url && url!==t.url){ t.url=url; afterChange() }   /* 回填一次，下次直接命中 */
    openModal(t.title,
      '<div class="hint" style="margin-bottom:10px">'+U.esc(t.cat||'')+' · '+hTypeLabel(t)+' · 来源 '+U.esc(t.source||'原创')+'</div>'+
      '<div style="white-space:pre-wrap;line-height:1.7;font-size:.94rem;word-break:break-word">'+autolink(t.body||'')+'</div>',
      '<button class="btn" data-act="closeModal">关闭</button>'+
      (url?'<button class="btn btn-primary" data-act="openTipInApp" data-id="'+t.id+'">'+svg('up','ic-sm')+' 在 APP 中打开</button>':''));
  },
  /* 复用问题 1 修好的跳转逻辑：有原始链接就先用链接唤起 APP */
  openTipInApp:function(d){
    var t=findIn(S.healthTips,d.id); if(!t) return;
    closeModal();
    openInApp({ title:t.title, t:t.title, cat:t.cat||'', url:t.url||'',
                kw:t.kw||t.title, plat:t.plat||t.source||'', source:t.plat||t.source||'' });

  hMove:function(d){

    openModal('移动分类','<div class="field"><label class="fl">选择新分类</label><select id="hmCat">'+HEALTH_TIP_CATS.filter(function(c){ return c!=='全部' }).map(function(c){ return '<option value="'+c+'"'+(t.cat===c?' selected':'')+'>'+c+'</option>' }).join('')+'</select></div>',
      '<button class="btn" data-act="closeModal">取消</button>'+
      '<button class="btn btn-primary" data-act="saveHealthTipCat" data-id="'+d.id+'">保存</button>');
  },
  saveHealthTipCat:function(d){

    t.cat=val('hmCat'); afterChange(); closeModal(); U.toast('已移动','ok');

};


/* ---------------- 26. 事件绑定 ---------------- */
function bind(){
  document.addEventListener('click', function(ev){
    var go=ev.target.closest?ev.target.closest('[data-go]'):null;
    var ac=ev.target.closest?ev.target.closest('[data-act]'):null;
    if(ac){
      ev.preventDefault();
      var fn=ACT[ac.getAttribute('data-act')];
      if(fn){
        var d={ id:ac.getAttribute('data-id'), v:ac.getAttribute('data-v'), k:ac.getAttribute('data-k'), t:ac.getAttribute('data-t'), i:ac.getAttribute('data-i') };
        /* 通用转发：把元素上其余的 data-* 属性一并带上（短横线转小驼峰，如 data-sid → d.sid）。
           原因：以前这里逐个登记 data-id/v/k/t/i，漏掉的 data-st / data-sid / data-s / data-c / data-d
           全是 undefined，导致 goSource 跳转、摘抄收录出处、练嘴素材打卡等动作静默失效。 */
        try{
          var ats=ac.attributes;
          for(var ai=0; ai<ats.length; ai++){
            var an=ats[ai].name;
            if(an.indexOf('data-')!==0 || an==='data-act') continue;
            var key=an.slice(5).replace(/-([a-z0-9])/g, function(_,c){ return c.toUpperCase() });
            if(d[key]===undefined) d[key]=ats[ai].value;
          }
        }catch(e){}
        /* ★ this 必须绑到 ACT。原来写成 fn(d, ac) 裸调，严格模式下 this 是 undefined，
           ACT 方法里凡是写 var self=this 的（AI 拆解 / 风险分析 / 练嘴素材）全会在回调里炸。
           绑上之后，任何 ACT 方法内部都能用 this 拿到兄弟方法。 */
        fn.call(ACT, d, ac);
      }
      return;
    }
    if(go){ ev.preventDefault(); go2(go.getAttribute('data-go')); return }
    if(ev.target.id==='mask') closeModal();
  });
  /* 第六轮修复 4：输入即记草稿（防抖落盘）。input 在输入框上冒泡，
     一次委托覆盖全部模块的全部输入框，不需要逐个绑定。
     不进草稿的：密码 / 文件 / 日期 / 复选单选（见 isDraftable）。 */
  document.addEventListener('input', function(ev){
    var t=ev.target;
    /* 应用密码：按安全设计**不进草稿、不落盘**（isDraftable 排除 type=password），
       但要在内存里留一份副本 —— 页面重绘时用它回填。
       为什么需要：用户「先填密码、再开同步开关」时，开关会触发 render 重建整个表单，
       密码框重建后回到「已保存值」（此时还没保存，就是空），刚填的密码就白填了，
       接着点保存 / 测试连接发出去的是空密码，网盘回 401。
       这只是内存变量（和 UI.__play 同类），刷新页面即消失，不会写进 localStorage。 */
    if(t&&t.id==='wdPass') UI.__wdPass=t.value;
    /* 同步密钥同理：不进草稿，但留内存副本，避免「先填密钥再开开关」时白填 */
    if(t&&t.id==='wdToken') UI.__wdToken=t.value;
    if(!isDraftable(t)) return;
    draftSet(draftKeyOf(t), t.value==null?'':t.value);
  });
  /* 粘贴分享文案时自动抠出链接、并把「来源」下拉框选到对应平台。
     一次委托覆盖 vUrl / htUrl / htBody / vTitle / htTitle，不需要等 DOM 重建后再逐个绑定。
     第八轮修复 1：取消 onlyIfPure。现在分两种情形：
       · 粘进「链接框」→ 只留纯链接（这是链接框，本来就该只有链接）
       · 粘进「正文框 / 标题框」→ 链接填进对应的 url 字段，当前框的内容按原样保留
         （正文一字不动；标题额外去掉链接和平台话术，留下干净名称）
     没抠到链接时一律不拦截，交给浏览器默认粘贴。 */
  document.addEventListener('paste', function(ev){
    var t=ev.target; if(!t||!t.id) return;
    var cfg=PASTE_URL_FIELDS[t.id]; if(!cfg) return;
    var txt='';
    try{ txt=((ev.clipboardData||window.clipboardData).getData('text')||'') }catch(e){ txt='' }
    if(!txt) return;
    var u=extractUrl(txt);
    if(!u) return;                                   /* 没抠到链接 → 维持浏览器默认粘贴行为 */

    var to=cfg.to?document.getElementById(cfg.to):null;

    /* ① 粘的就是链接框：只留纯链接（链接框本来就不该有别的东西） */
    if(!to){
      ev.preventDefault();
      t.value=u; draftSet('#'+t.id, u);
      var p=syncPlatSelect(cfg.src, u);
      U.toast(p?'已提取链接，来源设为 '+p:'已提取链接','ok');
      return;
    }

    /* ②③④ 的共同一步：把链接填进对应的 url 字段。
       已有正经链接就不覆盖，免得冲掉用户手填的。 */
    var old=to.value;
    /* 第九轮修复 2：只有「已经是一个像样的纯链接」才不覆盖。
       以前写 !/^https?:\/\//i.test(old)，链接框里是整段文案时 test 为真 → 不覆盖，
       于是整段文案就一直躺在 url 字段里。 */
    if(!isValidUrl(old)){ to.value=u; draftSet('#'+cfg.to, u) }
    var p2=syncPlatSelect(cfg.src, u);

    /* ③ 标题框：把整段文案清理成干净标题（去掉链接和「复制此链接…」那套话术） */
    if(t.id==='vTitle'||t.id==='htTitle'){
      var cleaned=cleanShareTitle(txt);
      if(cleaned){
        ev.preventDefault();
        t.value=cleaned; draftSet('#'+t.id, cleaned);
        U.toast(p2?'链接已填入，来源设为 '+p2:'链接已填入','ok');
        return;
      }
      /* 清理后为空（比如粘的本来就只有一个裸链接）→ 不拦，让原样进去，用户自己改 */
    }
    /* ④ 正文框：**不调用 preventDefault** —— 交给浏览器把整段文案原样粘进来，
       一字不动。链接已经在上面填进 url 字段了，正文不需要动。 */
    U.toast(p2?'链接已填入「链接」框，来源设为 '+p2:'链接已填入「链接」框','ok');
  });
  /* 第九轮修复 3.2：input 事件防抖兜底清洗。
     安卓很多第三方输入法有「剪贴板面板」，用户点一下插入文本，
     触发的是 **input 而不是 paste** —— 第八轮写的 paste 处理压根不会执行，
     这正是真机上链接框一直是整段文案的主因（我的测试用合成 ClipboardEvent，
     把 paste 分支测通了，反而没覆盖到这条真机路径）。
     链接框：直接把整段文案替换成纯链接。
     标题/正文框：只把链接填进对应的 url 字段，当前框一个字都不动 ——
     填的是**别的**输入框，不会打断用户正在打的字，所以这两类也一起做。
     只有「清理标题」这一步留给 change（失焦时），避免打字途中标题被改写。 */
  var __cleanTimer=null;
  document.addEventListener('input', function(ev){
    var t=ev.target;
    if(!t||!t.id) return;
    var cfg=PASTE_URL_FIELDS[t.id];
    if(!cfg) return;
    if(__cleanTimer) clearTimeout(__cleanTimer);
    __cleanTimer=setTimeout(function(){
      __cleanTimer=null;
      try{
        if(document.activeElement!==t) return;  /* 已失焦 → 交给 change */
        cleanUrlField(t, cfg, true);
      }catch(e){}
    },700);
  });
  /* 备忘录页内搜索：输入即筛（150ms 防抖）。
     只重绘列表区、不整页 render —— 整页重建会把搜索框一起重建，正在打的字和光标都会丢。
     纯前端过滤，不调 AI、不消耗额度。 */
  var _memoQT=null;
  document.addEventListener('input', function(ev){
    var t=ev.target;
    if(!t||t.id!=='memoQ') return;
    UI.filters.memoQ=t.value;
    if(_memoQT) clearTimeout(_memoQT);
    _memoQT=setTimeout(function(){ _memoQT=null; memoRenderList() },150);
  });
  /* change 事件委托：日期选择器 + 重复规则展开（避免在 IIFE 内联 onchange 不可用） */
  document.addEventListener('change', function(ev){
    var t=ev.target; if(!t) return;
    /* 下拉框在部分浏览器/输入法下不触发 input，这里补记一次草稿 */
    if(isDraftable(t)) draftSet(draftKeyOf(t), t.value==null?'':t.value);
    /* 第九轮修复 3.1：change 时先**清洗链接框本身**，再同步来源。
       原来只同步了来源、没动链接框，于是「来源」是对的、链接框里却还是整段文案
       （用户截图里正是这个现象），保存时整串文案被存进 url。 */
    var pcfg=PASTE_URL_FIELDS[t.id];
    if(pcfg) cleanUrlField(t, pcfg);
    if(t.matches&&t.matches('.wk-pick input[type=checkbox]')){
      var lab=t.closest('.wk-pick'); if(lab) lab.classList.toggle('on', t.checked); return;
    }
    if(!t.id) return;
    if(t.id==='dayPicker'){ ACT.pickDay() }
    else if(t.id==='fitDayPicker'){ ACT.pickFitDay() }
    else if(t.id==='pRepeat'||t.id==='epRepeat'||t.id==='exRepeat'){ onRepeatChange(t) }
  });
  U.$('#moreClose').addEventListener('click', closeSheet);
  U.$('#sbTop').addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}) });
  /* 抽屉 / 折叠 */
  var fab=U.$('#sbFab'), mask=U.$('#sbMask'), handle=U.$('#sbHandle');
  if(fab) fab.addEventListener('click', toggleDrawer);
  if(mask) mask.addEventListener('click', closeDrawer);
  if(handle) handle.addEventListener('click', toggleCollapse);
  /* 全局悬浮添加按钮 */
  var gFab=U.$('#globalFab');
  if(gFab){
    gFab.addEventListener('click', function(ev){
      ev.stopPropagation();
      openFabMenu(gFab);
    });
  }
  document.addEventListener('keydown', function(ev){
    if((ev.ctrlKey||ev.metaKey) && ev.key==='.'){ ev.preventDefault(); var f=U.$('#globalFab'); if(f) f.click() }
  });
  /* 导航拖拽排序（桌面端拖拽 / 移动端用 ↑ 置顶） */
  var DRAG=null;
  document.addEventListener('dragstart', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el){ DRAG=el.getAttribute('data-go'); el.classList.add('dragging') }
  });
  document.addEventListener('dragend', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el) el.classList.remove('dragging');
    U.$$('.nav-item[data-go]').forEach(function(n){ n.classList.remove('drag-over'); n.style.boxShadow='' });
    DRAG=null;
  });
  document.addEventListener('dragover', function(e){
    if(!DRAG) return;
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    if(el && el.getAttribute('data-go')!==DRAG){ e.preventDefault(); el.classList.add('drag-over') }
  });
  document.addEventListener('dragleave', function(e){
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null; if(el) el.classList.remove('drag-over');
  });
  document.addEventListener('drop', function(e){
    if(!DRAG) return;
    e.preventDefault();
    var el=e.target.closest?e.target.closest('.nav-item[data-go]'):null;
    U.$$('.nav-item[data-go]').forEach(function(n){ n.classList.remove('drag-over'); n.style.boxShadow='' });
    if(el && el.getAttribute('data-go')!==DRAG){ reorderNav(DRAG, el.getAttribute('data-go')) }
    DRAG=null;
  });
  document.addEventListener('keydown', function(ev){
    var t=ev.target;
    if(!t||!t.id) return;
    var enter=ev.key==='Enter';
    var mod=ev.ctrlKey||ev.metaKey;
    if(enter&&!mod){
      if(t.id==='pTitle'){ ev.preventDefault(); ACT.addPlan() }
      else if(t.id==='nQ'){ ev.preventDefault(); ACT.searchNotes() }
      else if(t.id==='aiQ'){ ev.preventDefault(); ACT.searchAi() }
      else if(t.id==='bTitle'||t.id==='bAuthor'){ ev.preventDefault(); ACT.addBook() }
      else if(t.id==='exName'){ ev.preventDefault(); ACT.addEx() }
      else if(t.id==='qTitle'){ ev.preventDefault(); var b=U.$('[data-act="qAddSave"]'); if(b) b.click() }
      else if(t.id==='cmName'){ ev.preventDefault(); ACT.cmCreate() }
    }
    if(enter&&mod){
      if(t.id==='mText'){ ev.preventDefault(); ACT.addMemo() }
      else if(t.id==='iText'){ ev.preventDefault(); ACT.addInspire() }
      else if(t.id==='xText'){ ev.preventDefault(); ACT.addExc() }
      else if(t.id==='thText'){ ev.preventDefault(); ACT.moodThAdd() }
      else if(t.id==='eRef'){ ev.preventDefault(); ACT.addExp() }
      else if(t.id==='cmText'){ ev.preventDefault(); var a=U.$('[data-act="cmAdd"]'); if(a) a.click() }
    }
    /* ESC 优先关搜索面板，其次才是弹窗 / 抽屉 */
    if(ev.key==='Escape'){ if(isSearchOpen()){ closeSearch(); return } closeModal(); closeSheet() }
  });
  window.addEventListener('focus', function(){ if(S&&S.settings.notify.enabled) NOTIFY.check() });
  document.addEventListener('visibilitychange', function(){
    /* 第六轮修复 4：切后台先把草稿落盘（不等防抖），这样 APP 被强杀也丢不了；
       切回前台照常跨天检查 + 重绘，重绘后由 formRestore 把草稿回填。 */
    if(document.hidden){ flushDrafts(); return }
    rollover(); render();
  });
  /* 安卓返回键：抽屉优先关闭，再返回上一模块 */
  window.addEventListener('popstate', function(){
    /* 搜索面板最先响应：移动端按返回键应该是关面板，而不是退出工作台 */
    if(isAiOpen()){ closeAi(); return }
    if(isSearchOpen()){ closeSearch(); return }
    if(U.$('#sidebar').classList.contains('on')){ closeDrawer(); return }
    if(U.$('#mask').classList.contains('on')){ closeModal(); return }
    if(U.$('#moreSheet').classList.contains('on')){ closeSheet(); return }
    if(UI.prevView && moduleById(UI.prevView)){ var p=UI.prevView; UI.prevView=null; goKeep(p) }
    else if(UI.view!=='daily'){ goKeep('daily') }
  });

  /* 全局搜索：输入即搜（300ms 防抖，避免每敲一个字全表扫一遍） */
  var gsIn=U.$('#gsInput');
  if(gsIn){
    gsIn.addEventListener('input', function(){
      UI.gsQ=gsIn.value;
      if(_gsTimer) clearTimeout(_gsTimer);
      _gsTimer=setTimeout(function(){ _gsTimer=null; gsRender() },300);
    });
    gsIn.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){
        ev.preventDefault();
        if(_gsTimer){ clearTimeout(_gsTimer); _gsTimer=null }
        gsRender();
      }
    });
  }
  /* Ctrl / Cmd + K 随时唤起搜索（已在里面则关闭） */
  document.addEventListener('keydown', function(ev){
    if((ev.ctrlKey||ev.metaKey) && (ev.key==='k'||ev.key==='K')){
      ev.preventDefault();
      if(isSearchOpen()) closeSearch(); else openSearch();
    }
  });
  /* Ctrl / Cmd + J 唤起 AI 助手（J 避开搜索的 K，两个面板互斥） */
  document.addEventListener('keydown', function(ev){
    if((ev.ctrlKey||ev.metaKey) && (ev.key==='j'||ev.key==='J')){
      ev.preventDefault();
      if(isAiOpen()) closeAi(); else openAi();
    }
  });
  /* ESC 关 AI 面板。单写一条：上面那条 ESC 分支要求焦点在带 id 的元素上才生效，
     而 AI 面板打开后焦点可能落在浮层容器上，不到达分支。 */
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape' && isAiOpen()){ ev.stopPropagation(); closeAi() }
  });
  /* AI 输入框：回车发送（Ctrl / Cmd + 回车不拦截，留给多行输入习惯） */
  var aiIn=U.$('#aiInput');
  if(aiIn){
    aiIn.addEventListener('keydown', function(ev){
      if(ev.key==='Enter' && !ev.ctrlKey && !ev.metaKey && !ev.shiftKey){ ev.preventDefault(); AI.chat() }
    });
  }
}
function go2(v){
  if(v!=='settings'&&!moduleById(v)){ v='daily' }
  UI.prevView=UI.view; UI.__formFk=null;
  UI.view=v; closeSheet(); closeModal(); pushHist(); render({switchView:true});
}
function goKeep(v){
  if(v!=='settings'&&!moduleById(v)) v='daily';
  UI.__formFk=null;
  UI.view=v; closeSheet(); closeModal(); render({switchView:true});
}

/* ---------------- 27. 初始化 ---------------- */
function rollover(){
  if(!S) return;
  var T=U.today(), ch=false;
  S.plans.forEach(function(p){
    /* 模块四：运动计划联动任务不顺延。
       一条模板会预生成一整年（最多 400 条）的按日期任务，若沿用顺延逻辑，
       每过一天就会把「昨天没做的跑步」搬到今天，几周后就堆成几十条同名的今日任务。
       联动任务保持原日期，过期未完成的由 fitnessCleanup() 回收。 */
    if(p.sourceType==='fitness') return;
    if(!p.done&&p.date&&p.date<T){ p.date=T; ch=true }
  });
  var keys=Object.keys(S.notified||{}), kill=0;
  keys.forEach(function(k){ if(k.indexOf('@'+T)<0){ delete S.notified[k]; kill++ } });
  if(ch||kill) DB.write(S);
}
/* 第五轮 A-2：老用户一次性补齐。S.healthTips 是持久化数组，老用户库里只有原来的 6 条，
   单纯改 demoData() 对他们完全无效。这里按标题去重补一次，只补「内置种子」里缺的条目。
   用 __healthTipsV2 标记只跑一次 —— 之后用户手动删掉的内置条目不会再被塞回来。 */
/* 第五轮 B：老数据一次性迁移 —— 补 doneDates 种子 + 给视频打卡同步项补 sync 标记。
   只跑一次（__healthDoneV1），之后用户手动改的不受影响。 */
function healthDoneDatesMigrate(){
  if(S.__healthDoneV1) return 0;
  S.__healthDoneV1=1;
  var n=0;
  (S.healthItems||[]).forEach(function(h){
    if(!h.sync && h.name==='完成一次运动'){ h.sync='video'; n++ }
    if(!Array.isArray(h.doneDates)){ h.doneDates=h.lastDoneDate?[h.lastDoneDate]:[]; n++ }
  });
  return n;
}
function healthTipsTopup(){
  if(S.__healthTipsV2 || S.cleared) return 0;   /* 清空后不再把内置健康贴士补回来 */
  S.__healthTipsV2=1;
  S.healthTips=S.healthTips||[];
  var have={}; S.healthTips.forEach(function(t){ have[t.title]=1 });
  var miss=demoData().healthTips.filter(function(t){ return !have[t.title] });
  if(!miss.length) return 0;
  S.healthTips=S.healthTips.concat(miss);
  return miss.length;
}
function init(){
  var raw=DB.read(), fresh=!raw;
  S=normalize(raw?raw:demoData());
  if(fresh){ DB.write(S) }
  rollover();
  /* 模块四：老数据迁移 —— 给尚无任何联动任务的运动计划模板补生成一次，
     避免出现「新模板走 S.plans、老模板走 done 布尔值」的混合口径。只跑一次（linked 标记）。 */
  try{
    var backfilled=fitnessBackfill();
    /* 滚动续排：保证未来 90 天都有任务（只补缺口，已存在的日期不重复生成） */
    var topped=fitnessMaintain();
    /* 裁剪：回收窗口由一年降到 90 天后多出来的未来预排任务（只裁可再生且未完成的） */
    var trimmed=fitnessTrimFuture();
    /* 开屏先回收一次过期联动任务：长期未打开时，否则首屏「逾期」会被一堆历史运动任务占满 */
    var cleaned=fitnessCleanup(false);
    /* 注意：清理/回填只改内存，必须显式写库，否则刷新后脏数据又回来了 */
    if(backfilled||topped||trimmed||cleaned){
      DB.write(S);
      if(backfilled) setTimeout(function(){ U.toast('已为 '+backfilled+' 项运动计划排入每日计划','ok') },1200);
      if(trimmed) console.log('ℹ️ 运动计划预排窗口收敛为 '+FIT_HORIZON+' 天，回收 '+trimmed+' 条超窗任务');
    }
  }catch(e){ console.warn('⚠️ 运动计划回填/续排/清理失败（不影响主功能）:', e&&e.message) }
  try{
    var hDone=healthDoneDatesMigrate(), htAdded=healthTipsTopup();
    if(hDone){ DB.write(S); console.log('ℹ️ 健康打卡历史记录已启用（doneDates），迁移 '+hDone+' 处') }
    if(htAdded){ DB.write(S); console.log('ℹ️ 健康 Tips 已补齐 '+htAdded+' 条（共 '+S.healthTips.length+' 条）') }
  }catch(e){ console.warn('⚠️ 健康 Tips 补齐失败（不影响主功能）:', e&&e.message) }
  /* 第十轮（阶段二）：给历史 AI 收藏视频补 id（老结构是 {t,bv,...} 没有 id）。
     只"加字段"不"改字段"，S.aigFavs.videos / S.tips / S.prompts 一条都不会少。
     补完立刻写库，刷新后不会再补第二遍。 */
  try{
    var aigIds=ensureAigFavIds();
    if(aigIds){ DB.write(S); console.log('ℹ️ AI 收藏视频已补 id（'+aigIds+' 条，数据未改动）') }
  }catch(e){ console.warn('⚠️ AI 收藏视频补 id 失败（不影响主功能）:', e&&e.message) }
  var ui=DB.ui.get();
  /* 第六轮修复 4：恢复上次未提交的输入草稿（APP 被强杀重开也还在） */
  if(ui.drafts&&typeof ui.drafts==='object') UI.drafts=ui.drafts;
  if(ui.view&&(ui.view==='settings'||moduleById(ui.view))) UI.view=ui.view;
  if(S.settings.show[UI.view]===false) UI.view='daily';
  UI.dailyDate=U.today(); UI.calSel=U.today(); UI.fitDay=null;
  SYNC.status=S.settings.webdav.enabled?'idle':'off';
  bind(); applySidebarCollapsed(); render();
  /* 修复：原先只在初始化这一刻有权限才启动定时器。
     若用户当时还没授权（permission 为 default），定时器永远不会启动，
     必须刷新页面才行。这里改为：已授权则立即启动，否则注册轮询等授权。 */
  if(S.settings.notify.enabled){
    if(NOTIFY.can()){
      NOTIFY.start();
    }else{
      /* 每 5 秒检查一次权限，一旦授权成功就自动启动定时器。
         不设硬超时（原实现有 60 秒限制，用户晚于 1 分钟授权就失效了）。 */
      var checkPermInterval = setInterval(function(){
        /* 用户中途在设置里关掉提醒 → 停止轮询，不再无意义地空转 */
        if(!S.settings.notify.enabled){ clearInterval(checkPermInterval); return }
        if(NOTIFY.can()){
          clearInterval(checkPermInterval);
          NOTIFY.start();
          U.toast('通知权限已就绪，后台提醒已启动','ok');
        }
      }, 5000);
      /* 页面从后台切回前台时主动检查一次权限。
         修复要点：外层只判断 visibilityState，内层做一次 can() 判断即可，
         不要写成 if(!can()){ if(can()){...} } —— 那样内层永远不成立，是死代码。 */
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState !== 'visible') return;
        if(NOTIFY.timer) return;              // 定时器已在运行，无需重复启动
        if(!S.settings.notify.enabled) return;
        if(NOTIFY.can()){
          clearInterval(checkPermInterval);
          NOTIFY.start();
          U.toast('通知权限已就绪，后台提醒已启动','ok');
        }
      });
    }
  }
  if(!DB.ok) U.toast(DB.err,'err');
  else if(location.protocol==='file:') U.toast('当前是 file:// 本地打开，通知与 PWA 安装不可用，请改用 http/https 访问','err');
  else if(fresh) setTimeout(function(){ U.toast('已载入演示数据，可在设置里一键清空','ok') },600);
  /* PWA：注入 manifest + 注册 Service Worker（安卓添加到主屏幕后可走通知栏） */
  try{ PWA.boot() }catch(e){ console.warn('⚠️ PWA 初始化失败（不影响主功能）:', e&&e.message) }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
