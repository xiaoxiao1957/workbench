var VIEWS={};

/* ---------------- 6.5 输入框内容保护（第六轮修复 4，优先级最高）----------------
   现象：从桌面 PWA 打开工作台，在任意输入框里打字后切到别的 APP，再切回来内容全没了。
   根因：visibilitychange 里无条件 render()，而 render() 是 c.innerHTML=html 全量重建，
        未保存的输入内容随之被丢弃。PWA 独立窗口比普通标签页更容易被系统回收，
        切回必定重绘，所以这个问题在 PWA 里必现。
   方案（指令里的 A+B 组合）：
     · render() 前后做「快照 → 重绘 → 回填」，统一机制，不逐个输入框写
     · 同时把值记进 UI.drafts 并防抖落盘，APP 被强杀重开后也能恢复
   只回填「用户最近编辑过且尚未被提交消费掉」的框，避免提交成功后表单该清空却没清空。 */
var DRAFT_SEL='input,textarea,select';
var DRAFT_OK_TYPE={text:1,search:1,url:1,tel:1,email:1,number:1};
var DRAFT_MAX=300;
/* 可入草稿的判定：只收文本类输入。
   密码（type=password，如 WebDAV 的 wdPass）、文件、日期、复选/单选一律排除，
   另外提供 data-nodraft 让页面可以显式声明某个框不参与。 */
function isDraftable(el){
  if(!el||!el.tagName) return false;
  var tg=el.tagName.toLowerCase();
  if(tg==='textarea'||tg==='select') return !(el.disabled||el.readOnly||el.hasAttribute('data-nodraft'));
  if(tg!=='input') return false;
  if(el.disabled||el.readOnly||el.hasAttribute('data-nodraft')) return false;
  var tp=(el.getAttribute('type')||'text').toLowerCase();
  return !!DRAFT_OK_TYPE[tp];
}
/* 稳定标识：有 id 用 id；没有 id 的用「从 body 往下的兄弟下标路径 + 标签 + type」。
   DOM 是同构重建的，路径可复现，所以无 id 的输入框也能对上号。 */
function draftKeyOf(el){
  if(!el) return '';
  if(el.id) return '#'+el.id;
  var parts=[], n=el, root=(el.ownerDocument&&el.ownerDocument.body)||null;
  while(n&&n!==root){
    var p=n.parentNode; if(!p) break;
    var i=0, s=n.previousElementSibling;
    while(s){ i++; s=s.previousElementSibling }
    parts.unshift(i);
    n=p;
  }
  return 'p:'+parts.join('.')+'|'+el.tagName.toLowerCase()+'|'+(el.getAttribute('type')||'').toLowerCase();
}
/* 结构指纹：回填前比对，防止路径撞车时把值写进另一个框 */
function draftSig(el){
  return el.tagName.toLowerCase()+'|'+(el.getAttribute('type')||'').toLowerCase()+'|'+
         (el.getAttribute('name')||'')+'|'+(el.getAttribute('placeholder')||'');
}
function draftSet(k, v){
  if(!k) return;
  if(!UI.drafts||typeof UI.drafts!=='object') UI.drafts={};
  if(v===''||v==null){ delete UI.drafts[k] }
  else{
    UI.drafts[k]={v:v, t:Date.now()};
    var ks=Object.keys(UI.drafts);
    if(ks.length>DRAFT_MAX){                      /* 超出上限时淘汰最旧的，避免草稿无限膨胀 */
      ks.sort(function(a,b){ return (UI.drafts[a].t||0)-(UI.drafts[b].t||0) });
      for(var i=0;i<ks.length-DRAFT_MAX;i++) delete UI.drafts[ks[i]];
    }
  }
  saveDraftsSoon();
}
/* 某输入框被「提交动作」读取过 → 打上消费时间戳。
   判定依据：所有新增/保存动作都通过 val(id) 读表单，读了就意味着这条内容已被消费，
   回填时应跳过。比起在 afterChange 里一刀切，这样只影响真正被提交的那几个框，
   不会把别处正在编辑的内容一起清掉。 */
function markConsumed(k){ if(!k) return; if(!UI.__consumed) UI.__consumed={}; UI.__consumed[k]=Date.now() }
function draftLive(k){
  var d=UI.drafts&&UI.drafts[k]; if(!d) return null;
  var c=UI.__consumed&&UI.__consumed[k]||0;
  return d.t>c ? d.v : null;
}
var _draftTimer=null;
function saveDraftsSoon(){
  if(_draftTimer) return;
  _draftTimer=setTimeout(function(){ _draftTimer=null; flushDrafts() },600);
}
function flushDrafts(){
  if(_draftTimer){ clearTimeout(_draftTimer); _draftTimer=null }
  try{ var u=DB.ui.get(); u.drafts=UI.drafts||{}; DB.ui.set(u) }catch(e){}
}
/* 重绘前记录 #content 里所有输入框的值与「谁有焦点」 */
function formSnapshot(root){
  var out=[]; if(!root||!root.querySelectorAll) return out;
  var fs=root.querySelectorAll(DRAFT_SEL), af=document.activeElement;
  for(var i=0;i<fs.length;i++){
    var el=fs[i];
    if(!isDraftable(el)) continue;
    out.push({k:draftKeyOf(el), s:draftSig(el), v:el.value, f:(el===af)});
  }
  return out;
}
/* 重绘后回填。两条放行规则：
     1) 重绘前焦点就在这个框上（用户正在编辑，哪怕还没触发过 input 事件）
     2) 有草稿，且草稿时间晚于该框被提交消费的时间（切后台/切模块/强杀重开都走这条）
   回填后把光标放到末尾，并尽量不滚动页面。 */
function formRestore(root, snap){
  /* 注意：不能因为 snap 为空就提前返回。
     从日历切回备忘录时，快照取自日历视图（里面没有输入框）→ snap 长度为 0，
     但草稿里是有内容的，必须继续走规则 2 才能回填；首次渲染时 #content 为空同理。 */
  if(!root) return;
  snap=snap||[];
  var fmap={}, i;
  for(i=0;i<snap.length;i++) fmap[snap[i].k]=snap[i];
  var fs=root.querySelectorAll(DRAFT_SEL), caret=null;
  for(i=0;i<fs.length;i++){
    var el=fs[i];
    if(!isDraftable(el)) continue;
    var k=draftKeyOf(el), rec=fmap[k], v=null, refocus=false;
    /* 规则 1：重绘前焦点就在这个框上 → 直接用快照值（覆盖草稿，最贴近用户当下所见） */
    if(rec && rec.s===draftSig(el) && rec.f){ v=rec.v; refocus=true }
    /* 规则 2：查草稿。注意不能只在快照里找 —— 切模块 / 刷新重开时，
       旧视图里根本没有这个框（比如从日历切回备忘录），快照里自然没有它，
       那样就恢复不了。所以这里一律直接查 UI.drafts。 */
    if(v==null) v=draftLive(k);
    if(v==null||v===el.value){ if(refocus) caret=el; continue }
    el.value=v;
    if(refocus) caret=el;
  }
  if(caret){
    try{
      caret.focus({preventScroll:true});
      var L=(caret.value||'').length;
      if(caret.setSelectionRange) caret.setSelectionRange(L,L);
    }catch(e){}
  }
}
function render(opts){
  opts=opts||{};
  var _c0=U.$('#content'), _snap=formSnapshot(_c0);
  applyTheme(); clearStaleDrafts(); renderNav();
  syncFab();
  var v=UI.view, html=backupBarHtml()+storageErrHtml();
  /* 今日要处理只出现在「每日计划」模块，避免每个模块重复 */
  if(v==='daily') html+=todayHtml();
  var fn=VIEWS[v];
  if(!fn && v.indexOf('cm_')===0) fn=VIEWS.__custom;
  html+=fn?fn(v):'<div class="card"><div class="empty">'+svg('warn')+'<p>模块不存在</p></div></div>';
  var c=U.$('#content');
  /* 切换模块跳到顶部；模块内操作保持当前滚动位置，不跳顶 */
  var prev=(!opts.switchView)?window.scrollY:0;
  c.innerHTML=html; c.scrollTop=0;
  /* 模块六：切换模块时给内容挂 .view-in，让卡片依次淡入；
     模块内操作（勾选/筛选）同样会整体重绘，这里刻意不挂，
     否则勾一个任务整页都会重新闪一遍。
     先移除 → 强制回流 → 再加回，动画才能重复触发。 */
  c.classList.remove('view-in');
  if(opts.switchView){ void c.offsetWidth; c.classList.add('view-in') }
  if(opts.switchView){ window.scrollTo(0,0); }
  else { window.scrollTo(0,prev); }
  formRestore(U.$('#content'), _snap);
  DB.ui.set({view:v, drafts:UI.drafts||{}});
  if(window.innerWidth<=900) closeDrawer();
  /* 设置页每次 render 都会重建 DOM，重建后恢复「安装到桌面」按钮的显隐与状态文字 */
  if(typeof PWA!=='undefined'&&PWA&&PWA.sync) PWA.sync();
}
function go(v){ UI.view=v; closeSheet(); closeDrawer(); render({switchView:true}) }

/* ---------------- 7. 每日计划 ---------------- */
/* ---------------- 重复规则 ---------------- */
var WK=['日','一','二','三','四','五','六'];
function addMonths(s,m){
  var d=U.parse(s); if(!d) return s; var day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+m);
  var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last)); return U.dstr(d);
}
function addYears(s,y){
  var d=U.parse(s); if(!d) return s; var day=d.getDate(), mon=d.getMonth();
  d.setFullYear(d.getFullYear()+y);
  if(d.getMonth()!==mon){ var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); }
  return U.dstr(d);
}
function nextRepeatDate(rep, from){
  if(!rep) return null;
  if(rep.t==='daily') return U.addDays(from,1);
  if(rep.t==='weekday'){
    var d=U.addDays(from,1), g=new Date(d+'T00:00:00').getDay();
    while(g===0||g===6){ d=U.addDays(d,1); g=new Date(d+'T00:00:00').getDay(); }
    return d;
  }
  if(rep.t==='weekly'){
    var w=rep.w||[]; if(!w.length) return null;
    for(var i=1;i<=7;i++){ var d=U.addDays(from,i); if(w.indexOf(new Date(d+'T00:00:00').getDay())>=0) return d; }
    return null;
  }
  if(rep.t==='interval') return U.addDays(from, Math.max(1, rep.n||1));
  if(rep.t==='monthly') return addMonths(from,1);
  if(rep.t==='yearly') return addYears(from,1);
  return null;
}
function repeatLabel(rep){
  if(!rep) return '';
  if(rep.t==='daily') return '每天';
  if(rep.t==='weekday') return '每工作日';
  if(rep.t==='weekly') return '每周 '+ (rep.w||[]).map(function(x){ return '周'+WK[x] }).join('、');
  if(rep.t==='interval') return '每 '+rep.n+' 天';
  if(rep.t==='monthly') return '每月同日';
  if(rep.t==='yearly') return '每年同日';
  return '';
}
function repeatControlsHtml(pfx, rep){
  rep=rep||{};
  var opts=[['none','不重复'],['daily','每天'],['weekday','每工作日'],['weekly','每周固定'],['interval','每 N 天'],['monthly','每月同日'],['yearly','每年同日']];
  var sel='<select id="'+pfx+'Repeat" class="repeat-sel">'+opts.map(function(o){ return '<option value="'+o[0]+'"'+(rep.t===o[0]?' selected':'')+'>'+o[1]+'</option>' }).join('')+'</select>';
  var wkp=WK.map(function(n,i){ var on=(rep.w||[]).indexOf(i)>=0; return '<label class="wk-pick'+(on?' on':'')+'"><input type="checkbox" value="'+i+'"'+(on?' checked':'')+'>周'+n+'</label>' }).join('');
  var optsDiv='<div id="'+pfx+'RepeatOpts" class="repeat-opts">'+
    '<div data-r="weekly" style="display:'+(rep.t==='weekly'?'flex':'none')+'">'+wkp+'</div>'+
    '<div data-r="interval" style="display:'+(rep.t==='interval'?'flex':'none')+'"><span>每</span><input id="'+pfx+'EveryN" type="number" min="1" max="365" value="'+(rep.n||2)+'"><span>天重复一次</span></div>'+
  '</div>';
  return sel+optsDiv;
}
function onRepeatChange(sel){
  var opts=document.getElementById(sel.id+'Opts');
  if(!opts) return;
  opts.querySelectorAll('[data-r]').forEach(function(d){ d.style.display = d.getAttribute('data-r')===sel.value?'flex':'none'; });
}
function readRepeat(pfx){
  var rt=val(pfx+'Repeat')||'none';
  if(rt==='none') return null;
  if(rt==='weekly'){
    var w=U.$$('#'+pfx+'RepeatOpts input[type=checkbox]:checked').map(function(c){ return +c.value });
    /* pfx+'Date'：运动计划新增表单的「起始日期」输入框（exDate），用于「每周固定」未勾选星期时的默认星期 */
    if(!w.length){ var base=val(pfx+'Ddl')||val(pfx+'Date')||UI.dailyDate||U.today(); w=[new Date(base+'T00:00:00').getDay()] }
    return {t:'weekly', w:w};
  }
  if(rt==='interval') return {t:'interval', n:U.clamp(U.num(val(pfx+'EveryN')),1,365)};
  return {t:rt};
}
/* 从 start 到 end（含）按重复规则生成所有命中的日期 */
function genRepeatDates(rep, start, end){
  var out=[], guard=0, cur=start;
  if(rep.t==='interval'){
    var n=Math.max(1, rep.n||1), off=0;
    while(U.diffDays(cur,end)>=0 && guard<1000){
      if(off%n===0) out.push(cur);
      cur=U.addDays(cur,1); off++; guard++;
    }
    return out;
  }
  var base=new Date(start+'T00:00:00');
  while(U.diffDays(cur,end)>=0 && guard<1000){
    var g=new Date(cur+'T00:00:00').getDay();
    var ok=false;
    if(rep.t==='daily') ok=true;
    else if(rep.t==='weekday') ok=(g!==0&&g!==6);
    else if(rep.t==='weekly') ok=((rep.w||[]).indexOf(g)>=0);
    else if(rep.t==='monthly') ok=(new Date(cur+'T00:00:00').getDate()===base.getDate());
    else if(rep.t==='yearly'){ var a=new Date(cur+'T00:00:00'); ok=(a.getMonth()===base.getMonth()&&a.getDate()===base.getDate()); }
    if(ok) out.push(cur);
    cur=U.addDays(cur,1); guard++;
  }
  return out;
}

/* ---------------- 18.5 减肥塑形 · 运动计划与每日计划联动（第三轮 · 模块四） ----------------
   设计要点：
     · 模板存在 S.fitness.plan（含 rep 重复规则对象）；每条模板按重复规则在 S.plans 中
       展开成一批「联动任务」，标记 sourceType:'fitness' / sourceId:模板id。
     · 统计与「今日还有几项没打卡」一律以 S.plans 为准，不再依赖模板上的 done 布尔值
       （模板 done 不分日期，勾一次就永久算完成，这是旧实现的缺陷）。
     · 日期计算全部复用 genRepeatDates，不手写日期循环。
     · rep 是对象（{t:'daily'|'weekday'|'weekly'|'monthly'|'yearly'|'interval'}），不是字符串。 */

var FIT_MAX_PER_TPL=400;      // 单个模板最多展开的任务条数
var FIT_MAX_TOTAL=3000;       // S.plans 总长度熔断阈值
var FIT_KEEP_DONE_DAYS=90;    // 已完成任务保留天数，超过则归档计数后删除
var FIT_KEEP_UNDONE_DAYS=1;   // 未完成的过期任务保留天数（避免堆积成「逾期」噪音）
var FIT_SPAN_DEFAULT=365;     // 用户添加计划时「连续天数」留空的默认窗口（第 3 批既有口径）
var FIT_SPAN_BACKFILL=90;     // 老数据补迁移的窗口：90 天足够，排一整年只会让任务数线性膨胀
var FIT_HORIZON=90;           // 预排窗口：始终保证「今天 ~ 今天+89 天」有运动任务，滚动续排

/* 本周判定：周一为一周起始（与日历模块 2274 行逻辑一致） */
function inThisWeek(dateStr){
  if(!dateStr) return false;
  var sd=U.parse(U.today());
  var off=(sd.getDay()+6)%7;              // 周一=0 … 周日=6
  sd.setDate(sd.getDate()-off);
  var ws=U.dstr(sd);                      // 本周一
  var we=U.addDays(ws,6);                 // 本周日
  return dateStr>=ws && dateStr<=we;      // U.dstr 零填充，字符串比较可靠
}

/* 取某模板在指定日期的联动任务（没有则返回 null） */
function fitnessTaskOn(tplId, date){
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType==='fitness' && p.sourceId===tplId && p.date===date) return p;
  }
  return null;
}

/* 打卡统计：只统计 sourceType==='fitness' 的已完成任务（视频打卡 vCheckin 不写入 S.plans，天然不计入） */
function getFitnessStats(){
  var T=U.today(), F=S.fitness;
  var list=S.plans.filter(function(p){ return p.sourceType==='fitness' && p.done===true });
  var yKey=T.slice(0,4), mKey=T.slice(0,7);
  var archY=(F.archivedY&&F.archivedY[yKey])||0;   // 归档快照：保证清理后年/月统计不倒退
  var archM=(F.archivedM&&F.archivedM[mKey])||0;
  return {
    today: list.filter(function(p){ return p.date===T }).length,
    week:  list.filter(function(p){ return inThisWeek(p.date) }).length,
    month: list.filter(function(p){ return p.date.slice(0,7)===mKey }).length + archM,
    year:  list.filter(function(p){ return p.date.slice(0,4)===yKey }).length + archY,
    archived: F.archivedCount||0
  };
}

/* 按模板的重复规则展开联动任务到 S.plans。
   返回 {added:n, updated:n, skipped:n}；skipped>0 表示触发了总量熔断。
   · 已在 sourceId+date 上存在 → 只同步标题/优先级/热量等模板派生字段，保留 done 与 doneAt
     （不能覆盖完成状态，否则用户补录后再次同步会把已完成冲掉）
   · 无 rep（一次性计划）→ 只展开 start 当天 span 条（默认 1 条） */
/* 老数据兜底：早期模板只有 freq 文本（如「每天」）而没有 rep 对象，
   不推断的话「每天」的计划只会生成今天 1 条，切到其它日期就空了（模块五按天显示会直接暴露）。
   只映射语义完全确定的几种；「每周 N 次」无法反推具体星期，保持一次性。 */
function freqToRep(freq){
  var f=String(freq||'').replace(/\s/g,'');
  if(f==='每天'||f==='每日') return {t:'daily'};
  if(f==='每工作日') return {t:'weekday'};
  if(f==='每月'||f==='每月同日') return {t:'monthly'};
  if(f==='每年'||f==='每年同日') return {t:'yearly'};
  return null;
}
/* 统一取模板的重复规则：优先 rep 对象，没有再用 freq 文本兜底 */
function tplRep(tpl){ return (tpl&&tpl.rep) || freqToRep(tpl&&tpl.freq) }
function fitnessSyncTemplate(tpl, opts){
  /* opts 为可选参数（模块五新增，不传时行为与第三轮完全一致）：
       opts.start  起始日期（运动计划表单可指定目标日期），默认今天
       opts.span   生成窗口天数；留空/0 时：有重复规则 → 一年，无重复规则 → 仅起始日 1 天
     日期计算仍然全部走 genRepeatDates，不手写重复规则。 */
  opts=opts||{};
  var res={added:0, updated:0, skipped:0};
  if(!tpl) return res;
  if(S.plans.length>=FIT_MAX_TOTAL){ res.skipped=1; return res }
  var start=opts.start||U.today();
  var rep=tplRep(tpl);
  var span=U.num(opts.span,0);
  /* 默认口径：重复计划「def」天 / 一次性计划 1 天。
     def 默认 FIT_SPAN_DEFAULT(365)，即第 3 批用户添加计划时留空「连续天数」的既有行为；
     老数据补迁移会显式传 def=FIT_SPAN_BACKFILL(90)，避免一次性灌进一年的任务。 */
  var def=U.num(opts.def,0)>0?U.num(opts.def,0):FIT_SPAN_DEFAULT;
  if(span<=0) span=rep?def:1;
  span=U.clamp(span,1,365);
  var end=U.addDays(start, span-1);
  var dates=[];
  if(rep){
    try{ dates=genRepeatDates(rep, start, end) || [] }
    catch(e){ console.warn('⚠️ 重复规则解析失败，按连续天数处理:', e&&e.message); dates=[] }
  }
  if(!dates.length){                               // 无重复规则 / 解析失败 → 从 start 起连续 span 天
    dates=[];
    for(var di=0; di<span; di++) dates.push(U.addDays(start, di));
  }
  dates=dates.slice(0, FIT_MAX_PER_TPL);           // 单模板上限，防止 localStorage 被灌爆
  var room=FIT_MAX_TOTAL-S.plans.length;
  if(dates.length>room) dates=dates.slice(0, Math.max(0,room));
  var exist={};
  S.plans.forEach(function(p){
    if(p.sourceType==='fitness' && p.sourceId===tpl.id) exist[p.date]=p;
  });
  dates.forEach(function(date){
    var old=exist[date];
    if(old){
      old.title=tpl.name;                          // 只同步派生字段，done / doneAt 保持原样
      old.pri='P1';
      old.kcal=tpl.kcal||null;
      res.updated++;
    }else{
      S.plans.push({
        id:U.uid(), title:tpl.name, pri:'P1', date:date, time:'', ddl:date,
        done:false, createdAt:U.now(),
        sourceType:'fitness', sourceId:tpl.id,
        repeat:rep?{t:rep.t}:null,                  // 仅用于列表上的「循环」角标，不参与生成
        kcal:tpl.kcal||null
      });
      res.added++;
    }
  });
  return res;
}

/* 首次升级时把「还没有任何联动任务」的老模板补一遍，避免出现
   「新模板走 S.plans、老模板走 done 布尔值」的混合口径 */
var FIT_FREQ_MIGRATED=false;
function fitnessBackfill(){
  if(!S.fitness) return 0;
  var n=0;
  if(S.fitness.linked!==true){
    (S.fitness.plan||[]).forEach(function(tpl){
      if(S.plans.some(function(p){ return p.sourceType==='fitness' && p.sourceId===tpl.id })) return;
      var r=fitnessSyncTemplate(tpl, { def:FIT_SPAN_BACKFILL }); n+=r.added;
    });
    S.fitness.linked=true;
  }
  /* 模块五补迁移：第三轮升级过的老模板只有 freq 文本、没有 rep 对象（如「每天」），
     当时只展开了 1 条任务，切到其它日期会显示空白。这里对这类模板补一次完整展开。
     每次开屏最多跑一次（内存标记），命中过就不再重复；已有任务只同步字段、不冲掉完成状态。
     窗口用 FIT_SPAN_BACKFILL(90 天) 而不是一年：健身计划本来就会调整，排一年意义不大，
     而任务数是「模板数 × 天数」线性膨胀的，90 天足够覆盖日常使用又不撑爆 localStorage。 */
  if(!FIT_FREQ_MIGRATED){
    FIT_FREQ_MIGRATED=true;
    (S.fitness.plan||[]).forEach(function(tpl){
      if(tpl.rep || !freqToRep(tpl.freq)) return;
      if(!S.plans.some(function(p){ return p.sourceType==='fitness' && p.sourceId===tpl.id })) return;
      n+=fitnessSyncTemplate(tpl, { def:FIT_SPAN_BACKFILL }).added;
    });
  }
  return n;
}

/* 滚动续排：把预排窗口从「一次性铺一年」改成「始终覆盖未来 FIT_HORIZON 天」。
   为什么必须有这一步：fitnessSyncTemplate 只在「首次迁移」和「用户添加计划」两处被调用，
   一旦把窗口从 365 天降到 90 天，第 91 天起运动计划就会凭空断供、页面显示空白。
   这里在每次开屏时把窗口重新补齐——已存在的日期只同步字段，不重复生成。
   只处理「有重复规则」的模板；一次性计划是用户明确指定的，不自动续排。 */
function fitnessMaintain(){
  if(!S.fitness) return 0;
  var T=U.today(), n=0;
  (S.fitness.plan||[]).forEach(function(tpl){
    if(!tplRep(tpl)) return;
    n+=fitnessSyncTemplate(tpl, { start:T, span:FIT_HORIZON }).added;
  });
  return n;
}
/* 裁剪超出窗口的「未完成」未来任务，回收把窗口从一年降到 90 天后多出来的那部分。
   安全边界（很重要）：
   · 只裁「有重复规则」的模板 —— 这些任务是可以再生的预排，进入窗口后由 fitnessMaintain 自动补回，不会丢计划；
   · 一次性模板（无 rep）绝不裁 —— 那是用户明确指定的日期，删了就真没了；
   · 已完成的任务绝不裁 —— 完成状态是统计数据的唯一来源。 */
function fitnessTrimFuture(){
  if(!S.fitness) return 0;
  var T=U.today(), horizon=U.addDays(T, FIT_HORIZON-1), n=0;
  var rep={};
  (S.fitness.plan||[]).forEach(function(t){ if(tplRep(t)) rep[t.id]=1 });
  var keep=[];
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType==='fitness' && !p.done && rep[p.sourceId] && p.date>horizon){ n++; continue }
    keep.push(p);
  }
  if(n) S.plans=keep;
  return n;
}

/* 数据清理：只清理 fitness 联动任务，不碰其它任务。
   入口在 afterChange()，24 小时最多扫一次，避免每次变更都全表扫描。 */
/* 第五轮修复 3：往按日期归档快照里记一笔。done/plan 都是增量。 */
function fitnessStatAdd(date, done, plan){
  var F=S.fitness; if(!F) return;
  if(!F.dailyStat||typeof F.dailyStat!=='object') F.dailyStat={};
  var d=date||U.today();
  var o=F.dailyStat[d]||{done:0,plan:0};
  o.done+=(done||0); o.plan+=(plan||0);
  F.dailyStat[d]=o;
}
function fitnessCleanup(force){
  var F=S.fitness; if(!F) return 0;
  var T=U.today();
  if(!force && F.lastCleanup===T) return 0;
  var doneLine=U.addDays(T,-FIT_KEEP_DONE_DAYS);
  var undoneLine=U.addDays(T,-FIT_KEEP_UNDONE_DAYS);
  var keep=[], n=0;
  for(var i=0;i<S.plans.length;i++){
    var p=S.plans[i];
    if(p.sourceType!=='fitness'){ keep.push(p); continue }
    if(p.done && p.date<doneLine){
      /* 归档：把完成数累计进快照，保证年/月统计不因清理而倒退 */
      F.archivedCount=(F.archivedCount||0)+1;
      var yk=(p.date||T).slice(0,4), mk=(p.date||T).slice(0,7);
      F.archivedY[yk]=(F.archivedY[yk]||0)+1;
      F.archivedM[mk]=(F.archivedM[mk]||0)+1;
      /* 第五轮修复 3：按日期记账。已完成 → done+1、plan+1（它本来就是应做的一项）。
         注意顺序：必须先写入快照，再丢弃这条任务，否则数据就丢了。 */
      fitnessStatAdd(p.date, 1, 1);
      n++;
      continue;
    }
    /* 过期未完成：直接丢弃，不进完成统计；但要记 plan，否则历史完成率会虚高 */
    if(!p.done && p.date<undoneLine){ fitnessStatAdd(p.date, 0, 1); n++; continue }
    keep.push(p);
  }
  if(n) S.plans=keep;
  F.lastCleanup=T;
  return n;
}

VIEWS.daily=function(){
  var T=U.today(), d=UI.dailyDate||T, f=UI.filters.daily||'all';
  var list=S.plans.filter(function(p){
    if(f==='over') return !p.done&&p.ddl&&U.diffDays(T,p.ddl)<0;
    if(f==='P0'||f==='P1'||f==='P2') return p.pri===f&&p.date===d;
    if(f==='done') return p.done&&p.date===d;
    return p.date===d;
  });
  var src=UI.filters.dailySrc||'all';
  if(src==='self') list=list.filter(function(p){ return !p.sourceType });
  else if(src==='goal') list=list.filter(function(p){ return p.sourceType==='goal' });
  else if(src==='fitness') list=list.filter(function(p){ return p.sourceType==='fitness' });
  list.sort(function(a,b){
    if(a.done!==b.done) return a.done?1:-1;
    var pr={P0:0,P1:1,P2:2};
    if(pr[a.pri]!==pr[b.pri]) return pr[a.pri]-pr[b.pri];
    return (a.time||'99:99')<(b.time||'99:99')?-1:1;
  });
  var done=list.filter(function(p){ return p.done }).length;
  var pct=list.length?Math.round(done/list.length*100):0;
  var rows=list.map(function(p){
    var od=!p.done&&p.ddl&&U.diffDays(T,p.ddl)<0, odn=od?-U.diffDays(T,p.ddl):0;
    var srcView=p.sourceType==='wrongq'?'wrongq':p.sourceType==='goal'?'goals':p.sourceType==='book'?'books':p.sourceType==='fitness'?'fitness':'';
    var srcLab=p.sourceType==='wrongq'?'错题集':p.sourceType==='goal'?'目标拆解':p.sourceType==='book'?'读书':p.sourceType==='fitness'?'运动计划':'';
    var srcName='';
    if(p.sourceType==='goal'){ var _g=findIn(S.goals,p.sourceId); if(_g) srcName=_g.title }
    else if(p.sourceType==='wrongq'){ var _w=findIn(S.wrongs,p.sourceId); if(_w) srcName=_w.q }
    else if(p.sourceType==='book'){ var _b=findIn(S.books,p.sourceId); if(_b) srcName=_b.title }
    else if(p.sourceType==='fitness'){ var _f=findIn(S.fitness.plan,p.sourceId); if(_f) srcName=_f.name }
    var isRep=!!p.repeat;
    return '<div class="item'+(p.done?' done':'')+(od?' over':'')+'">'+
      (od?'<span class="over-corner">逾期 '+odn+' 天</span>':'')+
      '<button class="cbx'+(p.done?' on':'')+'" data-act="togglePlan" data-id="'+p.id+'" aria-label="完成">'+svg('check')+'</button>'+

function aiDecompose(text, period, deadline, grain){
  grain=grain||'normal';
  var days=deadline?Math.max(7,U.diffDays(U.today(),deadline)):(period==='月度'?30:period==='季度'?90:365);
  var weeks=Math.max(1,Math.round(days/7));
  var hit=null;
  for(var i=0;i<DECOMP.length;i++){ if(DECOMP[i].k.test(text)){ hit=DECOMP[i]; break } }
  function grainTasks(orig){
    if(grain==='fine') return orig;
    if(grain==='rough'){
      var last=orig[orig.length-1]||'按里程碑验收完成度';
      return [ '达成「'+text.slice(0,14)+(text.length>14?'…':'')+'」的里程碑：'+last ];
    }
    /* normal：把每日动作两两合并成周度动作 */
    var out=[];
    for(var i=0;i<orig.length;i+=2){ out.push(orig[i]+(orig[i+1]?('；'+orig[i+1]):'')) }
    return out.length?out:[orig[0]];
  }
  function build(src){ return {id:U.uid(), name:src.n, target:src.t||100, current:0,
    tasks:grainTasks(src.tasks).map(function(t){ return {id:U.uid(), t:t, done:false} })} }
  var krs;
  if(hit){
    krs=hit.krs(weeks).map(build);
  }else{
    krs=[
      {id:U.uid(), name:'把目标拆成 '+weeks+' 周的里程碑并全部完成', target:weeks, current:0, tasks:[
        {id:U.uid(), t:'写清"做到什么程度算成功"的验收标准', done:false},
        {id:U.uid(), t:'倒排时间，切成每周一个可交付的小结果', done:false},
        {id:U.uid(), t:'把本周的动作拆进每日计划', done:false}
      ]},
      {id:U.uid(), name:'累计完成 '+(weeks*3)+' 次核心动作打卡', target:weeks*3, current:0, tasks:[
        {id:U.uid(), t:'找出推动目标的那 1 个高杠杆动作', done:false},
        {id:U.uid(), t:'固定每周 3 个时间块只做这件事', done:false},
        {id:U.uid(), t:'每次做完记录一句进展', done:false}
      ]},
      {id:U.uid(), name:'完成 '+Math.max(3,Math.round(weeks/2))+' 次复盘与调整', target:Math.max(3,Math.round(weeks/2)), current:0, tasks:[
        {id:U.uid(), t:'每两周检查一次进度偏差', done:false},
        {id:U.uid(), t:'识别最大阻碍并写下应对办法', done:false},
        {id:U.uid(), t:'该砍的子目标果断砍掉', done:false}
      ]}
    ].map(build);
  }
  return {
    id:U.uid(), title:text, objective:(hit?hit.o:'达成：'+text), period:period||'年度',
    deadline:deadline||U.addDays(U.today(),days), krs:krs, createdAt:U.now(),
    risk:['前两周热情最高，容易一次性排太满 → 把每周量压到你觉得"有点少"的程度',
          '中途某周断掉后就全放弃 → 允许断，规则是"断了就从下一天继续，不清零"']
  };
}
function goalProgress(g){
  var tot=0, dn=0;
  (g.krs||[]).forEach(function(k){ (k.tasks||[]).forEach(function(t){ tot++; if(t.done) dn++ }) });
  var byTask=tot?dn/tot:0;
  var byNum=0, cnt=0;
  (g.krs||[]).forEach(function(k){ if(k.target){ byNum+=U.clamp(U.num(k.current)/U.num(k.target,1),0,1); cnt++ } });
  byNum=cnt?byNum/cnt:0;
  return Math.round((byTask*0.5+byNum*0.5)*100);
}
function krProgress(k){
  var tot=(k.tasks||[]).length, dn=(k.tasks||[]).filter(function(t){ return t.done }).length;
  var a=tot?dn/tot:0, b=k.target?U.clamp(U.num(k.current)/U.num(k.target,1),0,1):0;
  return Math.round((a*0.5+b*0.5)*100);
}

/* ---------------- 9. 目标看板 ---------------- */
/* ================= 第五轮 B：目标看板 · 打卡总览 =================
   数据来源（均已读源码确认，未凭空发明）：
     · fitness → S.plans 中 sourceType==='fitness' 且 done===true 的条目，按 p.date 归集；
                 口径与 getFitnessStats() 完全一致（同一条过滤谓词）。
                 视频打卡（vCheckin）只写 S.fitness.records 与健康同步项，不产生 S.plans，
                 所以天然不计入，符合「视频打卡不算健身打卡」的要求。
     · health  → S.healthItems，逐条 freq/wday/mday 推算「应做」，逐条 doneDates 统计「完成」。
                 doneDates 是本次新增的日期数组（老数据用 lastDoneDate 作种子），
                 因为原结构只保存「最后一次打卡日期」，无法还原历史。
                 视频打卡自动同步出来的「完成一次运动」项被排除。
     · express → S.express，条目自带 date 字段，直接按日期归集；该模块没有计划，应做数恒为 0。
   ------------------------------------------------------------------ */
var BOARD_CHECKIN=[
  {key:'fitness', name:'减肥塑形', icon:'fitness', color:'var(--primary)'},
  {key:'health',  name:'健康养生', icon:'heart',   color:'var(--accent)'},
  {key:'express', name:'表达能力', icon:'express', color:'color-mix(in srgb, var(--primary) 45%, var(--accent))'}
];
var BOARD_DIMS=[['day','日'],['week','周'],['month','月'],['year','年']];
/* 时间分桶：日=最近30天；周=最近12周（周一为起点，与 inThisWeek 同口径）；
   月=最近12个自然月；年=当前自然年 12 个月（按月聚合，不是 365 个日点）。 */
function boardBuckets(dim){
  var T=U.today(), out=[], i;
  if(dim==='day'){
    /* 第五轮修复 3：30 根柱子在手机上太密、标签对不齐，收敛到 14 根 */
    for(i=13;i>=0;i--){ var d=U.addDays(T,-i); out.push({from:d,to:d,label:(+d.slice(5,7))+'/'+(+d.slice(8,10))}) }
    return out;
  }
  if(dim==='week'){
    var t0=U.parse(T), off=(t0.getDay()+6)%7;      /* 周一=0 … 周日=6，与 inThisWeek 一致 */
    var thisMon=U.addDays(T,-off);
    for(i=11;i>=0;i--){ var mon=U.addDays(thisMon,-7*i); out.push({from:mon,to:U.addDays(mon,6),label:(+mon.slice(5,7))+'/'+(+mon.slice(8,10))}) }
    return out;
  }
  if(dim==='month'){
    var n0=U.parse(T);
    for(i=11;i>=0;i--){
      var dt=new Date(n0.getFullYear(), n0.getMonth()-i, 1), y=dt.getFullYear(), m=dt.getMonth();
      out.push({from:y+'-'+U.pad(m+1)+'-01', to:y+'-'+U.pad(m+1)+'-'+U.pad(new Date(y,m+1,0).getDate()), label:(m+1)+'月'});
    }
    return out;
  }
  var Y=+T.slice(0,4);
  for(var m3=0;m3<12;m3++){
    out.push({from:Y+'-'+U.pad(m3+1)+'-01', to:Y+'-'+U.pad(m3+1)+'-'+U.pad(new Date(Y,m3+1,0).getDate()), label:(m3+1)+'月'});
  }
  return out;
}
/* 视频打卡同步出来的健康项：按 B 的要求不计入健康打卡统计 */
function isVideoSyncHealth(h){ return h.sync==='video' || h.name==='完成一次运动' }
function boardHealthItems(){ return (S.healthItems||[]).filter(function(h){ return !isVideoSyncHealth(h) }) }
/* 某健康项在某天是否「排了班」——只看频率计划，不看完成情况 */
function healthScheduledOn(h, d){
  if(h.freq==='daily') return true;
  if(h.freq==='weekly'){ var w=U.parse(d); return w && w.getDay()===(h.wday==null?0:h.wday) }
  if(h.freq==='monthly') return (+d.slice(8,10))===(h.mday||1);
  return false;
}
function healthDoneDates(h){
  if(Array.isArray(h.doneDates)&&h.doneDates.length) return h.doneDates;
  return h.lastDoneDate?[h.lastDoneDate]:[];   /* 老数据兜底：只有最后一次 */
}
function boardCount(key, b, T){
  var done=0, plan=0, d, guard;
  if(key==='fitness'){
    (S.plans||[]).forEach(function(p){
      if(p.sourceType!=='fitness') return;
      if(!p.date||p.date<b.from||p.date>b.to) return;
      if(p.done===true) done++;
      if(p.date<=T) plan++;          /* 未来的预排不算「应做」，否则完成率会被拉低 */
    });
    /* 第五轮修复 3：运动任务只保留 90 天，90 天前的已被清理，
       光查 S.plans 的话月档和年档会被截断、数字和周档差不多。
       这里合并按日期归档快照把历史补回来。
       两者不重叠：只有被清理掉的任务才会进快照，现存任务不在快照里。 */
    var _ds=(S.fitness&&S.fitness.dailyStat)||{};
    for(var _k in _ds){
      if(!Object.prototype.hasOwnProperty.call(_ds,_k)) continue;
      if(_k<b.from||_k>b.to) continue;
      done+=(_ds[_k].done||0); plan+=(_ds[_k].plan||0);
    }
    return {done:done, plan:plan};
  }
  if(key==='health'){
    boardHealthItems().forEach(function(h){
      healthDoneDates(h).forEach(function(x){ if(x>=b.from&&x<=b.to) done++ });
      var end=(b.to<T?b.to:T);       /* 只统计到今天为止的应做 */
      d=b.from; guard=0;
      while(d<=end && guard<400){ if(healthScheduledOn(h,d)) plan++; d=U.addDays(d,1); guard++ }
    });
    return {done:done, plan:plan};
  }
  /* express：只有实际记录，没有计划 → 应做 0，完成率显示「—」 */
  (S.express||[]).forEach(function(x){ var dd=(x.date||'').slice(0,10); if(dd&&dd>=b.from&&dd<=b.to) done++ });
  return {done:done, plan:0};
}
function boardDimHint(d){
  return d==='day'  ?'按天：最近 14 天，每天一根柱'
       : d==='week' ?'按周：最近 12 周，周一为一周起点（与「本周统计」同口径）'
       : d==='month'?'按月：最近 12 个自然月'
       :              '按年：'+U.today().slice(0,4)+' 年 12 个月，按月聚合（不是 365 个日点）';
}
function boardCheckinHtml(){
  var dim=UI.boardDim||'week';
  var cfg=(S.settings&&S.settings.boardCheckin)||{fitness:true,health:true,express:true};
  var T=U.today(), bks=boardBuckets(dim);

    var bars='', xs='';
    bks.forEach(function(b,i){

      bars+='<div class="bc-bar" title="'+U.esc(tip)+'">'+

        '<i class="d" style="height:'+dh+'%;background:'+m.color+'"></i></div>';
      xs+='<span>'+((i%step===0||i===bks.length-1)?b.label:'')+'</span>';
    });
    return '<div class="bc-mod"><div class="bc-mod-h">'+
      '<span class="bc-mod-n">'+svg(m.icon)+U.esc(m.name)+'</span>'+
      '<span class="bc-mod-s"><b>'+tot+' 次</b><span>完成率 '+(tp?Math.round(tot/tp*100)+'%':'—')+'</span></span></div>'+
      (maxV?'<div class="bc-chart">'+bars+'</div><div class="bc-x">'+xs+'</div>'
           :'<div class="bc-empty">这段时间还没有打卡记录</div>')+
      '</div>';
  }).join(''):'<div class="bc-empty">一个模块都没选，在下面挑一个吧</div>';
  return '<section class="card" data-mod="board"><div class="card-head"><h3>'+svg('check2')+'打卡总览</h3><div class="spacer"></div>'+dimChips+'</div>'+
    '<div class="hint-sm" style="margin-bottom:12px">'+boardDimHint(dim)+'</div>'+
    '<div class="bc-wrap">'+body+'</div>'+
    '<div class="bc-cfg" style="margin-top:12px;border-top:1px solid var(--line);padding-top:11px">'+modChips+'</div>'+
    '<div class="hint-sm" style="margin-top:10px;line-height:1.7">口径：减肥塑形 = 已完成的运动联动任务 ÷ 已排任务（视频打卡不计入）；'+
    '健康养生 = 实际打卡日期 ÷ 按频率推算的应做次数（历史日期从本次更新开始记录，更早的无法回溯）；'+
    '表达能力 = 练习记录条数，该模块没有计划，完成率显示「—」。</div></section>';

/* ---------------- 10. 日历 ---------------- */
VIEWS.calendar=function(){
  var T=U.today();
  if(!UI.calMonth){ var t=U.parse(T); UI.calMonth=t.getFullYear()+'-'+U.pad(t.getMonth()+1) }
  var sel=UI.calSel||T, mode=UI.calMode||'month';
  var mp=UI.calMonth.split('-'), y=+mp[0], mo=+mp[1]-1;
  var byDate={};
  S.plans.forEach(function(p){
    var k=p.ddl||p.date; if(!k) return;
    (byDate[k]=byDate[k]||[]).push(p);
  });
  S.goals.forEach(function(g){ if(g.deadline) (byDate[g.deadline]=byDate[g.deadline]||[]).push({title:'目标截止：'+g.title,pri:'P0',goal:true}) });
  var cells='', wd=['一','二','三','四','五','六','日'];
  var head=wd.map(function(w){ return '<div class="cal-wd">'+w+'</div>' }).join('');
  if(mode==='month'){
    var first=new Date(y,mo,1), fd=(first.getDay()+6)%7;
    var start=new Date(y,mo,1-fd);
    for(var i=0;i<42;i++){
      var d=new Date(start); d.setDate(start.getDate()+i);
      var ds=U.dstr(d), out=d.getMonth()!==mo;
      var items=(byDate[ds]||[]).filter(function(p){ return !p.done });
      var hasOver=items.some(function(p){ return !p.goal&&U.diffDays(T,ds)<0 });
      var dots=items.slice(0,3).map(function(p){ return '<i class="dot d'+({P0:0,P1:1,P2:2}[p.pri]||2)+'"></i>' }).join('');
      cells+='<div class="cal-cell'+(out?' out':'')+(ds===T?' today':'')+(ds===sel?' sel':'')+(hasOver?' hasover':'')+'" data-act="calPick" data-v="'+ds+'">'+
        '<span>'+d.getDate()+'</span><span class="dots">'+dots+'</span></div>';
      if(i>=34&&d.getMonth()!==mo&&(i+1)%7===0) break;
    }
  }else{
    var sd=U.parse(sel), off=(sd.getDay()+6)%7, ws=new Date(sd); ws.setDate(sd.getDate()-off);
    for(var j=0;j<7;j++){
      var dd=new Date(ws); dd.setDate(ws.getDate()+j);
      var ds2=U.dstr(dd), it2=(byDate[ds2]||[]).filter(function(p){ return !p.done });
      var ho=it2.some(function(p){ return !p.goal&&U.diffDays(T,ds2)<0 });
      cells+='<div class="cal-cell'+(ds2===T?' today':'')+(ds2===sel?' sel':'')+(ho?' hasover':'')+'" style="aspect-ratio:auto;min-height:76px" data-act="calPick" data-v="'+ds2+'">'+
        '<span style="font-size:.72rem;color:var(--muted)">'+(+ds2.slice(5,7))+'/'+(+ds2.slice(8,10))+'</span>'+
        '<span style="font-weight:700">'+it2.length+'</span><span style="font-size:.64rem;color:var(--muted)">项待办</span></div>';
    }
  }
  var dayItems=(byDate[sel]||[]);
  var dayList=dayItems.map(function(p){
    if(p.goal) return '<div class="item"><div class="it-body"><div class="it-title">'+U.esc(p.title)+'</div><div class="it-meta"><span class="tag">目标节点</span></div></div></div>';
    var od=!p.done&&U.diffDays(T,p.ddl||sel)<0;
    return '<div class="item'+(p.done?' done':'')+(od?' over':'')+'">'+
      '<button class="cbx'+(p.done?' on':'')+'" data-act="togglePlan" data-id="'+p.id+'" aria-label="完成">'+svg('check')+'</button>'+
      '<div class="it-body"><div class="it-title">'+U.esc(p.title)+'</div>'+
      '<div class="it-meta"><span class="badge b-'+p.pri.toLowerCase()+'">'+p.pri+'</span>'+(od?'<span class="badge b-over">'+U.ddlText(p.ddl)+'</span>':'<span>'+U.ddlText(p.ddl)+'</span>')+'</div></div></div>';
  }).join('')||U.empty('calendar','这一天没有安排');
  var mn=U.pad(mo+1);
  return '<h1 class="sec-title">'+svg('calendar')+'日历</h1>'+
    '<p class="sec-sub">圆点颜色代表优先级（红 P0 / 黄 P1 / 绿 P2），底色变红说明这天有逾期未处理。</p>'+
    '<section class="card" data-mod="calendar"><div class="card-head">'+
      '<h3>'+y+' 年 '+mn+' 月</h3><div class="spacer"></div>'+
      '<span class="chip'+(mode==='month'?' on':'')+'" data-act="calMode" data-v="month">月视图</span>'+
      '<span class="chip'+(mode==='week'?' on':'')+'" data-act="calMode" data-v="week">周视图</span>'+
      '<button class="icon-btn" data-act="calShift" data-v="-1" aria-label="上一月">'+svg('close')+'</button>'+
      '<button class="btn btn-sm" data-act="calShift" data-v="0">回到本月</button>'+
      '<button class="icon-btn" data-act="calShift" data-v="1" aria-label="下一月">'+svg('plus')+'</button></div>'+
      '<div class="cal-grid">'+(mode==='month'?head:'')+cells+'</div></section>'+
    '<section class="card" data-mod="calendar"><div class="card-head"><h3>'+U.cn(sel)+' 的安排'+(sel===T?'（今天）':'')+'</h3><div class="spacer"></div>'+
      '<button class="btn btn-sm btn-primary" data-act="quickAddOn" data-v="'+sel+'">'+svg('plus')+'加一条</button></div>'+
      '<div class="list">'+dayList+'</div></section>';
};

};

/* ===== 平台跳转配置：网页地址 + APP scheme（B站 / 抖音 / 小红书） ===== */
var PLATS={
  'B站':   { search:'https://search.bilibili.com/all?keyword=',                 appSearch:'bilibili://search?keyword=' },
  '抖音':  { search:'https://www.douyin.com/search/',                            appSearch:'snssdk1128://search?keyword=' },
  '小红书':{ search:'https://www.xiaohongshu.com/search_result?keyword=',        appSearch:'xhsdiscover://search/result?keyword=' },
  '其他':  { search:'https://www.bilibili.com/',                                 appSearch:'' }
};
/* 从链接域名反推平台：健康 Tips / 手动添加的条目常常只有 url，
   plat/source 是「小红书 · 内置推荐」这类带后缀的字符串，直接查表查不到，
   以前一律回落 B站，于是小红书链接的跳转按钮会显示成「跳转 B站」。 */
function platOfUrl(u){
  if(!u) return '';
  if(/douyin\.com|iesdouyin\.com/i.test(u)) return '抖音';
  if(/xiaohongshu\.com|xhslink\.com/i.test(u)) return '小红书';
  if(/bilibili\.com|b23\.tv|acg\.tv/i.test(u)) return 'B站';
  return '';
}
/* 来源下拉框：选项直接取 PLATS 的键，杜绝手打「bilibili」「b站」「小red书」匹配不上的问题 */
function platSelect(id, cur, emptyLabel){
  var h='<select id="'+id+'">';
  if(emptyLabel) h+='<option value=""'+(cur?'':' selected')+'>'+U.esc(emptyLabel)+'</option>';
  h+=Object.keys(PLATS).map(function(k){
    return '<option value="'+U.esc(k)+'"'+(cur===k?' selected':'')+'>'+U.esc(k)+'</option>';
  }).join('');
  return h+'</select>';
}
/* 第七轮修复 3：从分享文案里抠出第一个 http(s) 链接。
   典型输入：「【抖音】这拉伸太爽了！ 复制此链接，打开Dou音搜索… https://v.douyin.com/xxxx/ 复制本条信息…」 */
function extractUrl(text){
  if(!text) return '';
  var m=String(text).match(/https?:\/\/[^\s，,。、；：！？"'）)】\]]+/i);
  return m?m[0]:'';
}
/* 抠出链接后，把对应的「来源」下拉框选到该平台 */
function syncPlatSelect(selId, url){
  if(!selId) return '';
  var p=platOfUrl(url); if(!p) return '';
  var sel=document.getElementById(selId); if(!sel) return '';
  sel.value=p; draftSet('#'+selId, p);
  return p;
}
/* 需要处理「粘贴分享文案」的字段：src=对应的来源下拉框，to=提取后回填到哪里 */
var PASTE_URL_FIELDS={
  vUrl:  { src:'vSrc'  },
  htUrl: { src:'htSrc' },
  htBody:{ src:'htSrc', to:'htUrl', onlyIfPure:true }   /* 只有「整段就是一个链接」时才搬走 */
};
function platName(v){
  var n=v&&(v.plat||v.source||v.a);
  if(PLATS[n]) return n;
  var g=platOfUrl(v&&v.url); if(g) return g;
  return 'B站';
}
/* 真实网页地址：有 BV 号直接指向视频页，否则回落平台搜索页（搜索页永不 404） */
function videoUrl(v){
  if(!v) return '';
  if(v.bv) return 'https://www.bilibili.com/video/'+v.bv;
  if(v.url&&/^https?:\/\//i.test(v.url)) return v.url;
  var p=PLATS[platName(v)];
  return p.search+encodeURIComponent(v.kw||v.title||v.t||'');
}
/* APP 唤起地址。
   第六轮修复 1：原来抖音/小红书一律拼搜索 scheme，而且**完全没读用户自己添加的 v.url**，
   所以粘贴具体视频/笔记的分享链接后点「跳转 APP」，只会落到平台的搜索框。
   现在优先级改为：
     1) 用户自己添加的原始链接（http/https）→ 直接用它（平台 APP 靠 Universal Link 识别并定位）
     2) B站有 aid / bv → bilibili://video/... 直达
     3) 都没有 → 才回落平台站内搜索 */
function videoAppUrl(v){
  if(!v) return '';
  if(v.url&&/^https?:\/\//i.test(v.url)) return v.url;
  var n=platName(v), p=PLATS[n];
  if(n==='B站'&&v.aid) return 'bilibili://video/'+v.aid;
  if(n==='B站'&&v.bv)  return 'bilibili://video/'+v.bv;
  return p&&p.appSearch?p.appSearch+encodeURIComponent(v.kw||v.title||v.t||''):'';
}
/* 在系统浏览器新标签打开：WebView 里 window.open 常被拦，优先用 a[target=_blank] 触发 */
function openExternal(url){
  if(!url) return false;
  try{
    var a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
    a.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ a.parentNode.removeChild(a) }catch(e){} },0);
    return true;
  }catch(e){}
  try{ if(window.open(url,'_blank','noopener')) return true }catch(e){}
  try{ window.location.href=url; return true }catch(e){}
  return false;
}
/* 唤起前的确认框（第六轮修复 2.1）。
   为什么需要：系统弹出「是否打开 XX APP」时，页面其实还没切走（document.hidden 仍是 false），
   原来的实现从点击那一刻就开始 1.5s 倒计时，倒计时一到就误判「唤起失败」，
   偷偷用浏览器把网页版打开了 —— 用户从 APP 返回，看到的就是视频网页版而不是工作台。
   先让用户在工作台内点一次确认，计时起点就从「用户确认」开始，不再被系统弹框干扰。 */
function openInApp(v){
  if(!v){ U.toast('没有可打开的内容','err'); return }
  var pn=platName(v), web=videoUrl(v), scheme=videoAppUrl(v);
  UI.__inapp=v;
  openModal('跳转到 '+pn,
    '<div class="pm-info"><div class="pm-t">'+U.esc(v.title||v.t||'')+'</div>'+
      '<div class="hint-sm">'+U.esc(pn)+' · '+U.esc(v.cat||'')+
      (/^https?:\/\//i.test(scheme)?' · 通过链接唤起':' · 通过 APP 内地址唤起')+'</div>'+
      '<div class="pm-url">'+U.esc(web)+'</div></div>'+
    '<div class="hint" style="margin-top:10px;line-height:1.75">点「继续」后会尝试打开 '+U.esc(pn)+'。'+
    (/^https?:\/\//i.test(scheme)
      ? '需要离开一下工作台去唤起 APP，从 APP 返回时会自动回来。'
      : '如果设备上没装，<b>不会</b>自动打开网页版，会回来问你要不要用浏览器看。')+'</div>',
    '<button class="btn" data-act="closeModal">取消</button>'+
    '<button class="btn btn-primary" data-act="confirmOpenInApp">继续</button>');
}
/* 真正执行唤起（第六轮修复 1.2 / 2.2） */
function launchApp(v){
  var scheme=videoAppUrl(v), web=videoUrl(v), pn=platName(v);
  if(!scheme){
    if(!openExternal(web)){ copyText(web); U.toast('浏览器拦截了跳转，链接已复制','err') }
    return;
  }
  /* http/https 链接**不能**用 iframe 唤起 —— iframe 只会把网页加载进来，
     既唤不起 APP，还会让工作台整页变成视频网页版。
     自定义协议（snssdk1128://、xhsdiscover://、bilibili://）才走 iframe。 */
  if(/^https?:\/\//i.test(scheme)){
    /* 第七轮修复 1（回归）：上一轮这里改成了 openExternal()，结果三个平台都跳搜索页。
       原因：openExternal 的前两步是 a[target=_blank] 和 window.open()，
       在 PWA 独立窗口（standalone）里这两者都只在 Chrome Custom Tab（浏览器内标签）里打开，
       **不会触发安卓系统的 App Links / Universal Links 机制** ——
       抖音/小红书链接只是在网页里转一圈，落回搜索页或首页；
       B站的 BV 号也因为走了网页重定向而定位不到，把原本好的 B站也弄坏了。
       改回 window.location.href 整页导航：系统识别域名后弹「用 XX 打开吗」，
       交给 APP 自己解析，才能定位到具体视频（抖音会有 1-2 秒停留，属正常）。
       整页导航期间工作台会被替换，从 APP 返回时重新加载一次 —— 这是预期行为，
       与第六轮修掉的「返回后变成视频网页版」不是一回事（那是 iframe 引起的）。 */
    try{
      U.toast('正在唤起 '+pn+'…','ok');
      window.location.href=scheme;
      return;
    }catch(e){}
    /* 走到这里说明整页导航被拦了，才允许退而求其次用新标签 */
    if(openExternal(scheme)) return;
    copyText(scheme); U.toast('跳转失败，链接已复制','err');
    return;
  }
  var left=false, settled=false;
  function closeFallback(){                       /* 用户后来真的切走了 → 收起兜底提示 */
    var m=U.$('#mask');
    if(m&&m.getAttribute('data-fb')==='1') closeModal();
  }
  function mark(){ left=true; closeFallback() }
  document.addEventListener('visibilitychange',mark);
  window.addEventListener('pagehide',mark);
  window.addEventListener('blur',mark);
  var ifr=null;
  try{
    ifr=document.createElement('iframe');
    ifr.setAttribute('aria-hidden','true');
    ifr.style.cssText='display:none;width:0;height:0;border:0';
    ifr.src=scheme;
    document.body.appendChild(ifr);
  }catch(e){}
  U.toast('正在唤起 '+pn+' APP…','ok');
  setTimeout(function(){
    if(left||document.hidden||settled) return;     /* 已切走或已处理过 */
    settled=true;
    try{ if(ifr&&ifr.parentNode) ifr.parentNode.removeChild(ifr) }catch(e){}
    /* 第六轮修复 2.2：用户明确选的是「跳转 APP」，兜底时不再擅自打开网页版，
       而是把选择权交回给用户。 */
    openModal('未检测到 '+pn+' APP',
      '<div class="hint" style="line-height:1.8">没能唤起 '+U.esc(pn)+'。'+
      '可能是没装，也可能是系统弹框还没点。你可以复制链接，或改用浏览器打开网页版。</div>'+
      '<div class="pm-url">'+U.esc(web)+'</div>',
      '<button class="btn" data-act="closeModal">取消</button>'+
      '<button class="btn" data-act="copyLink" data-v="'+U.esc(web)+'">复制链接</button>'+
      '<button class="btn btn-primary" data-act="openWeb" data-v="'+U.esc(web)+'">用浏览器打开</button>');
    var m=U.$('#mask'); if(m) m.setAttribute('data-fb','1');
  },2500);
  setTimeout(function(){                           /* 兜底提示最长挂 15 秒，之后收尾 */
    document.removeEventListener('visibilitychange',mark);
    window.removeEventListener('pagehide',mark);
    window.removeEventListener('blur',mark);
    try{ if(ifr&&ifr.parentNode) ifr.parentNode.removeChild(ifr) }catch(e){}
  },15000);
}

/* ===== 内置推荐池（只读，永不写入个人库） ===== */
function sampleArr(arr,n){
  var s=(arr||[]).slice();
  for(var i=s.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=s[i]; s[i]=s[j]; s[j]=t; }
  return s.slice(0,n);
}
/* 紧凑数组 [bv,aid,标题,UP主,时长] 还原为对象 */
function fitPoolAll(cat){
  var cats=(cat&&cat!=='全部')?[cat]:Object.keys(FIT_VID), out=[];
  cats.forEach(function(c){
    (FIT_VID[c]||[]).forEach(function(r,i){
      out.push({ id:'fp_'+c+'_'+i, bv:r[0], aid:r[1], title:r[2], author:r[3], duration:r[4],
                 cat:c, plat:'B站', source:'B站', pool:true });
    });
  });
  return out;
}
function fitPoolCount(cat){ return fitPoolAll(cat).length }
function samplePool(cat){ return sampleArr(fitPoolAll(cat),10) }
function poolFor(cat){
  UI.fitPool=UI.fitPool||{};
  if(!UI.fitPool[cat]||!UI.fitPool[cat].length) UI.fitPool[cat]=samplePool(cat);
  return UI.fitPool[cat];
}
/* 只读查找内置池条目：播放时不落库，保证推荐池与个人库隔离 */
function poolItemById(id){
  if(!id) return null;
  UI.fitPool=UI.fitPool||{};
  for(var k in UI.fitPool){
    var arr=UI.fitPool[k]||[];
    for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i] }
  }
  var m=/^fp_(.+)_(\d+)$/.exec(id);
  if(m){ var list=fitPoolAll(m[1]); for(var n=0;n<list.length;n++){ if(list[n].id===id) return list[n] } }
  return null;
}
function anyVideoById(id){ return findIn(S.videos,id)||findIn(S.healthVideos||[],id)||poolItemById(id) }
/* 去重：同链接（BV）或同标题即视为已存在 */
function dupVideo(v){
  if(!v) return null;
  var u=videoUrl(v), t=(v.title||v.t||'').trim();
  return (S.videos||[]).filter(function(x){
    if(v.bv&&x.bv&&x.bv===v.bv) return true;
    if(u&&videoUrl(x)===u) return true;
    return !!(t&&(x.title||'').trim()===t);
  })[0]||null;
}
/* 只有「收藏 / 打卡」才把内置池视频落库，来源标记 pool */
function materializeVideo(id){

          duration:pv.duration, cat:pv.cat, source:pv.source, plat:pv.plat, author:pv.author,
          note:'', fav:false, manual:false, src:'pool', checkins:{}, addedAt:U.now() };
  S.videos=S.videos||[]; S.videos.push(v);
  return v;
}

  var recs=F.records.slice().sort(function(a,b){ return a.date<b.date?-1:1 });
  var last=recs[recs.length-1], first=recs[0];
  var bmi=(last&&pf.height)?(last.weight/Math.pow(pf.height/100,2)):0;
  var bmiTxt=bmi?(bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖'):'—';
  var delta=(last&&first)?(last.weight-first.weight):0;
  var toTarget=(last&&pf.targetWeight)?(last.weight-pf.targetWeight):0;
  var win=recs.filter(function(r){ return U.diffDays(r.date,T)<=30 });
  var wPts=win.map(function(r){ return {v:r.weight, l:(+r.date.slice(5,7))+'/'+(+r.date.slice(8,10))} });
  var fPts=win.filter(function(r){ return r.fat }).map(function(r){ return {v:r.fat, l:(+r.date.slice(5,7))+'/'+(+r.date.slice(8,10))} });
  var kcal7=recs.filter(function(r){ return U.diffDays(r.date,T)<=7 }).reduce(function(a,b){ return a+U.num(b.deficit) },0);
  var rows=recs.slice().reverse().slice(0,20).map(function(r){
    return '<div class="item"><div class="it-body"><div class="it-title">'+U.cn(r.date)+' · '+r.weight+' kg'+
      (r.fat?' · 体脂 '+r.fat+'%':'')+'</div><div class="it-meta">'+
      (r.deficit?'<span class="neg">热量缺口 '+r.deficit+' kcal</span>':'')+
      (pf.height?'<span>BMI '+(r.weight/Math.pow(pf.height/100,2)).toFixed(1)+'</span>':'')+
      (r.note?'<span>'+U.esc(r.note)+'</span>':'')+'</div></div>'+
      '<div class="it-actions"><button class="icon-btn dg" data-act="delFit" data-id="'+r.id+'" aria-label="删除">'+svg('trash')+'</button></div></div>';
  }).join('')||U.empty('fitness','还没有记录');
  /* 模块四 · 打卡情况：统计一律以 S.plans 中 sourceType==='fitness' 的已完成任务为准 */
  var st=getFitnessStats();
  var ckStat='<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('fire')+'打卡情况</h3>'+
      '<div class="spacer"></div><span class="hint-sm">仅统计运动计划联动任务</span></div>'+
    '<div class="grid g4">'+
      '<div class="stat"><div class="s-lab">今日</div><div class="s-val">'+st.today+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本周</div><div class="s-val">'+st.week+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本月</div><div class="s-val">'+st.month+'</div><div class="s-sub">次完成</div></div>'+
      '<div class="stat"><div class="s-lab">本年</div><div class="s-val">'+st.year+'</div><div class="s-sub">次完成'+
        (st.archived?'<span title="已归档的历史完成数" style="opacity:.7"> · 含归档 '+st.archived+'</span>':'')+'</div></div>'+
    '</div></section>';
  /* -------- 模块五 · 我的运动计划「按天显示」 --------
     数据源：S.plans 中 sourceType==='fitness' && date===所选日期 的联动任务，
     与上方「打卡情况」统计同源；勾选直接走 ACT.togglePlan，统计天然实时同步。
     日期选择器 id 用 fitDayPicker（新起），与「今日记录」表单里的 fDate 完全独立，互不干扰。 */
  var day=UI.fitDay||T;
  var dd=U.diffDays(T, day);                       // 正数=未来天数，负数=过去天数
  var dayTag=day===T?'今天':dd===1?'明天':dd===-1?'昨天':(dd>0?dd+' 天后':(-dd)+' 天前');
  var PR={P0:0,P1:1,P2:2};
  var dayTasks=S.plans.filter(function(p){ return p.sourceType==='fitness' && p.date===day })
    .sort(function(a,b){
      var pa=PR[a.pri]===undefined?3:PR[a.pri], pb=PR[b.pri]===undefined?3:PR[b.pri];
      if(pa!==pb) return pa-pb;
      return (a.createdAt||'')<(b.createdAt||'')?-1:1;
    });
  var dayDone=dayTasks.filter(function(p){ return p.done }).length;
  var dayRows=dayTasks.map(function(p){
    var tpl=p.sourceId?findIn(F.plan,p.sourceId):null;
    return '<div class="item'+(p.done?' done':'')+'" data-p="'+(PR[p.pri]===undefined?1:PR[p.pri])+'">'+
      '<button class="cbx'+(p.done?' on':'')+'" data-act="togglePlan" data-id="'+p.id+'" aria-label="完成">'+svg('check')+'</button>'+
      '<div class="it-body"><div class="it-title">'+U.esc(p.title||'')+'</div>'+
      '<div class="it-meta">'+
        '<span class="badge b-'+String(p.pri||'P1').toLowerCase()+'">'+U.esc(p.pri||'P1')+'</span>'+
        (p.kcal?'<span>约 '+p.kcal+' kcal</span>':'')+
        (tpl?'<span class="tag">'+U.esc(tpl.freq||'一次性')+'</span>':'')+
        (p.doneAt?'<span class="hint-sm">'+U.esc(String(p.doneAt).slice(11,16))+' 完成</span>':'')+
      '</div></div></div>';
  }).join('');
  /* 空状态：当天与历史日期文案分开，避免出现「今天」这种错位的措辞 */
  var dayEmpty='<div class="empty"><div style="font-size:2rem;line-height:1" aria-hidden="true">🌿</div>'+
    '<p>'+(day===T?'今天没有安排运动，休息一下 🌿':U.cn(day)+'没有安排运动')+'</p>'+
    '<span class="hint-sm">'+(F.plan&&F.plan.length
      ? '可在下方「添加运动计划」里排一条，或切换日期看看其它天'
      : '在下方「添加运动计划」里加一项，就会自动排进这里')+'</span></div>';
  var dayPick='<div class="card-head" style="margin-bottom:12px"><div class="day-head">'+svg('calendar')+
      '<input type="date" id="fitDayPicker" class="day-picker" value="'+day+'">'+
      '<span class="day-tag">'+dayTag+' · 周'+WK[new Date(day+'T00:00:00').getDay()]+'</span>'+
      (dayTasks.length?'<span class="day-tag">'+dayDone+' / '+dayTasks.length+' 已完成</span>':'')+
    '</div><div class="spacer"></div>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="-1">前一天</button>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="0">今天</button>'+
      '<button class="btn btn-sm" data-act="fitDayShift" data-v="1">后一天</button></div>';
  /* 计划模板（管理区）：置顶 / 删除 / 老数据补打卡 */
  var planArr=F.plan.slice();
  planArr.sort(function(a,b){ var pa=a.pinned?1:0, pb=b.pinned?1:0; if(pa!==pb) return pb-pa; return 0 });
  var plan=planArr.map(function(p){
    /* 所选日期已有联动任务 → 状态只在上方「当日任务」里勾选，这里给一个只读状态框，
       避免同一条任务出现两个可点勾选框；所选日期不是执行日时：
       一次性/老数据保留可点勾选框（走 toggleEx 补打卡），重复计划显示只读的「本日不练」。 */
    var t=fitnessTaskOn(p.id, day);
    var lead;
    if(t) lead='<span class="cbx'+(t.done?' on':'')+'" style="cursor:default;opacity:.45" title="'+U.cn(day)+'已排期，请在上方当日任务里勾选">'+svg('check')+'</span>';
    else if(tplRep(p)) lead='<span class="cbx" style="cursor:default;opacity:.3" title="'+U.cn(day)+'不是该计划的执行日">'+svg('check')+'</span>';
    else lead='<button class="cbx'+(p.done?' on':'')+'" data-act="toggleEx" data-id="'+p.id+'" aria-label="补打卡">'+svg('check')+'</button>';
    var on=t?!!t.done:!!p.done;
    return '<div class="item'+(p.pinned?' pinned':'')+'">'+lead+
      '<div class="it-body"><div class="it-title'+(on?'" style="text-decoration:line-through;opacity:.6':'')+'">'+U.esc(p.name)+'</div>'+
      '<div class="it-meta"><span class="tag">'+U.esc(p.freq||'一次性')+'</span>'+(p.kcal?'<span>约 '+p.kcal+' kcal/次</span>':'')+
        (t?'<span class="badge b-'+(t.done?'p2':'p1')+'">'+(t.done?'已完成':'待完成')+'</span>':'<span class="hint-sm">'+U.cn(day)+'不练</span>')+'</div></div>'+
      '<div class="it-actions"><button class="icon-btn" data-act="pinEx" data-id="'+p.id+'" title="'+(p.pinned?'取消置顶':'置顶')+'">'+svg('top','ic-sm')+'</button>'+
      '<button class="icon-btn dg" data-act="delEx" data-id="'+p.id+'" aria-label="删除">'+svg('trash')+'</button></div></div>';
  }).join('')||U.empty('fitness','还没有运动计划，在下方「添加运动计划」里加一项');
  var plan2Rows=(F.plan&&F.plan.length?'<div class="hint-sm" style="margin-top:10px">饮食记录 · 预留入口（占位，可在后续迭代直接接入）</div>':'');
  /* 模块五：页面顺序 = 打卡情况 → 我的运动计划（按天）→ 其它原有模块（顺序不变）→ 添加运动计划表单 */
  return ckStat+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('fire')+'我的运动计划</h3><div class="spacer"></div>'+
      '<button class="btn btn-sm" data-act="resetEx">重置本周勾选</button></div>'+
      dayPick+
      '<div class="list">'+(dayRows||dayEmpty)+'</div>'+
      '<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)">'+
        '<div class="card-head" style="margin-bottom:10px"><h3 style="font-size:.94rem">计划模板</h3>'+
        '<div class="spacer"></div><span class="hint-sm">置顶 · 删除 · 老数据补打卡</span></div>'+
        '<div class="list">'+plan+'</div></div>'+
    '</section>'+
    '<div class="grid g4" style="margin:18px 0">'+
      '<div class="stat"><div class="s-lab">'+svg('fitness','ic-sm')+'当前体重</div><div class="s-val">'+(last?last.weight+' <span style="font-size:.8rem;font-weight:400;color:var(--muted)">kg</span>':'—')+'</div>'+
        '<div class="s-sub '+(delta>0?'pos':'neg')+'">'+(recs.length>1?(delta>0?'累计 +':'累计 ')+delta.toFixed(1)+' kg':'开始记录')+'</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('info','ic-sm')+'BMI</div><div class="s-val">'+(bmi?bmi.toFixed(1):'—')+'</div><div class="s-sub">'+bmiTxt+'（身高 '+(pf.height||'—')+' cm）</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('target','ic-sm')+'距目标</div><div class="s-val '+(toTarget>0?'pos':'neg')+'">'+(last?(toTarget>0?toTarget.toFixed(1):'达成'):'—')+'</div><div class="s-sub">目标 '+(pf.targetWeight||'—')+' kg</div></div>'+
      '<div class="stat"><div class="s-lab">'+svg('fire','ic-sm')+'近 7 天缺口</div><div class="s-val neg">'+kcal7+'</div><div class="s-sub">约等于 '+(kcal7/7700).toFixed(2)+' kg 脂肪</div></div>'+
    '</div>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('board')+'近 30 天体重趋势</h3></div>'+U.lineChart(wPts,{dec:1})+
      (fPts.length>1?'<div class="card-head" style="margin-top:16px"><h3 style="font-size:.94rem">体脂率趋势 (%)</h3></div>'+U.lineChart(fPts,{dec:1,h:140}):'')+'</section>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>今日记录</h3></div>'+
      '<div class="row"><div><label class="fl">日期</label><input id="fDate" type="date" value="'+T+'"></div>'+
      '<div><label class="fl">体重 kg</label><input id="fW" type="number" step="0.1" inputmode="decimal" placeholder="68.5"></div>'+
      '<div><label class="fl">体脂 %</label><input id="fF" type="number" step="0.1" inputmode="decimal" placeholder="23.1"></div>'+
      '<div><label class="fl">热量缺口 kcal</label><input id="fD" type="number" inputmode="numeric" placeholder="400"></div></div>'+
      '<div class="row"><div style="flex:3"><input id="fN" placeholder="备注（可选）"></div>'+
      '<div style="flex:0 0 auto"><button class="btn btn-primary" data-act="addFit">'+svg('plus')+'保存记录</button></div></div>'+
      '<div class="row" style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)">'+
      '<div><label class="fl">身高 cm</label><input id="fH" type="number" inputmode="numeric" value="'+(pf.height||'')+'"></div>'+
      '<div><label class="fl">目标体重 kg</label><input id="fT" type="number" step="0.1" inputmode="decimal" value="'+(pf.targetWeight||'')+'"></div>'+
      '<div style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn" data-act="saveFitProfile">更新身体参数</button></div></div>'+plan2Rows+'</section>'+
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>历史记录</h3></div><div class="list">'+rows+'</div></section>'+
    /* 模块五：添加表单独立成区，放在最下方，新增「起始日期」（目标日期）与「连续天数」（批量添加） */
    '<section class="card" data-mod="fitness"><div class="card-head"><h3>'+svg('plus')+'添加运动计划</h3>'+
      '<div class="spacer"></div><span class="hint-sm">添加后自动排进每日计划</span></div>'+
      '<div class="row"><div style="flex:2"><label class="fl">运动项目</label>'+
        '<input id="exName" placeholder="运动项目，如：慢跑 40 分钟"></div>'+
      '<div><label class="fl">约消耗 kcal</label><input id="exKcal" type="number" inputmode="numeric" placeholder="300"></div></div>'+
      '<div class="row" style="margin-top:10px">'+
        '<div><label class="fl">起始日期</label><input id="exDate" type="date" value="'+(UI.fitDay||T)+'"></div>'+
        '<div><label class="fl">连续天数</label><input id="exSpan" type="number" min="1" max="60" inputmode="numeric" placeholder="留空=默认"></div>'+
        '<div style="flex:0 0 auto;display:flex;align-items:flex-end">'+
          '<button class="btn btn-primary" data-act="addEx">'+svg('plus')+'添加计划</button></div></div>'+
      '<div class="repeat-box" style="margin-top:12px"><label class="fl">重复</label>'+repeatControlsHtml('ex', null)+
      '<span class="repeat-tip">「连续天数」= 从起始日起连续排几天，填 7 就是一次排一周。留空时：选了重复规则则自动展开一年，未选则只排起始日 1 条。选择「每周固定」可指定每周几执行；「重置本周勾选」会清空本周完成状态。</span></div></section>';
};
VIEWS.fitnessVideo=function(){
  var cat=UI.fitVideoCat||'全部';
  var cats=FIT_CATS.map(function(c){ return '<div class="chip'+(cat===c?' on':'')+'" data-act="fitVideoCat" data-v="'+c+'">'+c+'</div>' }).join('');
  var pool=poolFor(cat);
  function card(v){
    var checked=v.checkins&&v.checkins[U.today()];
    return '<div class="v-card v-pool" data-id="'+v.id+'"><div class="v-card-head"><div class="v-tags"><span class="tag">'+U.esc(v.cat||'其他')+'</span></div>'+
      '<span class="v-src">'+U.esc(v.source||'B站')+'</span></div>'+
      '<div class="v-title">'+U.esc(v.title||'')+'</div>'+
      '<div class="v-desc">来自内置跟练链接池，点击「收藏」可加入锻炼打卡，「打卡」可直接记录今日完成。</div>'+
      '<div class="v-meta">'+(v.duration?'<span>⏱ '+v.duration+' 分钟</span>':'')+(v.author?'<span>'+U.esc(v.author)+'</span>':'')+
      (checked?'<span style="color:var(--primary)">✓ 今日已打卡</span>':'')+'</div>'+
      '<div class="v-actions">'+
        '<button class="btn btn-primary btn-sm" data-act="playVideo" data-id="'+v.id+'">'+svg('play','ic-sm')+'播放</button>'+
        '<button class="btn btn-sm" data-act="vFav" data-id="'+v.id+'">☆ 收藏</button>'+
        '<button class="btn btn-sm btn-ok" data-act="vCheckin" data-id="'+v.id+'">✓ 打卡</button>'+
      '</div></div>';
  }
  var poolCards=pool.map(function(v){ return card(v) }).join('');
  var html='<div class="chips" style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">'+
      cats+'<button class="btn btn-sm" data-act="vRefresh" style="margin-left:auto">'+svg('refresh','ic-sm')+'刷新</button></div>'+
    '<div class="hint-sm" style="margin:10px 0 14px">内置公开跟练链接池（仅展示推荐，手动添加与收藏的视频在「锻炼打卡」Tab）。点击「刷新」随机换 10 条。</div>'+
    '<div class="v-grid">'+poolCards+'</div>'+
    '<section class="card" data-mod="fitness" style="margin-top:20px"><div class="card-head"><h3>'+svg('plus')+'手动添加视频</h3></div>'+
      '<div class="hint">只存元数据（标题 / 链接 / 时长 / 备注），不下载视频文件。来自抖音 / 小红书 / B站 / YouTube / Keep 等平台都可。</div>'+
      '<div class="row" style="margin-top:10px"><div style="flex:2"><input id="vTitle" placeholder="视频名称（如：帕梅拉15分钟燃脂）"></div></div>'+
      '<div class="row" style="margin-top:8px"><div style="flex:3"><input id="vUrl" placeholder="视频链接（B站 / 抖音 / 小红书…）——可直接粘贴整段分享文案，会自动提取链接"></div>'+
        '<div><input id="vDur" type="number" min="1" placeholder="时长（分钟）"></div></div>'+
      '<div class="row" style="margin-top:8px"><div><select id="vCat"><option value="">选择分类</option>'+FIT_CATS.filter(function(c){ return c!=='全部' }).map(function(c){ return '<option value="'+c+'">'+c+'</option>' }).join('')+'</select></div>'+
        '<div>'+platSelect('vSrc','B站','')+'</div>'+
        '<div><input id="vAuth" placeholder="UP 主 / 作者"></div></div>'+
      '<div class="row" style="margin-top:8px"><div style="flex:3"><input id="vNote" placeholder="备注（可选）"></div>'+
        '<div style="flex:0 0 auto"><button class="btn btn-primary" data-act="vAdd">'+svg('plus')+'添加</button></div></div></section>';
  return html;
};
VIEWS.fitnessCheckin=function(){
  var T=U.today();
  var cat=UI.fitCheckinCat||'全部';
  var cats=FIT_CATS.map(function(c){ return '<div class="chip'+(cat===c?' on':'')+'" data-act="fitCheckinCat" data-v="'+c+'">'+c+'</div>' }).join('');
  var q=(UI.fitCheckinQ||'').toLowerCase();
  var list=(S.videos||[]).slice().sort(function(a,b){ return (b.addedAt||'')<(a.addedAt||'')?-1:1 });
  if(cat!=='全部') list=list.filter(function(v){ return v.cat===cat });
  if(q) list=list.filter(function(v){ return ((v.title||'')+' '+(v.cat||'')+' '+(v.author||v.source||'')+' '+(v.note||'')).toLowerCase().indexOf(q)>-1 });
  /* 本周打卡日历（最近 7 天） */
  var week=[]; for(var i=6;i>=0;i--) week.push(U.addDays(T,-i));
  var wkStats={}; week.forEach(function(d){ wkStats[d]=0 });
  (S.videos||[]).forEach(function(v){ Object.keys(v.checkins||{}).forEach(function(k){ if(wkStats[k]!=null) wkStats[k]++ }) });
  var wkHtml='<div class="grid g4" style="margin-bottom:14px">'+week.map(function(d){
    var has=wkStats[d]>0;
    return '<div class="stat" style="padding:10px"><div class="s-lab">'+U.cn(d).slice(5)+'</div><div class="s-val" style="font-size:1.4rem;color:'+(has?'var(--primary)':'var(--muted)')+'">'+wkStats[d]+'</div><div class="s-sub">次打卡</div></div>';
  }).join('')+'</div>';
  var rows=list.length?list.map(function(v){
    var days=Object.keys(v.checkins||{}).length;
    var last=days?(Object.keys(v.checkins).sort().reverse()[0]):'-';
    var todayCheck=v.checkins&&v.checkins[T];
    return '<div class="v-row"><div class="v-cover">'+svg('play','ic-sm')+'</div>'+
      '<div class="v-info"><div class="vt">'+U.esc(v.title)+'</div>'+
      '<div class="vm">'+U.esc(v.cat||'')+(v.author?' · '+U.esc(v.author):'')+(v.source?' · '+U.esc(v.source):'')+' · 累计 '+days+' 次'+(last!=='-'?' · 最近 '+U.cn(last):'')+'</div>'+
      '<div class="vm">'+srcTagHtml(v)+'</div></div>'+
      '<div class="v-act"><button class="icon-btn '+(todayCheck?'btn-primary':'')+'" data-act="vCheckin" data-id="'+v.id+'" title="'+(todayCheck?'今日已打卡':'打卡')+'">'+svg('check')+'</button>'+
      '<button class="icon-btn" data-act="playVideo" data-id="'+v.id+'" title="播放">'+svg('play')+'</button>'+
      '<button class="icon-btn dg" data-act="vDel" data-id="'+v.id+'" title="删除">'+svg('trash')+'</button></div></div>';
    }):U.empty('video','还没有视频，去「视频推荐」把喜欢的视频 ★ 收藏，或手动添加一条');

VIEWS.express=function(){

function expressWeakHtml(){
  var kws=weakKeywords();
  if(!kws.length) return '';
  return '<section class="card" data-mod="express"><div class="card-head"><h3>'+svg('warn','ic-sm')+'近期高频短板关键词</h3><div class="spacer"></div><span class="hint-sm">基于反思日志词频</span></div>'+
    '<div class="kw-cloud">'+kws.map(function(k){
      var fs=13+Math.min(11,k.n*2);
      return '<span class="kw" style="font-size:'+fs+'px">'+U.esc(k.w)+'</span>';
    }).join('')+'</div>'+
    '<div class="hint" style="margin-top:8px">出现越多，说明越该重点练。下次练习可专门挑 1 个词做针对性训练。</div></section>';
}
function starHtml(n, act, id){
  var out='';
  for(var i=1;i<=5;i++){
    out+='<span style="cursor:pointer;color:'+(i<=n?'var(--warn)':'var(--line)')+'" data-act="'+act+'" data-id="'+id+'" data-v="'+i+'">★</span>';
  }
  return '<span class="stars" style="font-size:1rem;letter-spacing:2px">'+out+'</span>';
}

/* ---------------- 15. 图书馆（封面墙） ---------------- */
VIEWS.library=function(){
  var reading=S.books.filter(function(b){ return b.status==='在读' });
  var done=S.books.filter(function(b){ return b.status==='已读' });
  /* 排序：在读按「加入时间」倒序；已读可按评分或读完时间排序 */
  var sortDoneBy=UI.libSort||'time';  /* 'time' | 'rating' */
  if(sortDoneBy==='rating') done.sort(function(a,b){ return (b.rating||0)-(a.rating||0) });
  else done.sort(function(a,b){ return (b.finished||b.updatedAt||'').slice(0,10)<(a.finished||a.updatedAt||'').slice(0,10)?-1:1 });
  reading.sort(function(a,b){ return (b.addedAt||b.updatedAt||'').slice(0,10)<(a.addedAt||a.updatedAt||'').slice(0,10)?-1:1 });
  function wall(arr){
    return arr.map(function(b){
      return '<div class="book" data-act="libJumpBook" data-id="'+b.id+'" title="点击跳到「读书推荐」编辑详情">'+
        '<div class="book-cv" style="background:linear-gradient(150deg,'+U.colorOf(b.title)+','+U.colorOf(b.author||b.title)+')">'+
        '<span class="bstat">'+U.esc(b.status)+'</span><span>'+U.esc(b.title)+'</span></div>'+
        '<div class="book-nm">'+U.esc(b.title)+'</div>'+
        '<div class="book-au">'+U.esc(b.author||'')+(b.progress&&b.status==='在读'?' · '+U.num(b.progress)+'%':'')+'</div>'+
        (b.rating?'<div class="stars">'+'★'.repeat(b.rating)+'</div>':'')+'</div>';
    }).join('');
  }
  var Y=new Date().getFullYear();
  var yr=done.filter(function(b){ return (b.finished||'').slice(0,4)===String(Y) });
  var sortBtns=[['time','按阅读时间 ↓'],['rating','按评分 ★']].map(function(s){
    return '<button class="ls-opt'+(sortDoneBy===s[0]?' on':'')+'" data-act="libSort" data-v="'+s[0]+'">'+s[1]+'</button>';
  }).join('');
  return '<h1 class="sec-title">'+svg('library')+'图书馆</h1><p class="sec-sub">读书推荐里「在读」和「已读」的书会自动上架，点封面可直接跳转到详情编辑。'+
    (S.books.filter(function(b){return b.status==='想读'}).length?' · 想读 '+S.books.filter(function(b){return b.status==='想读'}).length+' 本在「读书推荐」里待启动。':'')+'</p>'+
    '<section class="card" data-mod="books"><div class="card-head"><h3>'+svg('eye')+'正在读（'+reading.length+'）</h3></div>'+
      (reading.length?'<div class="shelf">'+wall(reading)+'</div><div class="shelf-board"></div>':U.empty('books','暂时没有在读的书'))+'</section>'+
    '<section class="card" data-mod="books"><div class="card-head"><h3>'+svg('check')+'已读完（'+done.length+'）</h3><div class="spacer"></div>'+
    '<div class="lib-sort"><span class="ls-label">排序：</span>'+sortBtns+'</div></div>'+
      '<div class="hint-sm">今年读完 '+yr.length+' 本 · 总累计 '+done.length+' 本（数据来自「读书推荐」）</div>'+
      (done.length?'<div class="shelf">'+wall(done)+'</div><div class="shelf-board"></div>':U.empty('books','还没有读完的书'))+'</section>';
};

function libJumpBook(b){

/* ---------------- 16. 灵感记录 ---------------- */
function hl(text, q){
  var s=U.esc(text); if(!q) return s;
  try{
    var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return s.replace(re,'<mark style="background:rgba(140,154,77,.25);color:var(--primary2);padding:0 2px;border-radius:3px">$1</mark>');
  }catch(e){ return s }
}

          '<div class="it-meta"><span>'+U.relTime(x.createdAt)+'</span>'+

VIEWS.wrongq=function(){

  }).join('')||'<section class="card" data-mod="wrongq">'+U.empty('wrongq','还没有错题，点下方「新建错题」开始归档')+'</section>';

function remDaysInMonth(y,m){

      var d=r.calendar==='lunar'?lunarToSolar(y,r.month,r.day):new Date(y,r.month-1,r.day);

    } else if(r.type==='contact'||(r.type==='cycle'&&r.freq==='week')){

/* ================= 第五轮 C：提醒中心导出 .ics 日历 =================
   目标：把「已启用且未归档」的提醒导出成 RFC 5545 日历文件，交给手机自带日历接管推送。
   全部纯 JS 字符串拼接 + Blob 下载，不引入任何第三方库。
   复用的既有能力：remOcc()（算下次发生日）、U.pad / U.today / U.num、U.download()（Blob 下载）。
   ------------------------------------------------------------------ */
var ICS_BYDAY=['SU','MO','TU','WE','TH','FR','SA'];   /* wday 0=周日 */
function icsStampUTC(d){
  return d.getUTCFullYear()+''+U.pad(d.getUTCMonth()+1)+''+U.pad(d.getUTCDate())+'T'+
         U.pad(d.getUTCHours())+U.pad(d.getUTCMinutes())+U.pad(d.getUTCSeconds())+'Z';
}
/* 浮动本地时间（不带 Z、不带 TZID）：手机日历会按本机时区解释，正是我们要的效果 */
function icsLocal(d,h){ return d.getFullYear()+''+U.pad(d.getMonth()+1)+''+U.pad(d.getDate())+'T'+U.pad(h)+'0000' }
/* RFC 5545 §3.3.11：文本里的反斜杠、分号、逗号、换行必须转义 */
function icsEsc(v){
  return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r\n|\r|\n/g,'\\n');
}
/* RFC 5545 §3.1：一行不超过 75 个八位组（不含 CRLF），续行以一个空格开头。
   按「字节」而非「字符」切，且只在 UTF-8 字节数组层面操作，绝不会把中文劈成乱码。 */
function icsBuild(lines){
  var enc=new TextEncoder(), chunks=[], CRLF=new Uint8Array([13,10]), SP=new Uint8Array([32]);
  lines.forEach(function(line){
    var a=enc.encode(line);
    if(a.length<=75){ chunks.push(a,CRLF); return }
    var off=0, first=true;
    while(off<a.length){
      var n=first?75:74, end=Math.min(off+n,a.length);
      if(!first) chunks.push(SP);
      chunks.push(a.subarray(off,end), CRLF);
      off=end; first=false;
    }
  });
  var total=0; chunks.forEach(function(c){ total+=c.length });
  var buf=new Uint8Array(total), p=0;
  chunks.forEach(function(c){ buf.set(c,p); p+=c.length });
  return buf;
}
/* 重复规则：生日/每年→YEARLY；每月→MONTHLY；每周/定期联系→WEEKLY(+BYDAY)；每日→DAILY */
function icsRRule(r){
  if(r.type==='birthday') return 'RRULE:FREQ=YEARLY';
  if(r.type==='contact')  return 'RRULE:FREQ=WEEKLY;BYDAY='+ICS_BYDAY[r.wday!=null?r.wday:0];
  if(r.type==='cycle'){
    var f=r.freq||'month';
    if(f==='day')   return 'RRULE:FREQ=DAILY';
    if(f==='week')  return 'RRULE:FREQ=WEEKLY;BYDAY='+ICS_BYDAY[r.wday!=null?r.wday:1];
    if(f==='month') return 'RRULE:FREQ=MONTHLY;BYMONTHDAY='+(r.mday||1);
    if(f==='year')  return 'RRULE:FREQ=YEARLY;BYMONTH='+(r.month||1)+';BYMONTHDAY='+(r.day||1);
  }
  return '';
}
/* 闹钟：默认当天 9:00；设了提前天数就落在「提前 N 天的 9:00」。
   事件是 00:00 起的全天语义，这里统一按 09:00 起算，所以偏移 = ahead*24-9 小时。 */
function icsTrigger(r){
  var ahead=Math.max(0, U.num(r.aheadDays,0));
  if(ahead<=0) return 'TRIGGER;RELATED=START:PT9H';
  var hours=ahead*24-9, d=Math.floor(hours/24), h=hours%24;
  if(d<=0) return 'TRIGGER;RELATED=START:-PT'+h+'H';
  return 'TRIGGER;RELATED=START:-P'+d+'D'+(h>0?'T'+h+'H':'');
}
function icsCount(){ return (S.reminders||[]).filter(function(r){ return r.enabled && !r.archived }).length }
function remToIcs(){
  var list=(S.reminders||[]).filter(function(r){ return r.enabled && !r.archived });
  if(!list.length){ U.toast('没有可导出的提醒（需「已启用」且未归档）','err'); return 0 }
  var stamp=icsStampUTC(new Date()), L=[], n=0;
  L.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WorkBench//Personal Worktable//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH');
  L.push('X-WR-CALNAME:'+icsEsc('工作台提醒'),'X-WR-TIMEZONE:local');
  list.forEach(function(r){
    var d=remOcc(r); if(!d) return;   /* 算不出下次日期的（缺字段等）直接跳过，不写坏事件 */
    var desc=[];
    if(r.desc) desc.push(r.desc);
    if(r.type==='birthday'){
      desc.push(r.calendar==='lunar'?'农历 '+r.month+' 月 '+r.day+' 日（公历日期每年不同，导入后请按年份核对）':'公历 '+r.month+' 月 '+r.day+' 日');
    }
    if(U.num(r.aheadDays,0)>0) desc.push('提前 '+r.aheadDays+' 天提醒');
    L.push('BEGIN:VEVENT','UID:'+r.id+'@workbench','DTSTAMP:'+stamp);
    L.push('DTSTART:'+icsLocal(d,9),'DTEND:'+icsLocal(d,10));
    var rr=icsRRule(r); if(rr) L.push(rr);
    L.push('SUMMARY:'+icsEsc(r.name||'提醒'));

    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc((r.name||'提醒')+' 到时间了'),icsTrigger(r),'END:VALARM');
    L.push('END:VEVENT');
    n++;

  if(!ok){ U.toast('导出失败，请检查浏览器下载权限','err'); return 0 }
  return n;
}

/* 第五轮 A-2：健康 Tips 的 type 目前只有两种真实取值 ——
     text  = 纯文字（点开就是一段正文，没有配图）
     video = 视频（带 url，走统一播放弹窗）
   原实现把 text 标成「图文」，但点开只有文字、没有图，标签与内容不符。
   注意：现阶段**不支持 image 类型**（渲染 / 收藏 / 播放三条链路都只处理 text 与 video），
   所以下面如实标成「文字」，不再虚构「图文」。 */
function hTypeLabel(t){ return ((t&&t.type)==='video')?'视频':'文字' }
function hTypeTag(t){ return '<span class="tag'+(hTypeLabel(t)==='视频'?' green':'')+'">'+hTypeLabel(t)+'</span>' }
/* 第六轮修复 3：正文里的 http(s) 链接自动变成可点击的 <a>。
   先 U.esc 再做正则替换 —— 此时 & < > " ' 都已经是实体，插进 href 也不会被注入；
   末尾的中英文标点不计入链接，避免把「。」「）」一起吞进去。 */
function autolink(text){
  var s=U.esc(text==null?'':String(text));
  return s.replace(/(https?:\/\/[^\s<>"'，。；：！？、）)】》」』…]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* ---------------- 20.5 PWA：Manifest / Service Worker / 安装引导 ---------------- */
/* 纯新增代码：不读取、不修改 S 里的业务数据，不触碰 save / 同步 / 渲染等既有逻辑。
   PWA.base 用页面所在目录而非写死 "/"，部署在根目录时计算结果就是 "/"，
   与规范一致；万一部署到子目录也不会因路径写死而 404。 */
var PWA={
  deferredPrompt:null,   // beforeinstallprompt 事件暂存，用户点击后手动触发
  swReg:null,
  swOk:false,
  base:(function(){ var p=location.pathname.replace(/[^/]*$/,''); return p||'/' })(),
  /* 是否已从桌面图标启动（standalone PWA 模式） */
  standalone:function(){
    try{
      if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) return true;
      if(window.navigator&&window.navigator.standalone===true) return true;  // iOS Safari
    }catch(e){}
    return false;
  },
  btn:function(){ return document.getElementById('installBtn') },
  show:function(){ var b=PWA.btn(); if(b) b.style.display='inline-flex' },
  hide:function(){ var b=PWA.btn(); if(b) b.style.display='none' },
  /* 设置页每次 render 都会重建 DOM，用它把按钮与状态文字恢复成当前应有的样子 */
  sync:function(){
    var b=PWA.btn(); if(!b) return;
    if(PWA.standalone()||!PWA.deferredPrompt) b.style.display='none';
    else b.style.display='inline-flex';
    var s=document.getElementById('pwaState');
    if(s) s.textContent=PWA.standalone()?'已安装':(PWA.deferredPrompt?'可安装':'未安装');
    var h=document.getElementById('pwaHint');
    if(h){
      h.textContent = PWA.swOk
        ? '离线缓存已就绪：断网也能打开，手机重启后桌面图标不会失效。'
        : '尚未启用离线缓存：请确认页面通过 HTTPS 访问，且 sw.js 与本页面放在同一目录下。';
    }
  },
  /* 第二轮修复：PWA.icon() 与 PWA.manifest() 已整体移除。
     原实现用 Canvas 画图标 + Blob URL 注入 manifest，但 Chrome 不会把 blob: 的 manifest
     和 data: 的图标识别为可安装 PWA，只能生成普通书签（重启后可能失效）。
     现在改为在 <head> 中静态引用真实文件 manifest.webmanifest 与 icon-192/512.png，
     让 Chrome 能正常生成 WebAPK。 */
  /* 注册 Service Worker：SW 必须是独立 .js 文件，无法用 Blob / 内联方式注册
     注册路径 = PWA.base + 'sw.js'：部署在站点根目录时即 '/sw.js'，
     与 sw.js 实际存放位置一致；子目录部署时也能自动跟随。 */
  register:function(){
    /* ④ 用 window.isSecureContext 代替 location.protocol!=='https:'。
       原因：http://localhost 同样属于安全上下文，但 protocol 是 'http:'，
       旧判断会把本地调试环境一并排除，导致 SW 永远注册不上。 */
    if(!('serviceWorker' in navigator) || !window.isSecureContext){
      console.warn('ℹ️ 当前环境不支持 Service Worker（需要 HTTPS 或 localhost），离线与推送功能不可用');
      return;
    }
    navigator.serviceWorker.register(PWA.base+'sw.js')
      .then(function(reg){
        PWA.swReg=reg; PWA.swOk=true;
        console.log('✅ Service Worker 注册成功:', reg.scope);
        /* 注册成功后，若之前已拿到延迟的安装提示再显示按钮，避免按钮闪烁 */
        if(PWA.deferredPrompt) PWA.show();
        PWA.sync();
      })
      .catch(function(err){
        /* 注册失败只影响离线与推送，不阻断主功能 */
        console.warn('⚠️ Service Worker 注册失败:', err&&err.message);
        PWA.sync();
      });
  },
  /* 用户点击「安装到桌面」 */
  install:function(){
    var dp=PWA.deferredPrompt;
    if(!dp){ U.toast('当前浏览器未给出安装提示，请用浏览器菜单「添加到主屏幕 / 安装应用」','err'); return }
    dp.prompt();   // 弹出系统安装对话框
    dp.userChoice.then(function(r){
      console.log('用户选择: '+(r&&r.outcome));
      if(r&&r.outcome==='accepted') U.toast('正在安装到桌面…','ok');
      PWA.deferredPrompt=null;   // 必须置空，否则无法再次触发
      PWA.hide();
    }).catch(function(){ PWA.deferredPrompt=null; PWA.hide() });
  },
  boot:function(){
    /* 第二轮修复：不再动态注入 manifest，直接用 <head> 里的
       <link rel="manifest" href="manifest.webmanifest"> 真实文件引用。 */
    if(PWA.standalone()) console.log('✅ 当前运行在 PWA 模式下（已从桌面图标启动）');
    else console.log('ℹ️ 当前在浏览器标签页中打开');
    PWA.register();
  }
};
/* 安装相关事件尽早挂载：Chrome 可能在页面 load 前后就触发 beforeinstallprompt */
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();       // 阻止 Chrome 自动弹出安装条
  PWA.deferredPrompt=e;     // 暂存事件，供「安装到桌面」按钮手动触发
  PWA.show();
});
window.addEventListener('appinstalled', function(){
  console.log('✅ PWA 已成功安装到桌面');
  PWA.deferredPrompt=null;
  PWA.hide();
});

/* ---------------- 23. WebDAV 同步 ---------------- */
function mergeData(remote){
  if(!remote) return;
  var arrKeys=['plans','memos','express','books','inspires','notes','excerpts','prompts','goals','custom','reminders','wrongs','videos','healthItems','healthTips'];
  arrKeys.forEach(function(k){
    if(Array.isArray(remote[k])){
      var local=S[k]||[], ids={}; local.forEach(function(x){ if(x&&x.id) ids[x.id]=1 });
      S[k]=local.concat(remote[k].filter(function(x){ return x&&x.id&&!ids[x.id] }));
    }
  });
  if(remote.fitness&&typeof remote.fitness==='object'){
    ['records','plan'].forEach(function(fk){
      if(Array.isArray(remote.fitness[fk])){
        var local=S.fitness[fk]||[], ids={}; local.forEach(function(x){ if(x&&x.id) ids[x.id]=1 });
        S.fitness[fk]=local.concat(remote.fitness[fk].filter(function(x){ return x&&x.id&&!ids[x.id] }));
      }
    });
  }
  if(Array.isArray(remote.custom)){
    (S.custom||[]).forEach(function(m){
      var rm=remote.custom.find(function(x){ return x&&x.id===m.id });
      if(rm&&Array.isArray(rm.items)){ var ids={}; (m.items||[]).forEach(function(it){ if(it&&it.id) ids[it.id]=1 }); m.items=(m.items||[]).concat(rm.items.filter(function(it){ return it&&it.id&&!ids[it.id] })) }
    });
  }
  S.updatedAt=U.now();
}

/* ---------------- 24. 通知与 Cron ---------------- */
function cronMatch(expr, d){
  if(!expr) return false;
  var f=expr.trim().split(/\s+/);
  if(f.length!==5) return false;
  var vals=[d.getMinutes(), d.getHours(), d.getDate(), d.getMonth()+1, d.getDay()];
  for(var i=0;i<5;i++){
    if(!fieldMatch(f[i], vals[i])) return false;
  }
  return true;
  function fieldMatch(f, v){
    if(f==='*') return true;
    return f.split(',').some(function(part){
      var st=1, base=part;
      if(part.indexOf('/')>-1){ var sp=part.split('/'); base=sp[0]; st=parseInt(sp[1],10)||1 }
      if(base==='*') return v%st===0;
      if(base.indexOf('-')>-1){
        var r=base.split('-'), a=+r[0], b=+r[1];
        return v>=a&&v<=b&&((v-a)%st===0);
      }
      return +base===v;
    });
  }
}
var NOTIFY={
  timer:null, lastCron:'',
  can:function(){ return typeof Notification!=='undefined'&&Notification.permission==='granted' },
  ask:function(cb){
    if(typeof Notification==='undefined'){ U.toast('当前浏览器不支持通知','err'); return }
    if(Notification.permission==='granted'){ cb&&cb(true); return }
    if(Notification.permission==='denied'){ U.toast('通知已被浏览器拒绝，请在站点设置里手动开启','err'); cb&&cb(false); return }
    Notification.requestPermission().then(function(p){
      if(p==='granted'){ U.toast('通知已开启','ok') } else { U.toast('未获得通知权限','err') }
      /* 修复：Android Chrome PWA 下，requestPermission 的 Promise resolve 后
         Notification.permission 属性可能尚未同步更新，导致后续 can() 误判为 false。
         这里延迟 100ms 再回调，确保权限状态已同步。 */
      setTimeout(function(){
        cb&&cb(Notification.permission === 'granted');
        render();
      }, 100);
    }).catch(function(e){
      /* 修复：补上异常处理，避免 Promise 静默失败导致开关状态卡死 */
      console.error('[NOTIFY] requestPermission 异常:', e);
      cb&&cb(false);
    });
  },
  /* 通知发送（异步，结果通过 cb 回调返回）
     优先走 Service Worker 的 registration.showNotification()：
     Android Chrome PWA 下页面上下文的 new Notification() 不可靠，
     在后台 / 独立窗口场景会被丢弃或抛异常。失败再回退页面方式。 */
  fire:function(title, body, tag, cb){
    /* 0) 基础检查 */
    if(typeof Notification === 'undefined'){
      console.warn('[NOTIFY] Notification API 不可用（可能是 file:// 或不支持的浏览器）');
      cb && cb(false); return;
    }
    if(Notification.permission !== 'granted'){
      console.warn('[NOTIFY] 权限未授权，当前状态:', Notification.permission);
      cb && cb(false); return;
    }

    /* 不传 icon：SVG data-URI 图标在 Android Chrome 上兼容性差，
       部分版本直接抛异常导致整条通知失败，改用系统默认图标最稳。 */
    var opt = { body: body || '', tag: tag || ('wb' + Date.now()) };

    /* 页面方式：SW 不可用、或 SW 方式失败时的兜底 */
    function fireViaWindow(t, o, done){
      try{
        var n = new Notification(t, o);
        n.onclick = function(){ try{ window.focus() }catch(e){}; n.close() };
        console.log('[NOTIFY] 通过页面方式发送成功:', t);
        done && done(true);
      }catch(e2){
        console.error('[NOTIFY] 页面方式也失败:', e2);
        done && done(false);
      }
    }

    /* 1) 优先走 Service Worker（PWA / Android Chrome 下最可靠） */
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(function(reg){
        return reg.showNotification(title, opt);
      }).then(function(){
        console.log('[NOTIFY] 通过 SW 发送成功:', title);
        cb && cb(true);
      }).catch(function(e){
        console.error('[NOTIFY] SW 发送失败，回退页面方式:', e);
        fireViaWindow(title, opt, cb);
      });
      return;
    }

    /* 2) 没有 SW 时用页面方式 */
    fireViaWindow(title, opt, cb);
  },
  check:function(){
    if(!S.settings.notify.enabled||!NOTIFY.can()) return;
    var now=new Date(), T=U.today(), ahead=U.num(S.settings.notify.aheadMin);
    var changed=false;
    S.plans.forEach(function(p){
      if(p.done||!p.time||p.date!==T) return;
      var hm=p.time.split(':'), tt=new Date();
      tt.setHours(+hm[0], +hm[1], 0, 0);
      tt=new Date(tt.getTime()-ahead*60000);
      var key=p.id+'@'+T;
      if(now>=tt && now-tt<30*60000 && !S.notified[key]){
        NOTIFY.fire('待办提醒 · '+p.pri, p.title+(p.time?'（'+p.time+'）':''), 'plan'+key);
        S.notified[key]=1; changed=true;
      }
    });

function lunarToSolar(y, lm, ld){
